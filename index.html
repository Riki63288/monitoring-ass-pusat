    },
    getProcessDepotSummary: function () { return S.process.depotSummary; },
    getProcessPeriodSummary: function () { return S.process.periodSummary; },
    getResultDailyDepot: function () { return S.result.dailyDepot; },
    getResultBaselineDepot: function () { return S.result.baselineDepot; },
    /* V1.7.9 — future contract stores. Sengaja DI LUAR rowMethods: filter
       Coverage Project diterapkan eksplisit oleh service, bukan oleh facade,
       karena grain-nya salesman dan butuh agregasi Depo yang benar. */
    getResultDailySalesman: function () { return S.result.dailySalesman; },
    getResultBaselineSalesman: function () { return S.result.baselineSalesman; },
    getPublishHistory: function () { return S.publishHistory; },
    getResultTargets: function () { return S.result.targets.slice(); },
    getResultDailyEceran: function () { return S.result.dailyEceran.slice(); },
    getResultMtdEceran: function () { return S.result.mtdEceran.slice(); },
    resultEceran: function () { return S.result.eceranSegments.map(function (x) { return { key: x.key, label: x.label }; }); },

    countSalesmen: function (scope) {

      let n = 0;
      for (let i = 0; i < S.org.salesmen.length; i++) if (inScope(S.org.salesmen[i], sc, allow)) n++;
      return n;
    },

    stats: function () {

               salesmen: S.org.salesmen.length, depots: S.org.depots.length,
               days: S.process.dates.length, mtdRows: S.result.mtdRecords.length };

    /* metadata audit — tersedia untuk drilldown/audit lanjutan */
    audit: function () {
      function mapBatch(b) {
        return { batch_id: b.batch_id, depot_code: b.depot_code, domain: b.domain,
                 period_month: b.period_month ? String(b.period_month).slice(0, 10) : null,
                 hk: b.hk, revision_number: b.revision_number === undefined ? null : b.revision_number,
                 publish_event_id: b.publish_event_id || null,
                 uploaded_by_name: b.uploaded_by_name || null,
                 created_at: b.created_at || null,

                 rejected_row_count: b.rejected_row_count === undefined ? null : b.rejected_row_count };
      }
      const process = S.process.batches.map(mapBatch), result = S.result.batches.map(mapBatch);
      const all = process.concat(result), depots = {};
      all.forEach(function (b) { const code = LiveNormalize.code(b.depot_code); if (code) depots[code] = 1; });
      return { process: process, result: result,

const ProviderHub = {
  _mode: 'live',
  _forcedDemo: false,

  detect: function () {
    let q = '';

  mode: function () { return this._mode; },
  isLive: function () { return this._mode === 'live'; },
  forcedDemo: function () { return this._forcedDemo; },

  active: function () { return this._mode === 'demo' ? DemoDataProvider : ApiDataProvider; },
  activeInfo: function () { return this._mode === 'demo' ? DemoInformationProvider : LiveInformationProvider; },

  /* status runtime untuk badge header & error view */
  state: function () {
    if (this._mode === 'demo') return { key: 'demo', label: 'DEV DEMO', tone: 'warn',
      title: 'Mode pengembangan eksplisit (?dev_provider=demo). Bukan data pusat.' };
    if (!LiveGateway.configured()) return { key: 'config', label: 'KONFIGURASI BELUM LENGKAP', tone: 'warn',
      title: LiveGateway.setupMessage() };
    const S = LiveDataStore;
    if (S.status.bootstrap === 'ready') {
      const partial = S.status.process === 'error' || S.status.result === 'error';
      return partial
        ? { key: 'partial', label: 'LIVE DATA · SEBAGIAN', tone: 'warn',
            title: 'Bootstrap berhasil, namun sebagian domain gagal dimuat.' }
        : { key: 'live', label: 'LIVE DATA · SUPABASE', tone: 'ok',
            title: 'Data berasal dari database pusat melalui Monitoring Pusat Read Gateway.' };
    }
    if (S.status.bootstrap === 'loading') return { key: 'loading', label: 'MEMUAT…', tone: 'warn',
      title: 'Memuat data pusat.' };
    if (S.status.bootstrap === 'error') return { key: 'error', label: 'DATA ERROR', tone: 'err',
      title: (S.errors.bootstrap && S.errors.bootstrap.message) || 'Gagal memuat data Monitoring Pusat.' };
    return { key: 'idle', label: 'MEMUAT…', tone: 'warn', title: 'Menunggu bootstrap.' };
  },

  /* fasad stabil: identitas objek tidak berubah walau provider berganti,
     sehingga DashboardService/InformationService tidak perlu di-rebind. */
  facade: null,
  infoFacade: null,
  buildFacades: function () {
    const hub = this;
    const passthrough = ['dates', 'firstDate', 'lastDate', 'org', 'lookup', 'getRecords', 'getEvents',
      'getResultRecords', 'resultEceran', 'countSalesmen', 'stats'];
    const optional = ['getResultMtdRecords', 'getResultDailyRecords', 'processDates', 'processLastDate',
      'processPeriodMonth', 'processHk', 'resultDates', 'resultLastDate', 'resultPeriodMonth', 'resultHk',
      'getResultTargets', 'getResultDailyEceran', 'getResultMtdEceran', 'audit',
      /* V1.7.7 — extension source_meta + jalur TOTAL DEPO (sengaja di luar rowMethods
         sehingga tidak terkena filter Coverage Salesman). */
      'getProcessDepotSummary', 'getProcessPeriodSummary', 'getResultDailyDepot', 'getResultBaselineDepot', 'getResultMtdRecordsRaw',
      /* V1.7.9 — future contract (additive; provider tanpa method ini mengembalikan undefined) */
      'getResultDailySalesman', 'getResultBaselineSalesman', 'getPublishHistory',
      'getRankingRecords', 'getRankingResultMtdRecords'];
    const f = {};
    passthrough.concat(optional).forEach(function (name) {
      f[name] = function () {
        const p = hub.active();
        if (typeof p[name] !== 'function') return undefined;
        const value = p[name].apply(p, arguments);
        /* V1.7.5 — satu gerbang filter bisnis untuk seluruh record Proses,
           Hasil, dan Anomali. Information memakai facade lain dan tidak terkena. */
        const rowMethods = { getRecords: 1, getEvents: 1, getResultRecords: 1,
          getResultMtdRecords: 1, getResultDailyRecords: 1, getRankingRecords: 1, getRankingResultMtdRecords: 1 };
        const projectScope = window.SalesmanProjectScope || null;
        if (rowMethods[name] && projectScope)
          return projectScope.filterRows(value);
        if (name === 'countSalesmen' && projectScope && !projectScope.isAll()) {
          const sc = arguments[0] || {}, org = p.org();
          let depotAllow = null;
          try { depotAllow = OrgResolver.depotSetOf(sc); } catch (e) { depotAllow = null; }
          return (org.salesmen || []).filter(function (sm) {
            if (!projectScope.isAllowed(sm.salesman_code)) return false;
            if (depotAllow && !depotAllow[sm.depot_code]) return false;
            if (sc.depot && sm.depot_code !== sc.depot) return false;
            if (sc.ass && sm.ass_code !== sc.ass) return false;
            if (sc.salesman && sm.salesman_code !== sc.salesman) return false;
            return true;
          }).length;
        }
        return value;
      };
    });
    Object.defineProperty(f, 'mode', { get: function () { return hub.active().mode; } });
    Object.defineProperty(f, 'label', { get: function () { return hub.active().label; } });
    Object.defineProperty(f, 'today', { get: function () {
      const p = hub.active();
      return p.today || p.lastDate() || null;
    } });
    f.rev = function () { const p = hub.active(); return typeof p.rev === 'function' ? p.rev() : 0; };
    f.isLive = function () { return hub.isLive(); };
    this.facade = f;

    const inf = { getLatestByDepot: function () { return hub.activeInfo().getLatestByDepot(); } };
    Object.defineProperty(inf, 'mode', { get: function () { return hub.activeInfo().mode; } });
    Object.defineProperty(inf, 'label', { get: function () { return hub.activeInfo().label; } });
    this.infoFacade = inf;
    return this;
  }
};

/* ============================================================================
   LAYER 5 — DASHBOARD SERVICE
   Satu-satunya jembatan antara DataProvider dan Renderer.
   Renderer TIDAK PERNAH menyentuh array data mentah.
   Mengganti DemoDataProvider -> ApiDataProvider cukup di sini.

/* ============================================================================
   LAYER 4C — RESULT CAPABILITY REGISTRY (V1.7.9)
   ----------------------------------------------------------------------------
   SATU tempat untuk menjawab "authority apa yang tersedia?".

   Renderer dan service TIDAK BOLEH memparsing source_meta sendiri. Alur resmi:
     SOURCE -> VALIDATE (LiveNormalize) -> NORMALIZE (LiveDataStore)
            -> CAPABILITY DETECTION (di sini) -> SCOPE -> AGGREGATE -> RENDER

   SOURCE PRIORITY FINAL:
     HASIL KERJA DAILY
       Coverage Semua Salesman : result_daily_depot V2 (TOTAL DEPO authority)
                                 -> legacy hanya bila memang existing fallback.
       Coverage Project        : result_daily_salesman V1
                                 -> granular salesman existing (public.result_daily)
                                 -> unavailable. TIDAK PERNAH Total Depo.
     DETAIL MTD BASELINE
       Coverage Semua Salesman : result_baseline_depot V1
       Coverage Project        : result_baseline_salesman V1
                                 -> unavailable. TIDAK PERNAH baseline Depo.
     PUBLISH HISTORY
       publish_history V1 complete === true -> COMPLETE
       observable current batches           -> PARTIAL
       tidak ada sumber usable              -> NONE

   Snapshot di-cache per (rev data x rev Coverage Project) sehingga pemeriksaan
   capability tidak pernah menjadi biaya per-render.
   ========================================================================= */
const ResultCapabilities = {
  _key: '', _snap: null,
  _rev: function () {
    let rev = 0;
    try { rev = ProviderHub.facade.rev(); } catch (e) { rev = 0; }
    let prev = 0, pkey = '';
    try {
      prev = (typeof SalesmanProjectScope !== 'undefined') ? SalesmanProjectScope.rev : 0;
      pkey = (typeof SalesmanProjectScope !== 'undefined' && !SalesmanProjectScope.isAll())
        ? SalesmanProjectScope.projectKey(SalesmanProjectScope.selected()) : '';
    } catch (e) { prev = 0; pkey = ''; }
    let mode = 'demo';
    try { mode = ProviderHub.mode(); } catch (e) { mode = 'demo'; }
    return [mode, rev, prev, pkey].join('|');
  },
  _store: function (name) {
    try {
      const f = ProviderHub.facade;
      if (typeof f[name] !== 'function') return null;
      return f[name]() || null;
    } catch (e) { return null; }
  },
  snapshot: function () {
    const key = this._rev();
    if (this._snap && this._key === key) return this._snap;
    const live = (function () { try { return ProviderHub.isLive(); } catch (e) { return false; } })();
    const dd = this._store('getResultDailyDepot');
    const ds = this._store('getResultDailySalesman');
    const bd = this._store('getResultBaselineDepot');
    const bs = this._store('getResultBaselineSalesman');
    const projectActive = (typeof SalesmanProjectScope !== 'undefined') && !SalesmanProjectScope.isAll();
    /* Mode publish history dihitung oleh PublishHistoryService yang memegang
       kontrak V1 sekaligus observable batches. Guard typeof: registry ini
       didefinisikan lebih awal, tetapi hanya dipanggil saat runtime. */
    let phMode = 'NONE', phSource = 'NONE';
    try {
      if (typeof PublishHistoryService !== 'undefined') {
        const m = PublishHistoryService.mode();
        phMode = m.mode; phSource = m.source;
      }
    } catch (e) { phMode = 'NONE'; phSource = 'NONE'; }
    const snap = {
      live: live,
      projectActive: projectActive,
      projectLabel: (typeof SalesmanProjectScope !== 'undefined') ? SalesmanProjectScope.label() : '',
      dailyDepotAvailable: !!(live && dd && dd.available && dd.rows && dd.rows.length),
      dailySalesmanAvailable: !!(live && ds && ds.available && ds.rows && ds.rows.length),
      dailySalesmanVersion: ds ? ds.version : null,
      dailySalesmanRowsBasis: ds ? ds.rowsBasis : null,
      baselineDepotAvailable: !!(live && bd && bd.available && bd.rows && bd.rows.length),
      baselineSalesmanAvailable: !!(live && bs && bs.available && bs.rows && bs.rows.length),
      baselineSalesmanHeader: (bs && bs.available) ? bs.header : null,
      publishHistoryMode: phMode,
      publishHistorySource: phSource
    };
    /* Authority efektif — inilah yang dibaca service, sehingga tidak ada
       pemeriksaan source yang tersebar di renderer. */
    snap.dailyAuthority = projectActive
      ? (snap.dailySalesmanAvailable ? 'RESULT_DAILY_SALESMAN_V1' : 'SCOPED_GRANULAR_OR_NONE')
      : (snap.dailyDepotAvailable ? 'RESULT_DAILY_DEPOT_V2' : 'LEGACY');
    snap.baselineAuthority = projectActive
      ? (snap.baselineSalesmanAvailable ? 'RESULT_BASELINE_SALESMAN_V1' : 'UNAVAILABLE')
      : (snap.baselineDepotAvailable ? 'RESULT_BASELINE_DEPOT_V1' : 'UNAVAILABLE');
    this._key = key; this._snap = snap;
    return snap;
  },

  /* ==========================================================================
     V1.7.9.1 — COMPLETENESS FOR SCOPE (PARTIAL ROLLOUT GUARD).

     Future contract akan dirilis BERTAHAP per Depo dari Website ASS. Bila baru
     sebagian Depo mengirimkannya, parent Regional/Nasional TIDAK BOLEH
     menampilkan hasil subset seolah-olah itu angka Project yang lengkap.

     EXPECTED DEPOT SET (generic, tanpa hardcode project apa pun):
       salesman member Project aktif (Master Salesman / SalesmanProjectScope)
       -> canonical depot_code lewat organization graph existing
       -> disaring Monitoring Scope + Regional/Cabang/Depo aktif
       -> disaring status Master Cabang 'monitoring'.

     AVAILABLE DEPOT SET:
       HANYA Depo yang punya contract future VALID (parser fail-closed).
       Punya Daily Depot V2 / result_mtd / batch RESULT / source_meta lain
       TIDAK membuat sebuah Depo dianggap tersedia.

     completeForScope = expected > 0 DAN missing = 0.
     Renderer TIDAK menghitung ulang coverage; cukup membaca hasil di sini.
     Cache mempertimbangkan rev data, Project aktif, Monitoring Scope, dan
     scope drilldown aktif sehingga tidak pernah stale.
     ========================================================================== */
  _cKey: '', _cVal: null,
  _scopeKey: function (scope) {
    const sc = scope || {};
    let ms = 0;
    try { ms = (typeof MonitoringScope !== 'undefined') ? MonitoringScope.rev : 0; } catch (e) { ms = 0; }
    let orgRev = 0;
    try { orgRev = (typeof OrgResolver !== 'undefined' ? OrgResolver.rev : 0) | 0; } catch (e) { orgRev = 0; }
    let period = '';
    try {
      const f = ProviderHub.facade;
      period = (typeof f.resultPeriodMonth === 'function' ? f.resultPeriodMonth() : '') || '';
    } catch (e) { period = ''; }
    return [this._rev(), ms, orgRev, period, sc.regional || '', sc.branch || '', sc.depot || '',
            sc.ass || '', sc.salesman || ''].join('|');
  },
  _depotAllowed: function (code) {
    try { return MasterCabangAuthority.allowed(code, 'monitoring'); } catch (e) { return true; }
  },
  _scopeDepotSet: function (scope) {
    try { return OrgResolver.depotSetOf(scope || {}) || {}; } catch (e) { return {}; }
  },
  completeness: function (scope) {
    const key = this._scopeKey(scope);
    if (this._cVal && this._cKey === key) return this._cVal;
    const snap = this.snapshot();
    const out = {
      projectActive: snap.projectActive, projectLabel: snap.projectLabel,
      expectedDepots: [], expectedCount: 0, expectedSalesmen: 0, hasProjectMember: false,
      daily: { available: snap.dailySalesmanAvailable, expectedDepots: 0, availableDepots: 0,
               missingDepots: 0, completeForScope: false, state: 'ABSENT' },
      baseline: { available: snap.baselineSalesmanAvailable, expectedDepots: 0, availableDepots: 0,
                  missingDepots: 0, missingSalesmen: 0, completeForScope: false, state: 'ABSENT' }
    };
    if (!snap.projectActive) { this._cKey = key; this._cVal = out; return out; }

    /* ---- EXPECTED: member Project -> canonical Depo -> scope ---- */
    let members = null, org = null;
    try { members = SalesmanProjectScope.activeSet(); } catch (e) { members = null; }
    try { org = ProviderHub.facade.org(); } catch (e) { org = null; }
    const scopeSet = this._scopeDepotSet(scope);
    const expectedDepotSet = {}, expectedSalesmen = [];
    /* Map salesman_code -> canonical depot. Dibangun sekali per cache key dan
       bekerja untuk semua bentuk organization graph (byCode maupun list). */
    let byCode = (org && org.byCode && org.byCode.salesman) ? org.byCode.salesman : null;
    if (!byCode) {
      byCode = {};
      const list = (org && org.salesmen) || [];
      for (let i = 0; i < list.length; i++) {
        const sm = list[i];
        const c = String((sm && sm.salesman_code) === undefined || sm.salesman_code === null ? '' : sm.salesman_code).trim();
        if (c && byCode[c] === undefined) byCode[c] = sm;
      }
    }
    if (members && members.size) {
      const self = this;
      members.forEach(function (code) {
        const sm = byCode[code];
        if (!sm || !sm.depot_code) return;                 /* tidak dikenal graph -> tidak diklaim */
        const d = sm.depot_code;
        if (!scopeSet[d]) return;                          /* di luar Monitoring Scope / drilldown */
        if (!self._depotAllowed(d)) return;
        expectedDepotSet[d] = 1;
        expectedSalesmen.push({ code: code, depot: d });
      });
    }
    const expected = Object.keys(expectedDepotSet);
    out.expectedDepots = expected;
    out.expectedCount = expected.length;
    out.expectedSalesmen = expectedSalesmen.length;
    out.hasProjectMember = expected.length > 0;

    /* ---- AVAILABLE: hanya Depo dengan contract future VALID ---- */
    const availOf = function (storeName) {
      const set = {};
      try {
        const f = ProviderHub.facade;
        if (typeof f[storeName] !== 'function') return set;
        const st = f[storeName]();
        if (!st || !st.available || !st.depots) return set;
        for (let i = 0; i < st.depots.length; i++) set[st.depots[i]] = 1;
      } catch (e) { /* store absen = tidak ada Depo tersedia */ }
      return set;
    };
    const dailyAvail = availOf('getResultDailySalesman');
    const baseAvail = availOf('getResultBaselineSalesman');

    function fill(target, availSet) {
      let have = 0;
      const missing = [];
      for (let i = 0; i < expected.length; i++) {
        if (availSet[expected[i]]) have++;
        else missing.push(expected[i]);
      }
      target.expectedDepots = expected.length;
      target.availableDepots = have;
      target.missingDepots = missing.length;
      target.missingList = missing;
      target.completeForScope = expected.length > 0 && missing.length === 0;
      target.state = expected.length === 0 ? 'NO_MEMBER'
                   : have === 0 ? 'ABSENT'
                   : target.completeForScope ? 'COMPLETE' : 'PARTIAL';
      return target;
    }
    fill(out.daily, dailyAvail);
    fill(out.baseline, baseAvail);

    /* ---- Baseline: cek salesman-level konservatif ----
       Contract baseline berscope SALESMAN dan diterima secara fail-closed per
       Depo, jadi Depo yang diterima WAJIB memuat seluruh member Project-nya.
       Member yang Deponya memang belum mengirim contract sudah terhitung pada
       missingDepots dan tidak dihitung dua kali. */
    let bySalesman = null;
    try {
      const st = ProviderHub.facade.getResultBaselineSalesman();
      bySalesman = (st && st.available) ? st.bySalesman : null;
    } catch (e) { bySalesman = null; }
    if (bySalesman) {
      let missSm = 0;
      for (let i = 0; i < expectedSalesmen.length; i++) {
        const e = expectedSalesmen[i];
        if (!baseAvail[e.depot]) continue;                 /* Depo-nya sudah dihitung missing */
        if (bySalesman[e.code] === undefined) missSm++;
      }
      out.baseline.missingSalesmen = missSm;
      if (missSm > 0) {
        out.baseline.completeForScope = false;
        if (out.baseline.state === 'COMPLETE') out.baseline.state = 'PARTIAL';
      }
    }
    this._cKey = key; this._cVal = out;
    return out;
  },
  invalidate: function () { this._key = ''; this._snap = null; this._cKey = ''; this._cVal = null; }
};
window.ResultCapabilities = ResultCapabilities;

  ];

  /* V1.7.0 — kalender PROSES tidak lagi dibekukan saat modul dibuat. Provider
     LIVE mengisi kalender setelah fetch selesai, sehingga kalender disinkronkan
     ulang setiap kali revisi data berubah. HASIL KERJA memakai kalender sendiri
     (lihat resultContext) karena periode PROSES dan RESULT independen. */
  let ALL = DP.dates() || [];
  let LAST = ALL.length - 1;
  let _calRev = -1;
  function syncCal() {
    const rev = typeof DP.rev === 'function' ? DP.rev() : 0;
    if (rev === _calRev) return;
    _calRev = rev;
    ALL = DP.dates() || [];
    LAST = ALL.length - 1;
  }
  function isLiveMode() { return typeof DP.isLive === 'function' ? !!DP.isLive() : false; }

  function sliceDates(a, b) { return ALL.slice(Math.max(0, a), Math.min(ALL.length, b + 1)); }
  function rangeOf(list) { return list.length ? { from: list[0], to: list[list.length - 1] }
                                             : { from: ALL[LAST] || null, to: ALL[LAST] || null }; }

  /* ---------------- periode ---------------- */
  function resolvePeriod(key) {
    syncCal();
    const today = ALL[LAST];
    let cur, prev, trend, trendNote, gran;

    if (key === 'w7') {
      cur = sliceDates(LAST - 6, LAST);
      prev = sliceDates(LAST - 13, LAST - 7);
      trend = cur; gran = 'day';
      trendNote = 'Trend harian 7 hari kerja terakhir.';
    } else if (key === 'mtd') {
      const mon = today.slice(0, 7);
      cur = ALL.filter(function (d) { return d.slice(0, 7) === mon; });
      const startIdx = ALL.indexOf(cur[0]);
      prev = sliceDates(startIdx - cur.length, startIdx - 1);
      trend = cur; gran = 'day';
      trendNote = 'Trend harian bulan berjalan (' + U.MONTHS[+today.slice(5, 7) - 1] + ' ' + today.slice(0, 4) + ').';
    } else {
      key = 'today';
      cur = sliceDates(LAST, LAST);
      prev = sliceDates(LAST - 1, LAST - 1);
      trend = sliceDates(LAST - 13, LAST); gran = 'day';
      trendNote = 'Snapshot 1 hari — 14 hari kerja terakhir ditampilkan sebagai konteks pembanding.';
    }

    /* V1.2 — jendela pola berulang = MAX(panjang periode aktif, 14 hari kerja).
       Sebelumnya "7 Hari" memakai window 7 HK sehingga pola dihitung dari rentang
       terlalu pendek. Sekarang minimum 14 HK berlaku untuk SEMUA periode. */
    const MIN_PATTERN_DAYS = 14;
    let win = cur;
    if (cur.length < MIN_PATTERN_DAYS) win = sliceDates(LAST - (MIN_PATTERN_DAYS - 1), LAST);

    return {
      key: key,
      label: (PERIODS.filter(function (p) { return p.key === key; })[0] || PERIODS[0]).label,
      dates: cur, range: rangeOf(cur),
      prevDates: prev, prevRange: rangeOf(prev),
      trendDates: trend, trendRange: rangeOf(trend), trendNote: trendNote, gran: gran,
      windowDates: win, windowRange: rangeOf(win),
      compareLabel: key === 'today' ? 'vs hari kerja sebelumnya'
                  : key === 'w7'    ? 'vs 7 hari sebelumnya'
                                    : 'vs periode setara sebelumnya'
    };
  }

  /* ---------------- agregasi (weighted, exact) ---------------- */
  const EMPTY = {
    n: 0, days: 0, salesmen: 0,
    jks: 0, sc: 0, visit: 0, ec: 0, omset: 0,
    visitOn: 0, visitOff: 0, geoOn: 0, geoOff: 0, ecOn: 0, ecOff: 0,
    sc_jks_pct: null, geo_match_pct: null, geo_off_route_pct: null,
    hit_rate_pct: null, avg_visit: null,
    avg_check_in: null, avg_check_out: null, avg_transport_minutes: null,
    avg_visit_duration_minutes: null,
    jks_visited: 0, jks_not_visited: 0, sales_call: 0, ec_count: 0,
    geo_on_route_eligible: 0, geo_off_route_eligible: 0,
    process_score: null, anomaly_total: 0, anomaly_critical: 0
  };

  function aggregate(recs) {
    if (!recs || !recs.length) return Object.assign({}, EMPTY);
    let jks = 0, sc = 0, vOn = 0, vOff = 0, gOn = 0, gOff = 0, eOn = 0, eOff = 0,
        omset = 0, ci = 0, co = 0, tr = 0, an = 0, anC = 0;
    const dset = {}, sset = {};
    /* V1.7.0 — akumulator counter production. Agregasi Depo/Cabang/Regional/
       Nasional memakai SUM numerator / SUM denominator. Rata-rata dari rata-rata
       TIDAK dipakai. */
    let live = false, salesCall = 0, ecTot = 0, jksV = 0, jksN = 0, gOnEl = 0, gOffEl = 0,
        ciSum = 0, ciCnt = 0, coSum = 0, coCnt = 0, trSum = 0, trCnt = 0, vdSum = 0, vdCnt = 0;
    for (let i = 0; i < recs.length; i++) {
      const r = recs[i];
      if (r.__live) {
        live = true;
        salesCall += r.sales_call; ecTot += r.ec_count;
        jksV += r.jks_visited; jksN += r.jks_not_visited;
        vOn += r.on_route_visits; vOff += r.off_route_visits;
        gOn += r.geo_on_route_match; gOnEl += r.geo_on_route_eligible;
        gOff += r.geo_off_route_match; gOffEl += r.geo_off_route_eligible;
        ciSum += r.check_in_seconds_sum; ciCnt += r.check_in_count;
        coSum += r.check_out_seconds_sum; coCnt += r.check_out_count;
        trSum += r.transport_duration_seconds_sum; trCnt += r.transport_duration_count;
        vdSum += r.visit_duration_seconds_sum; vdCnt += r.visit_duration_count;
        omset += r.omset; an += r.anomaly_total; anC += r.anomaly_critical;
      } else {
        jks += r.jks_count; sc += r.sc_count;
        vOn += r.on_route_visits; vOff += r.off_route_visits;
        gOn += r.on_route_geo_ok; gOff += r.off_route_geo_ok;
        eOn += r.on_route_ec; eOff += r.off_route_ec;
        omset += r.omset; ci += r.avg_check_in; co += r.avg_check_out; tr += r.avg_transport_minutes;
        an += r.anomaly_total; anC += r.anomaly_critical;
      }
      dset[r.report_date] = 1; sset[r.salesman_code] = 1;
    }
    if (live) {
      const nL = recs.length;
      const mL = {
        n: nL, days: Object.keys(dset).length, salesmen: Object.keys(sset).length,
        jks: jksV + jksN, sc: jksV, visit: salesCall, ec: ecTot, omset: omset,
        visitOn: vOn, visitOff: vOff, geoOn: gOn, geoOff: gOff, ecOn: null, ecOff: null,
        jks_visited: jksV, jks_not_visited: jksN, sales_call: salesCall, ec_count: ecTot,
        geo_on_route_eligible: gOnEl, geo_off_route_eligible: gOffEl,
        /* SC vs JKS mengikuti kontrak Website ASS existing:
           JKS Visited / (JKS Visited + JKS Not Visited). */
        sc_jks_pct:    (jksV + jksN) ? jksV / (jksV + jksN) * 100 : null,
        geo_match_pct: gOnEl  ? gOn  / gOnEl  * 100 : null,
        geo_off_route_pct: gOffEl ? gOff / gOffEl * 100 : null,
        hit_rate_pct:  salesCall ? ecTot / salesCall * 100 : null,
        avg_visit:     nL ? salesCall / nL : null,
        avg_check_in:  ciCnt ? ciSum / ciCnt / 60 : null,
        avg_check_out: coCnt ? coSum / coCnt / 60 : null,
        avg_transport_minutes: trCnt ? trSum / trCnt / 60 : null,
        avg_visit_duration_minutes: vdCnt ? vdSum / vdCnt / 60 : null,
        anomaly_total: an, anomaly_critical: anC
      };
      mL.process_score = KPI_MODEL.score(mL);
      /* EC tidak dipecah per route pada kontrak production -> null, bukan 0. */
      mL.on_route  = { visits: vOn,  geo_match_pct: gOnEl  ? gOn  / gOnEl  * 100 : null, hit_rate_pct: null, ec: null };
      mL.off_route = { visits: vOff, geo_match_pct: gOffEl ? gOff / gOffEl * 100 : null, hit_rate_pct: null, ec: null };
      return mL;
    }
    const n = recs.length, visit = vOn + vOff, ec = eOn + eOff;
    const m = {
      n: n, days: Object.keys(dset).length, salesmen: Object.keys(sset).length,
      jks: jks, sc: sc, visit: visit, ec: ec, omset: omset,
      visitOn: vOn, visitOff: vOff, geoOn: gOn, geoOff: gOff, ecOn: eOn, ecOff: eOff,
      sc_jks_pct:    jks   ? sc / jks * 100 : null,
      /* Definisi KPI pusat: Geo utama hanya ON ROUTE; OFF tidak dicampur. */
      geo_match_pct: vOn ? gOn / vOn * 100 : null,
      geo_off_route_pct: vOff ? gOff / vOff * 100 : null,
      hit_rate_pct:  visit ? ec / visit * 100 : null,
      avg_visit:     visit / n,
      avg_check_in:  ci / n, avg_check_out: co / n, avg_transport_minutes: tr / n,
      anomaly_total: an, anomaly_critical: anC
    };
    /* process_score dihitung ulang dari KPI agregat -> parent selalu konsisten dgn anak */
    m.process_score = KPI_MODEL.score(m);
    m.on_route = {
      visits: vOn, geo_match_pct: vOn ? gOn / vOn * 100 : null,
      hit_rate_pct: vOn ? eOn / vOn * 100 : null, ec: eOn
    };
    m.off_route = {
      visits: vOff, geo_match_pct: vOff ? gOff / vOff * 100 : null,
      hit_rate_pct: vOff ? eOff / vOff * 100 : null, ec: eOff
    };
    return m;
  }

  function delta(a, b) { return (a === null || b === null || a === undefined || b === undefined) ? null : a - b; }

  /* ==========================================================================
     V1.7.7 — DEPOT SCOPE RESOLVER (shared oleh PROCESS summary & RESULT V2).
     Mengembalikan daftar kode Depo yang berada di dalam:
       Monitoring Scope (outer allowlist Regional) DAN AppState scope aktif.
     Coverage Salesman / Project SENGAJA tidak dipakai di sini.
     ========================================================================== */
  function depotCodesInScope(scope) {
    const sc = scope || {};
    /* OrgResolver.depotCodesOf sudah menerapkan Monitoring Scope (outer allowlist)
       DAN drilldown Regional/Cabang/Depo, serta di-memo -> lookup murah. */
    let allow = null;
    try { allow = OrgResolver.depotSetOf(sc); } catch (e) { allow = null; }
    const out = [];
    if (!allow) return out;
    for (const k in allow) if (allow[k]) out.push(k);
    return out;
  }
  function depotSetInScope(scope) {
    const set = {}, list = depotCodesInScope(scope);
    for (let i = 0; i < list.length; i++) set[list[i]] = 1;
    return set;
  }
  /* arithmetic mean yang MENGEKSKLUSI missing (missing != 0) */
  function meanValid(values) {
    let sum = 0, n = 0;
    for (let i = 0; i < values.length; i++) {
      const v = values[i];
      if (v === null || v === undefined || !isFinite(v)) continue;
      sum += v; n++;
    }
    return n ? sum / n : null;
  }
  function sumValid(values) {
    let sum = 0, n = 0;
    for (let i = 0; i < values.length; i++) {
      const v = values[i];
      if (v === null || v === undefined || !isFinite(v)) continue;
      sum += v; n++;
    }
    return n ? sum : null;
  }

  /* ==========================================================================
     V1.7.7 — PROCESS DEPOT SUMMARY SERVICE.
     Website ASS adalah calculation authority. Untuk Dashboard managerial pada
     level Nasional / Regional / Cabang / Depo, KPI FINAL diambil apa adanya
     dari process_depot_summary. Parent memakai 1 DEPO = 1 SUARA.
     Level ASS / Salesman TETAP memakai process_daily (grain summary hanya
     DEPOT_MONTH — tidak boleh dipura-purakan menjadi grain di bawahnya).
     ========================================================================== */
  const ProcessSummary = {
    RATE_FIELDS: ['sc_jks_pct', 'geo_on_route_pct', 'geo_off_route_pct', 'hit_rate_pct',
                  'avg_visit', 'avg_check_in_minutes', 'avg_check_out_minutes', 'avg_transport_minutes'],

    periodStore: function (periodKey) {
      if (!isLiveMode() || typeof DP.getProcessPeriodSummary !== 'function') return null;
      const st = DP.getProcessPeriodSummary();
      if (!st || !st.byPeriod) return null;
      const key = periodKey === 'w7' ? 'w7' : (periodKey === 'mtd' ? 'mtd' : 'today');
      const bucket = st.byPeriod[key];
      return (bucket && bucket.available && bucket.rows && bucket.rows.length) ? bucket : null;
    },
    legacyMtdStore: function () {
      if (!isLiveMode() || typeof DP.getProcessDepotSummary !== 'function') return null;
      const st = DP.getProcessDepotSummary();
      return (st && st.available && st.rows && st.rows.length) ? st : null;
    },
    /* Source period-aware menjadi prioritas. process_depot_summary hanya fallback
       untuk MTD agar batch lama tetap terbaca tanpa mengubah contract lama. */
    store: function (periodKey) {
      const p = this.periodStore(periodKey);
      if (p) return { rows: p.rows, available: true, sourceType: 'period', periodKey: periodKey };
      if (periodKey === 'mtd') {
        const legacy = this.legacyMtdStore();
        if (legacy) return { rows: legacy.rows, available: true, sourceType: 'legacy_mtd', periodKey: 'mtd' };
      }
      return null;
    },
    /* Depo yang punya summary valid DAN berada di dalam Monitoring Scope aktif.
       Coverage Salesman/Project sengaja tidak diterapkan: grain = Depo. */
    rowsFor: function (scope, periodKey) {
      const st = this.store(periodKey); if (!st) return [];
      const sc = scope || {};
      if (sc.ass || sc.salesman) return [];
      const set = depotSetInScope(sc), out = [];
      for (let i = 0; i < st.rows.length; i++) if (set[st.rows[i].depot_code] &&
        MasterCabangAuthority.allowed(st.rows[i].depot_code, 'monitoring')) out.push(st.rows[i]);
      return out;
    },
    available: function (scope, periodKey) { return this.rowsFor(scope, periodKey).length > 0; },
    metricsFor: function (scope, periodKey) {
      const rows = this.rowsFor(scope, periodKey);
      if (!rows.length) return null;
      const st = this.store(periodKey);
      const out = { __summary: true, kpi_source: 'WEBSITE_ASS_FINAL_KPI',
                    summary_period_key: periodKey,
                    summary_source_type: st ? st.sourceType : '',
                    summary_depots: rows.length,
                    summary_depot_codes: rows.map(function (r) { return r.depot_code; }) };
      ProcessSummary.RATE_FIELDS.forEach(function (f) {
        out[f] = meanValid(rows.map(function (r) { return r[f]; }));
      });
      out.total_visit = sumValid(rows.map(function (r) { return r.total_visit; }));
      out.ec_count_sum = sumValid(rows.map(function (r) { return r.ec_count; }));
      out.active_salesman_days = sumValid(rows.map(function (r) { return r.active_salesman_days; }));
      out.salesman_count = sumValid(rows.map(function (r) { return r.salesman_count; }));
      /* metadata periode untuk audit/note. Pada parent multi-Depo, bounds hanya
         ditampilkan bila seluruh Depo memiliki nilai yang sama. */
      const froms = rows.map(function (r) { return r.date_from; }).filter(Boolean);
      const tos = rows.map(function (r) { return r.date_to; }).filter(Boolean);
      const hks = rows.map(function (r) { return r.hk; }).filter(function (v) { return v !== null && v !== undefined; });
      out.summary_date_from = froms.length && froms.every(function (v) { return v === froms[0]; }) ? froms[0] : null;
      out.summary_date_to = tos.length && tos.every(function (v) { return v === tos[0]; }) ? tos[0] : null;
      out.summary_hk = hks.length && hks.every(function (v) { return v === hks[0]; }) ? hks[0] : null;
      return out;
    },
    merge: function (base, scope, periodKey) {
      const sm = this.metricsFor(scope, periodKey);
      if (!sm) return base;
      const m = Object.assign({}, base);
      if (sm.sc_jks_pct !== null) m.sc_jks_pct = sm.sc_jks_pct;
      if (sm.geo_on_route_pct !== null) m.geo_match_pct = sm.geo_on_route_pct;
      if (sm.geo_off_route_pct !== null) m.geo_off_route_pct = sm.geo_off_route_pct;
      if (sm.hit_rate_pct !== null) m.hit_rate_pct = sm.hit_rate_pct;
      if (sm.avg_visit !== null) m.avg_visit = sm.avg_visit;
      if (sm.avg_check_in_minutes !== null) m.avg_check_in = sm.avg_check_in_minutes;
      if (sm.avg_check_out_minutes !== null) m.avg_check_out = sm.avg_check_out_minutes;
      if (sm.avg_transport_minutes !== null) m.avg_transport_minutes = sm.avg_transport_minutes;
      if (sm.total_visit !== null) m.visit = sm.total_visit;
      if (sm.ec_count_sum !== null) m.ec = sm.ec_count_sum;
      m.process_score = KPI_MODEL.score(m);
      m.__summary = true;
      m.kpi_source = sm.kpi_source;
      m.summary_period_key = sm.summary_period_key;
      m.summary_source_type = sm.summary_source_type;
      m.summary_depots = sm.summary_depots;
      m.summary_salesman_count = sm.salesman_count;
      m.summary_active_salesman_days = sm.active_salesman_days;
      m.summary_date_from = sm.summary_date_from;
      m.summary_date_to = sm.summary_date_to;
      m.summary_hk = sm.summary_hk;
      return m;
    },
    /* Managerial authority hanya level Nasional/Regional/Cabang/Depo.
       Bila extension period tersedia, period selection WAJIB sesuai tombol.
       MTD legacy tetap boleh fallback ke process_depot_summary. */
    appliesTo: function (scope, periodKey) {
      const sc = scope || {};
      if (sc.ass || sc.salesman) return false;
      const key = periodKey === 'w7' ? 'w7' : (periodKey === 'mtd' ? 'mtd' : 'today');
      return this.available(sc, key);
    },
    sourceNote: function (scope, periodKey) {
      const key = periodKey === 'w7' ? 'w7' : (periodKey === 'mtd' ? 'mtd' : 'today');
      const rows = this.rowsFor(scope, key);
      if (!rows.length) return null;
      const st = this.store(key);
      const label = key === 'today' ? 'Hari Ini' : (key === 'w7' ? '7 Hari Kerja' : 'Bulan Ini');
      const legacy = st && st.sourceType === 'legacy_mtd';
      return 'KPI final Website ASS (' + (legacy ? 'process_depot_summary' : 'process_period_summary.' +
             (key === 'w7' ? 'last_7_workdays' : key)) + ') · ' + label + ' · ' + rows.length +
             ' Depo · SC vs JKS = On Route · parent memakai rata-rata antar Depo (1 Depo = 1 suara) · ' +
             'tidak mengikuti Coverage Salesman.';
    }
  };

  /* ---------------- level & anak scope ---------------- */
  function levelOf(scope) {
    if (scope.ass)      return 'ass';
    if (scope.depot)    return 'depot';
    if (scope.branch)   return 'branch';
    if (scope.regional) return 'regional';
    return 'national';
  }
  /* V1.5 — hierarki final: Nasional > Regional > Cabang > Depo > ASS > Salesman */
  const CHILD_OF = { national: 'regional', regional: 'branch', branch: 'depot', depot: 'ass', ass: 'salesman' };
  const LEVEL_LABEL = { national: 'Nasional', regional: 'Regional', branch: 'Cabang',
                        depot: 'Depo', ass: 'ASS', salesman: 'Salesman' };

  function childrenOf(scope) {
    const org = DP.org(), lvl = levelOf(scope);
    const projectChildren = function (list) {
      return list.filter(function (c) {
        if (!MasterCabangAuthority.scopeHasAllowed(c.scope, 'monitoring')) return false;
        return typeof SalesmanProjectScope === 'undefined' || SalesmanProjectScope.isAll() ||
          SalesmanProjectScope.hasMatchInScope(c.scope);
      });
    };
    /* V1.6.6 — Regional / Cabang / Depo bersumber dari resolved organization graph */
    if (lvl === 'national') return projectChildren(OrgResolver.childrenAt({}, 'regional'));
    if (lvl === 'regional') return projectChildren(OrgResolver.childrenAt({ regional: scope.regional }, 'branch'));
    if (lvl === 'branch') return projectChildren(OrgResolver.childrenAt({ regional: scope.regional, branch: scope.branch }, 'depot'));
    /* Depo -> ASS. Daftar ASS diturunkan dari salesman pada scope aktif (bukan dari
       asumsi 1 depo = 1 ASS), sehingga tetap benar bila kelak satu ASS lintas depo. */
    if (lvl === 'depot') {
      if (!MasterCabangAuthority.allowed(scope.depot, 'monitoring')) return [];
      const seen = {}, out = [];
      org.salesmen.forEach(function (s) {
        if (typeof SalesmanProjectScope !== 'undefined' && !SalesmanProjectScope.isAllowed(s.salesman_code)) return;
        if (s.depot_code !== scope.depot || seen[s.ass_code]) return;
        seen[s.ass_code] = 1;
        out.push({ key: s.ass_code, code: s.ass_code, name: s.ass_name, label: s.ass_name,
                   scope: { regional: scope.regional, branch: scope.branch, depot: scope.depot, ass: s.ass_code },
                   kind: 'ass' });
      });
      out.sort(function (a, b) { return a.label < b.label ? -1 : (a.label > b.label ? 1 : 0); });
      return out;
    }
    /* ASS -> Salesman (dibatasi depo aktif bila ada, agar ASS lintas depo tetap benar) */
    return org.salesmen.filter(function (s) {
        return (typeof SalesmanProjectScope === 'undefined' || SalesmanProjectScope.isAllowed(s.salesman_code)) &&
          MasterCabangAuthority.allowed(s.depot_code, 'monitoring') &&
          s.ass_code === scope.ass && (!scope.depot || s.depot_code === scope.depot); })
      .map(function (s) {
        const rd = OrgResolver.resolveDepot(s.depot_code);
        return { key: s.salesman_code, code: s.salesman_code, name: s.salesman_name,
               label: s.salesman_name,
               scope: { regional: rd ? rd.regional_code : s.regional_code,
                        branch: rd ? rd.branch_code : s.branch_code, depot: s.depot_code,
                        ass: s.ass_code, salesman: s.salesman_code },
               kind: 'salesman' }; });
  }

  /* ---------------- V1.1: metrik Monitoring Harian ----------------
     bands = [baik, normal, perlu perhatian] — di bawah band terakhir = perlu review.
     Ambang diselaraskan dengan status KPI Summary agar tidak ada dua standar. */
  const DAILY_METRICS = [
    { key: 'sc_jks', label: 'SC vs JKS', unit: '%', bands: KPI_MODEL.visual.sc_jks,
      value: function (m) { return m.sc_jks_pct; },
      cell: function (v) { return U.dec(v, 0) + '%'; },
      full: function (v) { return U.pct(v, 1); },
      legend: ['100% Excellent', '95–<100% Baik', '90–<95% Perlu Perhatian', '<90% Perlu Review'] },
    { key: 'geo', label: 'Geo Match On Route', unit: '%', bands: KPI_MODEL.visual.geo,
      value: function (m) { return m.geo_match_pct; },
      cell: function (v) { return U.dec(v, 0) + '%'; },
      full: function (v) { return U.pct(v, 1); },
      legend: ['100% Excellent', '95–<100% Baik', '90–<95% Perlu Perhatian', '<90% Perlu Review'] },
    { key: 'hit', label: 'Hit Rate EC', unit: '%', bands: KPI_MODEL.visual.hit,
      value: function (m) { return m.hit_rate_pct; },
      cell: function (v) { return U.dec(v, 0) + '%'; },
      full: function (v) { return U.pct(v, 1); },
      legend: ['≥72% Excellent', '65–<72% Baik', '55–<65% Perlu Perhatian', '<55% Perlu Review'] },
    { key: 'visit', label: 'Avg Visit', unit: '', bands: KPI_MODEL.visual.visit,
      value: function (m) { return m.avg_visit; },
      cell: function (v) { return U.dec(v, 1); },
      full: function (v) { return U.dec(v, 1); },
      legend: ['≥35 Excellent', '30–<35 Baik', '25–<30 Perlu Perhatian', '<25 Perlu Review'] }
  ];
  const METRIC_BY_KEY = {};
  DAILY_METRICS.forEach(function (m) { METRIC_BY_KEY[m.key] = m; });

  function heatOf(v, bands) { return KPI_MODEL.grade(v, bands); }
  /* V1.6.6 — grouping Regional/Cabang memakai identitas RESOLVED (Master Cabang
     authoritative), bukan row.regional_code / row.branch_code mentah. */
  function childKeyOf(row, childLevel) {
    if (childLevel === 'regional' || childLevel === 'branch') {
      const rd = OrgResolver.resolveDepot(row.depot_code);
      if (rd) return childLevel === 'regional' ? rd.regional_code : rd.branch_code;
      return childLevel === 'regional' ? row.regional_code : row.branch_code;
    }
    return childLevel === 'depot' ? row.depot_code
         : childLevel === 'ass'   ? row.ass_code
         : row.salesman_code;
  }

  /* ---------------- pola berulang ---------------- */
  const PATTERN_MIN_DAYS = 3;
  const STATUSES = ['Belum Validasi', 'Dalam Review', 'Tervalidasi'];

  function buildPatterns(events) {
    const map = {};
    for (let i = 0; i < events.length; i++) {
      const e = events[i], k = e.salesman_code + '|' + e.type;
      let g = map[k];
      if (!g) { const rd = OrgResolver.resolveDepot(e.depot_code);
                g = map[k] = { salesman_code: e.salesman_code, salesman_name: e.salesman_name,
                             depot_name: rd ? rd.name : e.depot_name, depot_code: e.depot_code,
                             branch_name: rd ? rd.branch_name : e.branch_name,
                             regional_code: rd ? rd.regional_code : e.regional_code,
                             regional_name: rd ? (rd.regional_name || '') : e.regional_name, type: e.type,
                             type_label: (ANOMALY_BY_KEY[e.type] || {}).label || e.type,
                             dates: {}, cases: 0, crit: 0, occurrences: [] }; }
      g.dates[e.report_date] = (g.dates[e.report_date] || 0) + e.cases;
      g.cases += e.cases;
      if (e.severity === 'crit') g.crit += e.cases;
      g.occurrences.push(e);
    }
    const out = [];
    for (const k in map) {
      const g = map[k];
      const dayList = Object.keys(g.dates).sort();
      if (dayList.length < PATTERN_MIN_DAYS) continue;
      g.days = dayList.length;
      g.dayList = dayList;
      g.severity = g.days >= 6 ? 'crit' : (g.days >= 4 ? 'review' : 'warn');
      g.severity_label = g.severity === 'crit' ? 'Critical' : (g.severity === 'review' ? 'Perlu Review' : 'Warning');
      g.status = STATUSES[hashStr(k) % (g.severity === 'crit' ? 2 : 3)];
      g.occurrences.sort(function (a, b) { return a.report_date < b.report_date ? -1 : 1; });
      out.push(g);
    }
    out.sort(function (a, b) { return (b.days - a.days) || (b.cases - a.cases) ||
                                     (a.salesman_name < b.salesman_name ? -1 : 1); });
    return out;
  }

  /* ---------------- anomali ringkas ---------------- */
  function summarizeAnomaly(events) {
    const patterns = buildPatterns(events);
    const patByType = {};
    patterns.forEach(function (p) { patByType[p.type] = (patByType[p.type] || 0) + 1; });

    /* V1.7.0 — daftar jenis anomali tidak lagi dikunci pada katalog demo.
       Jenis yang benar-benar muncul pada data pusat ikut terhitung. */
    const typeSeen = {}, typeDefs = [];
    ANOMALY_TYPES.forEach(function (T) { typeSeen[T.key] = 1; typeDefs.push(T); });
    for (let i = 0; i < events.length; i++) {
      const k = events[i].type;
      if (k && !typeSeen[k]) {
        typeSeen[k] = 1;
        typeDefs.push({ key: k, label: events[i].type_label || k, desc: '' });
      }
    }
    let byType = typeDefs.map(function (T) {
      let cases = 0, crit = 0; const sm = {};
      for (let i = 0; i < events.length; i++) {
        const e = events[i];
        if (e.type !== T.key) continue;
        cases += e.cases; if (e.severity === 'crit') crit += e.cases;
        sm[e.salesman_code] = 1;
      }
      return { key: T.key, label: T.label, desc: T.desc, cases: cases, critical: crit,
               salesmen: Object.keys(sm).length, patterns: patByType[T.key] || 0 };
    });
    /* Pada LIVE, jenis anomali tanpa kasus tidak ditampilkan sebagai baris kosong. */
    if (isLiveMode()) byType = byType.filter(function (t) { return t.cases > 0; });
    const total = U.sum(byType, function (t) { return t.cases; });
    byType.forEach(function (t) { t.share = total ? t.cases / total * 100 : 0; });
    byType.sort(function (a, b) { return b.cases - a.cases; });
    return { byType: byType, totalCases: total,
             totalCritical: U.sum(byType, function (t) { return t.critical; }),
             totalPatterns: patterns.length, patterns: patterns };
  }

  /* ---------------- temuan utama ---------------- */
  function buildInsights(ctx) {
    const out = [], scopeName = ctx.scopeName, childLabel = LEVEL_LABEL[ctx.childLevel] || 'Unit';
    const cur = ctx.summary, rows = ctx.rows;

    /* 1. unit anak terlemah */
    const ranked = rows.filter(function (r) { return r.metrics.n > 0; })
                       .slice().sort(function (a, b) { return a.metrics.process_score - b.metrics.process_score; });
    if (ranked.length > 1) {
      const w = ranked[0];
      if (w.metrics.process_score < 80) {
        out.push({ sev: w.metrics.process_score < 70 ? 'crit' : 'review',
          text: '<b>' + U.esc(w.label) + '</b> memiliki Process Score terendah pada scope ini: <b>' +
                U.dec(w.metrics.process_score, 1) + '</b> (SC vs JKS ' + U.pct(w.metrics.sc_jks_pct) +
                ', Geo Match On Route ' + U.pct(w.metrics.geo_match_pct) + ').',
          meta: childLabel + ' terendah dari ' + ranked.length + ' unit · klik wilayah pada Monitoring Harian untuk drill-down',
          rank: 100 - w.metrics.process_score });
      }
    }
    /* 2. unit di bawah ambang geo match */
    const lowGeo = rows.filter(function (r) { return r.metrics.n > 0 && r.metrics.geo_match_pct < 85; });
    if (lowGeo.length) {
      out.push({ sev: lowGeo.length >= 3 ? 'review' : 'warn',
        text: '<b>' + lowGeo.length + ' ' + childLabel.toLowerCase() + '</b> memiliki Geo Match On Route di bawah 85% — terendah ' +
              U.esc(lowGeo.slice().sort(function (a, b) { return a.metrics.geo_match_pct - b.metrics.geo_match_pct; })[0].label) +
              ' (' + U.pct(lowGeo.slice().sort(function (a, b) { return a.metrics.geo_match_pct - b.metrics.geo_match_pct; })[0].metrics.geo_match_pct) + ').',
        meta: 'Indikasi posisi check-in tidak cocok dengan titik outlet', rank: 60 + lowGeo.length });
    }
    /* 3. pola berulang critical */
    const critPat = ctx.anomaly.patterns.filter(function (p) { return p.severity === 'crit'; });
    if (ctx.anomaly.patterns.length) {
      const topType = {};
      ctx.anomaly.patterns.forEach(function (p) { topType[p.type_label] = (topType[p.type_label] || 0) + 1; });
      let best = null;
      for (const k in topType) if (!best || topType[k] > topType[best]) best = k;
      const smSet = {};
      ctx.anomaly.patterns.forEach(function (p) { smSet[p.salesman_code] = 1; });
      out.push({ sev: critPat.length >= 5 ? 'review' : 'warn',
        text: '<b>' + Object.keys(smSet).length + ' salesman</b> menunjukkan pola berulang (' +
              ctx.anomaly.patterns.length + ' pola)' +
              (best ? ', paling dominan <b>' + U.esc(best) + '</b> (' + topType[best] + ' salesman)' : '') +
              (critPat.length ? '; <b>' + critPat.length + '</b> di antaranya berkategori Critical.' : '.'),
        meta: 'Jendela analisis ' + ctx.windowDays + ' hari kerja · lihat section Pola Berulang',
        rank: 55 + critPat.length });
    }
    /* 4. (V1.2) Insight Route DIHAPUS dari Temuan Utama.
       Analisis On Route vs Off Route kini difokuskan di section
       "Rekap Anomali Bulanan per Wilayah". Data on_route/off_route tetap tersedia. */
    /* 5. KPI di bawah target */
    if (cur.sc_jks_pct !== null && cur.sc_jks_pct < 88) {
      out.push({ sev: cur.sc_jks_pct < 82 ? 'review' : 'warn',
        text: 'SC vs JKS pada <b>' + U.esc(scopeName) + '</b> hanya <b>' + U.pct(cur.sc_jks_pct) +
              '</b>, di bawah target 100%.', meta: 'Realisasi kunjungan terhadap JKS On Route', rank: 100 - cur.sc_jks_pct });
    }
    if (cur.avg_transport_minutes !== null && cur.avg_transport_minutes > 150) {
      out.push({ sev: cur.avg_transport_minutes > 180 ? 'review' : 'warn',
        text: 'Rata-rata durasi jalan <b>' + U.dur(cur.avg_transport_minutes) + '</b>, melewati acuan 2 jam.',
        meta: 'Acuan efisiensi durasi perjalanan', rank: (cur.avg_transport_minutes - 150) / 3 });
    }
    /* 6. sisi positif — jangan semua merah */
    if (ranked.length > 1) {
      const b = ranked[ranked.length - 1];
      if (b.metrics.process_score >= 85) out.push({ sev: 'good',
        text: '<b>' + U.esc(b.label) + '</b> menjadi ' + childLabel.toLowerCase() +
              ' terbaik dengan Process Score <b>' + U.dec(b.metrics.process_score, 1) + '</b>.',
        meta: 'Dapat dijadikan pembanding praktik kerja', rank: 12 });
    }
    if (!out.length) out.push({ sev: 'good',
      text: 'Tidak ditemukan penyimpangan menonjol pada <b>' + U.esc(scopeName) + '</b> untuk periode ini.',
      meta: 'Seluruh KPI utama berada dalam batas wajar', rank: 1 });

    const ORDER = { crit: 0, review: 1, warn: 2, good: 3 };
    out.sort(function (a, b) { return (ORDER[a.sev] - ORDER[b.sev]) || (b.rank - a.rank); });
    return out.slice(0, 5);
  }

  /* ====================== DOMAIN HASIL KERJA — MTD ======================
     V1.7.0 — HASIL KERJA memakai PERIODE SENDIRI. PROCESS boleh berada pada
     bulan yang berbeda dari RESULT dan itu kondisi VALID; tidak ada satu
     DP.lastDate() global yang memaksa keduanya sama. */
  const ResultBaseline = {
    store: function () {
      if (!isLiveMode() || typeof DP.getResultBaselineDepot !== 'function') return null;
      const s = DP.getResultBaselineDepot();
      return s && s.available ? s : null;
    },
    rowsFor: function (scope) {
      const s = this.store(); if (!s) return [];
      if ((scope || {}).ass || (scope || {}).salesman) return [];
      const set = depotSetInScope(scope || {}), out = [];
      for (let i = 0; i < s.rows.length; i++) {
        const r = s.rows[i];
        if (set[r.depot_code] && MasterCabangAuthority.allowed(r.depot_code, 'monitoring')) out.push(r);
      }
      return out;
    },
    currentDepotCodes: function (scope) {
      if ((scope || {}).ass || (scope || {}).salesman) return [];
      const seen = {}, out = [];
      try {
        const recs = (typeof DP.getResultMtdRecordsRaw === 'function') ? (DP.getResultMtdRecordsRaw(scope || {}) || []) : [];
        for (let i = 0; i < recs.length; i++) {
          const code = String(recs[i] && recs[i].depot_code || '').trim();
          if (!code || seen[code] || !MasterCabangAuthority.allowed(code, 'monitoring')) continue;
          seen[code] = 1; out.push(code);
        }
      } catch (e) { /* coverage diagnostic tidak boleh memblokir comparison */ }
      return out;
    },
    aggregate: function (scope) {
      const sc = scope || {}, grainSupported = !sc.ass && !sc.salesman;
      const rows = grainSupported ? this.rowsFor(sc) : [], currentDepots = grainSupported ? this.currentDepotCodes(sc) : [];
      const dist = {}, current = { omset: 0, roa: 0, ec: 0 }, baseline = { omset: 0, roa: 0, ec: 0 };
      rows.forEach(function (r) {
        ['omset','roa','ec'].forEach(function (k) { current[k] += r.current[k]; baseline[k] += r.baseline[k]; });
        const key = r.baseline_period_month; dist[key] = (dist[key] || 0) + 1;
      });
      const keys = Object.keys(dist).sort(), totalDepots = Math.max(currentDepots.length, rows.length);
      return { available: rows.length > 0, rows: rows, current: rows.length ? current : null,
        baseline: rows.length ? baseline : null, grainSupported: !!grainSupported,
        validDepots: rows.length, totalDepots: totalDepots, missingDepots: Math.max(0, totalDepots - rows.length),
        periods: keys, distribution: dist, mixed: keys.length > 1,
        currentPeriod: rows.length && rows.every(function (r) { return r.current_period_month === rows[0].current_period_month; })
          ? rows[0].current_period_month : null,
        currentHk: rows.length && rows.every(function (r) { return r.current_hk === rows[0].current_hk; }) ? rows[0].current_hk : null,
        baselinePeriod: keys.length === 1 ? keys[0] : null,
        baselineHk: rows.length && rows.every(function (r) { return r.baseline_hk === rows[0].baseline_hk; }) ? rows[0].baseline_hk : null };
    },
    labelMonth: function (iso, short) {
      if (!/^\d{4}-\d{2}/.test(String(iso || ''))) return '\u2013';
      const m = Number(String(iso).slice(5,7)), y = String(iso).slice(0,4);
      return (short ? U.MON_S[m - 1] : U.MONTHS[m - 1]) + ' ' + y;
    },
    header: function (agg, fallbackCurrent) {
      const cur = agg.currentPeriod ? this.labelMonth(agg.currentPeriod) : fallbackCurrent;
      const curHk = agg.currentHk === null ? '' : ' HK' + U.int(agg.currentHk);
      const coverage = agg.grainSupported === false || !agg.totalDepots ? '' :
        (U.int(agg.validDepots) + '/' + U.int(agg.totalDepots) + ' Depo' +
         (agg.missingDepots ? ' · ' + U.int(agg.missingDepots) + ' Depo belum tersedia' : ''));
      if (!agg.available) return { title: cur + curHk + ' · Baseline belum tersedia', baselineLabel: 'Baseline', distribution: '', coverage: coverage };
      if (agg.mixed) {
        const distribution = agg.periods.map(function (p) { return agg.distribution[p] + ' Depo ' + ResultBaseline.labelMonth(p, true); }).join(' · ');
        return { title: cur + curHk + ' vs Baseline Campuran', baselineLabel: 'Baseline Campuran', distribution: distribution, coverage: coverage };
      }
      return { title: cur + curHk + ' vs ' + this.labelMonth(agg.baselinePeriod) + ' Baseline' +
        (agg.baselineHk === null ? '' : ' HK' + U.int(agg.baselineHk)), baselineLabel: this.labelMonth(agg.baselinePeriod, true) + ' Baseline', distribution: '', coverage: coverage };
    }
  };

  function liveResultContext() {
    /* RankingTat memakai InformationService (authority HK yang sama dengan menu
       Informasi) dan hasilnya di-cache, sehingga tidak ada request jaringan baru
       dan tidak ada perhitungan berulang pada setiap pemanggilan. */
    let tatSnap = { tat: null, valid: false, hkRunning: null, totalHk: null,
                    reasonCode: 'NOT_READY', reason: 'TAT belum dihitung.' };
    let tatSourceText = 'TAT dihitung dari HK RESULT tertinggi pada Monitoring Scope ÷ Total HK bulan.';
    try { tatSnap = RankingTat.snapshot(); tatSourceText = RankingTat.sourceText(); } catch (e) { /* fail safe */ }
    const period = typeof DP.resultPeriodMonth === 'function' ? DP.resultPeriodMonth() : null;
    const cutoff = typeof DP.resultLastDate === 'function' ? DP.resultLastDate() : null;
    const hk = typeof DP.resultHk === 'function' ? DP.resultHk() : null;
    /* ======================================================================
       V1.7.7 — kalender harian HASIL KERJA pada LIVE berasal dari union
       report_date result_daily_depot V2 (ORDER_DATE). Legacy public.result_daily
       tetap dipakai bila periode aktif sama sekali tidak memiliki extension V2.
       HK / TAT TIDAK diambil dari sini — tetap authority RESULT existing.
       ====================================================================== */
    let dates = (typeof DP.resultDates === 'function' ? DP.resultDates() : []) || [];
    let dailySource = 'RESULT_DAILY_LEGACY';
    try {
      const dd = (typeof DP.getResultDailyDepot === 'function') ? DP.getResultDailyDepot() : null;
      if (dd && dd.available && dd.dates && dd.dates.length) {
        dates = dd.dates.slice();
        dailySource = 'RESULT_DAILY_DEPOT_V2';
      }
    } catch (e) { /* extension gagal dibaca -> legacy, domain lain tidak terganggu */ }
    const mon = period ? period.slice(0, 7) : (cutoff ? cutoff.slice(0, 7) : null);
    let curLabel = '\u2013';
    if (mon) {
      const y = Number(mon.slice(0, 4)), mm = Number(mon.slice(5, 7));
      curLabel = U.MONTHS[mm - 1] + ' ' + y;
    }
    const ba = ResultBaseline.aggregate({});
    const bh = ResultBaseline.header(ba, curLabel);
    return {
      live: true,
      latest: cutoff, currentMonth: mon, previousMonth: ba.baselinePeriod,
      currentDates: dates, previousDates: [],
      currentRange: dates.length ? { from: dates[0], to: dates[dates.length - 1] }
                                 : { from: cutoff, to: cutoff },
      previousRange: { from: null, to: null },
      currentLabel: curLabel, previousLabel: ba.available ? (ba.mixed ? 'Baseline Campuran' : ResultBaseline.labelMonth(ba.baselinePeriod)) : 'Baseline belum tersedia',
      hk: hk, previousHk: ba.baselineHk,
      baselineHeader: bh, baselineAvailable: ba.available,
      /* V1.7.4 — TAT PRODUCTION.
           TAT = HK BERJALAN RESULT (MAX result_hk pada Monitoring Scope)
                 ÷ TOTAL HK BULAN (input manual business, per bulan RESULT)
                 × 100
         TIDAK pernah dihitung dari kalender browser. Bila salah satu komponen
         belum valid, tat_mtd tetap null dan Ranking ditahan (tanpa TAT palsu).
         Nilai identik untuk seluruh level drilldown karena sumbernya ROOT
         Monitoring Scope, bukan AppState.scope. */
      tat_mtd: tatSnap.tat, tat_available: tatSnap.valid,
      tat_hk_running: tatSnap.hkRunning, tat_total_hk: tatSnap.totalHk,
      tat_reason_code: tatSnap.reasonCode, tat_reason: tatSnap.reason,
      tat_source: tatSourceText,
      /* Periode pembanding RESULT belum dimuat pada build ini -> TAT bulan lalu
         tidak dikarang. */
      previous_tat_mtd: null,
      /* V1.7.7 — availability harian mencerminkan result_daily_depot V2 bila ada,
         bukan lagi hanya legacy public.result_daily. */
      dailyAvailable: dates.length > 0,
      dailySource: dailySource,
      dailyDateBasis: dailySource === 'RESULT_DAILY_DEPOT_V2' ? 'ORDER_DATE' : null,
      previousAvailable: false
    };
  }
  function resultContext() {
    if (isLiveMode()) return liveResultContext();
    syncCal();
    const latest = DP.lastDate(), curMonth = latest.slice(0, 7);
    const curDates = ALL.filter(function (d) { return d.slice(0, 7) === curMonth && d <= latest; });
    const cp = U.dParts(latest), prevDate = new Date(cp.y, cp.m - 2, 1);
    const prevMonth = prevDate.getFullYear() + '-' + U.pad(prevDate.getMonth() + 1);
    const prevPool = ALL.filter(function (d) { return d.slice(0, 7) === prevMonth; });
    const prevDates = prevPool.slice(0, curDates.length);
    return {
      latest: latest, currentMonth: curMonth, previousMonth: prevMonth,
      currentDates: curDates, previousDates: prevDates,
      currentRange: rangeOf(curDates), previousRange: rangeOf(prevDates),
      currentLabel: U.MONTHS[cp.m - 1] + ' ' + cp.y,
      previousLabel: U.MONTHS[prevDate.getMonth()] + ' ' + prevDate.getFullYear(),
      hk: curDates.length, previousHk: prevDates.length,
      /* ===== DEMO ONLY — TAT MTD =====
         TAT = porsi hari kerja berjalan terhadap total hari kerja bulan tsb.
         Dihitung dari KALENDER DATA (bukan Date browser) agar deterministik.
         Saat backend produksi aktif, field ini diganti tat_mtd dari data pusat. */
      tat_mtd: (function () {
        const y = cp.y, mo = cp.m, dim = new Date(y, mo, 0).getDate();
        let work = 0;
        for (let d = 1; d <= dim; d++) if (new Date(y, mo - 1, d).getDay() !== 0) work++;
        return work ? curDates.length / work * 100 : null;
      })(),
      tat_available: true, dailyAvailable: true, previousAvailable: true, live: false,
      tat_source: 'DEMO — hari kerja berjalan ÷ hari kerja sebulan (kalender data)',
      previous_tat_mtd: (function () {
        const pd = prevDate, y = pd.getFullYear(), mo = pd.getMonth() + 1, dim = new Date(y, mo, 0).getDate();
        let work = 0;
        for (let d = 1; d <= dim; d++) if (new Date(y, mo - 1, d).getDay() !== 0) work++;
        return work ? prevDates.length / work * 100 : null;
      })()
    };
  }

  /* V1.7.0 — SATU pintu sumber data Hasil Kerja.
     MTD: public.result_mtd (AUTHORITATIVE, tidak direkonstruksi dari daily).
     Harian/trend: public.result_daily. */
  function mtdRecordsFor(scope, ctx, which) {

      /* V1.7.0 hanya memuat periode AKTIF. Periode pembanding RESULT belum
         dimuat, jadi dikembalikan kosong (bukan diisi angka periode berjalan). */
      return which === 'previous' ? [] : DP.getResultMtdRecords(scope || {});
    }

  function dailyResultRecords(range, scope) {
    if (isLiveMode() && typeof DP.getResultDailyRecords === 'function')
      return DP.getResultDailyRecords(range, scope || {});

  /* Agregasi MTD authoritative. Target 0 / tidak tersedia TIDAK dianggap
     target bisnis nol, dan coverage target dilacak agar achievement tidak
     menyesatkan ketika hanya sebagian salesman memiliki target. */
  function aggregateResultMtd(list) {
    let omset = 0, ec = 0, epb = 0, roa = 0, ro = 0, ret = 0, noo = 0, nooOmset = 0, focus = 0;
    let salesCall = 0, salesCallAvail = false, hkSum = 0;
    let avgEcSum = 0, avgEcCount = 0, roaEligible = 0;
    const salesmen = {}, seen = {};
    const cov = { omset: { have: 0, total: 0, sum: 0 }, ec: { have: 0, total: 0, sum: 0 },
                  roa: { have: 0, total: 0, sum: 0 }, epb_point: { have: 0, total: 0, sum: 0 } };
    const PAIR = [['omset', 'target_omset'], ['ec', 'target_ec'],
                  ['roa', 'target_roa'], ['epb_point', 'target_epb_point']];
    (list || []).forEach(function (r) {
      const key = r.salesman_code + '@' + r.depot_code + '@' + (r.period_month || '');
      if (seen[key]) return;                 /* hanya revisi aktif; tidak double count */
      seen[key] = 1;
      salesmen[r.salesman_code] = 1;
      omset += r.omset || 0; ec += r.ec || 0; epb += r.epb_point || 0;
      /* ROA LIVE hanya memakai pasangan numerator/denominator yang lengkap. */
      if (r.ro_count !== null && r.ro_count !== undefined && isFinite(Number(r.ro_count)) && Number(r.ro_count) > 0 &&
          r.roa_count !== null && r.roa_count !== undefined && isFinite(Number(r.roa_count)) && Number(r.roa_count) >= 0) {
        roa += Number(r.roa_count); ro += Number(r.ro_count); roaEligible++;
      }
      if (r.avg_ec_mtd !== null && r.avg_ec_mtd !== undefined && isFinite(Number(r.avg_ec_mtd))) {

      target_omset: tgt('omset'), target_ec: tgt('ec'),

  function aggregateResult(recs) {
    if (recs && recs.length && recs[0].__mtd) return aggregateResultMtd(recs);

    const productBag = {};
    DP.resultEceran().forEach(function (p) {

    let targetOmset = 0, targetEc = 0, targetRoa = 0, targetEpb = 0;

    (recs || []).forEach(function (r) {
      if (!r.salesman_active) return;
      omset += r.omset; ec += r.ec; salesCall += r.sales_call; epb += r.epb_point; salesmanDays++;
      salesmen[r.salesman_code] = 1;
      r.active_outlet_ids.forEach(function (id) { outlets[id] = 1; });
      const tk = r.report_date.slice(0, 7) + '|' + r.salesman_code;
      if (!targetSeen[tk]) {
        targetSeen[tk] = 1; targetOmset += r.target_omset || 0; targetEc += r.target_ec || 0;
        targetRoa += r.target_roa || 0; targetEpb += r.target_epb_point || 0;
      }

        const b = productBag[p.key]; if (!b) return;

        p.active_outlet_ids.forEach(function (id) { b.outlets[id] = 1; });

    const has = salesmanDays > 0, roa = has ? Object.keys(outlets).length : null;
    const products = Object.keys(productBag).map(function (k) {
      const p = productBag[k];
      return { key: p.key, label: p.label, omset: p.omset,
               epb_point: Math.round(p.epb_point * 10) / 10,
               roa: Object.keys(p.outlets).length };
    });
    function pct(real, target) { return target ? real / target * 100 : null; }
    return {
      n: (recs || []).length, hasData: has, omset: has ? omset : null, ec: has ? ec : null,
      sales_call: has ? salesCall : null, epb_point: has ? Math.round(epb * 10) / 10 : null,
      roa: roa, salesman_days: salesmanDays, salesmen: Object.keys(salesmen).length,
      avg_ec: has ? (function () {
        const vals = (recs || []).map(function (r) { return r.avg_ec_mtd; })
          .filter(function (v) { return v !== null && v !== undefined && isFinite(Number(v)); });
        return vals.length ? vals.reduce(function (a, b) { return a + Number(b); }, 0) / vals.length : ec / salesmanDays;
      })() : null,
      avg_sales_call: has ? salesCall / salesmanDays : null,

  function resultGrowth(cur, prev) {

      return { key: c.key, code: c.code, name: c.name, label: c.label,

  }
  const RESULT_METRICS = [
    { key: 'omset', label: 'Omset', target: 'target_omset' },
    { key: 'ec', label: 'EC', target: 'target_ec' },
    { key: 'roa', label: 'ROA', target: 'target_roa' },
    { key: 'epb_point', label: 'Point EPB', target: 'target_epb_point' },
    /* V1.7.6 — NOO Bulan Ini = SUM(noo_count) dari result_mtd (actual information,

  function achCell(real, target, coverage) {

    const usable = hasReal && hasTgt && !partial;

    /* V1.7.5.1 — ROA pada HASIL KERJA bukan Actual ÷ Target.

    const roaHave = Number(m.roa_eligible_salesmen || 0);

    const hasRo = m.ro !== null && m.ro !== undefined && isFinite(Number(m.ro)) && Number(m.ro) > 0;
    const hasRoa = m.roa !== null && m.roa !== undefined && isFinite(Number(m.roa)) && Number(m.roa) >= 0;
    cells.roa = {

    const nooCount = (m.noo === null || m.noo === undefined) ? (m.hasData ? 0 : null) : m.noo;
    const nooOmset = (m.noo_omset === null || m.noo_omset === undefined) ? (m.hasData ? 0 : null) : m.noo_omset;

  /* ==========================================================================

    },

        if (!MasterCabangAuthority.allowed(r.depot_code, 'monitoring')) continue;
