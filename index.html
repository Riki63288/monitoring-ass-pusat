/* ---------------------------------------------------------------------------
   NORMALISASI — mengubah baris database menjadi bentuk record yang dipahami
   DashboardService existing, TANPA menghitung ulang angka bisnis.
   --------------------------------------------------------------------------- */
const LiveNormalize = {
  n: function (v) { const x = Number(v); return isFinite(x) ? x : 0; },
  nOrNull: function (v) { if (v === null || v === undefined || v === '') return null; const x = Number(v); return isFinite(x) ? x : null; },
  s: function (v) { return v === null || v === undefined ? '' : String(v); },
  code: function (v) { return String(v === null || v === undefined ? '' : v).trim(); },

  /* severity production → kelas visual existing. Label asli TIDAK diturunkan. */
  SEVERITY_VISUAL: { CRITICAL: 'crit', HIGH: 'review', WARNING: 'warn', INFO: 'good' },
  severityOf: function (raw) {
    const up = String(raw || '').trim().toUpperCase();
    const visual = this.SEVERITY_VISUAL[up];
    if (visual) return { visual: visual, label: up };
    /* Nilai di luar kanon TIDAK ditebak menjadi salah satu level bisnis. */
    return { visual: 'warn', label: up || 'TIDAK DIKETAHUI' };
  },

  /* ==========================================================================
     V1.7.7 — SOURCE_META EXTENSION READER.
     upload_batches.source_meta sudah dikirim Read Gateway existing pada action
     process maupun result. Parsing dilakukan SEKALI di loader (bukan di
     Renderer) dan bersifat DEFENSIF: extension malformed tidak boleh
     mematikan domain PROCESS/RESULT apa pun.
     ========================================================================== */
  sourceMetaOf: function (batch) {
    const raw = batch ? batch.source_meta : null;
    if (!raw) return null;
    if (typeof raw === 'object') return raw;
    if (typeof raw === 'string') {
      const t = raw.trim();
      if (!t) return null;
      try { const o = JSON.parse(t); return (o && typeof o === 'object') ? o : null; }
      catch (e) { return null; }
    }
    return null;
  },
  /* 0 valid tetap 0. Missing tetap null — TIDAK pernah dikonversi menjadi 0. */
  numIn: function (v, lo, hi) {
    if (v === null || v === undefined || v === '') return null;
    const n = Number(v);
    if (!isFinite(n)) return null;
    if (lo !== null && lo !== undefined && n < lo) return null;
    if (hi !== null && hi !== undefined && n > hi) return null;
    return n;
  },

  /* ---- PROCESS: source_meta.process_depot_summary (grain DEPOT_MONTH) ---- */
  processDepotSummaryOf: function (batch, org) {
    const meta = this.sourceMetaOf(batch);
    if (!meta) return null;
    if (meta.process_depot_summary_available !== true) return null;
    if (Number(meta.process_depot_summary_version) !== 1) return null;
    const sum = meta.process_depot_summary;
    if (!sum || typeof sum !== 'object' || Array.isArray(sum)) return null;
    const depot = this.code(batch.depot_code);
    if (!depot) return null;
    const dp = (org && org.byCode && org.byCode.depot) ? (org.byCode.depot[depot] || null) : null;
    const pct = function (v) { return LiveNormalize.numIn(v, 0, 100); };
    const min = function (v) { return LiveNormalize.numIn(v, 0, 1440); };
    const nonNeg = function (v) { return LiveNormalize.numIn(v, 0, null); };
    const rec = {
      batch_id: this.s(batch.batch_id),
      depot_code: depot,
      depot_name: dp ? dp.name : depot,
      branch_code: dp ? dp.branch_code : '',
      branch_name: dp ? dp.branch_name : '',
      regional_code: dp ? dp.regional_code : '',
      regional_name: dp ? dp.regional_name : '',
      period_month: this.s(batch.period_month || '').slice(0, 10),
      hk: this.nOrNull(batch.hk),
      sc_jks_pct: pct(sum.sc_jks_pct),
      geo_on_route_pct: pct(sum.geo_on_route_pct),
      geo_off_route_pct: pct(sum.geo_off_route_pct),
      hit_rate_pct: pct(sum.hit_rate_pct),
      avg_visit: nonNeg(sum.avg_visit),
      avg_check_in_minutes: min(sum.avg_check_in_minutes),
      avg_check_out_minutes: min(sum.avg_check_out_minutes),
      avg_transport_minutes: nonNeg(sum.avg_transport_minutes),
      total_visit: nonNeg(sum.total_visit),
      ec_count: nonNeg(sum.ec_count),
      active_salesman_days: nonNeg(sum.active_salesman_days),
      salesman_count: nonNeg(sum.salesman_count),
      summary_scope: this.s(meta.process_depot_summary_scope || ''),
      summary_source: this.s(meta.process_depot_summary_source || ''),
      summary_version: Number(meta.process_depot_summary_version)
    };
    /* Summary tanpa satupun metrik terbaca tidak berguna dan tidak dipakai. */
    const anyMetric = ['sc_jks_pct', 'geo_on_route_pct', 'geo_off_route_pct', 'hit_rate_pct',
      'avg_visit', 'avg_check_in_minutes', 'avg_check_out_minutes', 'avg_transport_minutes',
      'total_visit', 'ec_count'].some(function (k) { return rec[k] !== null; });
    return anyMetric ? rec : null;
  },

  /* ---- PROCESS V1.7.7.4: source_meta.process_period_summary (DEPOT_PERIOD) ----
     Website ASS tetap calculation authority. Pusat hanya melakukan parsing
     defensif dan memetakan key kontrak ke key UI: today / w7 / mtd. */
  processPeriodSummaryOf: function (batch, org, diagnostics) {
    const meta = this.sourceMetaOf(batch);
    if (!meta) return null;
    if (meta.process_period_summary_available !== true) return null;
    if (Number(meta.process_period_summary_version) !== 1) return null;
    const bag = meta.process_period_summary;
    if (!bag || typeof bag !== 'object' || Array.isArray(bag)) return null;
    const depot = this.code(batch.depot_code);
    if (!depot) return null;
    const dp = (org && org.byCode && org.byCode.depot) ? (org.byCode.depot[depot] || null) : null;
    const pct = function (v) { return LiveNormalize.numIn(v, 0, 100); };
    const min = function (v) { return LiveNormalize.numIn(v, 0, 1440); };
    const nonNeg = function (v) { return LiveNormalize.numIn(v, 0, null); };
    const date = function (v) {
      const x = LiveNormalize.s(v || '').slice(0, 10);
      return /^\d{4}-\d{2}-\d{2}$/.test(x) ? x : null;
    };
    const note = function (m) { if (diagnostics && diagnostics.length < 40) diagnostics.push(m); };
    const defs = [
      { sourceKey: 'today', uiKey: 'today', expected: 'TODAY' },
      { sourceKey: 'last_7_workdays', uiKey: 'w7', expected: 'LAST_7_WORKDAYS' },
      { sourceKey: 'mtd', uiKey: 'mtd', expected: 'MTD' }
    ];
    const out = [];
    for (let i = 0; i < defs.length; i++) {
      const def = defs[i], sum = bag[def.sourceKey];
      if (!sum || typeof sum !== 'object' || Array.isArray(sum)) continue;
      const rawPeriodKey = this.s(sum.period_key || '').trim().toUpperCase();
      if (rawPeriodKey && rawPeriodKey !== def.expected) {
        note('Depo ' + depot + ': process_period_summary.' + def.sourceKey +
             ' period_key tidak sesuai (' + rawPeriodKey + ').');
        continue;
      }
      const rec = {
        batch_id: this.s(batch.batch_id),
        depot_code: depot,
        depot_name: dp ? dp.name : depot,
        branch_code: dp ? dp.branch_code : '',
        branch_name: dp ? dp.branch_name : '',
        regional_code: dp ? dp.regional_code : '',
        regional_name: dp ? dp.regional_name : '',
        period_month: this.s(batch.period_month || '').slice(0, 10),
        period_key: def.uiKey,
        source_period_key: def.expected,
        hk: nonNeg(sum.hk),
        date_from: date(sum.date_from),
        date_to: date(sum.date_to),
        sc_jks_pct: pct(sum.sc_jks_pct),
        geo_on_route_pct: pct(sum.geo_on_route_pct),
        geo_off_route_pct: pct(sum.geo_off_route_pct),
        hit_rate_pct: pct(sum.hit_rate_pct),
        avg_visit: nonNeg(sum.avg_visit),
        avg_check_in_minutes: min(sum.avg_check_in_minutes),
        avg_check_out_minutes: min(sum.avg_check_out_minutes),
        avg_transport_minutes: nonNeg(sum.avg_transport_minutes),
        total_visit: nonNeg(sum.total_visit),
        ec_count: nonNeg(sum.ec_count),
        active_salesman_days: nonNeg(sum.active_salesman_days),
        salesman_count: nonNeg(sum.salesman_count),
        summary_scope: this.s(meta.process_period_summary_scope || ''),
        summary_source: this.s(meta.process_period_summary_source || ''),
        summary_version: Number(meta.process_period_summary_version),
        date_basis: this.s(meta.process_period_summary_date_basis || ''),
        sc_jks_basis: this.s(meta.process_period_summary_sc_jks_basis || '')
      };
      const anyMetric = ['sc_jks_pct', 'geo_on_route_pct', 'geo_off_route_pct', 'hit_rate_pct',
        'avg_visit', 'avg_check_in_minutes', 'avg_check_out_minutes', 'avg_transport_minutes',
        'total_visit', 'ec_count'].some(function (k) { return rec[k] !== null; });
      if (anyMetric) out.push(rec);
    }
    return out.length ? out : null;
  },

  /* ---- RESULT V1.7.7.7: authoritative comparison pair dari Website ASS ---- */
  resultBaselineDepotOf: function (batch, org, diagnostics) {
    const meta = this.sourceMetaOf(batch);
    if (!meta || meta.result_baseline_depot_available !== true ||
        Number(meta.result_baseline_depot_version) !== 1) return null;
    const raw = meta.result_baseline_depot;
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    const depot = this.code(batch.depot_code); if (!depot) return null;
    const note = function (m) { if (diagnostics && diagnostics.length < 40) diagnostics.push(m); };
    const date = function (v, monthOnly) {
      const x = LiveNormalize.s(v || '').slice(0, 10);
      const ok = /^\d{4}-\d{2}-\d{2}$/.test(x);
      if (!ok) return null;
      return monthOnly && x.slice(8, 10) !== '01' ? null : x;
    };
    const nonNeg = function (v) { return LiveNormalize.numIn(v, 0, null); };
    const curMonth = date(raw.current_period_month, true);
    const baseMonth = date(raw.baseline_period_month, true);
    const current = raw.current, baseline = raw.baseline;
    if (!curMonth || !baseMonth || !current || !baseline ||
        typeof current !== 'object' || typeof baseline !== 'object') {
      note('Depo ' + depot + ': result_baseline_depot tidak lengkap.'); return null;
    }
    const rec = {
      batch_id: this.s(batch.batch_id), depot_code: depot,
      authority: this.s(raw.authority), scope: this.s(raw.scope), slot: this.s(raw.slot),
      comparison_basis: this.s(raw.comparison_basis),
      current_period_month: curMonth, current_hk: nonNeg(raw.current_hk),
      current_cutoff_date: date(raw.current_cutoff_date, false),
      baseline_period_month: baseMonth, baseline_hk: nonNeg(raw.baseline_hk),
      baseline_cutoff_date: date(raw.baseline_cutoff_date, false),
      current: { omset: nonNeg(current.omset), roa: nonNeg(current.roa_count), ec: nonNeg(current.ec_count) },
      baseline: { omset: nonNeg(baseline.omset), roa: nonNeg(baseline.roa_count), ec: nonNeg(baseline.ec_count) }
    };
    if (rec.current_hk === null || rec.baseline_hk === null ||
        ['omset','roa','ec'].some(function (k) { return rec.current[k] === null || rec.baseline[k] === null; })) {
      note('Depo ' + depot + ': result_baseline_depot memiliki metric/HK invalid.'); return null;
    }
    return rec;
  },

  /* ---- RESULT: source_meta.result_daily_depot (V2, ORDER_DATE, Depo x Tanggal) ---- */
  resultDailyDepotOf: function (batch, org, diagnostics) {
    const meta = this.sourceMetaOf(batch);
    if (!meta) return null;
    if (meta.result_daily_depot_available !== true) return null;
    if (Number(meta.result_daily_depot_version) !== 2) return null;
    if (String(meta.result_daily_date_basis || '').toUpperCase() !== 'ORDER_DATE') return null;
    const arr = meta.result_daily_depot;
    if (!Array.isArray(arr) || !arr.length) return null;
    const depot = this.code(batch.depot_code);
    if (!depot) return null;
    const dp = (org && org.byCode && org.byCode.depot) ? (org.byCode.depot[depot] || null) : null;
    const period = this.s(batch.period_month || '').slice(0, 7);
    const seen = {}, out = [];
    const note = function (m) { if (diagnostics && diagnostics.length < 40) diagnostics.push(m); };
    for (let i = 0; i < arr.length; i++) {
      const row = arr[i];
      if (!row || typeof row !== 'object') { note('Depo ' + depot + ': baris daily V2 bukan object.'); continue; }
      const date = this.s(row.report_date || '').slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { note('Depo ' + depot + ': report_date daily V2 tidak valid.'); continue; }
      /* report_date adalah DATE bisnis (Tanggal Order) — tidak pernah digeser timezone. */
      if (period && date.slice(0, 7) !== period) {
        note('Depo ' + depot + ': ' + date + ' di luar period_month ' + period + '.'); continue;
      }
      const omset = this.numIn(row.omset, null, null);
      const avgEc = this.numIn(row.avg_ec, 0, null);
      if (omset === null && avgEc === null) { note('Depo ' + depot + ' ' + date + ': omset & avg_ec tidak valid.'); continue; }
      if (seen[date]) {
        /* Depo x Date wajib unik — duplicate TIDAK di-SUM diam-diam. */
        note('Depo ' + depot + ': tanggal duplicate ' + date + ' diabaikan (Depo x Date harus unik).');
        continue;
      }
      seen[date] = 1;
      out.push({
        batch_id: this.s(batch.batch_id),
        depot_code: depot,
        depot_name: dp ? dp.name : depot,
        branch_code: dp ? dp.branch_code : '',
        branch_name: dp ? dp.branch_name : '',
        regional_code: dp ? dp.regional_code : '',
        regional_name: dp ? dp.regional_name : '',
        period_month: this.s(batch.period_month || '').slice(0, 10),
        hk: this.nOrNull(batch.hk),
        report_date: date,
        omset: omset,
        avg_ec: avgEc,
        source_version: 2,
        date_basis: 'ORDER_DATE'
      });
    }
    return out.length ? out : null;
  },

  /* ==========================================================================
     V1.7.9 — FUTURE CONTRACT: RESULT DAILY SALESMAN V1.
     source_meta.result_daily_salesman (grain SALESMAN x TANGGAL ORDER).

     Contract:
       result_daily_salesman_available : true
       result_daily_salesman_version   : 1
       result_daily_salesman_date_basis: "ORDER_DATE"
       result_daily_salesman_scope     : "FULL_SOURCE" (informational)
       result_daily_salesman_rows_basis: "ACTIVE_SALESMAN_DAYS" (opsional,
           EKSPLISIT — hanya dengan ini row tanpa field salesman_active boleh
           dianggap active. Tanpa metadata eksplisit, row tanpa salesman_active
           TIDAK diklaim active dan dikeluarkan dari denominator Avg EC.)
       result_daily_salesman           : [ { report_date, salesman_code,
                                             omset, ec_count, salesman_active } ]

     ADDITIVE & BACKWARD COMPATIBLE: bila node tidak ada / malformed, fungsi
     mengembalikan null dan seluruh jalur Total Depo existing tidak terganggu.
     depot_code utama = batch.depot_code canonical. Bila row juga membawa
     depot_code, WAJIB cocok — mismatch dicatat dan barisnya dibuang, tidak
     dipakai diam-diam.
     ========================================================================== */
  resultDailySalesmanOf: function (batch, org, diagnostics) {
    const meta = this.sourceMetaOf(batch);
    if (!meta) return null;
    if (meta.result_daily_salesman_available !== true) return null;
    const depot = this.code(batch.depot_code);
    if (!depot) return null;
    const note = function (m) { if (diagnostics && diagnostics.length < 40) diagnostics.push(m); };
    /* V1.7.9.1 — FAIL-CLOSED. Contract yang menyatakan dirinya available bersifat
       ATOMIC per batch/Depo: satu pelanggaran mandatory => SELURUH contract Depo
       tersebut ditolak. Subset TIDAK PERNAH dipakai, karena subset dapat tampil
       seolah-olah lengkap. */
    const reject = function (m) {
      note(m + ' \u2014 SELURUH contract Daily Salesman Depo ini ditolak.');
      return null;
    };
    if (Number(meta.result_daily_salesman_version) !== 1)
      return reject('Depo ' + depot + ': version bukan 1');
    if (String(meta.result_daily_salesman_date_basis || '').toUpperCase() !== 'ORDER_DATE')
      return reject('Depo ' + depot + ': date_basis bukan ORDER_DATE');
    /* scope WAJIB FULL_SOURCE: hanya dengan ini Pusat boleh menganggap rows
       merepresentasikan SELURUH salesman Depo tersebut. */
    if (String(meta.result_daily_salesman_scope || '').toUpperCase() !== 'FULL_SOURCE')
      return reject('Depo ' + depot + ': scope bukan FULL_SOURCE');
    const arr = meta.result_daily_salesman;
    if (!Array.isArray(arr) || !arr.length)
      return reject('Depo ' + depot + ': result_daily_salesman bukan array valid / kosong');
    const dp = (org && org.byCode && org.byCode.depot) ? (org.byCode.depot[depot] || null) : null;
    const period = this.s(batch.period_month || '').slice(0, 7);
    const rowsBasis = String(meta.result_daily_salesman_rows_basis || '').toUpperCase();
    const seen = {}, out = [];
    for (let i = 0; i < arr.length; i++) {
      const row = arr[i];
      if (!row || typeof row !== 'object')
        return reject('Depo ' + depot + ': baris ke-' + (i + 1) + ' bukan object');
      /* salesman_code adalah STRING identity — leading zero WAJIB aman. */
      const code = this.code(row.salesman_code);
      if (!code) return reject('Depo ' + depot + ': baris ke-' + (i + 1) + ' tanpa salesman_code');
      const date = this.s(row.report_date || '').slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date))
        return reject('Depo ' + depot + ': report_date tidak valid pada salesman ' + code);
      /* report_date = DATE bisnis (Tanggal Order); TIDAK pernah digeser timezone. */
      if (period && date.slice(0, 7) !== period)
        return reject('Depo ' + depot + ': ' + date + ' di luar period_month ' + period);
      if (row.depot_code !== undefined && row.depot_code !== null && row.depot_code !== '') {
        const rowDepot = this.code(row.depot_code);
        if (rowDepot !== depot)
          return reject('Depo ' + depot + ': salesman ' + code + ' membawa depot_code ' + rowDepot + ' (mismatch canonical batch)');
      }
      const omset = this.numIn(row.omset, null, null);        /* 0 valid; malformed -> null */
      const ec = this.numIn(row.ec_count, 0, null);           /* 0 valid; negatif -> null */
      /* 0 valid; null/malformed BUKAN 0 dan bersifat mandatory. */
      if (omset === null) return reject('Depo ' + depot + ': omset tidak numeric pada salesman ' + code + ' ' + date);
      if (ec === null) return reject('Depo ' + depot + ': ec_count tidak numeric non-negative pada salesman ' + code + ' ' + date);
      if (row.salesman_active !== true && row.salesman_active !== false)
        return reject('Depo ' + depot + ': salesman_active bukan boolean pada salesman ' + code + ' ' + date);
      const k = date + '' + code;
      /* Grain authority = Depo x Salesman x Report Date. Duplicate TIDAK di-SUM,
         TIDAK dipilih latest, TIDAK di-dedupe diam-diam: contract ditolak. */
      if (seen[k]) return reject('Depo ' + depot + ': duplicate grain salesman ' + code + ' pada ' + date);
      seen[k] = 1;
      out.push({
        batch_id: this.s(batch.batch_id),
        depot_code: depot,
        depot_name: dp ? dp.name : depot,
        branch_code: dp ? dp.branch_code : '',
        branch_name: dp ? dp.branch_name : '',
        regional_code: dp ? dp.regional_code : '',
        regional_name: dp ? dp.regional_name : '',
        period_month: this.s(batch.period_month || '').slice(0, 10),
        report_date: date,
        salesman_code: code,
        omset: omset,
        ec: ec,
        salesman_active: row.salesman_active === true,
        source_version: 1,
        date_basis: 'ORDER_DATE',
        scope: 'FULL_SOURCE',
        rows_basis: rowsBasis || null
      });
    }
    return out.length ? out : null;
  },

  /* ==========================================================================
     V1.7.9 — FUTURE CONTRACT: RESULT BASELINE SALESMAN V1.
     source_meta.result_baseline_salesman (grain SALESMAN, pasangan
     Current/Baseline authoritative dari Website ASS).

     Website ASS adalah authority comparison basis. Pusat HANYA memfilter
     salesman sesuai Coverage Project lalu menjumlahkan, dan memakai formula
     Growth existing. Pusat TIDAK PERNAH menyusun baseline sendiri.
     Payload yang tidak lengkap / tidak comparable ditolak seluruhnya
     (bukan dipakai sebagian diam-diam).
     ========================================================================== */
  resultBaselineSalesmanOf: function (batch, org, diagnostics) {
    const meta = this.sourceMetaOf(batch);
    if (!meta || meta.result_baseline_salesman_available !== true) return null;
    const depot = this.code(batch.depot_code); if (!depot) return null;
    const note = function (m) { if (diagnostics && diagnostics.length < 40) diagnostics.push(m); };
    /* V1.7.9.1 — FAIL-CLOSED, ATOMIC per batch/Depo (lihat Daily Salesman).
       Growth Project yang dihitung dari subset baseline akan terlihat
       authoritative padahal salah, jadi subset dilarang total. */
    const reject = function (m) {
      note(m + ' \u2014 SELURUH contract Baseline Salesman Depo ini ditolak.');
      return null;
    };
    if (Number(meta.result_baseline_salesman_version) !== 1)
      return reject('Depo ' + depot + ': result_baseline_salesman version bukan 1');
    const raw = meta.result_baseline_salesman;
    if (!raw || typeof raw !== 'object' || Array.isArray(raw))
      return reject('Depo ' + depot + ': result_baseline_salesman bukan object');
    const date = function (v, monthOnly) {
      const x = LiveNormalize.s(v || '').slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(x)) return null;
      return monthOnly && x.slice(8, 10) !== '01' ? null : x;
    };
    const nonNeg = function (v) { return LiveNormalize.numIn(v, 0, null); };
    if (String(raw.scope || '').toUpperCase() !== 'SALESMAN')
      return reject('Depo ' + depot + ': result_baseline_salesman scope bukan SALESMAN');
    if (!this.s(raw.authority || '').trim())
      return reject('Depo ' + depot + ': result_baseline_salesman tanpa authority');
    const basis = this.s(raw.comparison_basis || '').trim();
    if (!basis) return reject('Depo ' + depot + ': result_baseline_salesman tanpa comparison_basis');
    const head = {
      batch_id: this.s(batch.batch_id), depot_code: depot,
      authority: this.s(raw.authority), scope: 'SALESMAN', comparison_basis: basis,
      current_period_month: date(raw.current_period_month, true),
      current_hk: nonNeg(raw.current_hk),
      current_cutoff_date: date(raw.current_cutoff_date, false),
      baseline_period_month: date(raw.baseline_period_month, true),
      baseline_hk: nonNeg(raw.baseline_hk),
      baseline_cutoff_date: date(raw.baseline_cutoff_date, false)
    };
    if (!head.current_period_month || !head.baseline_period_month ||
        head.current_hk === null || head.baseline_hk === null ||
        !head.current_cutoff_date || !head.baseline_cutoff_date)
      return reject('Depo ' + depot + ': header periode/HK/cutoff baseline salesman tidak lengkap');
    const arr = raw.rows;
    if (!Array.isArray(arr) || !arr.length)
      return reject('Depo ' + depot + ': result_baseline_salesman rows bukan array valid / kosong');
    const seen = {}, rows = [];
    for (let i = 0; i < arr.length; i++) {
      const r = arr[i];
      if (!r || typeof r !== 'object')
        return reject('Depo ' + depot + ': baris baseline ke-' + (i + 1) + ' bukan object');
      const code = this.code(r.salesman_code);
      if (!code) return reject('Depo ' + depot + ': baris baseline ke-' + (i + 1) + ' tanpa salesman_code');
      const cur = r.current, base = r.baseline;
      if (!cur || !base || typeof cur !== 'object' || typeof base !== 'object' ||
          Array.isArray(cur) || Array.isArray(base))
        return reject('Depo ' + depot + ' ' + code + ': pasangan current/baseline tidak lengkap');
      const c = { omset: nonNeg(cur.omset), roa: nonNeg(cur.roa_count), ec: nonNeg(cur.ec_count) };
      const b = { omset: nonNeg(base.omset), roa: nonNeg(base.roa_count), ec: nonNeg(base.ec_count) };
      /* 0 valid; null/missing/malformed TIDAK PERNAH dijadikan 0 -> contract ditolak. */
      if (['omset','roa','ec'].some(function (k) { return c[k] === null || b[k] === null; }))
        return reject('Depo ' + depot + ' ' + code + ': metric baseline salesman invalid (0 valid, null tidak)');
      /* Duplicate salesman dalam satu contract TIDAK di-SUM: contract ditolak. */
      if (seen[code]) return reject('Depo ' + depot + ': duplicate baseline salesman ' + code);
      seen[code] = 1;
      rows.push({ batch_id: head.batch_id, depot_code: depot, salesman_code: code,
                  current: c, baseline: b });
    }
    if (!rows.length) return null;
    return { head: head, rows: rows };
  },

  /* ==========================================================================
     V1.7.9 — FUTURE CONTRACT: PUBLISH HISTORY V1 (top-level node, BUKAN
     source_meta). Read Gateway kelak boleh mengirim node `publish_history`
     pada action bootstrap / process / result:

       { version: 1, complete: true, timezone: "Asia/Jakarta",
         period_month: "YYYY-MM-01",
         rows: [ { batch_id, publish_event_id, domain, depot_code,
                   period_month, hk, revision_number, created_at } ] }

     complete === true adalah SATU-SATUNYA cara mendapatkan capability
     COMPLETE. Tidak pernah ditebak dari jumlah batch / revision_number /
     banyaknya tanggal. Node malformed => null + diagnostic, TIDAK PERNAH
     dianggap complete.

     V1.7.9.1:
       - rows: [] dengan complete === true adalah CONTRACT VALID dan bermakna
         "authority menyatakan seluruh history periode ini tersedia, dan memang
         TIDAK ADA publish event". Bukan NONE, bukan PARTIAL.
       - complete === true DAN timezone WAJIB Asia/Jakarta; timezone lain tidak
         boleh diklaim complete karena grouping tanggal publish memakai WIB.
       - Satu baris malformah / batch_id duplicate dengan isi berbeda merusak
         klaim complete: capability diturunkan (PARTIAL/NONE), TIDAK PERNAH
         tetap COMPLETE dengan subset baris.
     ========================================================================== */
  publishHistoryOf: function (payload, diagnostics) {
    const node = payload ? payload.publish_history : null;
    if (!node || typeof node !== 'object' || Array.isArray(node)) return null;
    const note = function (m) { if (diagnostics && diagnostics.length < 40) diagnostics.push(m); };
    const declared = node.complete === true;
    /* V1.7.9.2 — contract yang MENGKLAIM complete bersifat all-or-nothing.
       Satu pelanggaran apa pun membatalkan seluruh contract (return null), lalu
       PublishHistoryService jatuh ke observable batches (PARTIAL) atau NONE.
       Subset historical row TIDAK PERNAH dipakai sebagai authoritative, karena
       tanggal yang barisnya terbuang akan tampil MERAH "Tidak Publish" padahal
       penyebabnya contract malformed. */
    const fail = function (m) {
      note('publish_history: ' + m + (declared
        ? ' \u2014 klaim complete DIBATALKAN dan contract tidak dipakai.'
        : ' \u2014 contract tidak dipakai.'));
      return null;
    };
    if (Number(node.version) !== 1)
      return fail('version tidak didukung (' + this.s(node.version) + ')');
    const arr = node.rows;
    if (!Array.isArray(arr)) return fail('rows bukan array');
    const periodRaw = this.s(node.period_month || '').slice(0, 10);
    const periodMonth = /^\d{4}-\d{2}-01$/.test(periodRaw) ? periodRaw : null;
    if (!periodMonth) return fail('period_month tidak valid');
    /* TIMEZONE STRICT: klaim complete hanya sah bila timezone dinyatakan
       EKSPLISIT sebagai Asia/Jakarta. Kosong / null / hilang / UTC / zona lain
       TIDAK PERNAH complete, karena grouping tanggal publish memakai WIB. */
    const tz = this.s(node.timezone || '').trim();
    if (declared && tz !== 'Asia/Jakarta')
      return fail('complete=true tetapi timezone "' + (tz || '(kosong)') + '" bukan Asia/Jakarta');

    const nonNeg = function (v) { return LiveNormalize.numIn(v, 0, null); };
    const rows = [], byBatch = {};
    let bad = 0;
    const badRow = function (i, why) {
      bad++;
      note('publish_history: baris ke-' + (i + 1) + ' tidak valid (' + why + ').');
    };
    for (let i = 0; i < arr.length; i++) {
      const r = arr[i];
      if (!r || typeof r !== 'object' || Array.isArray(r)) { badRow(i, 'bukan object'); continue; }
      const batchId = this.s(r.batch_id).trim();
      if (!batchId) { badRow(i, 'batch_id kosong'); continue; }
      const eventId = this.s(r.publish_event_id).trim();
      if (!eventId) { badRow(i, 'publish_event_id kosong'); continue; }
      const domain = String(r.domain || '').toUpperCase();
      if (domain !== 'PROCESS' && domain !== 'RESULT') { badRow(i, 'domain bukan PROCESS/RESULT'); continue; }
      const depot = this.code(r.depot_code);
      if (!depot) { badRow(i, 'depot_code kosong'); continue; }
      const rowPeriodRaw = this.s(r.period_month || '').slice(0, 10);
      if (!/^\d{4}-\d{2}-01$/.test(rowPeriodRaw)) { badRow(i, 'period_month baris tidak valid'); continue; }
      if (rowPeriodRaw !== periodMonth) { badRow(i, 'period_month baris tidak sama dengan node'); continue; }
      const hk = nonNeg(r.hk);
      if (hk === null) { badRow(i, 'hk bukan numeric non-negative'); continue; }
      /* created_at WAJIB benar-benar dapat diubah menjadi instant valid.
         "ABC" / "2026-99-99" / object / NaN-like DITOLAK, bukan sekadar
         dicek non-empty. Raw timestamptz TIDAK diubah — hanya dinormalisasi
         sekali di sini untuk ordering dan grouping WIB. */
      const rawTs = r.created_at;
      if (rawTs === null || rawTs === undefined || rawTs === '' ||
          (typeof rawTs !== 'string' && typeof rawTs !== 'number' && !(rawTs instanceof Date))) {
        badRow(i, 'created_at bukan timestamp'); continue;
      }
      const dt = U.toDate(rawTs);
      if (!dt || !isFinite(dt.getTime())) { badRow(i, 'created_at tidak dapat diparse'); continue; }
      const wib = U.wibParts(dt);
      if (!wib) { badRow(i, 'created_at tidak dapat dikonversi ke WIB'); continue; }
      /* revision_number OPSIONAL: absen bukan alasan reject. Bila ada tetapi
         malformed, baris dianggap tidak valid. TIDAK PERNAH dipakai sebagai
         jumlah publish pada hari yang sama. */
      let rev = null;
      if (r.revision_number !== undefined && r.revision_number !== null && r.revision_number !== '') {
        rev = nonNeg(r.revision_number);
        if (rev === null) { badRow(i, 'revision_number malformed'); continue; }
      }
      /* BATCH IDENTITY = batch_id. Duplicate dengan payload authority IDENTIK
         boleh di-dedupe defensif; duplicate dengan isi BERBEDA adalah konflik
         integrity dan membatalkan klaim complete. */
      const sig = [eventId, domain, depot, rowPeriodRaw, String(hk),
                   String(rev === null ? '' : rev), String(dt.getTime())].join('|');
      if (byBatch[batchId] !== undefined) {
        if (byBatch[batchId] === sig) continue;                 /* duplicate identik */
        badRow(i, 'batch_id ' + batchId + ' duplicate dengan isi berbeda (konflik integrity)');
        continue;
      }
      byBatch[batchId] = sig;
      rows.push({
        batch_id: batchId, publish_event_id: eventId,
        domain: domain, depot_code: depot, period_month: rowPeriodRaw,
        hk: hk, revision_number: rev,
        created_at: rawTs instanceof Date ? rawTs.toISOString() : rawTs,   /* raw dipertahankan */
        /* normalisasi SEKALI: renderer tidak pernah mem-parse ulang per cell */
        ts_ms: dt.getTime(),
        publish_date_wib: String(wib.y) + '-' + U.pad(wib.m) + '-' + U.pad(wib.d),
        publish_time_wib: wib.hh + ':' + wib.mm + ' WIB',
        /* optional audit — renderer TIDAK boleh bergantung pada field ini */
        uploaded_by_name: r.uploaded_by_name || null,
        source_app: r.source_app || null,
        source_app_version: r.source_app_version || null,
        is_active: r.is_active === undefined ? null : !!r.is_active,
        superseded_at: r.superseded_at || null
      });
    }
    /* FAIL-CLOSED: klaim complete gugur total bila ada satu baris tidak valid. */
    if (declared && bad > 0)
      return fail(bad + ' baris historical tidak valid');
    if (!declared && bad)
      note('publish_history: ' + bad + ' baris dibuang (contract tidak mengklaim complete).');
    /* rows: [] dengan complete === true adalah CONTRACT VALID: authority
       menyatakan seluruh history periode ini tersedia dan memang nihil. */
    if (!rows.length && !declared) return fail('tidak ada baris valid dan bukan complete authoritative');
    return { version: 1, complete: declared, declaredComplete: declared,
             timezone: tz || null,
             periodMonth: periodMonth, rows: rows, rejected: bad,
             authoritativeEmpty: declared && rows.length === 0 };
  },

  /* ---- MASTER DEPOT → organisasi ---- */
  buildOrg: function (masterRows, processDaily, resultMtd, batchById) {
    const regionals = [], branches = [], depots = [], salesmen = [], assList = [];
    const byCode = { regional: {}, branch: {}, depot: {}, ass: {}, salesman: {} };
    const regByCode = {}, brByCode = {};

    (masterRows || []).forEach(function (m) {
      const dcode = LiveNormalize.code(m.depot_code);
      if (!dcode) return;
      const rc = LiveNormalize.code(m.regional_code) || '(TANPA REGIONAL)';
      const rname = LiveNormalize.s(m.regional_name || '').trim();
      const rlabel = LiveNormalize.s(m.regional_label || '').trim();
      const bc = LiveNormalize.code(m.branch_code) || ('BR:' + rc);
      const bname = LiveNormalize.s(m.branch_name || m.branch_label || '').trim() || bc;
      const dname = LiveNormalize.s(m.area_name || m.depot_name || '').trim() || dcode;

      if (!regByCode[rc]) {
        const r = { code: rc, name: rname && rname !== rc ? rname : '', label_raw: rlabel, branches: [] };
        regByCode[rc] = r; regionals.push(r); byCode.regional[rc] = r;
      } else if (!regByCode[rc].name && rname && rname !== rc) regByCode[rc].name = rname;

      if (!brByCode[bc]) {
        const b = { code: bc, name: bname, regional_code: rc, label_raw: LiveNormalize.s(m.branch_label || ''), depots: [] };
        brByCode[bc] = b; branches.push(b); byCode.branch[bc] = b;
        regByCode[rc].branches.push(b);
      }

      const dp = { code: dcode, name: dname, branch_code: bc, regional_code: rc,
                   branch_name: bname, regional_name: regByCode[rc].name,
                   plant: LiveNormalize.code(m.plant_code), area: LiveNormalize.s(m.area_name || ''),
                   active: m.active === undefined ? true : !!m.active };
      depots.push(dp); byCode.depot[dcode] = dp; brByCode[bc].depots.push(dp);
    });

    /* ---- SALESMAN & ASS: diturunkan dari data operasional (PROCESS + RESULT).
       Publish Engine production menyimpan ass_name dengan fallback uploaded_by_name.
       Gateway V1.7.1 juga meng-enrich batch dari publish_events sebagai fallback audit.
       Urutan otoritas: ass_code+ass_name → ass_name → publish_events.uploaded_by_name
       → tidak tersedia. TIDAK ada nama salesman/ASS yang dibuat-buat. ---- */
    const assMap = {};
    /* V1.7.6 — MASTER SALESMAN ASS adalah OWNER authoritative.
       Lookup O(1) melalui Map SalesmanProjectScope (join: SALESMAN CODE).
       V1.7.6.1 — lookup menjadi PROJECT AWARE: ASS mengikuti Project aktif.
       Bila Master menyediakan ASS, uploaded_by_name TIDAK BOLEH override. */
    function masterAssOf(row) {
      try {
        if (typeof SalesmanProjectScope === 'undefined' || !SalesmanProjectScope.assOf) return null;
        const m = SalesmanProjectScope.assOf(LiveNormalize.code(row.salesman_code));
        if (m && m.key) return { code: m.key, name: m.name || m.key, source: 'master_salesman' };
      } catch (e) {}
      return null;
    }
    function assIdentityOf(row) {
      const master = masterAssOf(row);
      if (master) return master;
      const code = LiveNormalize.code(row.ass_code);
      const name = LiveNormalize.s(row.ass_name || '').trim();
      if (code) return { code: code, name: name || code, source: 'column' };
      if (name) return { code: 'ASSNAME:' + name.toUpperCase(), name: name, source: 'ass_name' };
      const b = batchById[String(row.batch_id)];
      const uploader = b ? LiveNormalize.s(b.uploaded_by_name || '').trim() : '';
      if (uploader) return { code: 'ASSNAME:' + uploader.toUpperCase(), name: uploader, source: 'publish_event' };
      return { code: '', name: '', source: 'none' };
    }

    /* ========================================================================
       V1.7.6.1 — SALESMAN CODE GLOBAL IDENTITY.

       Sebelumnya identity entity adalah salesmanCode + '@' + depot sehingga satu
       Salesman Code yang terbaca pada Depo/source berbeda (PROSES di depo A,
       RESULT di depo B) memecah diri menjadi DUA entity Ranking: satu membawa
       SC/JKS-Geo-HitRate, satu lagi membawa ROA-Omset-EPB-Golden EC.

       Sekarang: SALESMAN CODE adalah primary identity (STRING, leading zero
       aman, TIDAK pernah Number()/parseInt()). Nama salesman hanya display /
       audit dan TIDAK pernah menjadi join key, sehingga "DANI", "TX2DA DANI",
       dan "TX2DA-DANI" pada code yang sama tetap SATU salesman.

       Depo canonical dipilih deterministik (bukan urutan row kebetulan):
         1. seluruh source resolve ke satu depot canonical  -> depot tersebut;
         2. RESULT MTD hanya menunjuk satu depot            -> depot RESULT;
         3. PROCESS hanya menunjuk satu depot               -> depot PROCESS;
         4. masih ambigu -> batch aktif terbaru secara deterministik.
       Alias raw depot yang resolve ke depot canonical yang sama BUKAN conflict.
       Bila canonical depot benar-benar berbeda, salesman TETAP SATU entity dan
       ditandai organization_conflict beserta bukti source/resolved depot.
       ======================================================================== */
    const depotByPlant = {};
    depots.forEach(function (d) { if (d.plant && !depotByPlant[d.plant]) depotByPlant[d.plant] = d.code; });
    function canonDepot(raw) {
      const c = LiveNormalize.code(raw);
      if (!c) return '';
      if (byCode.depot[c]) return c;                 /* sudah canonical (master_depot) */
      if (depotByPlant[c]) return depotByPlant[c];   /* alias plant -> depot canonical */
      try {
        if (typeof OrgResolver !== 'undefined' && OrgResolver.resolveDepot) {
          const rd = OrgResolver.resolveDepot(c);
          const rc = rd ? LiveNormalize.code(rd.depot_code || rd.code) : '';
          if (rc && byCode.depot[rc]) return rc;
        }
      } catch (e) {}
      return c;
    }
    function uniqList(arr) {
      const out = [];
      for (let i = 0; i < arr.length; i++) if (arr[i] && out.indexOf(arr[i]) < 0) out.push(arr[i]);
      return out;
    }
    /* kunci deterministik "batch aktif terbaru" — tanpa Date.now / tanpa random */
    function batchRank(b) {
      if (!b) return '';
      const hk = (b.hk === null || b.hk === undefined) ? 0 : Number(b.hk) || 0;
      return String(b.created_at || '') + '|' + String(b.period_month || '') + '|' +
             ('0000' + hk).slice(-4) + '|' + String(b.batch_id || '');
    }

    /* ---- PASS 1: kumpulkan seluruh source organization per SALESMAN CODE ---- */
    const srcMap = {}, srcOrder = [];
    function collector(domain) {
      return function (row) {
        const b = batchById[String(row.batch_id)];
        if (!b) return;
        const scode = LiveNormalize.code(row.salesman_code);
        const sname = LiveNormalize.s(row.salesman_name || '').trim();
        /* Salesman Code adalah identity. Nama HANYA dipakai bila code benar-benar
           tidak tersedia, dan itupun bukan sebagai join lintas source. */
        const key = scode || (sname ? 'NAME:' + sname.toUpperCase() : '');
        if (!key) return;
        let e = srcMap[key];
        if (!e) { e = srcMap[key] = { key: key, name: '', sources: [] }; srcOrder.push(key); }
        if (!e.name && sname) e.name = sname;
        const raw = LiveNormalize.code(b.depot_code);
        e.sources.push({ domain: domain, raw: raw, canon: canonDepot(raw),
                         ass: assIdentityOf(row), batch: b });
      };
    }
    (processDaily || []).forEach(collector('process'));
    (resultMtd || []).forEach(collector('result'));

    /* ---- PASS 2: resolusi canonical + satu entity per Salesman Code ---- */
    const ASS_RANK = { master_salesman: 4, column: 3, ass_name: 2, publish_event: 1, none: 0 };
    srcOrder.forEach(function (key) {
      const e = srcMap[key];
      const canonAll = uniqList(e.sources.map(function (x) { return x.canon; }));
      const canonRes = uniqList(e.sources.filter(function (x) { return x.domain === 'result'; })
                                         .map(function (x) { return x.canon; }));
      const canonProc = uniqList(e.sources.filter(function (x) { return x.domain === 'process'; })
                                          .map(function (x) { return x.canon; }));
      let depot = '', conflict = false;
      if (canonAll.length <= 1) { depot = canonAll[0] || ''; conflict = false; }
      else {
        conflict = true;
        if (canonRes.length === 1) depot = canonRes[0];
        else if (canonProc.length === 1) depot = canonProc[0];
        else {
          const ranked = e.sources.filter(function (x) { return x.canon; }).slice().sort(function (a, b) {
            const ka = batchRank(a.batch), kb = batchRank(b.batch);
            if (ka !== kb) return ka < kb ? 1 : -1;        /* batch terbaru dahulu */
            return a.canon < b.canon ? -1 : (a.canon > b.canon ? 1 : 0);
          });
          depot = ranked.length ? ranked[0].canon : canonAll[0];
        }
      }
      const dp = byCode.depot[depot] || null;

      /* Identitas ASS: prioritas source tertinggi; seri -> source pertama (PROSES
         sebelum RESULT) sehingga hasilnya deterministik. */
      let bestAss = null, bestRank = -1;
      e.sources.forEach(function (x) {
        if (!x.ass || !x.ass.code) return;
        const r = ASS_RANK[x.ass.source] || 0;
        if (r > bestRank) { bestRank = r; bestAss = x.ass; }
      });
      const ass = bestAss || { code: '', name: '', source: 'none' };
      const assCode = ass.code || ('DEPOT:' + depot);
      const assName = ass.name || '(ASS belum teridentifikasi)';

      const sm = {
        salesman_code: e.key, salesman_name: e.name || e.key,
        depot_code: depot, depot_name: dp ? dp.name : depot,
        branch_code: dp ? dp.branch_code : '', branch_name: dp ? dp.branch_name : '',
        regional_code: dp ? dp.regional_code : '', regional_name: dp ? dp.regional_name : '',
        ass_code: assCode, ass_name: assName, ass_source: ass.source,
        in_master: !!dp,
        /* ---- metadata audit identity (tidak mengubah satupun nilai KPI) ---- */
        source_depot_codes: uniqList(e.sources.map(function (x) { return x.raw; })),
        resolved_depot_codes: canonAll,
        organization_conflict: conflict,
        conflict_sources: conflict ? e.sources.map(function (x) {
          return { domain: x.domain, raw_depot_code: x.raw, resolved_depot_code: x.canon };
        }) : []
      };
      salesmen.push(sm); byCode.salesman[e.key] = sm;

      let a = assMap[assCode];
      if (!a) {
        a = assMap[assCode] = { ass_code: assCode, ass_name: assName, code: assCode, name: assName,
                                depot_code: depot, depot_codes: [depot] };
        assList.push(a); byCode.ass[assCode] = a;
      } else if (a.depot_codes.indexOf(depot) < 0) a.depot_codes.push(depot);
    });

    regionals.sort(function (a, b) { return a.code < b.code ? -1 : a.code > b.code ? 1 : 0; });
    branches.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
    depots.sort(function (a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
    salesmen.sort(function (a, b) { return a.salesman_name < b.salesman_name ? -1 : 1; });

    return { regionals: regionals, branches: branches, depots: depots, ass: assList,
             salesmen: salesmen, byCode: byCode };
  },

  /* ==========================================================================
     V1.7.6.1 — RESOLVED IDENTITY UNTUK NORMALIZED RECORD.
     Raw response Supabase TIDAK pernah dimutasi. Yang dipakai presentation /
     hierarchy adalah organisasi CANONICAL milik Salesman Code, sehingga PROSES
     (batch depo A) dan RESULT (batch depo B) untuk Salesman Code yang sama
     bertemu pada satu entity Ranking, bukan terpecah dua row.
     Depo asal batch tetap disimpan sebagai source_depot_code untuk audit.
     ========================================================================== */
  resolveIdentity: function (row, batch, org) {
    const rawDepot = this.code(batch.depot_code);
    const scode = this.code(row.salesman_code);
    const sname = this.s(row.salesman_name || '').trim();
    const key = scode || (sname ? 'NAME:' + sname.toUpperCase() : '');
    const sm = (org && org.byCode && org.byCode.salesman) ? (org.byCode.salesman[key] || null) : null;
    const depot = (sm && sm.depot_code) ? sm.depot_code : rawDepot;
    const dp = (org && org.byCode && org.byCode.depot) ? (org.byCode.depot[depot] || null) : null;
    return {
      key: key, sm: sm, name: sname, rawDepot: rawDepot, depot: depot, dp: dp,
      ass_code: sm ? sm.ass_code : '',
      ass_name: sm ? sm.ass_name : '',
      conflict: !!(sm && sm.organization_conflict)
    };
  },

  /* ---- PROCESS DAILY → record harian per salesman ----
     Record membawa DUA hal sekaligus:
       (a) nama field legacy agar Renderer/aggregate existing tetap jalan;
       (b) counter mentah (sum & count) agar agregasi memakai
           SUM numerator / SUM denominator, bukan average-of-average. */
  processRecord: function (row, batch, org) {
    const N = this.n;
    const id = this.resolveIdentity(row, batch, org);
    const depot = id.depot, dp = id.dp, key = id.key, sm = id.sm, sname = id.name;

    const jksV = N(row.jks_visited), jksN = N(row.jks_not_visited);
    const onV = N(row.on_route_visits), offV = N(row.off_route_visits);
    const salesCall = N(row.sales_call);
    const ciSum = N(row.check_in_seconds_sum), ciCnt = N(row.check_in_count);
    const coSum = N(row.check_out_seconds_sum), coCnt = N(row.check_out_count);
    const tdSum = N(row.transport_duration_seconds_sum), tdCnt = N(row.transport_duration_count);
    const vdSum = N(row.visit_duration_seconds_sum), vdCnt = N(row.visit_duration_count);

    return {
      __live: true,
      report_date: this.s(row.report_date).slice(0, 10),
      batch_id: this.s(row.batch_id),
      salesman_code: key,
      salesman_name: sm ? sm.salesman_name : (sname || key),
      ass_code: sm ? sm.ass_code : (this.code(row.ass_code) || ('DEPOT:' + depot)),
      ass_name: sm ? sm.ass_name : (this.s(row.ass_name || '').trim() || '(ASS belum teridentifikasi)'),
      depot_code: depot,
      source_depot_code: id.rawDepot,
      organization_conflict: id.conflict,
      depot_name: dp ? dp.name : depot,
      branch_code: dp ? dp.branch_code : '',
      branch_name: dp ? dp.branch_name : '',
      regional_code: dp ? dp.regional_code : '',
      regional_name: dp ? dp.regional_name : '',

      /* --- legacy compatible --- */
      jks_count: jksV + jksN,
      sc_count: jksV,                       /* SC vs JKS numerator = JKS Visited (kontrak Website ASS) */
      on_route_visits: onV,
      off_route_visits: offV,
      on_route_geo_ok: N(row.geo_on_route_match),
      off_route_geo_ok: N(row.geo_off_route_match),
      on_route_ec: null,                    /* EC tidak dipecah per route pada kontrak production */
      off_route_ec: null,
      omset: N(row.omset),
      anomaly_total: N(row.anomaly_total),
      anomaly_critical: N(row.anomaly_critical),
      avg_check_in: ciCnt ? ciSum / ciCnt / 60 : null,
      avg_check_out: coCnt ? coSum / coCnt / 60 : null,
      avg_transport_minutes: tdCnt ? tdSum / tdCnt / 60 : null,

      /* --- counter mentah production --- */
      sales_call: salesCall,
      jks_visited: jksV,
      jks_not_visited: jksN,
      ec_count: N(row.ec_count),
      geo_on_route_match: N(row.geo_on_route_match),
      geo_on_route_eligible: N(row.geo_on_route_eligible),
      geo_off_route_match: N(row.geo_off_route_match),
      geo_off_route_eligible: N(row.geo_off_route_eligible),
      check_in_seconds_sum: ciSum, check_in_count: ciCnt,
      check_out_seconds_sum: coSum, check_out_count: coCnt,
      visit_duration_seconds_sum: vdSum, visit_duration_count: vdCnt,
      transport_duration_seconds_sum: tdSum, transport_duration_count: tdCnt
    };
  },

  /* ---- PROCESS ANOMALY → event ---- */
  processEvent: function (row, batch, org) {
    const id = this.resolveIdentity(row, batch, org);
    const depot = id.depot, dp = id.dp, key = id.key, sm = id.sm, sname = id.name;
    const sev = this.severityOf(row.severity);
    let payload = row.anomaly_payload;
    if (typeof payload === 'string') { try { payload = JSON.parse(payload); } catch (e) { payload = null; } }
    const routeStatus = payload && payload.route_status ? String(payload.route_status).toUpperCase() : null;
    const type = this.s(row.anomaly_type || '').trim() || 'LAINNYA';

    return {
      __live: true,
      report_date: this.s(row.report_date).slice(0, 10),
      batch_id: this.s(row.batch_id),
      salesman_code: key,
      salesman_name: sm ? sm.salesman_name : (sname || key),
      ass_code: sm ? sm.ass_code : ('DEPOT:' + depot),
      ass_name: sm ? sm.ass_name : '(ASS belum teridentifikasi)',
      depot_code: depot,
      source_depot_code: id.rawDepot,
      organization_conflict: id.conflict,
      depot_name: dp ? dp.name : depot,
      branch_code: dp ? dp.branch_code : '',
      branch_name: dp ? dp.branch_name : '',
      regional_code: dp ? dp.regional_code : '',
      regional_name: dp ? dp.regional_name : '',
      type: type,
      type_label: type,
      cases: 1,
      severity: sev.visual,             /* kelas visual saja */
      severity_label: sev.label,        /* label bisnis ASLI — tidak diturunkan */
      route_status: routeStatus,
      outlet: this.s(row.customer_name || row.customer_code || ''),
      customer_code: this.s(row.customer_code || ''),
      window: this.s(row.note || ''),
      note: this.s(row.note || ''),
      payload: payload || null
    };
  },

  /* ---- RESULT MTD → record MTD authoritative (satu baris per salesman) ---- */
  resultMtdRecord: function (row, batch, org, targetRow) {
    const N = this.nOrNull;
    const id = this.resolveIdentity(row, batch, org);
    const depot = id.depot, dp = id.dp, key = id.key, sm = id.sm;
    const hk = this.n(batch.hk);

    /* Target: result_targets adalah sumber utama; result_mtd.target_* dipakai
       bila targets tidak tersedia. Nilai 0 / null = TARGET TIDAK TERSEDIA
       (bukan target nol) sesuai aturan bisnis. */
    function pickTarget(a, b) {
      const va = N(a), vb = N(b);
      if (va !== null && va > 0) return va;
      if (vb !== null && vb > 0) return vb;
      return null;
    }
    const t = targetRow || {};

    return {
      __mtd: true, __live: true,
      report_date: this.s(row.cutoff_date || batch.data_date_to || '').slice(0, 10),
      cutoff_date: this.s(row.cutoff_date || batch.data_date_to || '').slice(0, 10),
      batch_id: this.s(row.batch_id),
      period_month: this.s(batch.period_month || '').slice(0, 10),
      hk: hk,
      salesman_code: key,
      salesman_name: sm ? sm.salesman_name : (this.s(row.salesman_name || '').trim() || key),
      salesman_group: this.s(row.salesman_group || ''),
      salesman_active: true,
      ass_code: sm ? sm.ass_code : ('DEPOT:' + depot),
      ass_name: sm ? sm.ass_name : '(ASS belum teridentifikasi)',
      depot_code: depot,
      source_depot_code: id.rawDepot,
      organization_conflict: id.conflict,
      depot_name: dp ? dp.name : depot,
      branch_code: dp ? dp.branch_code : '',
      branch_name: dp ? dp.branch_name : '',
      regional_code: dp ? dp.regional_code : '',
      regional_name: dp ? dp.regional_name : '',

      /* nilai MTD authoritative — TIDAK direkonstruksi dari daily */
      omset: this.n(row.actual_omset),
      return_omset: this.n(row.return_omset),
      ec: this.n(row.ec_actual_count),
      /* V1.7.5 — null tetap null agar completeness ROA dapat dibedakan dari nol valid. */
      roa_count: N(row.roa_actual_count),
      ro_count: N(row.ro_count),
      epb_point: this.n(row.actual_epb_point),
      focus_point: N(row.focus_point),
      noo_count: this.n(row.noo_count),
      noo_omset: this.n(row.noo_omset),
      avg_ec_mtd: N(row.avg_ec_mtd),
      sales_call: N(row.sales_call_mtd),          /* boleh null: kontrak existing belum menyediakan */

      target_omset: pickTarget(t.target_omset, row.target_omset),
      target_ec: pickTarget(t.target_ec, row.ec_target_count),
      target_roa: pickTarget(t.target_roa_count, null),
      target_epb_point: pickTarget(t.target_epb_point, row.target_epb_point),

      active_outlet_ids: [],
      products: []
    };
  },

  /* ---- RESULT DAILY → record harian (kosong pada kontrak publish saat ini) ---- */
  resultDailyRecord: function (row, batch, org) {
    const id = this.resolveIdentity(row, batch, org);
    const depot = id.depot, dp = id.dp, key = id.key, sm = id.sm;
    return {
      __live: true,
      report_date: this.s(row.report_date).slice(0, 10),
      batch_id: this.s(row.batch_id),
      salesman_code: key,
      salesman_name: sm ? sm.salesman_name : (this.s(row.salesman_name || '').trim() || key),
      salesman_group: this.s(row.salesman_group || ''),
      salesman_active: true,
      ass_code: sm ? sm.ass_code : ('DEPOT:' + depot),
      ass_name: sm ? sm.ass_name : '(ASS belum teridentifikasi)',
      depot_code: depot,
      source_depot_code: id.rawDepot,
      organization_conflict: id.conflict,
      depot_name: dp ? dp.name : depot,
      branch_code: dp ? dp.branch_code : '',
      branch_name: dp ? dp.branch_name : '',
      regional_code: dp ? dp.regional_code : '',
      regional_name: dp ? dp.regional_name : '',
      omset: this.n(row.omset),
      ec: this.n(row.ec_count),
      sales_call: this.n(row.sales_call),
      epb_point: this.n(row.epb_point),
      roa_count: this.n(row.roa_actual_count),
      active_outlet_count: this.n(row.active_outlet_count),
      active_outlet_ids: [],
      target_omset: null, target_ec: null, target_roa: null, target_epb_point: null,
      products: []
    };
  }
};

/* ---------------------------------------------------------------------------
   LIVE LOADER — mengisi LiveDataStore dari Read Gateway.
   --------------------------------------------------------------------------- */
const LiveLoader = {
  bootstrap: function () {
    const S = LiveDataStore;
    S.status.bootstrap = 'loading'; S.errors.bootstrap = null; S.bump();
    const gen = LiveGateway.nextGeneration();
    return LiveGateway.call('bootstrap', {}, { generation: gen }).then(function (resp) {
      const d = resp.data || {};
      const errs = LiveValidate.bootstrap(d);
      if (errs.length) throw LiveGateway._err('INVALID_BOOTSTRAP', 'Response bootstrap tidak valid: ' + errs.join('; ') + '.');
      if (!d.master_depots.length)
        throw LiveGateway._err('MASTER_EMPTY', 'Master organisasi pusat gagal dimuat: public.master_depot tidak mengembalikan depo aktif.');

      S.masterDepots = d.master_depots;
      MasterCabangAuthority.hydrate(S.masterDepots);
      S.allActiveBatches = d.batches || [];
      S.availablePeriods = { process: (d.available_periods || {}).process || [],
                             result: (d.available_periods || {}).result || [] };
      S.latestPeriod = { process: (d.latest_period || {}).process || null,
                         result: (d.latest_period || {}).result || null };
      S.notes = (d.schema_notes || []).slice();

      /* organisasi awal dari master saja (salesman menyusul saat domain dimuat) */
      S.org = LiveNormalize.buildOrg(S.masterDepots, [], [], {});

      /* Informasi: depot_update_latest + identitas master (join by depot_code) */
      const byDepot = {};
      S.org.depots.forEach(function (d2) { byDepot[d2.code] = d2; });
      S.latestByDepot = S.org.depots.map(function (dp) {
        const row = (d.latest_by_depot || []).filter(function (r) {
          return LiveNormalize.code(r.depot_code) === dp.code; })[0] || null;
        return {
          depot_code: dp.code, depot_name: dp.name,
          branch_code: dp.branch_code, branch_name: dp.branch_name,
          regional_code: dp.regional_code, regional_name: dp.regional_name,
          process_batch_id: row ? (row.process_batch_id || null) : null,
          process_period_month: row && row.process_period_month ? String(row.process_period_month).slice(0, 10) : null,
          process_hk: row && row.process_hk !== null && row.process_hk !== undefined && row.process_hk !== ''
                      ? Number(row.process_hk) : null,
          process_uploaded_at: row ? (row.process_uploaded_at || null) : null,
          result_batch_id: row ? (row.result_batch_id || null) : null,
          result_period_month: row && row.result_period_month ? String(row.result_period_month).slice(0, 10) : null,
          result_hk: row && row.result_hk !== null && row.result_hk !== undefined && row.result_hk !== ''
                     ? Number(row.result_hk) : null,
          result_uploaded_at: row ? (row.result_uploaded_at || null) : null
        };
      });

      /* V1.7.9 — future contract publish_history boleh datang di bootstrap. */
      LiveLoader.absorbPublishHistory(d, 'BOOTSTRAP');
      S.loadedAt = new Date().toISOString();
      S.status.bootstrap = 'ready';
      S.bump();
      return S;
    }).catch(function (e) {
      if (e && e.code === 'STALE_RESPONSE') throw e;
      S.status.bootstrap = 'error';
      S.errors.bootstrap = { code: (e && e.code) || 'ERROR', message: (e && e.message) || String(e) };
      S.bump();
      throw e;
    });
  },

  loadProcess: function (periodMonth) {
    const S = LiveDataStore;
    if (S.status.process === 'ready' && S.process.periodMonth &&
        (!periodMonth || periodMonth === S.process.periodMonth)) return Promise.resolve(S);
    S.status.process = 'loading'; S.errors.process = null; S.bump();
    const gen = LiveGateway.currentGeneration();
    const body = periodMonth ? { period_month: periodMonth } : {};
    return LiveGateway.call('process', body, { generation: gen }).then(function (resp) {
      const d = resp.data || {};
      const errs = LiveValidate.process(d);
      if (errs.length) throw LiveGateway._err('INVALID_PROCESS', 'Response PROSES tidak valid: ' + errs.join('; ') + '.');

      const batchById = {};
      (d.batches || []).forEach(function (b) { batchById[String(b.batch_id)] = b; });
      LiveLoader._mergeBatchIndex(batchById);

      /* organisasi diperbarui: salesman & ASS dari PROCESS + RESULT yang sudah ada */
      S.org = LiveNormalize.buildOrg(S.masterDepots, d.daily || [],
                                     S.result.mtd || [], LiveLoader._batchIndex);

      const records = [], recIndex = {}, dateSet = {};
      (d.daily || []).forEach(function (row) {
        const b = batchById[String(row.batch_id)];
        if (!b) return;                      /* baris tanpa batch aktif tidak dipakai */
        const rec = LiveNormalize.processRecord(row, b, S.org);
        if (!rec.report_date) return;
        records.push(rec);
        (recIndex[rec.report_date] || (recIndex[rec.report_date] = [])).push(rec);
        dateSet[rec.report_date] = 1;
      });
      const events = [], evIndex = {};
      (d.anomalies || []).forEach(function (row) {
        const b = batchById[String(row.batch_id)];
        if (!b) return;
        const ev = LiveNormalize.processEvent(row, b, S.org);
        if (!ev.report_date) return;
        events.push(ev);
        (evIndex[ev.report_date] || (evIndex[ev.report_date] = [])).push(ev);
      });

      const dates = Object.keys(dateSet).sort();
      let hkMax = null;
      (d.batches || []).forEach(function (b) {
        const h = Number(b.hk);
        if (isFinite(h) && (hkMax === null || h > hkMax)) hkMax = h;
      });

      /* ====================================================================
         V1.7.7 — PROCESS DEPOT SUMMARY (FINAL KPI Website ASS).
         Parse source_meta SEKALI di loader. Index by depot_code (object map,
         lookup O(1)). Extension malformed hanya dicatat sebagai diagnostic;
         process_daily existing TIDAK terpengaruh sama sekali.
         ==================================================================== */
      const psRows = [], psByDepot = {}, psNotes = [];
      (d.batches || []).forEach(function (b) {
        let rec = null;
        try { rec = LiveNormalize.processDepotSummaryOf(b, S.org); }
        catch (err) {
          rec = null;
          if (psNotes.length < 40) psNotes.push('Depo ' + LiveNormalize.code(b && b.depot_code) +
            ': process_depot_summary gagal dibaca (' + ((err && err.message) || 'tidak diketahui') + ').');
        }
        if (!rec) return;
        /* Satu batch aktif per Depo pada periode aktif; revisi terakhir menang. */
        const at = psByDepot[rec.depot_code];
        if (at === undefined) { psByDepot[rec.depot_code] = psRows.length; psRows.push(rec); }
        else psRows[at] = rec;
      });
      const psIndex = psByDepot;

      /* ====================================================================
         V1.7.7.4 — PROCESS PERIOD SUMMARY (FINAL KPI Website ASS).
         Satu batch dapat membawa tiga snapshot final: today / w7 / mtd.
         Index O(1) per period + depot. process_depot_summary lama tetap disimpan
         sebagai fallback MTD untuk batch legacy.
         ==================================================================== */
      const ppsRows = [], ppsNotes = [];
      const ppsByPeriod = {
        today: { rows: [], byDepot: {}, available: false },
        w7:    { rows: [], byDepot: {}, available: false },
        mtd:   { rows: [], byDepot: {}, available: false }
      };
      (d.batches || []).forEach(function (b) {
        let rows = null;
        try { rows = LiveNormalize.processPeriodSummaryOf(b, S.org, ppsNotes); }
        catch (err) {
          rows = null;
          if (ppsNotes.length < 40) ppsNotes.push('Depo ' + LiveNormalize.code(b && b.depot_code) +
            ': process_period_summary gagal dibaca (' + ((err && err.message) || 'tidak diketahui') + ').');
        }
        if (!rows) return;
        rows.forEach(function (rec) {

          if (at === undefined) {

      });

      S.process = {
        periodMonth: d.period_month || null,

        dates: dates, records: records, events: events,

        periodSummary: { rows: ppsRows, byPeriod: ppsByPeriod, available: ppsRows.length > 0, notes: ppsNotes }
      };
      if (psNotes.length) psNotes.forEach(function (n) {
        const t = 'PROSES · ' + n; if (S.notes.indexOf(t) < 0) S.notes.push(t); });
      if (ppsNotes.length) ppsNotes.forEach(function (n) {
        const t = 'PROSES PERIOD · ' + n; if (S.notes.indexOf(t) < 0) S.notes.push(t); });
      (d.schema_notes || []).forEach(function (n) { if (S.notes.indexOf(n) < 0) S.notes.push(n); });

  loadResult: function (periodMonth) {
    const S = LiveDataStore;
    if (S.status.result === 'ready' && S.result.periodMonth &&

        const key = LiveNormalize.code(r.segment_code) || LiveNormalize.s(r.segment_name || '').trim();

      const dsNotes = [], dsRows = [], dsByDepotDate = {}, dsByDate = {},

        }

        rows.forEach(function (r) {
          dsVersion = r.source_version; dsBasis = r.date_basis; dsRowsBasis = r.rows_basis;
          const k = r.depot_code + '|' + r.report_date;
          (dsByDepotDate[k] || (dsByDepotDate[k] = [])).push(r);
          (dsByDate[r.report_date] || (dsByDate[r.report_date] = [])).push(r);
          dsRows.push(r);
          dsDepotSeen[r.depot_code] = 1; dsDateSeen[r.report_date] = 1;

      });

      /* ====================================================================
         V1.7.9 — FUTURE CONTRACT: RESULT BASELINE SALESMAN V1.
         Index salesman_code -> pasangan current/baseline. Header comparison
         (period, HK, cutoff, basis) diambil apa adanya dari Website ASS.
         ==================================================================== */
      const bsNotes = [], bsRows = [], bsBySalesman = {}, bsHeads = [];
      (d.batches || []).forEach(function (b) {
        let pack = null;
        try { pack = LiveNormalize.resultBaselineSalesmanOf(b, S.org, bsNotes); }
        catch (err) {
          if (bsNotes.length < 40) bsNotes.push('Depo ' + LiveNormalize.code(b && b.depot_code) +
            ': result_baseline_salesman gagal dibaca (' + ((err && err.message) || 'tidak diketahui') + ').');
        }
        if (!pack) return;
        bsHeads.push(pack.head);
        pack.rows.forEach(function (r) {
          const at = bsBySalesman[r.salesman_code];
          /* revisi aktif terakhir per salesman menang (batch terakhir diproses) */
          if (at === undefined) { bsBySalesman[r.salesman_code] = bsRows.length; bsRows.push(r); }
          else bsRows[at] = r;
        });
      });
      /* Header comparison harus konsisten antar Depo; bila campur, tandai mixed. */
      let bsHeader = null;
      if (bsHeads.length) {
        const h0 = bsHeads[0];
        const same = function (k) { return bsHeads.every(function (h) { return String(h[k]) === String(h0[k]); }); };
        bsHeader = {
          authority: h0.authority, scope: 'SALESMAN',
          comparison_basis: same('comparison_basis') ? h0.comparison_basis : null,
          current_period_month: same('current_period_month') ? h0.current_period_month : null,
          current_hk: same('current_hk') ? h0.current_hk : null,
          current_cutoff_date: same('current_cutoff_date') ? h0.current_cutoff_date : null,
          baseline_period_month: same('baseline_period_month') ? h0.baseline_period_month : null,
          baseline_hk: same('baseline_hk') ? h0.baseline_hk : null,
          baseline_cutoff_date: same('baseline_cutoff_date') ? h0.baseline_cutoff_date : null,
          depots: bsHeads.length,
          mixed: !(same('comparison_basis') && same('current_period_month') && same('current_hk') &&
                   same('baseline_period_month') && same('baseline_hk'))
        };
        if (bsHeader.mixed && bsNotes.length < 40)
          bsNotes.push('result_baseline_salesman: basis comparison berbeda antar Depo — pasangan dianggap tidak comparable.');
      }

      S.result = {
        periodMonth: d.period_month || null,
        hkMax: hkMax,
        cutoffDate: cutoff,
        batches: d.batches || [], mtd: d.mtd || [], targets: d.targets || [],
        daily: d.daily || [], dailyEceran: d.daily_eceran || [], mtdEceran: d.mtd_eceran || [],
        mtdRecords: mtdRecords, dailyRecords: dailyRecords, dailyIndex: dailyIndex,
        eceranSegments: segments,
        dailyDepot: { rows: ddRows, byDepotDate: ddByDepotDate, byDate: ddByDate,
                      depots: Object.keys(ddDepotSeen), dates: ddDates,
                      available: ddRows.length > 0, notes: ddNotes },
        baselineDepot: { rows: bdRows, byDepot: bdByDepot,
                         available: bdRows.length > 0, notes: bdNotes },
        dailySalesman: { rows: dsRows, byDepotDate: dsByDepotDate, byDate: dsByDate,
                         depots: Object.keys(dsDepotSeen), dates: Object.keys(dsDateSeen).sort(),
                         available: dsRows.length > 0, version: dsVersion,
                         dateBasis: dsBasis, rowsBasis: dsRowsBasis, notes: dsNotes },
        baselineSalesman: { rows: bsRows, bySalesman: bsBySalesman, heads: bsHeads,
                            /* Depo yang contract baselinenya DITERIMA utuh (fail-closed). */
                            depots: bsHeads.map(function (h) { return h.depot_code; }),
                            header: bsHeader,
                            /* tidak comparable => TIDAK dipakai, bukan dipakai sebagian */
                            available: bsRows.length > 0 && !!bsHeader && !bsHeader.mixed,
                            version: bsRows.length ? 1 : null, notes: bsNotes }
      };
      LiveLoader.absorbPublishHistory(d, 'RESULT');
      if (dsNotes.length) dsNotes.forEach(function (n) {
        const t = 'HASIL DAILY SALESMAN · ' + n; if (S.notes.indexOf(t) < 0) S.notes.push(t); });
      if (bsNotes.length) bsNotes.forEach(function (n) {
        const t = 'HASIL BASELINE SALESMAN · ' + n; if (S.notes.indexOf(t) < 0) S.notes.push(t); });
      if (ddNotes.length) ddNotes.forEach(function (n) {
        const t = 'HASIL · ' + n; if (S.notes.indexOf(t) < 0) S.notes.push(t); });
      if (bdNotes.length) bdNotes.forEach(function (n) {
        const t = 'HASIL BASELINE · ' + n; if (S.notes.indexOf(t) < 0) S.notes.push(t); });
      (d.schema_notes || []).forEach(function (n) { if (S.notes.indexOf(n) < 0) S.notes.push(n); });
      S.status.result = 'ready';

    }).catch(function (e) {

      S.bump();
      throw e;
    });
  },

  /* ==========================================================================
     V1.7.9.4 — FUTURE CONTRACT: node top-level `publish_history` dari action
     mana pun (bootstrap / process / result).

     Setiap payload yang membawa node publish_history adalah SNAPSHOT/statement
     authoritative TERBARU dan MENGGANTIKAN state sebelumnya secara atomic.
     Payload tanpa node TIDAK mengubah state (backward compatible untuk action
     yang response contract-nya belum membawa extension ini).
     Tidak ada union/merge rows antar response — lihat detail di dalam fungsi.
     ========================================================================== */
  absorbPublishHistory: function (payload, sourceLabel) {
    const S = LiveDataStore;
    /* ======================================================================
       V1.7.9.4 — ATOMIC REPLACEMENT.

       Setiap payload yang MEMBAWA node publish_history adalah SNAPSHOT /
       statement authoritative TERBARU dari Read Gateway dan MENGGANTIKAN state
       sebelumnya secara atomic. Payload TANPA node tidak mengubah state.

       TIDAK ADA union/merge rows antar response, termasuk ketika period_month
       kebetulan sama: snapshot terbaru yang menyatakan rows: [] berarti
       "periode ini lengkap dan memang tidak ada publish", bukan "pertahankan
       rows lama". Producer wajib mengirim node ini sebagai snapshot penuh,
       bukan incremental delta.

       Semantik property:
         ABSENT  (tidak ada property)  -> tidak ada statement, state dibiarkan.
         PRESENT (termasuk null)       -> statement baru; bila tidak sah, state
                                          authoritative DIRESET ke default.
       Action asal (bootstrap/process/result) tidak mengubah semantik ini.
       Proteksi stale/generation LiveGateway existing tidak disentuh: response
       usang sudah dibuang sebelum loader memanggil fungsi ini.
       ====================================================================== */
    if (!payload || !Object.prototype.hasOwnProperty.call(payload, 'publish_history'))
      return S.publishHistory;

    const notes = [];
    let pack = null;
    if (payload.publish_history === null) {
      notes.push('publish_history dikirim null \u2014 authoritative state direset.');
    } else {
      try { pack = LiveNormalize.publishHistoryOf(payload, notes); }
      catch (err) {
        notes.push('publish_history gagal dibaca (' + ((err && err.message) || 'tidak diketahui') + ').');
        pack = null;
      }
    }
    if (notes.length) notes.forEach(function (n) {
      const t = 'PUBLISH HISTORY \u00b7 ' + String(sourceLabel || '') + ' \u00b7 ' + n;
      if (S.notes.indexOf(t) < 0) S.notes.push(t);
    });

    /* Kandidat SELALU dimulai dari default: tidak ada satu pun field state lama
       (complete / declaredComplete / timezone / periodMonth / rows / rejected /
       authoritativeEmpty) yang diwariskan ke statement baru. */
    const next = LiveDataStore.defaultPublishHistory();
    next.notes = notes;

    if (!pack) {                       /* node hadir tetapi tidak sah -> reset penuh */
      S.publishHistory = next;         /* SATU COMMIT */
      return S.publishHistory;
    }

    next.available = true;
    next.version = pack.version;
    next.complete = pack.complete;
    next.declaredComplete = pack.declaredComplete;
    next.timezone = pack.timezone;
    next.periodMonth = pack.periodMonth;
    next.rows = pack.rows.slice();     /* HANYA rows snapshot terbaru */
    next.rejected = pack.rejected;
    next.authoritativeEmpty = pack.complete === true && pack.rows.length === 0;
    S.publishHistory = next;           /* SATU COMMIT */
    return S.publishHistory;
  },
  _batchIndex: {},
  _mergeBatchIndex: function (idx) {
    for (const k in idx) if (Object.prototype.hasOwnProperty.call(idx, k)) this._batchIndex[k] = idx[k];
  }
};

/* ---------------------------------------------------------------------------
   API DATA PROVIDER — interface SYNCHRONOUS yang dibaca DashboardService.
   Bentuk API sengaja dibuat semirip mungkin dengan DemoDataProvider.
   --------------------------------------------------------------------------- */
const ApiDataProvider = (function () {
  const S = LiveDataStore;

  /* V1.7.2 — sebuah baris harus memenuhi DUA syarat sekaligus:
       (1) berada di dalam Monitoring Scope (outer allowlist Regional trial), DAN
       (2) berada di dalam AppState.scope existing (inner drilldown).
     OrgResolver.depotCodesOf() sudah menerapkan keduanya, sehingga cukup
     memastikan allowSet TIDAK di-bypass ketika drilldown masih di root. */
  function allowSetFor(scope) {
    const sc = scope || {};
    const restricted = typeof MonitoringScope !== 'undefined' && !MonitoringScope.isAll();
    if (!restricted && !sc.regional && !sc.branch && !sc.depot) return null;
    if (typeof OrgResolver !== 'undefined' && OrgResolver.depotSetOf) return OrgResolver.depotSetOf(sc);
    return null;
  }
  function inScope(row, scope, allow, domain) {
    const sc = scope || {};
    const set = allow === undefined ? allowSetFor(sc) : allow;
    if (set && !set[row.depot_code]) return false;
    if (sc.depot && row.depot_code !== sc.depot) return false;
    if (sc.ass && row.ass_code !== sc.ass) return false;
    if (sc.salesman && row.salesman_code !== sc.salesman) return false;
    if (domain !== 'none' && !MasterCabangAuthority.allowed(row.depot_code, domain || 'monitoring')) return false;
    return true;
  }
  function pick(index, from, to, scope, domain) {
    const out = [], allow = allowSetFor(scope || {});
    const keys = Object.keys(index);
    for (let i = 0; i < keys.length; i++) {
      const d = keys[i];
      if (from && d < from) continue;
      if (to && d > to) continue;
      const bucket = index[d];
      for (let j = 0; j < bucket.length; j++) {
        if (inScope(bucket[j], scope || {}, allow, domain)) out.push(bucket[j]);
      }
    }
    return out;
  }

  return {
    mode: 'live',
    label: 'Monitoring Pusat Read Gateway (Supabase)',
    rev: function () { return S.rev; },
    isLive: true,
    ready: function () { return S.ready(); },
    store: function () { return S; },

    /* ---- kalender PROSES (independen dari HASIL) ---- */
    dates: function () { return S.process.dates.slice(); },
    firstDate: function () { return S.process.dates[0] || null; },
    lastDate: function () { return S.process.dates[S.process.dates.length - 1] || null; },
    processDates: function () { return S.process.dates.slice(); },
    processLastDate: function () { return S.process.dates[S.process.dates.length - 1] || null; },
    processPeriodMonth: function () { return S.process.periodMonth; },
    processHk: function () { return S.process.hkMax; },

    /* ---- kalender HASIL (independen dari PROSES) ---- */
    resultDates: function () { return Object.keys(S.result.dailyIndex).sort(); },
    resultLastDate: function () { return S.result.cutoffDate; },
    resultPeriodMonth: function () { return S.result.periodMonth; },
    resultHk: function () { return S.result.hkMax; },

    /* ---- organisasi ---- */
    org: function () { return S.org; },
    lookup: function (kind, code) { return S.org.byCode[kind] ? (S.org.byCode[kind][code] || null) : null; },

    /* ---- PROSES ---- */
    getRecords: function (range, scope) { return pick(S.process.recIndex, range && range.from, range && range.to, scope || {}); },
    getRankingRecords: function (range, scope) { return pick(S.process.recIndex, range && range.from, range && range.to, scope || {}, 'none'); },
    getEvents: function (range, scope) { return pick(S.process.evIndex, range && range.from, range && range.to, scope || {}); },

    /* ---- HASIL ---- */
    /* result_mtd = AUTHORITATIVE. Tidak direkonstruksi dari result_daily. */
    getResultMtdRecords: function (scope) {
      const allow = allowSetFor(scope || {}), out = [];
      for (let i = 0; i < S.result.mtdRecords.length; i++) {
        const r = S.result.mtdRecords[i];
        if (inScope(r, scope || {}, allow, 'monitoring')) out.push(r);
      }
      return out;
    },
    getResultDailyRecords: function (range, scope) {
      return pick(S.result.dailyIndex, range && range.from, range && range.to, scope || {});
    },
    getRankingResultMtdRecords: function (scope) {
      const allow = allowSetFor(scope || {}), out = [];
      for (let i = 0; i < S.result.mtdRecords.length; i++) {
        const r = S.result.mtdRecords[i];
        if (inScope(r, scope || {}, allow, 'none')) out.push(r);
      }
      return out;
    },
    /* kompatibilitas nama lama: dipakai hanya oleh jalur harian */
    getResultRecords: function (range, scope) { return this.getResultDailyRecords(range, scope); },
    /* ====================================================================

       Dipakai HANYA oleh Monitoring Harian / Trend Result V2 dan kolom MTD di
       section tersebut. Mengikuti Monitoring Scope + hierarchy organisasi,
       TETAPI sengaja TIDAK melalui SalesmanProjectScope.filterRows karena
       result_daily_depot bergrain DEPO (tidak ada detail Salesman untuk
       membentuk subset Project secara benar). filterRows() global TIDAK diubah.

    getResultMtdRecordsRaw: function (scope) {

      for (let i = 0; i < S.result.mtdRecords.length; i++) {
        const r = S.result.mtdRecords[i];
