  /* V1.6.3 — hanya untuk interaction internal Ranking. Menu utama tetap memakai
     Renderer.renderView() sehingga perpindahan Proses/Hasil/Ranking masih mulai dari atas. */
  renderPreserveScroll: function (options) {
    const opt = options || {};
    const x = Number(window.scrollX || window.pageXOffset || 0);
    const y = Number(window.scrollY || window.pageYOffset || 0);
    const tableScroll = Array.prototype.map.call(document.querySelectorAll('#viewHost .rk-wrap'), function (el) {
      return { left: el.scrollLeft || 0, top: el.scrollTop || 0 };
    });
    this.render(document.getElementById('viewHost'));
    const raf = window.requestAnimationFrame || function (cb) { return setTimeout(cb, 0); };
    raf(function () {
      const wraps = document.querySelectorAll('#viewHost .rk-wrap');
      tableScroll.forEach(function (pos, i) {
        if (!wraps[i]) return;
        wraps[i].scrollLeft = pos.left;
        wraps[i].scrollTop = pos.top;
      });
      window.scrollTo({ top: y, left: x, behavior: 'auto' });
      if (opt.focusId) {
        const field = document.getElementById(opt.focusId);
        if (field) {
          try { field.focus({ preventScroll: true }); } catch (e) { field.focus(); }
          /* V1.7.4 — input type="number" TIDAK mendukung selection range dan
             akan melempar InvalidStateError. Caret hanya diatur untuk tipe teks. */
          const selectable = /^(text|search|url|tel|password)$/i.test(String(field.type || 'text'));
          if (opt.caretEnd && selectable && typeof field.setSelectionRange === 'function') {
            const end = String(field.value || '').length;
            try { field.setSelectionRange(end, end); } catch (e) { /* abaikan */ }
          }
          /* Browser lama dapat mengabaikan preventScroll tanpa melempar error. */
          window.scrollTo({ top: y, left: x, behavior: 'auto' });
        }
      }
    });
  }
};

/* ---------------- export ---------------- */
const RankingExport = {
  csv: function () {
    const s = AppState.ranking;
    const data = RankingService.getRanking(AppState.scope, s.level);
    const rows = RankingView.applyView(data.rows, s);
    const order = ['sc_jks', 'geo', 'roa', 'hit', 'golden', 'omset', 'epb'];
    const head = ['Rank', 'Kode', 'Nama'].concat(order.map(function (k) {
      return RankingService.KPIS.filter(function (x) { return x.key === k; })[0].label;
    })).concat(['Final Score', 'Kategori']);
    const q = function (v) { const t = String(v === null || v === undefined ? '' : v);
      return /[",;\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
    const lines = [head.map(q).join(';')];
    rows.forEach(function (r) {
      const vals = order.map(function (k) {
        const v = RankingView.actualOf(r, k);
        return v === null || v === undefined || isNaN(v) ? '' : U.dec(v, 2);
      });
      lines.push([r.rank === null ? '' : r.rank, r.code, r.label].concat(vals)
        .concat([r.final === null ? '' : U.dec(r.final, 2), r.categoryLabel]).map(q).join(';'));
    });
    const name = 'ranking-' + s.level + '-' + data.context.currentMonth + '.csv';
    this._download(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), name);
    return { rows: rows.length, name: name };
  },

  /* V1.6.6 — tombol JPG Ranking existing tetap ada, namun kini menjadi WRAPPER
     ke JpgExportService sehingga hanya ada SATU sistem JPG di seluruh aplikasi
     (sebelumnya: SVG foreignObject terpisah). Perilaku user tidak berubah:
     satu klik pada tabel Ranking utama tetap menghasilkan satu file JPG. */
  jpg: function (button) {
    const wrap = document.querySelector('#viewHost .rk-wrap');
    if (!wrap) return Promise.reject(new Error('Tabel ranking tidak ditemukan.'));
    const node = wrap.closest('section.section') || wrap;
    const level = DashboardService.levelLabel(AppState.ranking.level);
    return JpgExportService.run([node], {
      button: button || null,
      title: 'RANKING ' + String(level).toUpperCase(),
      subtitle: '',
      lines: JpgExportService.contextLines(),
      filename: ['Ranking', level, JpgExportService.scopeToken(), JpgExportService.stampToken()].join('_')
    });
  },
  /* dipertahankan untuk kompatibilitas (tidak lagi dipakai jalur JPG utama) */
  _collectCss: function () {
    let out = '';
    const want = /^\.(rk-|thead-green|row-|badge|dd-note|clickable)/;
    for (let i = 0; i < document.styleSheets.length; i++) {
      let rules; try { rules = document.styleSheets[i].cssRules; } catch (e) { continue; }
      for (let j = 0; j < rules.length; j++) {
        const r = rules[j];
        if (r.selectorText && want.test(r.selectorText)) out += r.cssText + '\n';
      }
    }
    return out + 'table{border-collapse:separate;border-spacing:0}td,th{padding:5px 8px;font-size:11px}';
  },
  _download: function (blob, name) {
    const a = document.createElement('a'), url = URL.createObjectURL(blob);
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }
};

/* ============================================================================
   LAYER 16B — JPG EXPORT SERVICE (V1.6.6)
   SATU engine JPG reusable untuk Proses Kerja, Hasil Kerja, Ranking, Analisis
   KPI, dan Informasi. Tanggung jawab: memuat html2canvas secara dinamis (sekali),
   membangun export stage offscreen, membersihkan UI interaktif, mengembangkan
   scroll container, menonaktifkan sticky, memilih scale adaptif, merender canvas,
   mengunduh JPEG, menamai file, loading state, error handling, dan cleanup.
   Export TIDAK PERNAH mengubah AppState maupun posisi scroll halaman.
   ========================================================================= */
const JpgExportService = {
  HTML2CANVAS_URL: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  _loading: null,
  _busy: false,
  _seq: 0,
  _registry: {},

  /* ---------- loader dinamis (pola sama dengan MasterCabangIO.loadXlsx) ---------- */
  loadHtml2Canvas: function () {
    if (window.html2canvas) return Promise.resolve(window.html2canvas);
    if (this._loading) return this._loading;
    const url = this.HTML2CANVAS_URL;
    this._loading = new Promise(function (res, rej) {
      const sc = document.createElement('script');
      sc.src = url; sc.async = true;
      sc.onload = function () {
        window.html2canvas ? res(window.html2canvas)
                           : rej(new Error('Fitur Download JPG tidak dapat dimuat. Periksa koneksi internet.'));
      };
      sc.onerror = function () {
        rej(new Error('Fitur Download JPG tidak dapat dimuat. Periksa koneksi internet.'));
      };
      document.head.appendChild(sc);
    });
    /* bila gagal, izinkan percobaan ulang berikutnya (promise tidak dikunci selamanya) */
    this._loading.catch(function () { JpgExportService._loading = null; });
    return this._loading;
  },

  /* ---------- konteks report ---------- */
  /* V1.7.2 — stempel waktu export mengikuti WIB (Asia/Jakarta). */
  nowLabel: function () { return U.wibNowDate() + ' · ' + U.wibNowTime(); },
  stampToken: function () { return U.wibStamp(); },
  scopeText: function () {
    const sc = AppState.scope, parts = [];
    if (sc.regional) parts.push(Renderer.orgLabel('regional', sc.regional));
    if (sc.branch)   parts.push(Renderer.orgLabel('branch', sc.branch));
    if (sc.depot)    parts.push(Renderer.orgLabel('depot', sc.depot));
    /* V1.7.2 — metadata export mengikuti Monitoring Scope; root scope trial
       TIDAK ditulis "Nasional". */
    const orgText = parts.length ? parts.join(' › ') : MonitoringScope.rootLabel();
    /* Informasi/HK tidak memiliki Project Scope. Report lain menstempel coverage aktif. */
    return AppState.menu === 'informasi' ? orgText : (orgText + ' · Coverage: ' + SalesmanProjectScope.label());
  },
  scopeToken: function () {
    const sc = AppState.scope;
    const raw = sc.depot ? Renderer.orgLabel('depot', sc.depot)
              : sc.branch ? Renderer.orgLabel('branch', sc.branch)
              : sc.regional ? Renderer.orgLabel('regional', sc.regional)
              : MonitoringScope.rootToken();
    const coverage = AppState.menu === 'informasi' ? '' : '_COVERAGE_' + SalesmanProjectScope.label();
    return this.sanitize(raw + coverage).toUpperCase();
  },
  /* filename deterministic & readable; karakter ilegal / non-ASCII dibersihkan
     agar browser tidak menolak atribut download. */
  sanitize: function (v) {
    return String(v === null || v === undefined ? '' : v)
      .replace(/[–—›·]+/g, '-')
      .replace(/[^A-Za-z0-9._-]+/g, '_')
      .replace(/_+/g, '_').replace(/-+/g, '-')
      .replace(/^[_\-.]+|[_\-.]+$/g, '')
      .slice(0, 120) || 'Report';
  },
  menuLabel: function () { return (MENUS[AppState.menu] || {}).label || String(AppState.menu || '').toUpperCase(); },

  /* baris konteks tambahan sesuai menu & state aktif (tidak mengubah state apa pun) */
  contextLines: function () {
    const out = [];
    if (AppState.menu === 'proses') {
      const p = DashboardService.resolvePeriod(AppState.period);
      out.push(['Periode', p.label + ' (' + (p.dates.length > 1
        ? U.dMed(p.range.from) + ' – ' + U.dMed(p.range.to) : U.dMed(p.range.to)) + ')']);
      const dm = DashboardService.monitoringMetrics().filter(function (m) { return m.key === AppState.dailyMetric; })[0];
      if (dm) out.push(['Metrik Harian', dm.label]);
    } else if (AppState.menu === 'hasil') {
      const ctx = DashboardService.resultContext();
      out.push(['Periode', 'MTD ' + ctx.currentLabel + ' · HK ' + ctx.hk + ' · s.d. ' + U.dMed(ctx.latest)]);
    } else if (AppState.menu === 'ranking') {
      const s = AppState.ranking, ctx = DashboardService.resultContext();
      out.push(['Periode', 'MTD ' + ctx.currentLabel + ' · HK ' + ctx.hk]);
      if (s.tab === 'ranking') {
        out.push(['Level Ranking', DashboardService.levelLabel(s.level)]);
        const quick = { all: 'Semua', top3: 'Top 3', bottom3: 'Bottom 3', critical: 'Critical' };
        if (s.quick && s.quick !== 'all') out.push(['Quick Filter', quick[s.quick] || s.quick]);
        if (s.search) out.push(['Pencarian', '"' + s.search + '"']);
        if (s.colFilter && s.colFilter.kpi) out.push(['Filter Kolom', s.colFilter.kpi +
          (s.colFilter.min !== null && s.colFilter.min !== undefined ? ' ≥ ' + s.colFilter.min : '') +
          (s.colFilter.max !== null && s.colFilter.max !== undefined ? ' ≤ ' + s.colFilter.max : '')]);
        if (s.catFilter) out.push(['Kategori', s.catFilter]);
      } else if (s.tab === 'analisis') {
        out.push(['Level Ranking', DashboardService.levelLabel(s.level)]);
        out.push(['Mode Analisis', s.analysisMode === 'summary' ? 'Ringkasan KPI' : 'Peringkat & Detail']);
        if (s.analysisMode !== 'summary') out.push(['KPI Aktif', s.kpi === 'final' ? 'Final Score' :
          (RankingService.KPIS.filter(function (k) { return k.key === s.kpi; })[0] || {}).label || s.kpi]);
      }
    } else if (AppState.menu === 'informasi') {
      out.push(['Periode', 'Metadata update terakhir per Depo']);
    }
    return out;
  },

  /* ---------- header report (mandiri, tidak bergantung header website) ---------- */
  headerNode: function (title, subtitle, extraLines) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'padding:18px 22px 14px;border-bottom:3px solid #17375e;margin-bottom:14px;' +
      'font-family:Inter,Segoe UI,Arial,sans-serif;background:#ffffff';
    const lines = [['Scope', this.scopeText()]].concat(extraLines || [])
      /* V1.7.0 — metadata export mengikuti sumber data yang BENAR-BENAR dipakai,
         termasuk periode PROSES & HASIL yang bisa berbeda bulan. */
      .concat([['Export', this.nowLabel()],
               ['Sumber', ProviderHub.isLive() ? 'LIVE DATA · SUPABASE' : 'DEV DEMO'],
               ['Periode', (function () {
                  try {
                    const p = DashboardService.processContext();
                    const r = DashboardService.resultContextPublic();
                    function ml(x) { const t = String(x || '');
                      return /^\d{4}-\d{2}/.test(t) ? U.MON_S[Number(t.slice(5, 7)) - 1] + ' ' + t.slice(0, 4) : '-'; }
                    return 'PROSES ' + ml(p.periodMonth) + ' HK ' + (p.hk == null ? '-' : p.hk) +
                           ' · HASIL ' + ml(r.currentMonth ? r.currentMonth + '-01' : null) +
                           ' HK ' + (r.hk == null ? '-' : r.hk);
                  } catch (e) { return '-'; }
                })()]]);
    wrap.innerHTML =
      '<div style="font-size:11px;letter-spacing:.14em;color:#5b7186;font-weight:700">PORTAL MONITORING ASS</div>' +
      '<div style="font-size:21px;font-weight:800;color:#17375e;margin-top:3px;letter-spacing:.02em">' +
        U.esc(title) + '</div>' +
      (subtitle ? '<div style="font-size:12.5px;color:#41607a;margin-top:2px;font-weight:600">' +
        U.esc(subtitle) + '</div>' : '') +
      '<div style="margin-top:9px;display:flex;flex-wrap:wrap;gap:4px 26px">' +
      lines.map(function (l) {
        return '<div style="font-size:11.5px;color:#2f4a60"><span style="color:#7d93a6">' +
          U.esc(l[0]) + ' : </span><b style="color:#17375e">' + U.esc(l[1]) + '</b></div>';
      }).join('') + '</div>';
    return wrap;
  },

  /* ---------- pembersihan clone ---------- */
  REMOVE_SELECTORS: [
    '.filter-bar', '.scope-bar', '.rk-tabs', '.demo-note', '.report-actions',
    '[data-jpg-btn]', '.jpg-btn', '.seg', '.hm-seg', '.rk-toolbar',
    'button', 'select', 'input', 'textarea', 'label', '.skel', '.modal-backdrop', '.app-toast'
  ],
  EXPAND_SELECTORS: [
    '.daily-wrap', '.mtx-wrap', '.table-wrap', '.result-table-wrap', '.ach-wrap',
    '.rk-wrap', '.info-table-wrap', '.chart-host', '.contrib-list', '.section-body'
  ],
  cleanClone: function (root) {
    const self = this;
    self.REMOVE_SELECTORS.forEach(function (sel) {
      Array.prototype.slice.call(root.querySelectorAll(sel)).forEach(function (el) {
        /* jangan hapus baris data yang kebetulan berada di dalam tabel report */
        if (el.closest && el.closest('table') && (el.tagName === 'BUTTON' || el.tagName === 'LABEL')) {
          el.parentNode.replaceChild(document.createTextNode(el.textContent || ''), el); return;
        }
        if (el.parentNode) el.parentNode.removeChild(el);
      });
    });
    /* sisa elemen interaktif diratakan menjadi teks biasa */
    Array.prototype.slice.call(root.querySelectorAll('.spacer, .row-chev, .rk-bucket-chev')).forEach(function (el) {
      if (el.parentNode) el.parentNode.removeChild(el);
    });
    /* scroll container dikembangkan penuh — JPG memuat SELURUH kolom & baris */
    self.EXPAND_SELECTORS.forEach(function (sel) {
      Array.prototype.slice.call(root.querySelectorAll(sel)).forEach(function (el) {
        el.style.overflow = 'visible';
        el.style.overflowX = 'visible';
        el.style.overflowY = 'visible';
        el.style.maxHeight = 'none';
        el.style.maxWidth = 'none';
      });
    });
    if (root.matches && self.EXPAND_SELECTORS.some(function (s) { return root.matches(s); })) {
      root.style.overflow = 'visible'; root.style.maxHeight = 'none'; root.style.maxWidth = 'none';
    }
    return root;
  },

  /* ---------- stage offscreen ---------- */
  buildStage: function (nodes, header) {
    const stage = document.createElement('div');
    stage.className = 'jpg-stage';
    stage.setAttribute('data-jpg-stage', '1');
    if (header) stage.appendChild(header);
    const body = document.createElement('div');
    body.className = 'jpg-stage-body';
    nodes.forEach(function (n) { body.appendChild(n); });
    stage.appendChild(body);
    /* pass 1 — lebar dasar desktop supaya pengukuran tabel realistis (bukan shrink-to-fit) */
    stage.style.width = '1360px';
    document.body.appendChild(stage);

    /* pass 2 — ukur konten terlebar (termasuk min-width tabel) lalu kunci lebar stage */
    let need = 0;
    Array.prototype.slice.call(stage.querySelectorAll('table')).forEach(function (t) {
      need = Math.max(need, t.scrollWidth || 0, t.offsetWidth || 0);
    });
    Array.prototype.slice.call(stage.querySelectorAll('svg')).forEach(function (t) {
      need = Math.max(need, t.getBoundingClientRect().width || 0);
    });
    const width = Math.min(Math.max(1360, Math.ceil(need) + 56), 7000);
    stage.style.width = width + 'px';
    return stage;
  },

  /* ---------- scale adaptif: prefer 2 → 1.5 → 1 ---------- */
  MAX_PIXELS: 36000000,
  MAX_SIDE: 16000,
  pickScale: function (w, h) {
    const candidates = [2, 1.5, 1];
    for (let i = 0; i < candidates.length; i++) {
      const s = candidates[i];
      if (w * s <= this.MAX_SIDE && h * s <= this.MAX_SIDE && w * s * h * s <= this.MAX_PIXELS) return s;
    }
    return 0;   /* melampaui kemampuan browser */
  },

  /* ---------- inti export ---------- */
  run: function (nodes, opts) {
    const self = this;
    const o = opts || {};
    if (self._busy) return Promise.reject(new Error('Export lain sedang berjalan.'));
    self._busy = true;

    const btn = o.button || null;
    const btnHtml = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.setAttribute('aria-busy', 'true'); btn.innerHTML = 'Menyiapkan JPG…'; }

    const sx = window.scrollX || window.pageXOffset || 0;
    const sy = window.scrollY || window.pageYOffset || 0;
    let stage = null;

    /* Posisi scroll halaman dikembalikan persis seperti sebelum export.
       Diterapkan berlapis karena html2canvas dapat menyentuh scroll setelah
       promise-nya selesai (clone iframe dibongkar secara asinkron). */
    const keepScroll = function () { window.scrollTo({ top: sy, left: sx, behavior: 'auto' }); };
    const restore = function () {
      if (stage && stage.parentNode) stage.parentNode.removeChild(stage);
      stage = null;
      if (btn) { btn.disabled = false; btn.removeAttribute('aria-busy'); btn.innerHTML = btnHtml; }
      keepScroll();
      const raf = window.requestAnimationFrame || function (cb) { return setTimeout(cb, 0); };
      raf(keepScroll);
      setTimeout(keepScroll, 80);
      setTimeout(keepScroll, 260);
      self._busy = false;
    };

    return self.loadHtml2Canvas().then(function (h2c) {
      const clones = nodes.map(function (n) { return self.cleanClone(n.cloneNode(true)); });
      if (!clones.length) throw new Error('Tidak ada konten yang dapat diexport.');
      stage = self.buildStage(clones, self.headerNode(o.title, o.subtitle, o.lines));

      const w = Math.max(stage.scrollWidth, stage.offsetWidth, 600);
      const h = Math.max(stage.scrollHeight, stage.offsetHeight, 300);
      const scale = self.pickScale(w, h);
      if (!scale) throw new Error('Tampilan terlalu besar untuk dijadikan satu JPG. Persempit scope atau filter.');

      return h2c(stage, { backgroundColor: '#ffffff', scale: scale, logging: false,
                          useCORS: true, imageTimeout: 0, removeContainer: true,
                          width: w, height: h, windowWidth: w, windowHeight: h });
    }).then(function (canvas) {
      return new Promise(function (res, rej) {
        canvas.toBlob(function (b) {
          if (!b) { rej(new Error('Canvas gagal menghasilkan gambar.')); return; }
          res({ blob: b, width: canvas.width, height: canvas.height });
        }, 'image/jpeg', 0.92);
      });
    }).then(function (r) {
      const name = self.sanitize(o.filename || 'Report') + '.jpg';
      self.download(r.blob, name);
      restore();
      return { bytes: r.blob.size, name: name, width: r.width, height: r.height };
    }).catch(function (err) {
      restore();
      if (window.console) console.error('[JpgExportService]', err);
      throw err;
    });
  },

  download: function (blob, name) {
    const a = document.createElement('a'), url = URL.createObjectURL(blob);
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  },

  /* ---------- API tingkat menu ---------- */
  allButtonHtml: function () {
    return '<div class="report-actions"><button class="jpg-btn jpg-btn-all" data-act="jpg-all" data-jpg-btn="1" ' +
      'title="Unduh seluruh tampilan report pada filter aktif menjadi satu file JPG">' +
      '🖼 Download JPG Semua Tampilan</button></div>';
  },
  tableButtonHtml: function (id) {
    return '<button class="jpg-btn" data-act="jpg-table" data-jpg-id="' + U.esc(id) + '" data-jpg-btn="1" ' +
      'title="Unduh tabel ini (seluruh baris & kolom) menjadi JPG">🖼 Download JPG</button>';
  },

  /* Menyisipkan tombol JPG pada setiap TABEL REPORT setelah render.
     Aturan: subcard bertabel → tombol pada subcard; section bertabel tanpa subcard →
     tombol pada section head; Informasi → tombol pada info-section head. */
  decorate: function () {
    const host = document.getElementById('viewHost');
    if (!host) return;
    const self = this;
    self._registry = {};
    let n = 0;

    const attach = function (unit, headEl, name) {
      if (!unit || !headEl || unit.getAttribute('data-jpg-id')) return;
      if (!unit.querySelector('table')) return;
      const id = 'jt' + (++n);
      unit.setAttribute('data-jpg-id', id);
      self._registry[id] = { name: name };
      const btn = document.createElement('button');
      btn.className = 'jpg-btn';
      btn.setAttribute('data-act', 'jpg-table');
      btn.setAttribute('data-jpg-id', id);
      btn.setAttribute('data-jpg-btn', '1');
      btn.title = 'Unduh tabel ini (seluruh baris & kolom) menjadi JPG';
      btn.innerHTML = '🖼 Download JPG';
      if (!headEl.querySelector('.spacer')) {
        const sp = document.createElement('span'); sp.className = 'spacer'; headEl.appendChild(sp);
      }
      headEl.appendChild(btn);
    };

    /* 1. subcard (MTD per Eceran, Top 10 / Bottom 10, dst) */
    Array.prototype.slice.call(host.querySelectorAll('.result-subcard')).forEach(function (card) {
      const head = card.querySelector('.result-subcard-head');
      const parentSec = card.closest('section.section');
      const secTitle = parentSec ? (parentSec.querySelector('.section-title') || {}).textContent : '';
      attach(card, head, [(secTitle || '').trim(), (head ? head.textContent : '').trim()]
        .filter(Boolean).join(' — '));
    });

    /* 2. section bertabel yang tidak memiliki subcard */
    Array.prototype.slice.call(host.querySelectorAll('section.section')).forEach(function (sec) {
      if (sec.querySelector('.result-subcard')) return;
      /* Ranking utama sudah punya tombol JPG existing (kini memakai engine yang sama) */
      if (sec.querySelector('[data-act="rk-jpg"]')) return;
      const head = sec.querySelector('.section-head');
      const title = (sec.querySelector('.section-title') || {}).textContent || 'Tabel';
      attach(sec, head, title.trim());
    });

    /* 3. Informasi Update Data per Depo */
    Array.prototype.slice.call(host.querySelectorAll('.info-section')).forEach(function (sec) {
      const head = sec.querySelector('.info-section-head');
      const title = (sec.querySelector('.info-section-title') || {}).textContent || 'Informasi Update Data';
      attach(sec, head, title.trim());
    });
  },

  /* ---------- aksi: satu tabel ---------- */
  exportTable: function (id, button) {
    const unit = document.querySelector('#viewHost [data-jpg-id="' + id + '"]');
    if (!unit) return Promise.reject(new Error('Tabel tidak ditemukan.'));
    const meta = this._registry[id] || {};
    const name = meta.name || 'Tabel';
    return this.run([unit], {
      button: button,
      title: String(name).toUpperCase() + ' — ' + this.menuLabel(),
      subtitle: '',
      lines: this.contextLines(),
      filename: [this.menuKey(), name, this.scopeToken(), this.stampToken()].join('_')
    });
  },
  menuKey: function () {
    return AppState.menu === 'proses' ? 'Proses'
         : AppState.menu === 'hasil' ? 'Hasil'
         : AppState.menu === 'ranking' ? 'Ranking'
         : AppState.menu === 'informasi' ? 'Informasi' : 'Report';
  },

  /* ---------- aksi: SEMUA TAMPILAN (satu klik = satu JPG) ---------- */
  allRootSelector: function () {
    return AppState.menu === 'proses' ? '#dashBody'
         : AppState.menu === 'hasil' ? '#resultDashBody'
         : AppState.menu === 'informasi' ? '#informationBody'
         : AppState.menu === 'ranking' ? '#rkBody' : null;
  },
  allTitle: function () {
    if (AppState.menu !== 'ranking') return this.menuLabel();
    const s = AppState.ranking;
    if (s.tab === 'analisis') return 'ANALISIS KPI — ' + (s.analysisMode === 'summary' ? 'RINGKASAN KPI' : 'PERINGKAT & DETAIL');
    return 'RANKING';
  },
  allFilenamePart: function () {
    if (AppState.menu !== 'ranking') return this.menuKey() + '_ALL';
    const s = AppState.ranking;
    if (s.tab === 'analisis') return 'Ranking_Analisis_' + (s.analysisMode === 'summary' ? 'Ringkasan' : 'Detail') + '_ALL';
    return 'Ranking_' + DashboardService.levelLabel(s.level) + '_ALL';
  },
  exportAll: function (button) {
    const sel = this.allRootSelector();
    const root = sel ? document.querySelector(sel) : null;
    if (!root) return Promise.reject(new Error('Tampilan report tidak ditemukan.'));
    return this.run([root], {
      button: button,
      title: this.allTitle(),
      subtitle: '',
      lines: this.contextLines(),
      filename: [this.allFilenamePart(), this.scopeToken(), this.stampToken()].join('_')
    });
  }
};

/* ============================================================================
   LAYER 11 — CONTROLLER (event delegation — listener didaftarkan SEKALI)
   ========================================================================= */
const Controller = {
  setScope: function (sc) {
    /* V1.6.6 — scope selalu dinormalisasi terhadap resolved organization graph */
    AppState.scope = OrgResolver.normalizeScope({ regional: sc.regional || null,
                       branch: sc.branch || null, depot: sc.depot || null });
    Renderer.refresh(true);
  },

  /* V1.6.6 — dipanggil setiap kali Master Cabang disimpan / diganti / dihapus.
     Hierarchy resolved berubah, sehingga: cache Ranking invalid, scope aktif
     dinormalisasi (stale scope aman), lalu SELURUH menu aktif dirender ulang
     (filter options, breadcrumb, KPI, tabel, Informasi) tanpa refresh browser. */
  applyOrgChange: function () {
    OrgResolver.invalidate();
    if (typeof RankingService !== 'undefined') RankingService.invalidate();
    AppState.scope = OrgResolver.normalizeScope(AppState.scope);
    if (AppState.menu === 'ranking') RankingShell.renderPreserveScroll();
    else Renderer.refresh(true);
  },
  /* ======================================================================
     V1.7.2 — Monitoring Scope berubah.
     Urutan: cache hierarchy di-invalidate → AppState.scope dinormalisasi
     (drilldown di luar scope baru direset ke root) → cache Ranking di-invalidate
     untuk future safety → menu aktif dirender ulang. TIDAK reload halaman dan
     TIDAK fetch ulang Supabase.
     ====================================================================== */
  /* V1.7.4 — setting Ranking / Total HK berubah: TAT dan cache Ranking dihitung
     ulang, lalu tab Ranking dirender ulang tanpa reload halaman. */
  applyRankingSettingChange: function () {
    if (typeof RankingTat !== 'undefined') RankingTat.invalidate();
    if (typeof RankingService !== 'undefined' && RankingService.invalidate) RankingService.invalidate();
    if (AppState.menu === 'ranking') RankingShell.renderPreserveScroll();
    else Renderer.renderView();
  },

  applyMonitoringScopeChange: function () {
    OrgResolver.invalidateLive();
    /* Monitoring Scope berubah -> HK standar pusat dan TAT ikut dihitung ulang. */
    if (typeof RankingTat !== 'undefined') RankingTat.invalidate();
    if (typeof RankingService !== 'undefined' && RankingService.invalidate) RankingService.invalidate();
    AppState.scope = OrgResolver.normalizeScope(AppState.scope);
    if (AppState.menu === 'ranking') RankingShell.renderPreserveScroll();
    else Renderer.renderView();
    Controller.toast(MonitoringScope.isAll()
      ? 'Scope Monitoring: Semua Regional'
      : 'Scope Monitoring: ' + MonitoringScope.count() + ' Regional aktif');
  },

  /* ======================================================================
     V1.7.6 — MASTER SALESMAN BERUBAH (upload / ganti / hapus).
     Urutan invalidation:
       (1) organization graph LIVE dibangun ulang -> ASS mapping index baru;
       (2) cache hierarchy OrgResolver di-invalidate (Project index ikut
           terbentuk ulang lewat SalesmanProjectScope.setMaster);
       (3) cache Ranking di-invalidate;
       (4) scope aktif dinormalisasi, drilldown ASS yang stale ditutup;
       (5) view aktif dirender ulang.
     TIDAK ada refetch Supabase — Master Salesman adalah data lokal.
     TAT / Total HK / HK Hypercare / Informasi TIDAK disentuh.
     ====================================================================== */
  applyMasterSalesmanChange: function () {
    try {
      if (ProviderHub.isLive() && LiveDataStore.status.bootstrap === 'ready') LiveDataStore.rebuildOrg();
    } catch (e) { if (window.console) console.error(e); }
    if (typeof OrgResolver !== 'undefined' && OrgResolver.invalidateLive) OrgResolver.invalidateLive();
    else if (typeof OrgResolver !== 'undefined' && OrgResolver.invalidate) OrgResolver.invalidate();
    if (typeof RankingService !== 'undefined' && RankingService.invalidate) RankingService.invalidate();
    if (AppState.scope && AppState.scope.ass) AppState.scope.ass = null;
    AppState.scope = OrgResolver.normalizeScope(AppState.scope);
    if (DrilldownState && DrilldownState.open) Modal.close();
    if (AppState.menu === 'ranking') RankingShell.renderPreserveScroll();
    else Renderer.renderView();
    Controller.toast('Coverage Salesman: ' + SalesmanProjectScope.label());
  },

  /* Project Scope hanya mengubah cache/perhitungan frontend. Tidak refetch LIVE,
     tidak mengubah TAT, InformationService, Monitoring Scope, atau hierarchy. */
  applyProjectScopeChange: function () {
    /* ======================================================================
       V1.7.6.1 — Coverage Project berubah => ASS owner dapat berubah
       (Master Salesman mendukung ASS per Project). Resolved organization graph
       WAJIB dibangun ulang agar Ranking ASS / ASS Terbaik / drilldown /
       breadcrumb / export langsung memakai ASS Project aktif tanpa reload.
       TIDAK ada refetch Supabase, TIDAK menyentuh TAT / Total HK / Informasi.
       ====================================================================== */
    try {
      if (ProviderHub.isLive() && LiveDataStore.status.bootstrap === 'ready') LiveDataStore.rebuildOrg();
    } catch (e) { if (window.console) console.error(e); }
    if (typeof OrgResolver !== 'undefined' && OrgResolver.invalidateLive) OrgResolver.invalidateLive();
    if (typeof RankingService !== 'undefined' && RankingService.invalidate) RankingService.invalidate();
    if (AppState.scope && AppState.scope.ass) AppState.scope.ass = null;
    AppState.scope = OrgResolver.normalizeScope(AppState.scope);
    if (DrilldownState && DrilldownState.open) Modal.close();
    if (AppState.menu === 'ranking') RankingShell.renderPreserveScroll();
    else Renderer.renderView();
    Controller.toast('Coverage Salesman: ' + SalesmanProjectScope.label());
  },

  drill: function (kind, scope, code) {
    if (kind === 'salesman') { Detail.salesman(code); return; }
    this.setScope(scope);
  },
  back: function () {
    const sc = AppState.scope;
    if (sc.depot) sc.depot = null;
    else if (sc.branch) sc.branch = null;
    else if (sc.regional) sc.regional = null;
    this.setScope(sc);
  },
  crumb: function (level) {
    if (level === 'national') this.setScope({});
    else if (level === 'regional') this.setScope({ regional: AppState.scope.regional });
    else if (level === 'branch') this.setScope({ regional: AppState.scope.regional, branch: AppState.scope.branch });
    else Renderer.refresh(true);
  },

  /* notifikasi ringan; satu elemen, tanpa timer permanen */
  toast: function (msg) {
    let el = document.getElementById('appToast');
    if (!el) { el = document.createElement('div'); el.id = 'appToast'; el.className = 'app-toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('on');
    clearTimeout(Controller._toastT);
    Controller._toastT = setTimeout(function () { el.classList.remove('on'); }, 2600);
  },
  _toastT: null,

  /* label entitas diambil dari baris yang diklik (row-label / contrib-name) */
  entityLabel: function (el) {
    const n = el.querySelector('.row-label') || el.querySelector('.contrib-name');
    const code = el.dataset.code || '';
    return n ? n.textContent.trim() : code;
  },

  /* pointer bergerak > 6px antara pointerdown dan click = drag/scroll, bukan klik */
  _down: { x: 0, y: 0 },
  wasDrag: function (e) {
    if (typeof e.clientX !== 'number') return false;
    /* klik tanpa pointerdown (keyboard Enter / klik programatik) bukan drag */
    if (!e.clientX && !e.clientY) return false;
    const dx = e.clientX - Controller._down.x, dy = e.clientY - Controller._down.y;
    return Math.sqrt(dx * dx + dy * dy) > 6;
  },

  openRankingBucket: function (el) {
    if (!el || AppState.menu !== 'ranking') return;
    const detail = RankingService.getKpiBucketDetail(AppState.scope, AppState.ranking.level,
      el.dataset.kpi, Number(el.dataset.bi));
    if (detail && detail.count > 0) Drilldown.openBucket(detail);
  },

  init: function () {
    Modal.init();
    /* V1.7.2 — preference Monitoring Scope dibaca SEBELUM render pertama supaya
       tidak ada kedipan Nasional → Scope Trial. Validasi terhadap master LIVE
       dilakukan setelah bootstrap selesai (lihat startLive / afterLiveChange). */
    MonitoringScope.load();
    SalesmanProjectScope.loadPreference();
    const projectMasterReady = SalesmanProjectStore.load().then(function (m) {
      SalesmanProjectScope.setMaster(m || null); return m || null;
    }).catch(function () { SalesmanProjectScope.setMaster(null); return null; });

    document.addEventListener('pointerdown', function (e) {
      Controller._down.x = e.clientX; Controller._down.y = e.clientY;
    }, true);

    document.addEventListener('keydown', function (e) {
      const el = e.target && e.target.closest ? e.target.closest('[data-act="rk-bucket"]') : null;
      if (!el || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault(); Controller.openRankingBucket(el);
    });

    document.getElementById('appNav').addEventListener('click', function (e) {
      const b = e.target.closest('.nav-item'); if (!b) return;
      if (AppState.menu === b.dataset.menu) return;
      AppState.menu = b.dataset.menu;
      /* V1.7.0 — lazy load per menu. Data domain hanya diambil saat dibutuhkan
         dan tidak di-refetch bila cache periode aktif masih valid. */
      Renderer.renderView();                     /* tampilkan loading/state menu dulu */
      Controller.ensureDomain(AppState.menu);    /* selesai fetch -> render ulang */
    });

    document.addEventListener('click', function (e) {
      const el = e.target.closest('[data-act]'); if (!el) return;
      const act = el.dataset.act;

      if ((act === 'drill' || act === 'result-drill') && Controller.wasDrag(e)) return;   /* cegah drill saat scroll horizontal */

      if (act === 'period') { AppState.period = el.dataset.p; Renderer.refresh(false); }
      else if (act === 'dmetric') {
        if (AppState.dailyMetric === el.dataset.m) return;
        AppState.dailyMetric = el.dataset.m;
        Renderer.updateDaily();
      }
      else if (act === 'result-daily') {
        if (AppState.resultDailyMetric === el.dataset.m) return;
        AppState.resultDailyMetric = el.dataset.m;
        Renderer.renderResultDashboard();
      }
      else if (act === 'reset') { Controller.setScope({}); }
      else if (act === 'back') { Controller.back(); }
      else if (act === 'crumb') { Controller.crumb(el.dataset.level); }
      /* ===== V1.5 — SELURUH klik baris organisasi diarahkan ke popup drill-down.
         Tidak ada lagi setScope() dari klik baris: scope halaman utama HANYA
         diubah oleh filter global / breadcrumb halaman / Reset Scope. ===== */
      else if (act === 'drill' || act === 'result-drill') {
        let sc = {}; try { sc = JSON.parse(el.dataset.scope || '{}'); } catch (x) { sc = {}; }
        const entity = { scope: sc, code: el.dataset.code, kind: el.dataset.kind,
                         label: Controller.entityLabel(el) };
        if (el.closest('#modalRoot') && DrilldownState.open) { Drilldown.goChild(entity); return; }
        const srcEl = el.closest('[data-dsrc]');
        if (!srcEl) return;
        Drilldown.openFrom(srcEl.dataset.dsrc, entity);
      }
      else if (act === 'pattern')  {
        if (DrilldownState.open && Drilldown.openSub('pattern', { sm: el.dataset.sm, type: el.dataset.type })) return;
        Detail.pattern(el.dataset.sm, el.dataset.type);
      }
      else if (act === 'salesman') {
        if (DrilldownState.open) { DrilldownState.salesmanCode = el.dataset.sm;
                                   Drilldown.openSub('salesman'); return; }
        Detail.salesman(el.dataset.sm);
      }
      else if (act === 'evidence') {
        if (DrilldownState.open && Drilldown.openSub('evidence')) return;
        Detail.evidence(el.dataset.sm);
      }
      /* ===== V1.6 — aksi Menu Ranking ===== */
      else if (act === 'rk-bucket') { Controller.openRankingBucket(el); }
      else if (act === 'rk-bucket-drill') {
        let sc = {}; try { sc = JSON.parse(el.dataset.scope || '{}'); } catch (x) { sc = {}; }
        Drilldown.goBucketEntity({ scope: sc, code: el.dataset.code, kind: el.dataset.kind,
                                   label: Controller.entityLabel(el) });
      }
      else if (act === 'rk-tab')   { AppState.ranking.tab = el.dataset.t;
                                     if (el.dataset.t === 'analisis') AppState.ranking.analysisMode = 'summary';
                                     AppState.ranking.settingSaved = false; RankingShell.renderPreserveScroll(); }
      else if (act === 'rk-analysis-mode') { AppState.ranking.analysisMode = el.dataset.m; RankingShell.renderPreserveScroll(); }
      else if (act === 'rk-level') { AppState.ranking.level = el.dataset.l; AppState.ranking.search = '';
                                     AppState.ranking.quick = 'all'; RankingShell.renderPreserveScroll(); }
      else if (act === 'rk-kpi')   { AppState.ranking.kpi = el.dataset.k; RankingShell.renderPreserveScroll(); }
      else if (act === 'rk-quick') { AppState.ranking.quick = el.dataset.q; RankingShell.renderPreserveScroll(); }
      else if (act === 'rk-sort')  {
        const k = el.dataset.k, r = AppState.ranking;
        if (r.sortKey === k) r.sortDir = r.sortDir === 'desc' ? 'asc' : 'desc';
        else { r.sortKey = k; r.sortDir = 'desc'; }
        RankingShell.renderPreserveScroll();
      }
      else if (act === 'rk-filter-clear') { AppState.ranking.colFilter = { kpi: '', min: null, max: null };
                                            RankingShell.renderPreserveScroll(); }
      /* ===== V1.6.6 — JPG EXPORT (satu engine untuk seluruh menu report) ===== */
      else if (act === 'jpg-all') {
        JpgExportService.exportAll(el)
          .then(function (r) { Controller.toast('JPG diunduh · ' + Math.round(r.bytes / 1024) + ' KB'); })
          .catch(function (e) { Controller.toast('JPG gagal dibuat. ' + (e && e.message ? e.message : 'Silakan coba kembali.')); });
      }
      else if (act === 'jpg-table') {
        JpgExportService.exportTable(el.dataset.jpgId, el)
          .then(function (r) { Controller.toast('JPG diunduh · ' + Math.round(r.bytes / 1024) + ' KB'); })
          .catch(function (e) { Controller.toast('JPG gagal dibuat. ' + (e && e.message ? e.message : 'Silakan coba kembali.')); });
      }
      else if (act === 'rk-csv')   { const r = RankingExport.csv(); Controller.toast('CSV diunduh · ' + r.rows + ' baris'); }
      else if (act === 'rk-jpg')   {
        RankingExport.jpg(el).then(function (r) { Controller.toast('JPG diunduh · ' + Math.round(r.bytes / 1024) + ' KB'); })
          .catch(function (e) { Controller.toast('JPG gagal dibuat. ' + (e && e.message ? e.message : 'Silakan coba kembali.')); });
      }
      else if (act === 'rk-save') {
        const d = AppState.ranking.settingDraft || RankingSettings.get();
        if (Math.abs(RankingSettings.totalWeight(d.weights) - 100) > 1e-9) return;
        /* V1.7.4 — Total HK ikut disimpan, TETAPI hanya bila valid.
           Nilai invalid tidak pernah masuk storage; user diberi pesan jelas. */
        const hk = AppState.ranking.hkDraft;
        if (hk !== null && hk !== undefined && String(hk).trim() !== '') {
          const snap = RankingTat.snapshot();
          const res = RankingPeriodSettings.setTotalHk(snap.periodMonth, hk);
          if (!res.ok) { Controller.toast('Total HK tidak disimpan: ' + res.message); return; }
        }
        /* totalHk tidak boleh mengotori storage setting bobot */
        const clean = JSON.parse(JSON.stringify(d));
        delete clean.totalHk;
        RankingSettings.save(clean);
        AppState.ranking.settingDraft = null; AppState.ranking.hkDraft = null;
        AppState.ranking.settingSaved = true;
        Controller.applyRankingSettingChange();
      }
      /* Hapus Total HK bulan aktif — aksi EKSPLISIT, bukan efek Reset Default. */
      else if (act === 'rk-hk-clear') {
        const snap = RankingTat.snapshot();
        RankingPeriodSettings.clearPeriod(snap.periodMonth);
        AppState.ranking.hkDraft = null; AppState.ranking.settingSaved = false;
        Controller.toast('Total HK ' + snap.periodLabel + ' dihapus');
        Controller.applyRankingSettingChange();
      }
      else if (act === 'rk-reset-default') {
        /* V1.7.4 — hanya bobot / Golden EC / Score Cap. Total HK per bulan
           adalah period business setting dan TIDAK dihapus di sini. */
        RankingSettings.reset();
        AppState.ranking.settingDraft = null; AppState.ranking.hkDraft = null;
        AppState.ranking.settingSaved = true;
        Controller.applyRankingSettingChange();
      }
      else if (act === 'rk-master-save') {
        const pv = RankingMasterView._preview;
        if (!pv || !pv.result.ok) return;
        const payload = { fileName: pv.fileName, uploadedAt: pv.uploadedAt, rows: pv.result.rows,
                          regionals: pv.result.regionals, branches: pv.result.branches, depots: pv.result.depots };
        MasterCabangStore.save(payload).then(function () {
          OrgResolver.setMaster(payload); RankingMasterView._preview = null;
          Controller.toast('Master Cabang tersimpan (IndexedDB)'); Controller.applyOrgChange();
        }).catch(function (e) { Controller.toast('Gagal menyimpan: ' + e.message); });
      }
      else if (act === 'rk-master-cancel') { RankingMasterView._preview = null; RankingShell.renderPreserveScroll(); }
      else if (act === 'rk-master-clear') {
        MasterCabangStore.clear().then(function () {
          OrgResolver.setMaster(null); Controller.toast('Master Cabang dihapus'); Controller.applyOrgChange();
        });
      }
      else if (act === 'master-download') {
        MasterControlIO.download().then(function (n) { Controller.toast('Master XLSX diunduh · ' + n + ' Depo'); })
          .catch(function (err) { Controller.toast('Download gagal: ' + err.message); });
      }
      else if (act === 'master-cancel') { RankingMasterView._preview = null; RankingShell.renderPreserveScroll(); }
      else if (act === 'master-confirm') {
        const pv = RankingMasterView._preview;
        if (!MASTER_CONTROL_WRITE_ENABLED || !pv || !pv.result || !pv.result.valid ||
            !pv.result.changes.length || MasterControlIO._applying) return;

        const changes = pv.result.changes.map(function (r) {
          const a = r.after || {};
          return {
            depot_code: r.depot_code,
            regional_code: a.regional_code,
            regional_name: a.regional_name,
            branch_code: a.branch_code,
            branch_name: a.branch_name,
            depot_name: a.depot_name,
            plant: a.plant,
            status_monitoring: a.status_monitoring,
            status_ranking: a.status_ranking,
            status_informasi: a.status_informasi,
            reason: 'MASTER_EXCEL_UPLOAD'
          };
        });

        if (!window.confirm(
          'Terapkan ' + changes.length + ' perubahan Master Cabang ke Supabase?\n\n' +
          'Perubahan akan langsung menjadi authority Monitoring Pusat.\n' +
          'Row yang tidak ada di file tetap NO CHANGE dan TAKE OUT tidak menghapus history.'
        )) return;

        MasterControlIO._applying = true;
        RankingShell.renderPreserveScroll();
        Controller.toast('Menerapkan ' + changes.length + ' perubahan Master Cabang…');

        MasterCabangAuthority.apply(changes).then(function (d) {
          RankingMasterView._preview = null;
          MasterControlIO._applying = false;
          Controller.toast('Master Cabang berhasil diperbarui · ' +
            U.int((d && d.updated) || changes.length) + ' Depo');
          Controller.applyOrgChange();
        }).catch(function (err) {
          MasterControlIO._applying = false;
          Controller.toast('Apply Master Cabang gagal: ' + (err && err.message ? err.message : 'Unknown error'));
          RankingShell.renderPreserveScroll();
        });
      }
      else if (act === 'project-master-save') {
        const pv = SalesmanProjectView._preview;
        if (!pv || !pv.result || !pv.result.ok) return;
        /* V1.7.6 — payload menyimpan kolom ASS. Safe replace tetap: master lama
           baru diganti setelah put IndexedDB benar-benar sukses. */
        const payload = { fileName: pv.fileName, uploadedAt: pv.uploadedAt,
          rows: pv.result.rows, totalRows: pv.result.totalRows, valid: pv.result.valid,
          invalid: pv.result.invalid, duplicates: pv.result.duplicates,
          uniqueSalesmen: pv.result.uniqueSalesmen, uniqueProjects: pv.result.uniqueProjects,
          uniqueAss: pv.result.uniqueAss || 0, hasAssColumn: !!pv.result.hasAssColumn,
          schema: 'master_salesman_v2' };
        SalesmanProjectStore.save(payload).then(function () {
          SalesmanProjectScope.setMaster(payload); SalesmanProjectView._preview = null;
          Controller.toast('Master Salesman tersimpan (IndexedDB)');
          Controller.applyMasterSalesmanChange();
        }).catch(function (err) { Controller.toast('Gagal menyimpan Master Salesman: ' + err.message); });
      }
      else if (act === 'project-master-cancel') {
        SalesmanProjectView._preview = null; RankingShell.renderPreserveScroll();
      }
      else if (act === 'project-master-clear') {
        if (!window.confirm('Hapus Master Salesman? Coverage kembali ke Semua Salesman dan ASS kembali ke identitas LIVE existing.')) return;
        SalesmanProjectStore.clear().then(function () {
          SalesmanProjectScope._setAll(true); SalesmanProjectScope.setMaster(null);
          SalesmanProjectView._preview = null;
          Controller.toast('Master Salesman dihapus · Coverage Semua Salesman');
          Controller.applyMasterSalesmanChange();
        }).catch(function (err) { Controller.toast('Gagal menghapus Master Salesman: ' + err.message); });
      }
      else if (act === 'rk-drill') {
        if (Controller.wasDrag(e)) return;
        let sc = {}; try { sc = JSON.parse(el.dataset.scope || '{}'); } catch (x) { sc = {}; }
        const entity = { scope: sc, code: el.dataset.code, kind: el.dataset.kind,
                         label: Controller.entityLabel(el) };
        if (el.closest('#modalRoot') && DrilldownState.open) { Drilldown.goChild(entity); return; }
        Drilldown.openFrom('ranking_main', entity);
      }
      else if (act === 'dd-back') { Drilldown.back(); }
      else if (act === 'dd-bucket-home') { Drilldown.bucketHome(); }
      else if (act === 'dd-back-sm') { Drilldown.openSub('salesman'); }
      else if (act === 'dd-crumb') { Drilldown.goCrumb(parseInt(el.dataset.i, 10)); }
      else if (act === 'modal-close') { Modal.close(); }
      /* V1.7.0 — retry LIVE. Tidak ada fallback demo; hanya mencoba ulang. */
      /* ===== V1.7.2 — MONITORING SCOPE (memakai event delegation existing;
         tidak ada listener baru yang dipasang per render) ===== */
      else if (act === 'ms-open')  { MonitoringScopeView.open(); }
      else if (act === 'ms-all')   { MonitoringScopeView.selectAll(true); }
      else if (act === 'ms-none')  { MonitoringScopeView.selectAll(false); }
      else if (act === 'ms-apply') { MonitoringScopeView.apply(); }
      else if (act === 'live-retry') { Controller.retryBootstrap(); }
      else if (act === 'live-retry-domain') { Controller.retryDomain(el.dataset.domain); }
    });

    /* input Ranking — debounce untuk search, langsung untuk numerik */
    let rkT = null;
    document.addEventListener('input', function (e) {
      const t = e.target, r = AppState.ranking;
      if (t.id === 'rkSearch') {
        clearTimeout(rkT); const v = t.value;
        rkT = setTimeout(function () { r.search = v;
          RankingShell.renderPreserveScroll({ focusId: 'rkSearch', caretEnd: true }); }, 260);
      } else if (t.dataset && t.dataset.act === 'rk-weight') {
        if (!r.settingDraft) r.settingDraft = JSON.parse(JSON.stringify(RankingSettings.get()));
        r.settingDraft.weights[t.dataset.k] = Number(t.value) || 0;
        r.settingSaved = false;
        clearTimeout(rkT); rkT = setTimeout(function () { RankingShell.renderPreserveScroll(); }, 200);
      } else if (t.dataset && t.dataset.act === 'rk-hk') {
        /* V1.7.4 — Total HK Bulan. Nilai invalid TIDAK disimpan; hanya draft. */
        r.hkDraft = t.value === '' ? '' : t.value;
        r.settingSaved = false;
        clearTimeout(rkT); rkT = setTimeout(function () {
          RankingShell.renderPreserveScroll({ focusId: 'rkHkInput', caretEnd: true }); }, 320);
      } else if (t.dataset && t.dataset.act === 'rk-param') {
        if (!r.settingDraft) r.settingDraft = JSON.parse(JSON.stringify(RankingSettings.get()));
        r.settingDraft[t.dataset.p] = Number(t.value) || 0;
        r.settingSaved = false;
        clearTimeout(rkT); rkT = setTimeout(function () { RankingShell.renderPreserveScroll(); }, 200);
      } else if (t.id === 'rkFilterMin' || t.id === 'rkFilterMax') {
        const k = t.id === 'rkFilterMin' ? 'min' : 'max';
        r.colFilter[k] = t.value === '' ? null : Number(t.value);
        clearTimeout(rkT); rkT = setTimeout(function () { RankingShell.renderPreserveScroll(); }, 260);
      } else if (t.id === 'rkCiVal') {
        r.countif.value = Number(t.value);
        clearTimeout(rkT); rkT = setTimeout(function () { RankingShell.renderPreserveScroll(); }, 260);
      }
    });

    document.addEventListener('change', function (e) {
      const t0 = e.target, rk = AppState.ranking;
      /* Monitoring Scope — radio mode & checkbox Regional */
      if (t0 && t0.dataset && t0.dataset.act === 'ms-mode') { MonitoringScopeView.setMode(t0.dataset.mode); return; }
      if (t0 && t0.dataset && t0.dataset.act === 'ms-toggle') {
        MonitoringScopeView.toggle(t0.dataset.code, !!t0.checked); return;
      }
      if (t0.id === 'rkFilterKpi') { rk.colFilter.kpi = t0.value; RankingShell.renderPreserveScroll(); return; }
      if (t0.id === 'rkCiKpi') { rk.countif.kpi = t0.value; RankingShell.renderPreserveScroll(); return; }
      if (t0.id === 'rkCiOp') { rk.countif.op = t0.value; RankingShell.renderPreserveScroll(); return; }
      if (t0.id === 'rkMasterFile') {
        const f = t0.files && t0.files[0]; if (!f) return;
        Controller.toast('Membaca ' + f.name + '…');
        MasterCabangIO.readFile(f).then(function (matrix) {
          const res = MasterCabangIO.validate(matrix);
          RankingMasterView._preview = { fileName: f.name,
            uploadedAt: (ProviderHub.facade.today || new Date().toISOString().slice(0, 10)), result: res };
          RankingShell.renderPreserveScroll();
        }).catch(function (err) {
          RankingMasterView._preview = null;
          Controller.toast('Gagal membaca file: ' + err.message);
          RankingShell.renderPreserveScroll();
        });
        return;
      }
      if (t0.id === 'masterControlFile') {
        const f = t0.files && t0.files[0]; if (!f) return;
        if (!/\.(xlsx|xls)$/i.test(f.name || '')) { Controller.toast('Format file harus XLSX atau XLS.'); return; }
        Controller.toast('Memvalidasi ' + f.name + '…');
        MasterCabangIO.readFile(f).then(function (matrix) {
          RankingMasterView._preview = { fileName: f.name, result: MasterControlIO.validate(matrix) };
          RankingShell.renderPreserveScroll();
        }).catch(function (err) {
          RankingMasterView._preview = null; Controller.toast('File tidak valid: ' + err.message);
          RankingShell.renderPreserveScroll();
        });
        return;
      }
      if (t0.id === 'projectMasterFile') {
        const f = t0.files && t0.files[0]; if (!f) return;
        Controller.toast('Membaca ' + f.name + '…');
        SalesmanProjectIO.readFile(f).then(function (matrix) {
          const res = SalesmanProjectIO.validate(matrix);
          SalesmanProjectView._preview = { fileName: f.name,
            uploadedAt: U.wibNowDate() + ' ' + U.wibNowTime(), result: res };
          RankingShell.renderPreserveScroll();
        }).catch(function (err) {
          SalesmanProjectView._preview = null;
          Controller.toast('Gagal membaca Master Salesman: ' + err.message);
          RankingShell.renderPreserveScroll();
        });
        return;
      }
      const t = e.target;
      if (t.id === 'projectScopeSelect') {
        SalesmanProjectScope.select(t.value || ''); Controller.applyProjectScopeChange();
      }
      else if (t.id === 'fRegional') Controller.setScope({ regional: t.value || null });
      else if (t.id === 'fBranch') Controller.setScope({ regional: AppState.scope.regional, branch: t.value || null });
      else if (t.id === 'fDepot')  Controller.setScope({ regional: AppState.scope.regional,
                                                         branch: AppState.scope.branch, depot: t.value || null });
    });

    /* jam header — satu interval saja, 30 detik */
    /* V1.7.0 — TANGGAL DATA berasal dari metadata production (cutoff PROSES &
       cutoff HASIL), BUKAN dari new Date(). Jam browser hanya untuk tampilan jam. */
    const clock = document.getElementById('hdrClock');
    function dataDateLabel() {
      if (!ProviderHub.isLive()) return 'Data s.d. ' + U.dMed(ProviderHub.facade.today || '');
      const S2 = LiveDataStore;
      if (S2.status.bootstrap !== 'ready') return 'Data Pusat';
      function ml(p) {
        const t = String(p || '');
        if (!/^\d{4}-\d{2}/.test(t)) return '–';
        return U.MON_S[Number(t.slice(5, 7)) - 1] + ' ' + t.slice(0, 4);
      }
      /* HK terbaru per domain DI DALAM period_month terbaru domain tsb.
         HK lintas bulan tidak pernah dicampur. */
      function hkOf(domain, period) {
        if (!period) return null;
        let best = null;
        (S2.allActiveBatches || []).forEach(function (b) {
          if (String(b.domain || '').toUpperCase() !== domain) return;
          if (String(b.period_month || '').slice(0, 10) !== period) return;
          const h = Number(b.hk);
          if (isFinite(h) && (best === null || h > best)) best = h;
        });
        return best;
      }
      const pPer = S2.process.periodMonth || S2.latestPeriod.process;
      const rPer = S2.result.periodMonth || S2.latestPeriod.result;
      const pHk = S2.process.hkMax !== null && S2.process.hkMax !== undefined ? S2.process.hkMax : hkOf('PROCESS', pPer);
      const rHk = S2.result.hkMax !== null && S2.result.hkMax !== undefined ? S2.result.hkMax : hkOf('RESULT', rPer);
      const parts = [];
      parts.push('PROSES ' + (pPer ? ml(pPer) : '–') + (pHk === null || pHk === undefined ? '' : ' HK ' + pHk));
      parts.push('RESULT ' + (rPer ? ml(rPer) : '–') + (rHk === null || rHk === undefined ? '' : ' HK ' + rHk));
      return 'Data Pusat · ' + parts.join(' · ');
    }
    function tick() {
      /* V1.7.2 — jam header memakai Asia/Jakarta, bukan jam perangkat user. */
      clock.textContent = dataDateLabel() + ' · ' + U.wibNowTime();
    }
    Controller._tick = tick;
    tick(); setInterval(tick, 30000);

    if (ProviderHub.isLive()) {
      /* ==================================================================
         V1.7.1 — LIVE BOOTSTRAP.
         Urutan: loading state → validasi konfigurasi/sesi → fetch bootstrap →
         bangun hierarchy master_depot → isi cache provider → normalisasi scope
         → render PERTAMA. Tidak pernah render demo dahulu lalu berubah live.
         ================================================================== */
      Renderer.renderView();                       /* menampilkan loading state */
      /* Preference + index Project selesai sebelum data report pertama dirender. */
      projectMasterReady.then(function () { Controller.startLive(); });
      return;
    }

    /* ---- MODE PENGEMBANGAN (?dev_provider=demo) ---- */
    /* V1.6.6 — Master Cabang diselesaikan SEBELUM render pertama sehingga tidak ada
       flash hierarchy demo → master. Bila IndexedDB gagal/lambat, aplikasi tetap
       jalan memakai fallback organisasi existing. */
    let firstRenderDone = false;
    const firstRender = function () {
      if (firstRenderDone) return;
      firstRenderDone = true;
      AppState.scope = OrgResolver.normalizeScope(AppState.scope);
      Renderer.renderView();
    };
    const guard = setTimeout(function () { MonitoringScope.sanitizeAgainstOrg(); firstRender(); }, 2000);
    Promise.all([MasterCabangStore.load(), projectMasterReady])
      .then(function (items) { const m = items[0]; if (m) { OrgResolver.setMaster(m); return true; } return false; })
      .catch(function () { return false; })
      .then(function (applied) {
        clearTimeout(guard);
        MonitoringScope.sanitizeAgainstOrg();
        if (firstRenderDone) { if (applied) Controller.applyOrgChange(); return; }
        firstRender();
      });
  },

  /* ======================================================================
     V1.7.1 — SIKLUS HIDUP LIVE DATA
     ====================================================================== */
  _liveStarted: false,

  startLive: function () {
    const self = this;
    self._liveStarted = true;
    return LiveLoader.bootstrap()
      .then(function () {
        /* Status governance dibaca dari backend terpisah. Kegagalan endpoint
           tidak mematikan dashboard; payload bootstrap lama tetap AKTIF semua. */
        return MasterCabangAuthority.refresh().catch(function (e) {
          if (LiveDataStore.notes.indexOf('MASTER CONTROL · endpoint belum tersedia') < 0)
            LiveDataStore.notes.push('MASTER CONTROL · endpoint belum tersedia');
          return MasterCabangAuthority.rows;
        });
      })
      .then(function () {
        /* hierarchy Live berasal dari master_depot; master lokal tidak override */
        OrgResolver.invalidateLive();
        AppState.scope = OrgResolver.normalizeScope(AppState.scope);
        /* Master Cabang lokal tetap dimuat untuk keperluan tab admin, TETAPI
           TIDAK dipasang sebagai authority hierarchy pada LIVE MODE. */
        MasterCabangStore.load().then(function (m) {
          if (m) { OrgResolver._master = m; OrgResolver._index = null; }
        }).catch(function () {});
        /* Master LIVE sudah tersedia: buang kode Regional yang tidak ada lagi.
           Bila habis, needsReselect aktif dan user diminta memilih ulang —
           TIDAK diam-diam kembali ke Semua Regional. */
        MonitoringScope.sanitizeAgainstOrg();
        self.afterLiveChange();                    /* bootstrap siap -> render pertama */
        return self.ensureDomain(AppState.menu);
      })
      .catch(function (e) {
        if (e && e.code === 'STALE_RESPONSE') return;
        self.afterLiveChange();
        if (window.console) console.error('[LIVE bootstrap]', e && e.code, e && e.message);
      });
  },

  /* Memuat domain yang dibutuhkan menu aktif. Tidak refetch bila cache valid. */
  ensureDomain: function (menu) {
    if (!ProviderHub.isLive() || !LiveDataStore.ready()) return Promise.resolve();
    const self = this;
    let p = null;
    if (menu === 'proses') p = LiveLoader.loadProcess(null);
    else if (menu === 'hasil') p = LiveLoader.loadResult(null);
    else if (menu === 'ranking') {
      /* V1.7.4 — Ranking LIVE memakai KPI Proses Kerja DAN Hasil Kerja, jadi
         kedua domain harus tersedia sebelum engine Ranking dijalankan. Cache
         existing tetap dipakai; tidak ada refetch bila periode masih valid. */
      p = Promise.all([LiveLoader.loadProcess(null), LiveLoader.loadResult(null)]);
    }
    else p = Promise.resolve();                               /* Informasi cukup bootstrap */
    return p.then(function () { self.afterLiveChange(); })
            .catch(function (e) {
              if (e && e.code === 'STALE_RESPONSE') return;
              self.afterLiveChange();
              if (window.console) console.error('[LIVE ' + menu + ']', e && e.code, e && e.message);
            });
  },

  /* Dipanggil setelah cache Live berubah: hierarchy, scope, badge, dan jam
     header disegarkan bersama-sama supaya tidak ada state setengah jalan. */
  afterLiveChange: function (rerender) {
    OrgResolver.invalidateLive();
    /* V1.7.4 — HK berjalan dapat berubah setelah data baru masuk (mis. 18 -> 19).
       TAT ikut menyesuaikan otomatis tanpa user mengedit setting apa pun.
       Total HK manual TIDAK berubah oleh refresh data. */
    if (typeof RankingTat !== 'undefined') RankingTat.invalidate();
    if (typeof RankingService !== 'undefined' && RankingService.invalidate) RankingService.invalidate();
    AppState.scope = OrgResolver.normalizeScope(AppState.scope);
    if (Renderer && Renderer.syncBadge) Renderer.syncBadge();
    if (Controller._tick) { try { Controller._tick(); } catch (e) {} }
    /* Render ulang setelah cache Live berubah: loading -> ready / error.
       Tidak pernah menampilkan angka demo di antaranya. */
    if (rerender !== false) Renderer.renderView();
  },

  retryBootstrap: function () {
    LiveDataStore.reset();
    Renderer.renderView();                        /* loading state */
    this.startLive();
  },

  retryDomain: function (domain) {
    if (domain === 'process') { LiveDataStore.status.process = 'idle'; LiveDataStore.process.periodMonth = null; }
    if (domain === 'result') { LiveDataStore.status.result = 'idle'; LiveDataStore.result.periodMonth = null; }
    LiveDataStore.errors[domain] = null;
    LiveDataStore.bump();
    Renderer.renderView();
    this.ensureDomain(domain === 'process' ? 'proses' : 'hasil');
  }
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { Controller.init(); });
else Controller.init();

</script>
</body>
