        if (!bag) bag = byDepot[r.depot_code] = {
          current: { omset: 0, roa: 0, ec: 0 }, baseline: { omset: 0, roa: 0, ec: 0 }, salesmen: 0 };
        bag.current.omset += r.current.omset; bag.current.roa += r.current.roa; bag.current.ec += r.current.ec;
        bag.baseline.omset += r.baseline.omset; bag.baseline.roa += r.baseline.roa; bag.baseline.ec += r.baseline.ec;
        bag.salesmen++; salesmen++;
      }
      const depots = Object.keys(byDepot);
      const out = { available: depots.length > 0, byDepot: byDepot, depots: depots,
                    header: store.header || null, salesmen: salesmen };
      this._key = key; this._idx = out;
      return out;
    },
    /* Agregasi untuk satu scope. ASS/Salesman tidak didukung grain-nya. */
    aggregate: function (scope) {
      const sc = scope || {};
      const idx = this.index();
      if (!idx.available || sc.ass || sc.salesman)
        return { available: false, current: null, baseline: null, depots: 0, salesmen: 0,
                 grainSupported: !sc.ass && !sc.salesman, header: idx.header };
      const set = depotSetInScope(sc);
      const current = { omset: 0, roa: 0, ec: 0 }, baseline = { omset: 0, roa: 0, ec: 0 };
      let n = 0, sm = 0;
      for (let i = 0; i < idx.depots.length; i++) {
        const code = idx.depots[i];
        if (!set[code]) continue;
        const bag = idx.byDepot[code];
        current.omset += bag.current.omset; current.roa += bag.current.roa; current.ec += bag.current.ec;
        baseline.omset += bag.baseline.omset; baseline.roa += bag.baseline.roa; baseline.ec += bag.baseline.ec;
        n++; sm += bag.salesmen;
      }
      return { available: n > 0, current: n ? current : null, baseline: n ? baseline : null,
               depots: n, salesmen: sm, grainSupported: true, header: idx.header };
    },
    headerText: function (fallbackCurrent) {
      const h = this.index().header;
      if (!h) return null;
      const cur = h.current_period_month ? ResultBaseline.labelMonth(h.current_period_month) : fallbackCurrent;
      const curHk = h.current_hk === null ? '' : ' HK' + U.int(h.current_hk);
      const base = h.baseline_period_month ? ResultBaseline.labelMonth(h.baseline_period_month) : '–';
      const baseHk = h.baseline_hk === null ? '' : ' HK' + U.int(h.baseline_hk);
      return {
        title: cur + curHk + ' vs ' + base + baseHk + ' Baseline',
        baselineLabel: (h.baseline_period_month ? ResultBaseline.labelMonth(h.baseline_period_month, true) : 'Baseline') + ' Baseline',
        basis: h.comparison_basis || '',
        distribution: '', coverage: ''
      };
    }
  };

  function getResultDetail(scope) {
    const ctx = resultContext(), curRows = resultRows(scope || {}, ctx, 'current'), prevRows = resultRows(scope || {}, ctx, 'previous');
    /* ======================================================================
       V1.7.8 — DETAIL MTD SCOPE-SAFE TERHADAP COVERAGE PROJECT.

       Current  : resultRows() -> mtdRecordsFor() -> DP.getResultMtdRecords(),
                  yang SUDAH melewati SalesmanProjectScope. Jadi Current memang
                  benar-benar hanya salesman Project aktif.
       Baseline : result_baseline_depot bergrain DEPO (Current+Baseline pair
                  authoritative per Depo dari Website ASS) dan periode
                  pembanding RESULT tidak dimuat pada kontrak LIVE existing
                  (mtdRecordsFor 'previous' = []). Tidak ada baseline
                  salesman-level authoritative. Membagi baseline Depo secara
                  proporsional DILARANG. Karena itu, saat Coverage Project
                  aktif, Baseline dan Growth ditampilkan "—" (unavailable),
                  BUKAN angka Total Depo dan BUKAN 0 palsu.
       Coverage = Semua Salesman: behaviour existing dipertahankan 100%.
       ====================================================================== */
    if (isLiveMode() && typeof SalesmanProjectScope !== 'undefined' && !SalesmanProjectScope.isAll()) {
      const projectLabel = SalesmanProjectScope.label();
      /* ====================================================================
         V1.7.9 — bila FUTURE CONTRACT result_baseline_salesman V1 tersedia,
         Baseline + Growth Project AKTIF OTOMATIS (tanpa feature flag).
         Pasangan Current/Baseline diambil apa adanya dari Website ASS agar
         comparison tetap apple-to-apple sesuai comparison_basis.
         ==================================================================== */
      /* ====================================================================
         V1.7.9.1 — PARTIAL ROLLOUT GUARD BASELINE.
         Baseline Project hanya dipakai bila SELURUH expected Depo Project pada
         scope aktif sudah mempunyai contract Baseline Salesman V1 yang valid,
         DAN seluruh member Project pada Depo tersebut ada di dalamnya. Bila
         belum: Current tetap tampil (authority result_mtd salesman-level),
         Baseline & Growth "—", TANPA menjumlahkan subset dan TANPA memakai
         result_baseline_depot Total Depo.
         ==================================================================== */
      let bcov = null;
      try { bcov = ResultCapabilities.completeness(scope || {}); } catch (e) { bcov = null; }
      const baselineComplete = !!(bcov && bcov.baseline && bcov.baseline.completeForScope);
      if (ResultBaselineSalesman.active() && baselineComplete) {
        curRows.forEach(function (r) {
          const a = ResultBaselineSalesman.aggregate(r.scope);
          if (a.available) {
            r.metrics = Object.assign({}, r.metrics, a.current, { hasData: true });
            r.previous = Object.assign({ hasData: true }, a.baseline);
            r.baselineMeta = a;
          } else {
            r.previous = aggregateResult([]); r.baselineMeta = a;
          }
          r.growth = { omset: resultGrowth(r.metrics.omset, r.previous.omset),
                       roa: resultGrowth(r.metrics.roa, r.previous.roa),
                       ec: resultGrowth(r.metrics.ec, r.previous.ec) };
        });
        curRows.sort(function (a, b) {
          const av = a.growth.omset, bv = b.growth.omset;
          if (av === null || bv === null) return av === null ? 1 : -1;
          return av - bv;
        });
        const agg = ResultBaselineSalesman.aggregate(scope || {});
        const head = ResultBaselineSalesman.headerText(ctx.currentLabel) || {
          title: ctx.currentLabel + ' · Baseline Project', baselineLabel: 'Baseline', basis: '',
          distribution: '', coverage: '' };
        return {
          context: ctx, level: levelOf(scope || {}), childLevel: CHILD_OF[levelOf(scope || {})],
          childLabel: LEVEL_LABEL[CHILD_OF[levelOf(scope || {})]], rows: curRows,
          baseline: agg, projectScoped: true, projectLabel: projectLabel,
          projectBaselineAvailable: true,
          header: { title: head.title + ' · Coverage ' + projectLabel,
                    baselineLabel: head.baselineLabel, distribution: '',
                    coverage: (agg.available ? U.int(agg.depots) + ' Depo · ' + U.int(agg.salesmen) + ' Salesman Project' : ''),
                    basis: head.basis }
        };
      }
      curRows.forEach(function (r) {
        r.previous = aggregateResult([]);          /* seluruh field null, bukan 0 */
        r.baselineMeta = { available: false, grainSupported: false, projectScoped: true };
        r.growth = { omset: null, roa: null, ec: null };
      });
      curRows.sort(function (a, b) {
        if (a.hasData !== b.hasData) return a.hasData ? -1 : 1;
        const av = a.metrics.omset, bv = b.metrics.omset;
        if (av === null || bv === null) return av === null ? 1 : -1;
        return bv - av;
      });
      const curHk = ctx.hk === null || ctx.hk === undefined ? '–' : ctx.hk;
      /* Bedakan "belum tersedia sama sekali" dari "tersedia tetapi belum lengkap". */
      const partial = !!(bcov && bcov.baseline && bcov.baseline.availableDepots > 0 && !baselineComplete);
      const covText = partial
        ? U.int(bcov.baseline.availableDepots) + '/' + U.int(bcov.baseline.expectedDepots) + ' Depo'
        : '';
      return {
        context: ctx, level: levelOf(scope || {}), childLevel: CHILD_OF[levelOf(scope || {})],
        childLabel: LEVEL_LABEL[CHILD_OF[levelOf(scope || {})]], rows: curRows,
        baseline: { available: false, projectScoped: true },
        projectScoped: true, projectLabel: projectLabel,
        projectBaselinePartial: partial,
        projectBaselineCoverage: bcov ? bcov.baseline : null,
        header: { title: ctx.currentLabel + ' HK' + curHk + ' · Coverage ' + projectLabel +
                    ' · ' + (partial ? 'Baseline Project belum lengkap' : 'Baseline Project belum tersedia'),
                  baselineLabel: 'Baseline', distribution: '', coverage: covText }
      };
    }
    if (isLiveMode()) {
      curRows.forEach(function (r) {
        const a = ResultBaseline.aggregate(r.scope);
        if (a.available) {
          r.metrics = Object.assign({}, r.metrics, a.current, { hasData: true });
          r.previous = Object.assign({ hasData: true }, a.baseline);
          r.baselineMeta = a;
        } else {
          r.previous = aggregateResult([]); r.baselineMeta = a;
        }
        r.growth = { omset: resultGrowth(r.metrics.omset, r.previous.omset),
                     roa: resultGrowth(r.metrics.roa, r.previous.roa),
                     ec: resultGrowth(r.metrics.ec, r.previous.ec) };
      });
      curRows.sort(function (a, b) {
        const av = a.growth.omset, bv = b.growth.omset;
        if (av === null || bv === null) return av === null ? 1 : -1;
        return av - bv;
      });
      const aggregateMeta = ResultBaseline.aggregate(scope || {});
      return { context: ctx, level: levelOf(scope || {}), childLevel: CHILD_OF[levelOf(scope || {})],
               childLabel: LEVEL_LABEL[CHILD_OF[levelOf(scope || {})]], rows: curRows,
               baseline: aggregateMeta, header: ResultBaseline.header(aggregateMeta, ctx.currentLabel) };
    }
    const prevBy = {}; prevRows.forEach(function (r) { prevBy[r.key] = r.metrics; });
    curRows.forEach(function (r) {
      const p = prevBy[r.key] || aggregateResult([]); r.previous = p;
      r.growth = { omset: resultGrowth(r.metrics.omset, p.omset), roa: resultGrowth(r.metrics.roa, p.roa), ec: resultGrowth(r.metrics.ec, p.ec) };
    });
    curRows.sort(function (a, b) {
      if (a.hasData !== b.hasData) return a.hasData ? -1 : 1;
      const av = a.growth.omset, bv = b.growth.omset;
      if (av === null || bv === null) return av === null ? 1 : -1;
      return av - bv;
    });
    return { context: ctx, level: levelOf(scope || {}), childLevel: CHILD_OF[levelOf(scope || {})],
             childLabel: LEVEL_LABEL[CHILD_OF[levelOf(scope || {})]], rows: curRows,
             baseline: null, header: null };
  }
  function getResultEceran(scope) {
    const ctx = resultContext();
    const cur = aggregateResult(mtdRecordsFor(scope || {}, ctx, 'current'));
    const prev = aggregateResult(mtdRecordsFor(scope || {}, ctx, 'previous'));
    const prevBy = {}; prev.products.forEach(function (p) { prevBy[p.key] = p; });
    const rows = cur.products.map(function (p) {
      const q = prevBy[p.key] || { roa: null, epb_point: null };
      return { key: p.key, label: p.label, roa: p.roa, roa_prev: q.roa,
               roa_growth: resultGrowth(p.roa, q.roa), roa_gap: q.roa === null ? null : p.roa - q.roa,
               epb_point: p.epb_point, epb_prev: q.epb_point,
               epb_growth: resultGrowth(p.epb_point, q.epb_point),
               epb_gap: q.epb_point === null ? null : p.epb_point - q.epb_point };
    });
    return { context: ctx, rows: rows };
  }
  function getResultContribution(scope) {
    const ctx = resultContext(), rows = resultRows(scope || {}, ctx, 'current');
    const total = U.sum(rows, function (r) { return r.metrics.omset || 0; });
    rows.forEach(function (r) { r.share = total ? (r.metrics.omset || 0) / total * 100 : null; });
    rows.sort(function (a, b) { return (b.share || 0) - (a.share || 0); });
    return { context: ctx, level: levelOf(scope || {}), childLevel: CHILD_OF[levelOf(scope || {})], rows: rows, total: total };
  }
  function getResultSalesmanDetail(code) {
    const sm = DP.lookup('salesman', code); if (!sm) return null;
    const ctx = resultContext(), scope = { salesman: code };
    const cur = aggregateResult(mtdRecordsFor(scope, ctx, 'current'));
    const prev = aggregateResult(mtdRecordsFor(scope, ctx, 'previous'));
    return { context: ctx, identity: sm, current: cur, previous: prev,
             growth: { omset: resultGrowth(cur.omset, prev.omset), roa: resultGrowth(cur.roa, prev.roa), ec: resultGrowth(cur.ec, prev.ec) } };
  }

  /* =========================== PUBLIC API =========================== */
  return {
    periods: function () { return PERIODS.slice(); },
    resolvePeriod: resolvePeriod,
    levelOf: levelOf,
    levelLabel: function (l) { return LEVEL_LABEL[l]; },
    childLevelOf: function (scope) { return CHILD_OF[levelOf(scope)]; },
    providerMode: function () { return DP.mode; },
    dataStats: function () { return DP.stats(); },
    org: function () { return DP.org(); },
    /* V1.6.6 — lookup Regional/Cabang/Depo dilayani resolved organization graph
       (termasuk INTERNAL BRANCH KEY dari Master Cabang). ASS/Salesman tetap dataset. */
    lookup: function (k, c) {
      if (typeof OrgResolver !== 'undefined' && OrgResolver.graph) {
        const g = OrgResolver.graph();
        if (k === 'regional' && g.regionalByCode[c]) return g.regionalByCode[c];
        if (k === 'branch'   && g.branchByKey[c])    return g.branchByKey[c];
        if (k === 'depot'    && g.depotByCode[c])    return g.depotByCode[c];
      }
      return DP.lookup(k, c);
    },

    /* --- ringkasan KPI + pembanding periode sebelumnya --- */
    getProcessSummary: function (scope, period) {
      const p = resolvePeriod(period);
      /* V1.7.7 — KPI managerial PROSES memakai FINAL KPI Website ASS bila
         tersedia untuk scope aktif (Nasional/Regional/Cabang/Depo). Field non-KPI
         (jumlah record, hari, omset, anomali, route breakdown) tetap dari
         process_daily existing. Bila summary tidak tersedia sama sekali,
         perilaku legacy V1.7.6.1 dipakai apa adanya (backward compatible). */
      const curRaw = aggregate(DP.getRecords(p.range, scope));
      const useSummary = ProcessSummary.appliesTo(scope, p.key);
      const cur  = useSummary ? ProcessSummary.merge(curRaw, scope, p.key) : curRaw;
      const prev = aggregate(DP.getRecords(p.prevRange, scope));
      /* V1.7.7.4 — bila current memakai authority Website ASS period-aware,
         process_daily pada prevRange tetap bukan pembanding yang setara. Delta KPI
         dikosongkan sampai tersedia authority pembanding periode sebelumnya. */
      const safeDelta = function (key) {
        return useSummary ? null : delta(cur[key], prev[key]);
      };
      return {
        period: p, current: cur, previous: prev,
        kpiSource: cur.__summary ? 'WEBSITE_ASS_FINAL_KPI' : 'PROCESS_DAILY',
        kpiSourceNote: cur.__summary ? ProcessSummary.sourceNote(scope, p.key) : null,
        salesmanCount: DP.countSalesmen(scope),
        delta: {
          sc_jks_pct: safeDelta('sc_jks_pct'),
          geo_match_pct: safeDelta('geo_match_pct'),
          hit_rate_pct: safeDelta('hit_rate_pct'),
          avg_visit: safeDelta('avg_visit'),
          process_score: safeDelta('process_score'),
          avg_check_in: safeDelta('avg_check_in'),
          avg_check_out: safeDelta('avg_check_out'),
          avg_transport_minutes: safeDelta('avg_transport_minutes')
        }
      };
    },

    /* --- on route vs off route --- */
    getRouteAnalysis: function (scope, period) {
      const p = resolvePeriod(period);
      const m = aggregate(DP.getRecords(p.range, scope));
      const on = m.on_route || { visits: 0 }, off = m.off_route || { visits: 0 };
      const tot = (on.visits || 0) + (off.visits || 0);
      return {
        total: tot,
        on:  Object.assign({}, on,  { share: tot ? on.visits  / tot * 100 : 0 }),
        off: Object.assign({}, off, { share: tot ? off.visits / tot * 100 : 0 }),
        geoGap: (on.geo_match_pct !== null && off.geo_match_pct !== null) ? on.geo_match_pct - off.geo_match_pct : null,
        hitGap: (on.hit_rate_pct !== null && off.hit_rate_pct !== null) ? on.hit_rate_pct - off.hit_rate_pct : null
      };
    },

    /* --- tabel performa wilayah (drill-down) --- */
    getHierarchyData: function (scope, period) {
      const p = resolvePeriod(period);
      const kids = childrenOf(scope);
      /* V1.7.7 — baris Regional/Cabang/Depo memakai FINAL KPI Website ASS.
         Baris ASS/Salesman TETAP memakai process_daily karena grain summary
         hanya DEPOT_MONTH dan tidak boleh dipecah ke bawah Depo. */
      const MANAGERIAL = { regional: 1, branch: 1, depot: 1 };
      const rows = kids.map(function (c) {
        const recs = DP.getRecords(p.range, c.scope);
        const raw = aggregate(recs);
        const m = (MANAGERIAL[c.kind] && ProcessSummary.appliesTo(c.scope, p.key))
          ? ProcessSummary.merge(raw, c.scope, p.key) : raw;
        return { key: c.key, code: c.code, name: c.name, label: c.label, kind: c.kind,
                 scope: c.scope, metrics: m,
                 salesmanCount: c.kind === 'salesman' ? 1 : DP.countSalesmen(c.scope) };
      });
      rows.sort(function (a, b) { return (b.metrics.n ? 0 : 1) - (a.metrics.n ? 0 : 1) ||
                                         a.metrics.process_score - b.metrics.process_score; });
      const totalRaw = aggregate(DP.getRecords(p.range, scope));
      const total = ProcessSummary.appliesTo(scope, p.key) ? ProcessSummary.merge(totalRaw, scope, p.key) : totalRaw;
      return { level: levelOf(scope), childLevel: CHILD_OF[levelOf(scope)],
               childLabel: LEVEL_LABEL[CHILD_OF[levelOf(scope)]],
               rows: rows, total: total,
               kpiSource: total.__summary ? 'WEBSITE_ASS_FINAL_KPI' : 'PROCESS_DAILY' };
    },

    /* --- anomali (ikut scope & periode) --- */
    getAnomalySummary: function (scope, period) {
      const p = resolvePeriod(period);
      return Object.assign(summarizeAnomaly(DP.getEvents(p.range, scope)),
                           { rangeLabel: p.label, days: p.dates.length });
    },

    /* --- V1.7.3 REKAP ANOMALI BULANAN PER WILAYAH ---
       DEMO: perilaku legacy V1.2 tetap dipertahankan.
       LIVE: kolom mengikuti Website ASS monthly visit recap. Denominator ON/OFF
       tetap dipisah. Granular flag tanpa attribution route TIDAK ditebak. */
    getMonthlyAnomalyMatrix: function (scope) {
      syncCal();
      const today = ALL[LAST] || '', mon = today.slice(0, 7);
      const dates = ALL.filter(function (d) { return d.slice(0, 7) === mon; });
      const range = rangeOf(dates);
      const lvl = levelOf(scope), childLevel = CHILD_OF[lvl];
      const kids = childrenOf(scope);
      const liveAligned = isLiveMode();
      const matrixTypes = liveAligned ? LIVE_MONTHLY_ANOMALY_TYPES : ANOMALY_TYPES;

      function N(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
      }
      function routeOf(v) {
        const x = String(v === null || v === undefined ? '' : v).trim().toUpperCase().replace(/-/g, '_').replace(/\s+/g, '_');
        if (x === 'ON' || x === 'ON_ROUTE') return 'ON';
        if (x === 'OFF' || x === 'OFF_ROUTE') return 'OFF';
        return null;
      }
      function emptySlot() { return { on: 0, off: 0, unknown: 0, onPct: null, offPct: null }; }
      function addSlot(row, key, on, off, unknown) {
        const slot = row && row.types ? row.types[key] : null;
        if (!slot) return;
        on = Math.max(0, N(on)); off = Math.max(0, N(off)); unknown = Math.max(0, N(unknown));
        slot.on += on; slot.off += off; slot.unknown += unknown;
        row.totalOn += on; row.totalOff += off; row.totalUnknown += unknown;
        row.totalCases += on + off + unknown;
      }
      function explicitFlagBreakdown(flag, event, flagCount, flagCountInEvent) {
        flag = flag || {};
        const hasOn = flag.onCount !== undefined || flag.on_count !== undefined;
        const hasOff = flag.offCount !== undefined || flag.off_count !== undefined;
        const hasUnk = flag.unknownCount !== undefined || flag.unknown_count !== undefined;
        if (hasOn || hasOff || hasUnk) {
          const on = N(flag.onCount !== undefined ? flag.onCount : flag.on_count);
          const off = N(flag.offCount !== undefined ? flag.offCount : flag.off_count);
          const unknown = N(flag.unknownCount !== undefined ? flag.unknownCount : flag.unknown_count);
          const known = on + off + unknown;
          return { on: on, off: off, unknown: Math.max(0, flagCount - known) + unknown };
        }
        const rt = routeOf(flag.route_status || flag.routeStatus || flag.route_type || flag.routeType);
        if (rt === 'ON') return { on: flagCount, off: 0, unknown: 0 };
        if (rt === 'OFF') return { on: 0, off: flagCount, unknown: 0 };

        /* Top-level event route hanya aman diwariskan bila payload memiliki satu flag. */
        if (flagCountInEvent === 1) {
          const er = routeOf(event && event.route_status);
          if (er === 'ON') return { on: flagCount, off: 0, unknown: 0 };
          if (er === 'OFF') return { on: 0, off: flagCount, unknown: 0 };
        }
        return null;
      }

      const idx = {}, rows = kids.map(function (c, i) {
        idx[c.key] = i;
        const types = {};
        matrixTypes.forEach(function (T) { types[T.key] = emptySlot(); });
        return { key: c.key, code: c.code, name: c.name, label: c.label, kind: c.kind, scope: c.scope,
                 visit: 0, visitOn: 0, visitOff: 0, types: types,
                 totalOn: 0, totalOff: 0, totalUnknown: 0, totalCases: 0,
                 rate: null, hasData: false, geoCountersAvailable: false };
      });

      /* denominator kunjungan + GEO SALAH authoritative dari process_daily LIVE */
      const recs = DP.getRecords(range, scope);
      for (let i = 0; i < recs.length; i++) {
        const r = recs[i], k = idx[childKeyOf(r, childLevel)];
        if (k === undefined) continue;
        const row = rows[k];
        const onV = N(r.on_route_visits), offV = N(r.off_route_visits);
        row.visitOn += onV; row.visitOff += offV;
        row.visit += liveAligned ? (r.sales_call === null || r.sales_call === undefined ? onV + offV : N(r.sales_call)) : N(r.total_visit);
        row.hasData = true;

        if (liveAligned && r.__live) {
          const hasGeo = r.geo_on_route_eligible !== undefined || r.geo_off_route_eligible !== undefined;
          if (hasGeo) {
            row.geoCountersAvailable = true;
            const onBad = Math.max(0, N(r.geo_on_route_eligible) - N(r.geo_on_route_match));
            const offBad = Math.max(0, N(r.geo_off_route_eligible) - N(r.geo_off_route_match));
            addSlot(row, 'GEO_SALAH', onBad, offBad, 0);
          }
        }
      }

      const evs = DP.getEvents(range, scope);
      for (let i = 0; i < evs.length; i++) {
        const e = evs[i], k = idx[childKeyOf(e, childLevel)];
        if (k === undefined) continue;
        const row = rows[k];

        if (!liveAligned) {
          const slot = row.types[e.type];
          if (!slot) continue;
          if (e.route_status === 'OFF') addSlot(row, e.type, 0, e.cases, 0);
          else                          addSlot(row, e.type, e.cases, 0, 0);
          continue;
        }

        const payload = e && e.payload && typeof e.payload === 'object' ? e.payload : null;
        const flags = payload && Array.isArray(payload.flags) ? payload.flags : [];
        for (let f = 0; f < flags.length; f++) {
          const flag = flags[f] || {};
          const key = liveMonthlyFlagKey(flag.name);
          if (!key || !row.types[key]) continue;

          /* GEO_SALAH sudah authoritative dari daily counter. Skip flags geo agar tidak double count. */
          if (key === 'GEO_SALAH' && row.geoCountersAvailable) continue;

          const count = Math.max(0, N(flag.count));
          if (!count) continue;
          const explicit = explicitFlagBreakdown(flag, e, count, flags.length);
          if (explicit) {
            addSlot(row, key, explicit.on, explicit.off, explicit.unknown);
            continue;
          }

          /* ORDER REMOTE production saat ini membawa contextBasedCount (Off Route Geo Not Match + EC)
             dan noteBasedCount. Hanya context-based yang boleh dipastikan OFF; sisanya tetap unknown. */

      contradiction: m.contradiction || null,
      /* Kelengkapan revisi: dijamin hanya oleh contract COMPLETE. */
      revisionHistoryComplete: m.mode === 'COMPLETE'
    };
  }

  let _cache = null, _cacheKey = '';
  function cacheKeyOf(scope) {
    let rev = 0;
    try { rev = (typeof LiveDataStore !== 'undefined') ? LiveDataStore.rev : 0; } catch (e) { rev = 0; }
    const sc = scope || {};
    let ms = '';
    try { ms = (typeof MonitoringScope !== 'undefined') ? String(MonitoringScope.rev) : ''; } catch (e) { ms = ''; }
    let orgRev = 0;
    try { orgRev = (typeof OrgResolver !== 'undefined' ? OrgResolver.rev : 0) | 0; } catch (e) { orgRev = 0; }
    /* V1.7.9.2 — periode aktif masuk cache key supaya state periode lama tidak
       pernah dipakai ulang setelah period berganti. */
    return [rev, orgRev, sc.regional || '', sc.branch || '', sc.depot || '', ms,
            activePeriodMonth() || ''].join('|');
  }

  /* ---- matrix Depo x tanggal publish ---- */
  function build(scope) {
    const key = cacheKeyOf(scope);
    if (_cache && _cacheKey === key) return _cache;

    const snap = InformationService.getSnapshot(scope || {});
    const depotRows = snap.rows.slice().sort(function (a, b) {
      return String(a.regional_code_display || '').localeCompare(String(b.regional_code_display || ''), 'id') ||
        String(a.branch_name_display || '').localeCompare(String(b.branch_name_display || ''), 'id') ||
        String(a.depot_name_display || '').localeCompare(String(b.depot_name_display || ''), 'id') ||
        String(a.depot_code || '').localeCompare(String(b.depot_code || ''), 'id');
    });
    const allow = {};
    depotRows.forEach(function (r) { allow[r.depot_code] = 1; });

    /* V1.7.9.3 — event matrix berasal dari SATU resolver sesuai effective mode:
       COMPLETE -> contract saja; PARTIAL -> contract + observable; NONE -> []. */
    const modeInfo = evaluateCapability();
    const events = eventsForMatrix();
    const scoped = events.filter(function (e) { return allow[e.depot_code]; });

    /* V1.7.9.1 — COMPLETE dengan nol event adalah kondisi SAH: matrix tetap
       dirender penuh dan hari kerja eligible menjadi merah. */
    if ((!events.length && modeInfo.mode !== 'COMPLETE') || modeInfo.mode === 'NONE') {
      _cacheKey = key;
      _cache = { available: false, reason: 'NO_HISTORY', rows: [], dates: [], month: null,
                 depotCount: depotRows.length, eventCount: 0,
                 mode: 'NONE', complete: false,
                 capability: capabilityOf([], modeInfo) };
      return _cache;
    }

    /* PERIOD SAFETY — bulan matrix:
         COMPLETE : period_month yang dinyatakan contract publish_history V1.
         PARTIAL  : bulan dari tanggal publish TERBARU pada scope.
       Bulan lain TIDAK PERNAH dicampur ke dalam matrix. Tidak ada bulan hardcode. */
    let maxDate = null;
    (scoped.length ? scoped : events).forEach(function (e) {
      if (maxDate === null || e.date > maxDate) maxDate = e.date;
    });
    let monthKey = null;
    if (modeInfo.mode === 'COMPLETE' && modeInfo.periodMonth) monthKey = modeInfo.periodMonth.slice(0, 7);
    else if (maxDate) monthKey = maxDate.slice(0, 7);
    else {
      const act = activePeriodMonth();
      monthKey = act || (todayWib() ? iso(todayWib().y, todayWib().m, 1).slice(0, 7) : null);
    }
    if (!monthKey) {
      _cacheKey = key;
      _cache = { available: false, reason: 'NO_PERIOD', rows: [], dates: [], month: null,
                 depotCount: depotRows.length, eventCount: 0, mode: modeInfo.mode, complete: false,
                 capability: capabilityOf([], modeInfo) };
      return _cache;
    }
    const year = Number(monthKey.slice(0, 4)), mon = Number(monthKey.slice(5, 7));
    const dim = daysInMonth(year, mon);
    const tw = todayWib();
    let endDay;
    if (tw && tw.y === year && tw.m === mon) endDay = tw.d;          /* bulan berjalan -> s.d. hari ini */
    else endDay = dim;                                              /* bulan lampau  -> satu bulan penuh */
    const maxDay = (maxDate && maxDate.slice(0, 7) === monthKey) ? Number(maxDate.slice(8, 10)) : 0;
    if (maxDay > endDay) endDay = maxDay;
    if (endDay > dim) endDay = dim;
    if (endDay < 1) endDay = 1;

    const dates = [];
    for (let d = 1; d <= endDay; d++) {
      const dIso = iso(year, mon, d), dw = dowOf(dIso);
      dates.push({ iso: dIso, day: d, dow: dw, sunday: dw === 0,
                   future: !!(tw && dIso > tw.iso), label: U.pad(d),
                   dowLabel: U.DAYS[dw].slice(0, 3) });
    }

    /* index depot|date -> bag; hanya tanggal yang benar-benar ada publish. */
    const idx = {};
    for (let i = 0; i < scoped.length; i++) {
      const e = scoped[i];
      if (e.date.slice(0, 7) !== monthKey) continue;
      const k = e.depot_code + '|' + e.date;
      let bag = idx[k];
      if (!bag) bag = idx[k] = { PROCESS: [], RESULT: [] };
      bag[e.domain].push(e);
    }
    function latestOf(list) {
      /* AUTHORITY "terakhir" = TIMESTAMP publish terbesar per domain.
         Bukan HK terbesar, bukan revision_number terbesar. revision_number
         hanya tie-break deterministik saat timestamp benar-benar identik. */
      let best = null;
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (best === null || e.ms > best.ms ||
            (e.ms === best.ms && (Number(e.revision) || 0) > (Number(best.revision) || 0))) best = e;
      }
      return best;
    }
    function distinctActions(list) {
      const set = {};
      for (let i = 0; i < list.length; i++) set[actionKeyOf(list[i])] = 1;
      return set;
    }
    /* Ringkasan per cell dihitung SEKALI di sini (hanya untuk bag yang ada),
       sehingga renderer cukup lookup O(1) tanpa filter ulang per Depo x Tanggal. */
    const summary = {};
    for (const k in idx) {
      if (!Object.prototype.hasOwnProperty.call(idx, k)) continue;
      const bag = idx[k];
      const pList = bag.PROCESS, hList = bag.RESULT;
      const pAct = distinctActions(pList), hAct = distinctActions(hList);
      const pActions = Object.keys(pAct).length, hActions = Object.keys(hAct).length;
      /* union aksi publish pada hari itu: satu klik Publish yang membawa
         PROCESS + RESULT dihitung SATU aksi, bukan dua. */
      const allAct = {};
      for (const a in pAct) if (Object.prototype.hasOwnProperty.call(pAct, a)) allAct[a] = 1;
      for (const a in hAct) if (Object.prototype.hasOwnProperty.call(hAct, a)) allAct[a] = 1;
      /* V1.7.9 — BADGE = DISTINCT PUBLISH ACTION (union antar domain) pada
         Depo x Tanggal tersebut. PROCESS + RESULT dari satu aksi publish =>
         union = 1 => TANPA badge. Dua publish_event_id berbeda (walau satu
         hanya PROCESS dan satunya hanya RESULT) => union = 2 => badge 2x.
         Math.max per domain TIDAK dipakai lagi sebagai authority badge. */
      const repeat = Object.keys(allAct).length;
      /* daftar waktu per AKSI publish (bukan per batch mentah) */
      const grouped = {}, order = [];
      pList.concat(hList).forEach(function (e) {
        const a = actionKeyOf(e);
        let g = grouped[a];
        if (!g) { g = grouped[a] = { ms: e.ms, time: e.time, p: null, h: null }; order.push(a); }
        if (e.ms < g.ms) { g.ms = e.ms; g.time = e.time; }
        const slot = e.domain === 'PROCESS' ? 'p' : 'h';
        if (!g[slot] || e.ms > g[slot].ms) g[slot] = e;
      });
      const times = order.map(function (a) { return grouped[a]; })
        .sort(function (a, b) { return a.ms - b.ms; })
        .map(function (g) {
          const parts = [];
          if (g.p) parts.push('Proses' + (g.p.hk === null ? '' : ' HK' + g.p.hk));
          if (g.h) parts.push('Hasil' + (g.h.hk === null ? '' : ' HK' + g.h.hk));
          return g.time + (parts.length ? ' · ' + parts.join(' · ') : '');
        });
      const pLast = latestOf(pList), hLast = latestOf(hList);
      summary[k] = {
        processHk: pLast ? pLast.hk : null, resultHk: hLast ? hLast.hk : null,
        processCount: pActions, resultCount: hActions,
        processBatches: pList.length, resultBatches: hList.length,
        publishCount: Object.keys(allAct).length,
        repeat: repeat > 1 ? repeat : 0,
        times: times
      };
    }

    const EMPTY_CELL = { processHk: null, resultHk: null, processCount: 0, resultCount: 0,
                         processBatches: 0, resultBatches: 0, publishCount: 0, repeat: 0, times: [] };

    /* ====================================================================
       STATE CELL — satu-satunya tempat keputusan visual dibuat.
         publish    : ada publish observable pada tanggal itu.
         holiday    : Minggu (non-working day) tanpa publish.
         future     : tanggal belum terjadi -> netral, TIDAK PERNAH merah.
         missing    : hari kerja tanpa publish DAN history COMPLETE ->
                      benar-benar tidak publish (merah).
         unverified : hari kerja tanpa publish tetapi history PARTIAL ->
                      belum dapat diverifikasi (netral, BUKAN merah).
                      Absennya event pada sumber PARTIAL bukan bukti Depo
                      tidak publish, sehingga tuduhan merah dilarang.
       ==================================================================== */
    const complete = modeInfo.mode === 'COMPLETE';
    const rows = depotRows.map(function (r) {
      const cells = dates.map(function (dt) {
        const s = summary[r.depot_code + '|' + dt.iso] || EMPTY_CELL;
        const has = s.publishCount > 0;
        const state = has ? 'publish'
                    : dt.sunday ? 'holiday'
                    : dt.future ? 'future'
                    : complete ? 'missing' : 'unverified';
        return {
          date: dt.iso, day: dt.day, sunday: dt.sunday, future: dt.future,
          hasPublish: has, state: state,
          processHk: s.processHk, resultHk: s.resultHk,
          processCount: s.processCount, resultCount: s.resultCount,
          processBatches: s.processBatches, resultBatches: s.resultBatches,
          publishCount: s.publishCount, repeat: s.repeat,
          times: s.times
        };
      });
      return {
        depot_code: r.depot_code,
        depot: r.depot_name_display || r.depot_code || '–',
        branch: r.branch_name_display || '',
        regional: [r.regional_code_display, r.regional_name_display].filter(Boolean).join(' '),
        cells: cells,
        publishedDays: cells.filter(function (c) { return c.hasPublish; }).length
      };
    });

    const cap = capabilityOf(scoped.filter(function (e) { return e.date.slice(0, 7) === monthKey; }), modeInfo);
    _cacheKey = key;
    _cache = { available: true, reason: '', rows: rows, dates: dates, month: monthKey,
               monthLabel: U.MONTHS[mon - 1] + ' ' + year,
               mode: modeInfo.mode, complete: complete, source: modeInfo.source,
               depotCount: rows.length, eventCount: cap.observableEventCount,
               batchCount: cap.observableBatchCount,
               capability: cap,
               workdayCount: dates.filter(function (d) { return !d.sunday && !d.future; }).length };
    return _cache;
  }

  return { build: build,
           /* NONE / PARTIAL / COMPLETE — dibaca ResultCapabilities. */
           mode: mode,
           /* diagnostic terbuka untuk audit; tidak dipakai untuk klaim UI besar */
           capability: function (scope) { const d = build(scope || {}); return d.capability; },
           /* diagnostic terbuka untuk audit precedence */
           sources: function () {
             return { contract: collectContractEvents().length,
                      observable: collectObservableEvents().length,
                      matrix: eventsForMatrix().length,
                      mode: evaluateCapability().mode };
           },
           invalidate: function () {
             _cache = null; _cacheKey = '';
             _contractCache = null; _contractKey = '';
             _obsCache = null; _obsKey = '';
             _capCache = null; _capKey = '';
           } };
})();

/* ============================================================================
   LAYER 8 — TREND CHART (SVG murni, tanpa library eksternal)
   Instance dikelola eksplisit: destroy() dipanggil sebelum setiap mount ulang
   sehingga tidak pernah ada chart/listener ganda.
   ========================================================================= */
const TrendChart = {
  _items: [],

  destroy: function () {
    this._items.forEach(function (item) {
      item.host.removeEventListener('pointermove', item.move);
      item.host.removeEventListener('pointerleave', item.leave);
    });
    this._items = [];
  },

  SPECS: {
    sc_jks_pct:    { target: 100, def: [85, 100] },
    geo_match_pct: { target: 100, def: [85, 100] },
    hit_rate_pct:  { target: 90,  def: [50, 95] }
  },

  mount: function (host, trend) {
    this.destroy();
    if (!host) return;
    if (!trend.points.length) {
      host.innerHTML = UI.empty('Tidak Ada Data Trend', 'Tidak ada hari kerja dengan data pada periode ini.');
      return;
    }

    const pts = trend.points;
    host.innerHTML = '<div class="mini-trend-grid">' + trend.series.map(function (s) {
      const spec = TrendChart.SPECS[s.key];
      const last = pts[pts.length - 1], prev = pts.length > 1 ? pts[pts.length - 2] : null;
      const val = last[s.key], pv = prev ? prev[s.key] : null;
      const delta = (val === null || val === undefined || pv === null || pv === undefined) ? null : val - pv;
      const dcls = delta === null ? 'flat' : (delta > .05 ? 'up' : (delta < -.05 ? 'down' : 'flat'));
      const offRoute = s.key === 'geo_match_pct' ? last.geo_off_route_pct : null;
      return '<article class="mini-trend" data-series="' + U.esc(s.key) + '">' +
        '<div class="mini-trend-head"><div><div class="mini-trend-name">' + U.esc(s.name) + '</div>' +
        '<div class="mini-trend-value">' + (val === null || val === undefined ? '–' : U.dec(val, 1) + '%') + '</div>' +
        '<div class="mini-trend-meta"><span class="delta ' + dcls + '">' +
        (delta === null ? '–' : U.pts(delta, 1)) + '</span><span>vs hari kerja sebelumnya</span></div></div>' +
        '<span class="mini-trend-target">Target ' + U.dec(spec.target, 0) + '%</span></div>' +
        (s.key === 'geo_match_pct' ? '<div class="kpi-context' +
          (offRoute !== null && offRoute < 90 ? ' is-low' : '') + '">Off Route ' + U.pct(offRoute, 1) + '</div>' : '') +
        '<div class="mini-chart-host" data-chart></div></article>';
    }).join('') + '</div>';

    trend.series.forEach(function (series) {
      const card = host.querySelector('[data-series="' + series.key + '"]');
      if (card) TrendChart._mountOne(card.querySelector('[data-chart]'), pts, series, TrendChart.SPECS[series.key]);
    });
  },

  _mountOne: function (host, pts, series, spec) {
    const W = 400, H = 172, PL = 34, PR = 9, PT = 13, PB = ChartAxis.padBottom(pts);
    const iw = W - PL - PR, ih = H - PT - PB, n = pts.length;
    let lo = spec.def[0], hi = spec.def[1];
    pts.forEach(function (p) {
      const v = p[series.key];
      if (v === null || v === undefined) return;
      if (v < lo) lo = Math.floor((v - 1.5) / 5) * 5;
      if (v > hi) hi = Math.ceil((v + 1.5) / 5) * 5;
    });
    lo = Math.max(0, lo); hi = Math.min(100, hi);
    if (hi - lo < 5) hi = Math.min(100, lo + 5);

    const X = function (i) { return PL + (n === 1 ? iw / 2 : iw * i / (n - 1)); };
    const Y = function (v) { return PT + ih - (v - lo) / (hi - lo) * ih; };
    /* V1.4.2 — gridline vertikal per tanggal digambar lebih dulu (lapisan terlemah),
       lalu gridline horizontal 5 interval (6 garis). Skala lo/hi TIDAK diubah. */
    let grid = ChartAxis.build(pts, X, H, PT, ih);
    const LV = ChartAxis.H_LEVELS, decY = ChartAxis.tickDec((hi - lo) / LV);
    for (let t = 0; t <= LV; t++) {
      const y = PT + ih - ih * t / LV;
      const v = lo + (hi - lo) * t / LV;
      grid += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (PL + iw) +
        '" y2="' + y.toFixed(1) + '" stroke="#e6ebe8" stroke-width="1"/>' +
        '<text x="' + (PL - 6) + '" y="' + (y + 3.3).toFixed(1) + '" text-anchor="end" ' +
        'font-size="8.5" fill="#8b978f" font-family="inherit">' + U.dec(v, decY) + '</text>';
    }

    const targetY = Y(spec.target);
    let path = '', dots = '', started = false;
    pts.forEach(function (p, i) {
      const v = p[series.key];
      if (v === null || v === undefined) return;
      const x = X(i), y = Y(v);
      path += (started ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); started = true;
      dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' +
        (i === n - 1 ? '4.2' : '3.2') + '" fill="' + series.hex + '" stroke="#ffffff" stroke-width="1.8"/>';
    });

    host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" ' +
      'aria-label="Trend ' + U.esc(series.name) + '">' + grid +
      '<line x1="' + PL + '" y1="' + targetY.toFixed(1) + '" x2="' + (PL + iw) + '" y2="' + targetY.toFixed(1) +
      '" stroke="#91a099" stroke-width="1.2" stroke-dasharray="5 4"/>' +
      '<text x="' + (PL + 4) + '" y="' + (targetY - 4).toFixed(1) + '" font-size="8.5" font-weight="650" ' +
      'fill="#75827b" font-family="inherit">Target ' + U.dec(spec.target, 0) + '%</text>' +
      '<path d="' + path + '" fill="none" stroke="' + series.hex + '" stroke-width="2.8" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>' + dots +
      '<line data-cross x1="0" y1="' + PT + '" x2="0" y2="' + (PT + ih) +
      '" stroke="#91a099" stroke-width="1" opacity="0"/><g data-hover></g></svg>' +
      '<div class="chart-tip" data-tip></div>';

    const svg = host.querySelector('svg'), cross = host.querySelector('[data-cross]');
    const hover = host.querySelector('[data-hover]'), tip = host.querySelector('[data-tip]');
    const move = function (ev) {
      const box = svg.getBoundingClientRect();
      const sx = (ev.clientX - box.left) / box.width * W;
      let idx = n === 1 ? 0 : Math.round((sx - PL) / (iw / (n - 1)));
      idx = U.clamp(idx, 0, n - 1);
      const p = pts[idx], prev = idx > 0 ? pts[idx - 1] : null, value = p[series.key];
      if (value === null || value === undefined) return;
      const x = X(idx), y = Y(value), pv = prev ? prev[series.key] : null;
      const delta = (pv === null || pv === undefined) ? null : value - pv;
      const dcls = delta === null ? 'flat' : (delta > .05 ? 'up' : (delta < -.05 ? 'down' : 'flat'));
      cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', '.75');
      hover.innerHTML = '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" fill="' +
        series.hex + '" stroke="#ffffff" stroke-width="2"/>';
      tip.innerHTML = '<div class="tip-date">' + U.esc(U.dDow(p.date) + ', ' + U.dMed(p.date)) + '</div>' +
        '<div class="tip-row"><span class="tip-key" style="background:' + series.hex + '"></span>' +
        '<span class="tip-name">' + U.esc(series.name) + '</span><span class="tip-val">' + U.dec(value, 1) + '%</span></div>' +
        '<div class="tip-row"><span class="tip-name">Perubahan</span><span class="tip-val delta ' + dcls + '">' +
        (delta === null ? '–' : U.pts(delta, 1)) + '</span></div>' +
        '<div class="tip-row"><span class="tip-name">Total kunjungan</span><span class="tip-val">' +
        U.int(p.visit) + '</span></div>' +
        (prev ? '<div class="tip-row"><span class="tip-name" style="font-size:10px">vs ' +
          U.esc(U.dShort(prev.date)) + '</span></div>' : '');
      tip.classList.add('on');
      const relX = x / W * box.width, tw = tip.offsetWidth || 190;
      tip.style.left = U.clamp(relX + 10, 4, Math.max(4, box.width - tw - 5)) + 'px';
      tip.style.top = '4px';
    };
    const leave = function () {
      cross.setAttribute('opacity', '0'); hover.innerHTML = ''; tip.classList.remove('on');
    };
    host.addEventListener('pointermove', move);
    host.addEventListener('pointerleave', leave);
    this._items.push({ host: host, move: move, leave: leave });
  }
};

/* ===== V1.4.2 — util sumbu-X bersama kedua mini chart =====
   - SEMUA hari kerja diberi label (tidak ada lagi labelStep).
   - Label = angka tanggal saja; sufiks bulan hanya muncul saat bulan berganti,
     ditulis pada baris kedua supaya tidak bertabrakan.
   - Font mengecil otomatis saat titik banyak (target: tetap terbaca s.d. 27 HK). */
const ChartAxis = {
  isMultiMonth: function (pts) {
    return pts.length > 1 && pts[0].date.slice(0, 7) !== pts[pts.length - 1].date.slice(0, 7);
  },
  labelFont: function (n) { return n <= 16 ? 8.5 : (n <= 22 ? 7.6 : 6.9); },
  /* tinggi ruang bawah yang dibutuhkan sumbu-X */
  padBottom: function (pts) { return ChartAxis.isMultiMonth(pts) ? 30 : 24; },
  /* seluruh label + garis grid vertikal untuk setiap titik data */
  build: function (pts, X, H, PT, ih) {
    const n = pts.length, multi = ChartAxis.isMultiMonth(pts), fs = ChartAxis.labelFont(n);
    const dayY = H - (multi ? 15 : 6), monY = H - 5;
    let out = '';
    for (let i = 0; i < n; i++) {
      const x = X(i).toFixed(1), d = U.dParts(pts[i].date);
      /* gridline vertikal — lapisan paling lemah secara visual */
      out += '<line x1="' + x + '" y1="' + PT + '" x2="' + x + '" y2="' + (PT + ih) +
             '" stroke="#eff3f1" stroke-width="1"/>';
      out += '<text x="' + x + '" y="' + dayY + '" text-anchor="middle" font-size="' + fs +
             '" fill="#8b978f" font-family="inherit">' + U.pad(d.d) + '</text>';
      if (multi && (i === 0 || pts[i].date.slice(0, 7) !== pts[i - 1].date.slice(0, 7)))
        out += '<text x="' + x + '" y="' + monY + '" text-anchor="middle" font-size="' + (fs - 0.6) +
               '" fill="#a4afa8" font-family="inherit">' + U.esc(U.MON_S[d.m - 1]) + '</text>';
    }
    return out;
  },
  H_LEVELS: 5,  /* 5 interval = 6 garis horizontal termasuk atas & bawah */
  /* dengan 6 level, rentang sempit bisa membuat label sumbu-Y berulang (24/24/24).
     Desimal dinaikkan otomatis supaya setiap level tetap berbeda. Skala tidak diubah. */
  tickDec: function (step) {
    const a = Math.abs(step);
    if (a >= 1) return 0;
    if (a >= 0.1) return 1;
    return 2;
  }
};

/* Mini trend Hasil Kerja — instance dan listener dibersihkan pada setiap rerender. */
const ResultTrendChart = {
  _items: [],
  destroy: function () {
    this._items.forEach(function (x) {
      x.host.removeEventListener('pointermove', x.move);
      x.host.removeEventListener('pointerleave', x.leave);
    });
    this._items = [];
  },
  money: function (v) {
    if (v === null || v === undefined || isNaN(v)) return '–';
    if (Math.abs(v) >= 1000000000) return 'Rp' + U.dec(v / 1000000000, 2) + ' M';
    if (Math.abs(v) >= 1000000) return 'Rp' + U.dec(v / 1000000, 1) + ' Jt';
    return 'Rp' + U.int(v);
  },
  format: function (key, v) { return key === 'omset' ? this.money(v) : U.dec(v, 1); },
  mount: function (host, trend) {
    this.destroy(); if (!host) return;
    /* V1.7.8 — Trend Project tanpa granular authority: jujur, bukan Total Depo. */
    if (trend && trend.unavailable) {
      host.innerHTML = UI.empty('Trend Project Belum Tersedia', trend.unavailableMessage ||
        'Data harian per Salesman belum tersedia untuk Coverage Project ini.');
      return;
    }
    if (!trend.points.length) { host.innerHTML = UI.empty('Tidak Ada Data Trend', 'Belum ada data hasil kerja pada bulan aktif.'); return; }
    const pts = trend.points, self = this;
    host.innerHTML = '<div class="result-trend-grid">' + trend.series.map(function (s) {
      const last = pts[pts.length - 1], prev = pts.length > 1 ? pts[pts.length - 2] : null;
      const v = last[s.key], pv = prev ? prev[s.key] : null, d = v !== null && pv !== null ? v - pv : null;
      const cls = d === null || Math.abs(d) < .0001 ? 'flat' : (d > 0 ? 'up' : 'down');
      return '<article class="result-trend-card" data-result-series="' + s.key + '">' +
        '<div class="mini-trend-name">' + U.esc(s.name) + '</div>' +
        '<div class="mini-trend-value">' + self.format(s.key, v) + '</div>' +
        '<div class="mini-trend-meta"><span class="delta ' + cls + '">' +
        (d === null ? '–' : (d > 0 ? '+' : d < 0 ? '−' : '±') + self.format(s.key, Math.abs(d))) +
        '</span><span>vs hari kerja sebelumnya</span></div><div class="result-trend-host" data-result-chart></div></article>';
    }).join('') + '</div>';
    trend.series.forEach(function (s) {
      const card = host.querySelector('[data-result-series="' + s.key + '"]');
      if (card) self._mountOne(card.querySelector('[data-result-chart]'), pts, s);
    });
  },
  _mountOne: function (host, pts, series) {
    const W = 400, H = 170, PL = 43, PR = 9, PT = 12, PB = ChartAxis.padBottom(pts),
          iw = W - PL - PR, ih = H - PT - PB, n = pts.length;
    const vals = pts.map(function (p) { return p[series.key]; }).filter(function (v) { return v !== null && v !== undefined; });
    if (!vals.length) { host.innerHTML = UI.empty('Tidak Ada Data'); return; }
    let lo = Math.min.apply(Math, vals), hi = Math.max.apply(Math, vals), pad = (hi - lo) * .18;
    if (!pad) pad = Math.max(1, Math.abs(hi) * .08); lo = Math.max(0, lo - pad); hi += pad;
    const X = function (i) { return PL + (n === 1 ? iw / 2 : iw * i / (n - 1)); };
    const Y = function (v) { return PT + ih - (v - lo) / (hi - lo) * ih; };
    /* V1.4.2 — gridline vertikal per tanggal + semua label tanggal, lalu 6 garis horizontal.
       Skala lo/hi dan seluruh nilai data TIDAK diubah. */
    let grid = ChartAxis.build(pts, X, H, PT, ih), path = '', dots = '', started = false;
    const LV = ChartAxis.H_LEVELS, isM = series.key === 'omset';
    const stepV = (hi - lo) / LV, decY = ChartAxis.tickDec(isM ? stepV / 1000000 : stepV);
    for (let t = 0; t <= LV; t++) {
      const y = PT + ih - ih * t / LV, v = lo + (hi - lo) * t / LV;
      grid += '<line x1="' + PL + '" y1="' + y.toFixed(1) + '" x2="' + (PL + iw) + '" y2="' + y.toFixed(1) + '" stroke="#e6ebe8"/>' +
        '<text x="' + (PL - 6) + '" y="' + (y + 3).toFixed(1) + '" text-anchor="end" font-size="8" fill="#8b978f" font-family="inherit">' +
        (isM ? U.dec(v / 1000000, decY) + 'Jt' : U.dec(v, decY)) + '</text>';
    }
    pts.forEach(function (p, i) {
      const v = p[series.key]; if (v === null || v === undefined) return;
      const x = X(i), y = Y(v); path += (started ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); started = true;
      dots += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.2" fill="' + series.hex + '" stroke="#fff" stroke-width="1.7"/>';
    });
    host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Trend ' + U.esc(series.name) + '">' + grid +
      '<path d="' + path + '" fill="none" stroke="' + series.hex + '" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>' + dots +
      '<line data-result-cross x1="0" y1="' + PT + '" x2="0" y2="' + (PT + ih) + '" stroke="#91a099" opacity="0"/><g data-result-hover></g></svg>' +
      '<div class="chart-tip" data-result-tip></div>';
    const svg = host.querySelector('svg'), cross = host.querySelector('[data-result-cross]'), hover = host.querySelector('[data-result-hover]'), tip = host.querySelector('[data-result-tip]'), self = this;
    const move = function (ev) {
      const box = svg.getBoundingClientRect(), sx = (ev.clientX - box.left) / box.width * W;
      let idx = n === 1 ? 0 : Math.round((sx - PL) / (iw / (n - 1))); idx = U.clamp(idx, 0, n - 1);
      const p = pts[idx], prev = idx ? pts[idx - 1] : null, v = p[series.key]; if (v === null || v === undefined) return;
      const x = X(idx), y = Y(v), pv = prev ? prev[series.key] : null, d = pv === null || pv === undefined ? null : v - pv;
      cross.setAttribute('x1', x); cross.setAttribute('x2', x); cross.setAttribute('opacity', '.75');
      hover.innerHTML = '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" fill="' + series.hex + '" stroke="#fff" stroke-width="2"/>';
      let extra = '';
      /* V1.7.7 — Daily V2 bergrain Depo: tidak membawa Total EC / salesman aktif.
         Baris tambahan hanya ditampilkan bila datanya memang tersedia. */
      if (series.key === 'avg_ec' && p.ec !== null && p.ec !== undefined)
        extra = '<div class="tip-row"><span class="tip-name">Total EC</span><span class="tip-val">' + U.int(p.ec) + '</span></div>';
      if (series.key !== 'omset' && p.salesman_days !== null && p.salesman_days !== undefined)
        extra += '<div class="tip-row"><span class="tip-name">Salesman aktif</span><span class="tip-val">' + U.int(p.salesman_days) + '</span></div>';
      tip.innerHTML = '<div class="tip-date">' + U.esc(U.dDow(p.date) + ', ' + U.dMed(p.date)) + '</div>' +
        '<div class="tip-row"><span class="tip-key" style="background:' + series.hex + '"></span><span class="tip-name">' + U.esc(series.name) + '</span><span class="tip-val">' + self.format(series.key, v) + '</span></div>' +
        '<div class="tip-row"><span class="tip-name">Perubahan</span><span class="tip-val">' + (d === null ? '–' : (d > 0 ? '+' : d < 0 ? '−' : '±') + self.format(series.key, Math.abs(d))) + '</span></div>' + extra;
      tip.classList.add('on'); const rx = x / W * box.width, tw = tip.offsetWidth || 190;
      tip.style.left = U.clamp(rx + 10, 4, Math.max(4, box.width - tw - 5)) + 'px'; tip.style.top = '4px';
    };
    const leave = function () { cross.setAttribute('opacity', '0'); hover.innerHTML = ''; tip.classList.remove('on'); };
    host.addEventListener('pointermove', move); host.addEventListener('pointerleave', leave);
    this._items.push({ host: host, move: move, leave: leave });
  }
};

/* ============================================================================
   LAYER 9 — RENDERER
   ========================================================================= */
const Renderer = (function (S) {

  const $ = function (sel) { return document.querySelector(sel); };

  /* ---------------- scope helpers ---------------- */
  /* V1.6.6 — label scope/breadcrumb dibaca dari resolved organization graph.
     INTERNAL BRANCH KEY tidak pernah ditampilkan; yang tampil adalah nama Cabang. */
  function orgLabel(kind, code) {
    const o = S.lookup(kind, code);
    if (!o) return String(code || '');
    if (kind === 'regional') return o.name ? o.code + ' ' + o.name : o.code;
    return o.name || String(code || '');
  }
  /* V1.7.2 — semantik ROOT mengikuti Monitoring Scope.
     Ketika user sudah drill ke satu Regional, label kembali normal (mis. "R05 BANTEN")
     dan TIDAK lagi menulis "Gabungan N Regional". Internal levelOf({}) tetap
     'national' supaya architecture existing tidak dirombak. */
  function scopeName() {
    const sc = AppState.scope;
    if (sc.depot)    return orgLabel('depot', sc.depot);
    if (sc.branch)   return orgLabel('branch', sc.branch);
    if (sc.regional) return orgLabel('regional', sc.regional);
    return MonitoringScope.rootLabel();
  }
  function rootBadgeLabel() { return MonitoringScope.rootBadge(); }
  /* Badge level pada scope bar: hanya ROOT yang berubah semantik. */
  function levelBadge(lvl) {
    return lvl === 'national' ? rootBadgeLabel() : S.levelLabel(lvl);
  }
  function crumbList() {
    const sc = AppState.scope, out = [{ label: rootBadgeLabel(), level: 'national' }];
    if (sc.regional) out.push({ label: orgLabel('regional', sc.regional), level: 'regional' });
    if (sc.branch)   out.push({ label: orgLabel('branch', sc.branch), level: 'branch' });
    if (sc.depot)    out.push({ label: orgLabel('depot', sc.depot), level: 'depot' });
    return out;
  }

  /* ---------------- KPI ---------------- */
  function statusOf(v, good, warn, review) {
    if (v === null || v === undefined) return 'neut';
    if (v >= good) return 'good'; if (v >= warn) return 'warn';
    if (v >= review) return 'review'; return 'crit';
  }
  /* V1.2 — status KPI mengikuti ambang visual terpusat (satu sumber kebenaran) */
  function gradeStatus(v, key) {
    return KPI_MODEL.gradeStatus[KPI_MODEL.grade(v, KPI_MODEL.visual[key])];
  }
  function statusOfLow(v, good, warn, review) {
    if (v === null || v === undefined) return 'neut';
    if (v <= good) return 'good'; if (v <= warn) return 'warn';
    if (v <= review) return 'review'; return 'crit';
  }
  function deltaHtml(d, unit, invert, digits) {
    if (d === null || d === undefined || isNaN(d)) return '<span class="delta flat">–</span>';
    const eps = unit === 'min' ? 0.5 : 0.05;
    const good = invert ? d < -eps : d > eps;
    const bad  = invert ? d >  eps : d < -eps;
    const cls = good ? 'up' : (bad ? 'down' : 'flat');
    let txt;
    if (unit === 'min') txt = (Math.abs(d) < 0.5 ? '±0m' : (d > 0 ? '+' : '−') + U.durShort(Math.abs(d)));
    else txt = U.pts(d, digits === undefined ? 1 : digits) + (unit ? ' ' + unit : '');
    return '<span class="delta ' + cls + '">' + txt + '</span>';
  }
  function kpiCard(label, value, status, footHtml, hero, small, contextHtml) {
    return '<div class="kpi is-' + status + (hero ? ' hero' : '') + '">' +
      '<div class="kpi-label">' + U.esc(label) + '</div>' +
      '<div class="kpi-value' + (small ? ' sm' : '') + '">' + value + '</div>' +
      '<div class="kpi-foot">' + footHtml + '</div>' +
      (contextHtml ? '<div class="kpi-context">' + contextHtml + '</div>' : '') + '</div>';
  }

  /* V1.7.7.3 — Website ASS menampilkan durasi authority sebagai jam + menit utuh
     (floor), bukan pembulatan menit. Helper ini KHUSUS presentation KPI summary
     authority agar 201,6086 menit tampil 3 jam 21 menit seperti Website ASS. */
  function assAuthorityDur(minutes) {
    if (minutes === null || minutes === undefined || isNaN(minutes)) return '–';
    const totalMin = Math.max(0, Math.floor(Number(minutes)));
    if (totalMin < 60) return totalMin + ' menit';
    const h = Math.floor(totalMin / 60), m = totalMin % 60;
    return m === 0 ? (h + ' jam') : (h + ' jam ' + m + ' menit');
  }

  /* V1.3.1 — 7 KPI dalam satu baris desktop. */
  function renderKPI(sum) {
    const c = sum.current, d = sum.delta;
    if (!c.n && !c.__summary) return UI.empty('Tidak Ada Data KPI', 'Tidak ada record proses kerja pada scope dan periode ini.');

    const cards =
      kpiCard('SC vs JKS · On Route', U.pct(c.sc_jks_pct), gradeStatus(c.sc_jks_pct, 'sc_jks'),
        deltaHtml(d.sc_jks_pct, 'pts') + '<span class="kpi-target">target 100%</span>') +
      kpiCard('Geo Match · On Route', U.pct(c.geo_match_pct), gradeStatus(c.geo_match_pct, 'geo'),
        deltaHtml(d.geo_match_pct, 'pts') + '<span class="kpi-target">target 100%</span>', false, false,
        '<span class="' + (c.geo_off_route_pct !== null && c.geo_off_route_pct < 90 ? 'is-low' : '') +
        '">Off Route ' + U.pct(c.geo_off_route_pct, 1) + '</span>') +
      kpiCard('Hit Rate EC', U.pct(c.hit_rate_pct), gradeStatus(c.hit_rate_pct, 'hit'),
        deltaHtml(d.hit_rate_pct, 'pts') + '<span class="kpi-target">target 90%</span>') +
      kpiCard('Avg Visit', U.dec(c.avg_visit, 1), gradeStatus(c.avg_visit, 'visit'),
        deltaHtml(d.avg_visit, '', false, 1) + '<span class="kpi-target">' + U.int(c.visit) + ' visit</span>') +
      kpiCard('Avg Check In', U.clock(c.avg_check_in), statusOfLow(c.avg_check_in, 480, 495, 510),
        deltaHtml(d.avg_check_in, 'min', true) + '<span class="kpi-target">≤ 08:00</span>', false, true) +
      kpiCard('Avg Check Out', U.clock(c.avg_check_out), statusOf(c.avg_check_out, 1020, 1000, 975),
        deltaHtml(d.avg_check_out, 'min') + '<span class="kpi-target">≥ 17:00</span>', false, true) +
      kpiCard('Avg Durasi Jalan', c.__summary ? assAuthorityDur(c.avg_transport_minutes) : U.dur(c.avg_transport_minutes), statusOfLow(c.avg_transport_minutes, 120, 145, 170),
        deltaHtml(d.avg_transport_minutes, 'min', true) + '<span class="kpi-target">≤ 2 jam</span>', false, true);

    return '<div class="kpi-row single">' + cards + '</div>';
  }

  /* ---------------- ROUTE ----------------
     V1.1: section "Analisis Route" TIDAK LAGI dipasang di halaman Proses Kerja.
     Fungsi dipertahankan (bersama DashboardService.getRouteAnalysis) karena masih
     dipakai oleh generator temuan "Off Route vs On Route" dan disiapkan untuk
     iterasi berikutnya. Menghapusnya sekarang berisiko regresi tanpa manfaat. */
  function barLine(label, v, hex, max) {
    return '<div class="bar-line"><div class="bar-line-top"><span>' + U.esc(label) + '</span><b>' +
      (v === null ? '–' : U.pct(v)) + '</b></div><div class="bar-track"><div class="bar-fill" style="width:' +
      U.clamp((v || 0) / (max || 100) * 100, 0, 100).toFixed(1) + '%;background:' + hex + '"></div></div></div>';
  }
  function renderRoute(ra) {
    if (!ra.total) return UI.empty('Tidak Ada Kunjungan', 'Belum ada kunjungan tercatat pada scope dan periode ini.');
    const gap = ra.geoGap;
    const verdict = gap === null ? 'Data Off Route belum cukup untuk dibandingkan.'
      : gap >= 20 ? 'Masalah proses <b>dominan berasal dari Off Route</b> — selisih Geo Match sangat lebar.'
      : gap >= 8  ? 'Off Route menjadi <b>penyumbang utama penurunan</b> Geo Match pada scope ini.'
      : gap >= 0  ? 'Kualitas On Route dan Off Route <b>relatif sebanding</b>; masalah tidak terkonsentrasi pada satu jalur.'
                  : 'Off Route justru <b>lebih rapi</b> dibanding On Route — periksa kepatuhan rute terjadwal.';
    return '<div class="route-grid">' +
      '<div class="route-card on"><div class="route-head"><span class="route-name">On Route</span>' +
        '<span class="route-visits">' + U.int(ra.on.visits) + '</span><span class="route-share">visit · ' +
        U.pct(ra.on.share, 0) + ' porsi</span></div>' +
        barLine('Geo Match On Route', ra.on.geo_match_pct, 'var(--brand)') +

      '<div class="route-card off"><div class="route-head"><span class="route-name">Off Route</span>' +
        '<span class="route-visits">' + U.int(ra.off.visits) + '</span><span class="route-share">visit · ' +
        U.pct(ra.off.share, 0) + ' porsi</span></div>' +
        barLine('Geo Match Off Route', ra.off.geo_match_pct, 'var(--st-review)') +

        '<div class="gapline"><span>Total kunjungan</span><b>' + U.int(ra.total) + '</b></div></div></div>';

  /* ---------------- INSIGHT ---------------- */

    return '<div class="insight-list">' + list.map(function (i) {
      return '<div class="insight ' + i.sev + '"><span class="insight-ico">' + ICO[i.sev] + '</span>' +
        '<div class="insight-body"><div class="insight-text">' + i.text + '</div>' +
        '<div class="insight-meta">' + U.esc(i.meta) + '</div></div></div>';

  /* ---------------- TABEL PERFORMA WILAYAH ----------------
     V1.1: section "Performa Wilayah" DIGANTI oleh Monitoring Harian dan tidak lagi
     dipasang. DashboardService.getHierarchyData tetap dipakai oleh Temuan Utama,
     jadi hanya presentasinya yang dilepas. */
  function mtag(v, warn, bad, fmt) {
    if (v === null || v === undefined) return '–';
    const cls = v < bad ? 'low' : (v < warn ? 'mid' : '');
    return '<span class="mtag ' + cls + '">' + fmt(v) + '</span>';

  function scorePill(v) {

  function anomCell(m) {

  function renderHierarchy(h) {
