const OrgResolver = {
  _master: null, _index: null, rev: 0,
  /* Kode depo dinormalisasi: trim, uppercase, dan leading zero DIPERTAHANKAN.
     Prefiks 'D' pada kode demo diabaikan saat mencocokkan ke master. */
  normCode: function (v) {
    let t = String(v === null || v === undefined ? '' : v).trim().toUpperCase();
    t = t.replace(/\s+/g, '');
    return t;
  },
  matchKeys: function (code) {
    const c = this.normCode(code), out = [c];
    if (c.charAt(0) === 'D') out.push(c.slice(1));
    else out.push('D' + c);
    return out;
  },
  setMaster: function (m) { this._master = m || null; this._index = null; this._graph = null; this._memo = {}; this.rev++;
                            if (typeof RankingService !== 'undefined') RankingService.invalidate(); },
  /* dipanggil setiap kali LiveDataStore berubah revisi */
  invalidateLive: function () { this._index = null; this._graph = null; this._memo = {}; this.rev++;
                                if (typeof RankingService !== 'undefined') RankingService.invalidate(); },
  invalidate: function () { this._index = null; this._graph = null; this._memo = {}; this.rev++;
                            if (typeof RankingService !== 'undefined') RankingService.invalidate(); },
  master: function () { return this._master; },
  index: function () {
    if (this._index) return this._index;
    const idx = {};
    const m = this._master;
    if (m && m.rows) m.rows.forEach(function (r) { idx[OrgResolver.normCode(r.depot_code)] = r; });
    this._index = idx; return idx;
  },
  /* resolve mengembalikan mapping organisasi untuk sebuah kode depo.
     source: 'master' bila ditemukan di Master Cabang, 'demo' bila memakai org dummy. */
  resolve: function (depotCode) {
    /* V1.6.6 — seluruh resolusi melewati satu organization graph (master menang,
       fallback demo bila kode depo tidak ada di master). */
    const d = this.graph().depotByCode[depotCode];
    if (d) {
      return { source: d.org_source, depot_code: depotCode, depot_name: d.name,
               branch_name: d.branch_name, branch_key: d.branch_code,
               regional_code: d.regional_code, regional_name: d.regional_name,
               plant: d.plant || '', area: d.area || '' };
    }
    const mr = this.masterRowOf(depotCode);
    if (mr) {
      return { source: 'master', depot_code: depotCode, depot_name: mr.depot_name || '',
               branch_name: mr.branch_name, branch_key: this.branchKeyOf(mr.regional_code, mr.branch_name),
               regional_code: mr.regional_code,
               regional_name: mr.regional_name === mr.regional_code ? '' : (mr.regional_name || ''),
               plant: mr.plant || '', area: mr.area || '' };
    }
    return { source: 'none', depot_code: depotCode, depot_name: '', branch_name: '', branch_key: '',
             regional_code: '', regional_name: '', plant: '', area: '' };
  },
  /* kualitas pemetaan master terhadap dataset aktif */
  mappingStatus: function () {
    if (this.liveMode()) {
      const g = this.graph();
      return { total: g.depots.length, matched: g.depots.length, unmatched: 0, mismatch: 0,
               unmatchedList: [], mismatchList: [], hasMaster: true, live: true };
    }
    const depots = DashboardService.org().depots;
    const out = { total: depots.length, matched: 0, unmatched: 0, mismatch: 0, unmatchedList: [], mismatchList: [] };
    const hasMaster = !!(this._master && this._master.rows && this._master.rows.length);
    depots.forEach(function (d) {
      if (!hasMaster) { out.unmatched++; out.unmatchedList.push(d.code); return; }
      const r = OrgResolver.resolve(d.code);
      if (r.source !== 'master') { out.unmatched++; out.unmatchedList.push(d.code); return; }
      out.matched++;
      if (r.regional_code && r.regional_code !== d.regional_code) {
        out.mismatch++; out.mismatchList.push(d.code + ': data ' + d.regional_code + ' vs master ' + r.regional_code);
      }
    });
    out.hasMaster = hasMaster;
    return out;
  },

  /* ==========================================================================
     V1.6.6 — RESOLVED ORGANIZATION GRAPH (satu-satunya sumber hierarchy global)
     Regional → Cabang → Depo untuk Proses, Hasil, Ranking, Informasi, filter,
     breadcrumb, drill-down, dan metadata. Master Cabang menang bila Kode Depo
     match; bila tidak match dipakai fallback organisasi existing (demo).
     Data operasional TIDAK dimutasi — hierarchy hanya lapisan resolusi.
     ====================================================================== */
  _graph: null,
  _memo: {},

  /* INTERNAL BRANCH KEY — hanya teknis, tidak ditampilkan ke user.
     Deterministic, collision-safe dalam Regional; nama Cabang sama pada Regional
     berbeda dianggap Cabang berbeda. Master TIDAK wajib punya Branch Code. */
  branchKeyOf: function (regionalCode, branchName) {
    const r = String(regionalCode === null || regionalCode === undefined ? '' : regionalCode).trim().toUpperCase();
    const b = String(branchName === null || branchName === undefined ? '' : branchName).trim().toUpperCase().replace(/\s+/g, ' ');
    return 'MB:' + r + '|' + b;
  },
  isInternalBranchKey: function (k) { return String(k || '').indexOf('MB:') === 0; },

  masterRowOf: function (depotCode) {
    const idx = this.index(), keys = this.matchKeys(depotCode);
    for (let i = 0; i < keys.length; i++) if (idx[keys[i]]) return idx[keys[i]];
    return null;
  },

  /* V1.7.1 — pada LIVE MODE, hierarchy production berasal dari public.master_depot
     (server). Master Cabang lokal (IndexedDB) TETAP ada sebagai utility admin,
     tetapi TIDAK PERNAH meng-override hierarchy Live. */
  liveMode: function () { return typeof ProviderHub !== 'undefined' && ProviderHub.isLive(); },
  masterAuthority: function () { return this.liveMode() ? 'master_depot' : 'master_cabang_lokal'; },

  graph: function () {
    if (this._graph) return this._graph;
    const DP = (typeof ProviderHub !== 'undefined' && ProviderHub.active) ? ProviderHub.active() : DemoDataProvider;
    const base = DP.org();
    const liveAuthority = this.liveMode();
    /* Master lokal diabaikan sepenuhnya untuk hierarchy saat LIVE. */
    const hasMaster = !liveAuthority && !!(this._master && this._master.rows && this._master.rows.length);

    if (liveAuthority) {
      /* master_depot sudah dinormalisasi oleh ApiDataProvider menjadi
         regionals / branches / depots. Tidak ada fallback organisasi dummy. */
      const regionalByCodeL = {}, branchByKeyL = {}, depotByCodeL = {};
      base.regionals.forEach(function (r) { regionalByCodeL[r.code] = r; });
      base.branches.forEach(function (b) { branchByKeyL[b.code] = b; });
      base.depots.forEach(function (d) { d.org_source = 'master_depot'; depotByCodeL[d.code] = d; });
      const dOfBranch = {}, dOfRegional = {}, bOfRegional = {};
      base.depots.forEach(function (d) {
        (dOfBranch[d.branch_code] || (dOfBranch[d.branch_code] = [])).push(d);
        (dOfRegional[d.regional_code] || (dOfRegional[d.regional_code] = [])).push(d);
      });
      base.branches.forEach(function (b) {
        (bOfRegional[b.regional_code] || (bOfRegional[b.regional_code] = [])).push(b);
      });
      this._graph = { hasMaster: true, live: true,
                      regionals: base.regionals.slice(), branches: base.branches.slice(),
                      depots: base.depots.slice(),
                      regionalByCode: regionalByCodeL, branchByKey: branchByKeyL,
                      depotByCode: depotByCodeL, depotsOfBranch: dOfBranch,
                      depotsOfRegional: dOfRegional, branchesOfRegional: bOfRegional };
      return this._graph;
    }

    const regIndex = {}, brIndex = {};
    base.regionals.forEach(function (r, i) { regIndex[r.code] = { i: i, name: r.name }; });
    base.branches.forEach(function (b, i) { brIndex[b.code] = { i: i, name: b.name }; });

    const regionalByCode = {}, branchByKey = {}, depotByCode = {};
    const regionals = [], branches = [], depots = [];

    base.depots.forEach(function (d) {
      const mr = hasMaster ? OrgResolver.masterRowOf(d.code) : null;
      let rc, rname, bkey, bname, dname, source;
      if (mr) {
        source = 'master';
        rc = mr.regional_code;
        rname = regIndex[rc] ? regIndex[rc].name
              : (mr.regional_name && mr.regional_name !== rc ? mr.regional_name : '');
        bname = mr.branch_name;
        bkey = OrgResolver.branchKeyOf(rc, bname);
        dname = mr.depot_name || d.name;
      } else {
        source = 'demo';
        rc = d.regional_code;
        rname = regIndex[rc] ? regIndex[rc].name : '';
        bkey = d.branch_code;
        bname = brIndex[bkey] ? brIndex[bkey].name : bkey;
        dname = d.name;
      }

      if (!regionalByCode[rc]) {
        const rg = { code: rc, name: rname, _order: regIndex[rc] ? regIndex[rc].i : 100000 };
        regionalByCode[rc] = rg; regionals.push(rg);
      } else if (!regionalByCode[rc].name && rname) regionalByCode[rc].name = rname;

      if (!branchByKey[bkey]) {
        const br = { code: bkey, name: bname, regional_code: rc,
                     _order: brIndex[bkey] ? brIndex[bkey].i : 100000, _source: source };
        branchByKey[bkey] = br; branches.push(br);
      }

      const dep = Object.assign({}, d, { code: d.code, name: dname, regional_code: rc,
                    branch_code: bkey, branch_name: bname, regional_name: rname,
                    plant: mr ? (mr.plant || '') : '', area: mr ? (mr.area || '') : '',
                    org_source: source });
      depotByCode[d.code] = dep; depots.push(dep);
    });

    regionals.sort(function (a, b) { return a._order - b._order || (a.code < b.code ? -1 : a.code > b.code ? 1 : 0); });
    branches.sort(function (a, b) {
      return a._order - b._order || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0) ||
             (a.code < b.code ? -1 : a.code > b.code ? 1 : 0);
    });

    const depotsOfBranch = {}, depotsOfRegional = {}, branchesOfRegional = {};
    depots.forEach(function (d) {
      (depotsOfBranch[d.branch_code] || (depotsOfBranch[d.branch_code] = [])).push(d);
      (depotsOfRegional[d.regional_code] || (depotsOfRegional[d.regional_code] = [])).push(d);
    });
    branches.forEach(function (b) { (branchesOfRegional[b.regional_code] || (branchesOfRegional[b.regional_code] = [])).push(b); });

    this._graph = { hasMaster: hasMaster, regionals: regionals, branches: branches, depots: depots,
                    regionalByCode: regionalByCode, branchByKey: branchByKey, depotByCode: depotByCode,
                    depotsOfBranch: depotsOfBranch, depotsOfRegional: depotsOfRegional,
                    branchesOfRegional: branchesOfRegional };
    return this._graph;
  },
  getOrganizationGraph: function () { return this.graph(); },
  resolveDepot: function (code) { return this.graph().depotByCode[code] || null; },
  resolvedDepots: function () { return this.graph().depots.slice(); },

  /* daftar Kode Depo yang menjadi member sebuah scope (hasil resolusi, bukan raw) */
  depotCodesOf: function (scope) {
    const sc = scope || {};
    /* V1.7.2 — memo key ikut membawa revisi Monitoring Scope supaya hasil lama
       tidak dipakai setelah user mengganti Regional trial. */
    const key = (MonitoringScope.rev | 0) + '|' + (sc.regional || '') + '' + (sc.branch || '') + '' + (sc.depot || '');
    if (this._memo[key]) return this._memo[key];
    const g = this.graph();
    let list;
    if (sc.depot) list = g.depotByCode[sc.depot] ? [g.depotByCode[sc.depot]] : [];
    else if (sc.branch) list = (g.depotsOfBranch[sc.branch] || []).filter(function (d) {
      return !sc.regional || d.regional_code === sc.regional; });
    else if (sc.regional) list = g.depotsOfRegional[sc.regional] || [];
    else list = g.depots;
    /* OUTER ALLOWLIST Monitoring Scope — master TIDAK dimutasi, hanya disaring
       pada layer query/presentasi. Lookup Set = O(1). */
    const allowReg = MonitoringScope.allowedRegionalSet();
    if (allowReg) list = list.filter(function (d) { return allowReg.has(d.regional_code); });
    const set = {};
    list.forEach(function (d) { set[d.code] = 1; });
    const out = { list: list.slice(), set: set };
    this._memo[key] = out;
    return out;
  },
  depotSetOf: function (scope) { return this.depotCodesOf(scope).set; },
  matchesScope: function (depotCode, scope) {
    const sc = scope || {};
    /* V1.7.2 — Monitoring Scope adalah OUTER allowlist: berlaku juga ketika
       drilldown masih di root. Tanpa cek ini, helper akan mengembalikan true
       untuk Depo di luar Regional trial. */
    if (!MonitoringScope.isDepotAllowed(depotCode)) return false;
    if (!sc.regional && !sc.branch && !sc.depot) return true;
    return !!this.depotCodesOf(sc).set[depotCode];
  },

  /* opsi filter bertingkat — authoritative */
  getFilterOptions: function (scope) {
    const g = this.graph(), sc = scope || {};
    /* Dropdown Regional hanya menampilkan Regional di dalam Monitoring Scope. */
    const regionals = g.regionals.filter(function (r) { return MonitoringScope.isRegionalAllowed(r.code) &&
        MasterCabangAuthority.scopeHasAllowed({ regional: r.code }, 'monitoring'); })
      .map(function (r) { return { code: r.code, label: OrgResolver.regionalLabel(r) }; });
    const branches = sc.regional
      ? (g.branchesOfRegional[sc.regional] || []).filter(function (b) {
          return MasterCabangAuthority.scopeHasAllowed({ regional: b.regional_code, branch: b.code }, 'monitoring');
        }).map(function (b) { return { code: b.code, label: b.name }; })
      : [];
    const depots = sc.branch
      ? (g.depotsOfBranch[sc.branch] || []).filter(function (d) { return (!sc.regional || d.regional_code === sc.regional) &&
            MasterCabangAuthority.allowed(d.code, 'monitoring'); })
          .map(function (d) { return { code: d.code, label: d.name }; })
      : [];
    return { regionals: regionals, branches: branches, depots: depots };
  },
  regionalLabel: function (r) { return r ? (r.name ? r.code + ' ' + r.name : r.code) : ''; },

  /* entitas organisasi pada level tertentu di dalam sebuah scope */
  childrenAt: function (scope, level) {
    const g = this.graph(), sc = scope || {};
    /* Kompatibilitas V1.6.5: level organisasi yang lebih tinggi dari scope aktif
       tidak mengembalikan entity (mis. level Cabang di dalam scope Depo). */
    if (level === 'branch' && (sc.depot || sc.ass)) return [];
    if (level === 'depot' && sc.ass) return [];
    if (level === 'regional')
      return g.regionals.filter(function (r) {
          return (!sc.regional || r.code === sc.regional) && MonitoringScope.isRegionalAllowed(r.code); })
        .map(function (r) { return { key: r.code, code: r.code, name: r.name, label: OrgResolver.regionalLabel(r),
               kind: 'regional', scope: { regional: r.code } }; });
    if (level === 'branch')
      return g.branches.filter(function (b) {
          if (sc.regional && b.regional_code !== sc.regional) return false;
          if (sc.branch && b.code !== sc.branch) return false;
          return MonitoringScope.isRegionalAllowed(b.regional_code); })
        .map(function (b) { return { key: b.code, code: b.code, name: b.name, label: b.name, kind: 'branch',
               scope: { regional: b.regional_code, branch: b.code } }; });
    return this.depotCodesOf(sc).list.map(function (d) {
      return { key: d.code, code: d.code, name: d.name, label: d.name, kind: 'depot',
               scope: { regional: d.regional_code, branch: d.branch_code, depot: d.code } };
    });
  },

  /* normalisasi scope bila Master berubah dan sebagian scope tidak lagi valid */
  normalizeScope: function (scope) {
    const g = this.graph(), sc = scope || {};
    const out = { regional: sc.regional || null, branch: sc.branch || null, depot: sc.depot || null };
    if (out.regional && !g.regionalByCode[out.regional]) { out.regional = null; out.branch = null; out.depot = null; }
    /* V1.7.2 — drilldown yang berada DI LUAR Monitoring Scope direset ke root
       gabungan Regional trial (bukan ke Nasional penuh). */
    if (out.regional && !MonitoringScope.isRegionalAllowed(out.regional)) {
      out.regional = null; out.branch = null; out.depot = null;
    }
    if (out.branch) {
      const bb = g.branchByKey[out.branch];
      if (!bb || !MonitoringScope.isRegionalAllowed(bb.regional_code)) { out.branch = null; out.depot = null; }
    }
    if (out.depot) {
      const dd = g.depotByCode[out.depot];
      if (!dd || !MonitoringScope.isRegionalAllowed(dd.regional_code)) out.depot = null;
    }
    if (out.branch) {
      const b = g.branchByKey[out.branch];
      if (!b || (out.regional && b.regional_code !== out.regional)) { out.branch = null; out.depot = null; }
      else if (!out.regional) out.regional = b.regional_code;
    }
    if (out.depot) {
      const d = g.depotByCode[out.depot];
      if (!d || (out.regional && d.regional_code !== out.regional) || (out.branch && d.branch_code !== out.branch)) out.depot = null;
    }
    return out;
  }
};

/* ============================================================================
   LAYER 13 — RANKING SERVICE (V1.6)
   Mengambil metric dari DashboardService (Proses + Hasil) — TIDAK menghitung
   ulang metric mentah. Tugasnya: TAT, Golden EC target, Score Cap, bobot,
   Final Score, kategori, sorting, dan perbandingan periode sebelumnya.
   ========================================================================= */
const RankingService = (function (S) {

  const cache = {}, metaCache = {};
  function invalidate() {
    for (const k in cache) delete cache[k];
    for (const m in metaCache) delete metaCache[m];
  }

  function cacheKey(level, scope, prev) {
    const st = RankingSettings.get();
    /* V1.7.4 — cache ikut invalid saat Total HK, Monitoring Scope, atau data
       LIVE berubah, supaya TAT yang dipakai selalu yang terbaru. */
    const tatSnap = (typeof RankingTat !== 'undefined') ? RankingTat.snapshot() : { tat: null };
    return [level, JSON.stringify(scope || {}), prev ? 'prev' : 'cur',
            JSON.stringify(st.weights), st.goldenEcTarget, st.scoreCap,
            RankingSettings.rev, MasterCabangStore.rev, OrgResolver.rev,
            (typeof MonitoringScope !== 'undefined' ? MonitoringScope.rev : 0),
            (typeof SalesmanProjectScope !== 'undefined' ? SalesmanProjectScope.rev : 0),
            (typeof RankingPeriodSettings !== 'undefined' ? RankingPeriodSettings.rev : 0),
            tatSnap.tat === null ? 'no-tat' : tatSnap.tat,
            S.resultContext().latest].join('|');
  }

  /* Metadata organisasi informational — DISTINCT code, tidak ikut scoring. */
  function entityMeta(scope, kind) {
    const key = cacheKey('meta:' + kind, scope || {}, false);
    if (metaCache[key]) return metaCache[key];
    const src = scope || {};
    const countScope = kind === 'ass'
      ? { regional: src.regional || null, branch: src.branch || null, ass: src.ass || null }
      : src;
    const salesmen = S.childrenAt(countScope, 'salesman');
    const distinct = function (rows, field) {
      const seen = {};
      rows.forEach(function (r) { const v = r.scope && r.scope[field]; if (v) seen[v] = 1; });
      return Object.keys(seen).length;
    };
    let text = '', counts = {};
    if (kind === 'regional') {
      counts = { branches: S.childrenAt(src, 'branch').length, depots: S.childrenAt(src, 'depot').length,
                 salesmen: distinct(salesmen, 'salesman') };
      text = counts.branches + ' Cabang • ' + counts.depots + ' Depo • ' + counts.salesmen + ' Salesman';
    } else if (kind === 'branch') {
      counts = { depots: S.childrenAt(src, 'depot').length, salesmen: distinct(salesmen, 'salesman') };
      text = counts.depots + ' Depo • ' + counts.salesmen + ' Salesman';
    } else if (kind === 'depot') {
      counts = { ass: distinct(salesmen, 'ass'), salesmen: distinct(salesmen, 'salesman') };
      text = counts.ass + ' ASS • ' + counts.salesmen + ' Salesman';
    } else if (kind === 'ass') {
      counts = { depots: distinct(salesmen, 'depot'), salesmen: distinct(salesmen, 'salesman') };
      text = counts.depots + ' Depo • ' + counts.salesmen + ' Salesman';
    } else if (kind === 'salesman') {
      const sm = S.lookup('salesman', src.salesman);
      text = sm ? (sm.ass_name || sm.ass_code || 'ASS –') + ' • ' + (sm.depot_name || sm.depot_code || 'Depo –') : '';
      /* V1.7.6.1 — indikator ringan bila satu Salesman Code ditemukan pada lebih
         dari satu Depo canonical. Salesman TETAP satu entity; ini hanya audit. */
      if (sm && sm.organization_conflict) text += ' • \u26A0 Depot mismatch';
    }
    return (metaCache[key] = { text: text, counts: counts });
  }

  function categoryOf(score) {
    if (score === null || score === undefined || isNaN(score)) return { key: 'none', label: 'Data Belum Lengkap' };
    for (let i = 0; i < RANKING_CATEGORY.length; i++)
      if (score >= RANKING_CATEGORY[i].min) return RANKING_CATEGORY[i];
    return RANKING_CATEGORY[RANKING_CATEGORY.length - 1];
  }

  /* metric mentah per entity — seluruhnya diambil dari service existing.
     V1.7.4 — PROSES dan HASIL memiliki kalender INDEPENDEN (arsitektur V1.7.0),
     sehingga masing-masing memakai range domainnya sendiri. Sebelumnya keduanya
     memakai range konteks HASIL; pada LIVE hal itu membuat seluruh KPI Proses
     Kerja kosong karena tanggal PROSES berada di luar range cutoff RESULT. */
  function entityMetrics(scope, range, procRange) {
    const rankOnly = function (rows) { return (rows || []).filter(function (r) {
      return MasterCabangAuthority.allowed(r.depot_code, 'ranking'); }); };
    const proc = S.aggregate(rankOnly(S.rawRecords(procRange || range, scope)));
    const res  = S.aggregateResultRecords(rankOnly(S.rawResultRecords(range, scope)));
    return {
      sc_jks_pct: proc.n ? proc.sc_jks_pct : null,          /* ON ROUTE  */
      geo_match_pct: proc.n ? proc.geo_match_pct : null,     /* ON ROUTE  */
      hit_rate_pct: proc.n ? proc.hit_rate_pct : null,       /* ON + OFF  */
      avg_ec: res.hasData ? res.avg_ec : null,               /* ON + OFF  */
      roa: res.hasData ? res.roa : null,
      omset: res.hasData ? res.omset : null,
      epb_point: res.hasData ? res.epb_point : null,
      /* V1.7.5 — ROA Ranking actual = SUM(roa_actual_count) / SUM(ro_count). */
      ach_roa: res.hasData ? (res.roa_actual_pct === undefined ? res.achievement.roa : res.roa_actual_pct) : null,
      ach_omset: res.hasData ? res.achievement.omset : null,
      ach_epb: res.hasData ? res.achievement.epb_point : null,
      salesman_days: res.salesman_days, visit: proc.visit, ec: proc.ec, procN: proc.n
    };
  }

  /* Actual -> Score Basis -> Score Cap -> Weight -> Contribution */
  function scoreRow(m, tat) {
    const st = RankingSettings.get(), cap = st.scoreCap, W = st.weights;
    const basis = {
      sc_jks: m.sc_jks_pct,
      geo: m.geo_match_pct,
      hit: m.hit_rate_pct,
      golden: (m.avg_ec === null || !st.goldenEcTarget) ? null : m.avg_ec / st.goldenEcTarget * 100,
      roa: (m.ach_roa === null || !tat) ? null : m.ach_roa / tat * 100,
      omset: (m.ach_omset === null || !tat) ? null : m.ach_omset / tat * 100,
      epb: (m.ach_epb === null || !tat) ? null : m.ach_epb / tat * 100
    };
    const parts = {}; let final = 0, complete = true;
    RANKING_KPIS.forEach(function (k) {
      const b = basis[k.key];
      const capped = (b === null || b === undefined || isNaN(b)) ? null : Math.min(b, cap);
      const w = Number(W[k.key]) || 0;
      const contrib = capped === null ? null : capped * w / 100;
      if (capped === null) complete = false; else final += contrib;
      parts[k.key] = { basis: b, score: capped, weight: w, contribution: contrib, tat: k.tat };
    });
    return { parts: parts, final: complete ? final : null, complete: complete };
  }

  function buildRows(scope, level, range, tat, procRange) {
    const kids = S.childrenAt(scope, level).filter(function (c) {
      return MasterCabangAuthority.scopeHasAllowed(c.scope, 'ranking');
    });
    return kids.map(function (c) {
      const m = entityMetrics(c.scope, range, procRange);
      const sc = scoreRow(m, tat);
      const cat = categoryOf(sc.final);
      return { key: c.key, code: c.code, name: c.name, label: c.label, kind: c.kind, scope: c.scope,
               metrics: m, parts: sc.parts, final: sc.final, complete: sc.complete,
               category: cat.key, categoryLabel: cat.label, meta: entityMeta(c.scope, c.kind) };
    });
  }

  function sortRows(rows) {
    rows.sort(function (a, b) {
      if (a.complete !== b.complete) return a.complete ? -1 : 1;
      if (!a.complete && !b.complete) return a.label < b.label ? -1 : 1;
      return (b.final - a.final) || (a.label < b.label ? -1 : 1);
    });
    rows.forEach(function (r, i) { r.rank = r.complete ? i + 1 : null; });
    return rows;
  }

  function compute(scope, level, prev) {
    const key = cacheKey(level, scope, prev);
    if (cache[key]) return cache[key];
    const ctx = S.resultContext();
    const range = prev ? ctx.previousRange : ctx.currentRange;
    const tat = prev ? ctx.previous_tat_mtd : ctx.tat_mtd;
    /* Range PROSES = periode PROSES aktif (independen dari periode HASIL).
       Untuk perbandingan periode sebelumnya, data PROSES bulan lalu belum
       dimuat pada build ini sehingga sengaja dikosongkan (tidak dikarang). */
    let procRange = range;
    if (typeof S.isLive === 'function' && S.isLive()) {
      if (prev) procRange = { from: null, to: null };
      else {
        const pc = S.processContext();
        procRange = { from: pc.firstDate, to: pc.cutoffDate };
      }
    }
    const rows = sortRows(buildRows(scope || {}, level, range, tat, procRange));
    const out = { level: level, scope: scope || {}, rows: rows, context: ctx, tat: tat,
                  settings: RankingSettings.get() };
    cache[key] = out;
    return out;
  }

  const LEVELS = [
    { key: 'regional', label: 'Regional' }, { key: 'branch', label: 'Cabang' },
    { key: 'depot', label: 'Depo' }, { key: 'ass', label: 'ASS' }, { key: 'salesman', label: 'Salesman' }
  ];

  return {
    KPIS: RANKING_KPIS.slice(),
    LEVELS: LEVELS.slice(),
    invalidate: invalidate,
    categoryOf: categoryOf,
    levelLabel: function (l) { const x = LEVELS.filter(function (v) { return v.key === l; })[0]; return x ? x.label : l; },
    getEntityMeta: entityMeta,

    /* ranking + delta terhadap bulan lalu pada HK yang sama */
    getRanking: function (scope, level) {
      const cur = compute(scope, level, false);
      const ctx = cur.context;
      const hasPrev = ctx.previousDates && ctx.previousDates.length > 0;
      let prevBy = null;
      if (hasPrev) {
        const prev = compute(scope, level, true);
        prevBy = {};
        prev.rows.forEach(function (r) { prevBy[r.key] = r; });
      }
      cur.rows.forEach(function (r) {
        const p = prevBy ? prevBy[r.key] : null;
        if (!prevBy) { r.delta = { available: false }; return; }
        if (!p || !p.complete) { r.delta = { available: true, isNew: true }; return; }
        r.delta = { available: true, isNew: false,
                    rank: (r.rank !== null && p.rank !== null) ? p.rank - r.rank : null,
                    score: (r.final !== null) ? r.final - p.final : null,
                    prevRank: p.rank, prevScore: p.final };
      });
      cur.hasPrevious = !!prevBy;
      return cur;
    },

    /* 5 kartu "terbaik" per level, dihitung pada scope aktif */
    getBest: function (scope) {
      return LEVELS.map(function (lv) {
        const d = compute(scope, lv.key, false);
        const top = d.rows.filter(function (r) { return r.complete; })[0] || null;
        return { level: lv.key, levelLabel: lv.label, entity: top, count: d.rows.length };
      });
    },

    /* Analisis KPI: statistik + distribusi + top/bottom, null TIDAK dihitung 0 */
    getKpiAnalysis: function (scope, level, kpiKey) {
      const d = compute(scope, level, false);
      const isFinal = kpiKey === 'final';
      const valueOf = function (r) {
        if (isFinal) return r.final;
        const p = r.parts[kpiKey];
        if (!p) return null;
        /* tampilkan ACTUAL, bukan contribution */
        if (kpiKey === 'golden') return r.metrics.avg_ec;
        if (kpiKey === 'sc_jks') return r.metrics.sc_jks_pct;
        if (kpiKey === 'geo') return r.metrics.geo_match_pct;
        if (kpiKey === 'hit') return r.metrics.hit_rate_pct;
        if (kpiKey === 'roa') return r.metrics.ach_roa;
        if (kpiKey === 'omset') return r.metrics.ach_omset;
        if (kpiKey === 'epb') return r.metrics.ach_epb;
        return null;
      };
      const items = d.rows.map(function (r) { return { row: r, value: valueOf(r) }; });
      const valid = items.filter(function (x) { return x.value !== null && x.value !== undefined && !isNaN(x.value); });
      const vals = valid.map(function (x) { return x.value; }).slice().sort(function (a, b) { return a - b; });
      const n = vals.length;
      const stats = n ? {
        count: n, missing: items.length - n,
        average: vals.reduce(function (a, b) { return a + b; }, 0) / n,
        median: n % 2 ? vals[(n - 1) / 2] : (vals[n / 2 - 1] + vals[n / 2]) / 2,
        highest: vals[n - 1], lowest: vals[0]
      } : { count: 0, missing: items.length, average: null, median: null, highest: null, lowest: null };

      /* bucket numerik dari rentang data — bukan threshold bisnis karangan */
      let buckets = [];
      if (n) {
        const lo = vals[0], hi = vals[n - 1];
        if (hi === lo) buckets = [{ from: lo, to: hi, count: n }];
        else {
          const B = 5, step = (hi - lo) / B;
          for (let i = 0; i < B; i++) {
            const f = lo + step * i, t = i === B - 1 ? hi : lo + step * (i + 1);
            buckets.push({ from: f, to: t,
              count: vals.filter(function (v) { return i === B - 1 ? (v >= f && v <= t) : (v >= f && v < t); }).length });
          }
        }
      }
      const sortedDesc = valid.slice().sort(function (a, b) { return b.value - a.value; });
      return { level: level, kpi: kpiKey, items: items, stats: stats, buckets: buckets,
               top: sortedDesc.slice(0, 10), bottom: sortedDesc.slice(-10).reverse(), context: d.context, tat: d.tat };
    },

    /* Membership memakai items + boundary dari getKpiAnalysis yang sama. */
    getKpiBucketDetail: function (scope, level, kpiKey, bucketIndex) {
      const a = this.getKpiAnalysis(scope || {}, level, kpiKey);
      const idx = Number(bucketIndex), bucket = a.buckets[idx];
      if (!bucket) return null;
      const isLast = idx === a.buckets.length - 1;
      const entities = a.items.filter(function (x) {
        const v = x.value;
        if (v === null || v === undefined || isNaN(v)) return false;
        return isLast ? (v >= bucket.from && v <= bucket.to) : (v >= bucket.from && v < bucket.to);
      }).map(function (x) {
        return { key: x.row.key, code: x.row.code, name: x.row.name, label: x.row.label,
                 kind: x.row.kind, scope: x.row.scope, actual: x.value, finalScore: x.row.final,
                 category: x.row.category, categoryLabel: x.row.categoryLabel, meta: x.row.meta };
      });
      return { kpi: kpiKey, level: level, bucketIndex: idx,
               bucket: { from: bucket.from, to: bucket.to, count: bucket.count, isLast: isLast },
               count: entities.length, valid: a.stats.count,
               percentage: a.stats.count ? entities.length / a.stats.count * 100 : 0,
               entities: entities, context: a.context };
    },

    /* Analisis Nilai (COUNTIF) — null diabaikan, bukan dianggap 0 */
    countIf: function (scope, level, kpiKey, op, threshold) {
      const a = this.getKpiAnalysis(scope, level, kpiKey);
      const valid = a.items.filter(function (x) { return x.value !== null && !isNaN(x.value); });
      const hit = valid.filter(function (x) {
        const v = x.value;
        return op === '<' ? v < threshold : op === '<=' ? v <= threshold
             : op === '>' ? v > threshold : v >= threshold;
      });
      return { matched: hit.length, valid: valid.length, total: a.items.length,
               ignored: a.items.length - valid.length, rows: hit.map(function (x) { return x.row; }) };
    },

    /* Detail Ranking satu entity (audit trail Final Score) */
    getEntityDetail: function (scope, level, code) {
      const d = compute(scope, level, false);
      return d.rows.filter(function (r) { return r.code === code; })[0] || null;
    }
  };
})(DashboardService);

  function catClass(k) { return 'rk-cat rk-' + k; }

  /* nilai ACTUAL yang ditampilkan di kolom tabel (bukan contribution) */
  function actualOf(r, key) {
    const m = r.metrics;
    switch (key) {
      case 'sc_jks': return m.sc_jks_pct; case 'geo': return m.geo_match_pct;
      case 'hit': return m.hit_rate_pct;  case 'roa': return m.ach_roa;
      case 'omset': return m.ach_omset;   case 'epb': return m.ach_epb;
      case 'golden': return m.avg_ec;     default: return null;
    }
  }
  function actualText(r, key) {
    const v = actualOf(r, key);
    if (v === null || v === undefined || isNaN(v)) return '–';
    if (key === 'golden') return U.dec(v, 1);
    return U.dec(v, 1) + '%';
  }
  function cellTitle(r, key) {
    const p = r.parts[key], k = RS.KPIS.filter(function (x) { return x.key === key; })[0];
    if (!p) return '';
    return k.label + ' · sumber: ' + k.source +
      ' | Actual ' + (actualOf(r, key) === null ? '–' : U.dec(actualOf(r, key), 2) + (key === 'golden' ? '' : '%')) +
      ' | Score Basis ' + (p.basis === null ? '–' : U.dec(p.basis, 2)) +
      (k.tat ? ' (sudah dibagi TAT)' : '') +
      ' | Setelah cap ' + (p.score === null ? '–' : U.dec(p.score, 2)) +
      ' | Bobot ' + p.weight + '% → kontribusi ' + (p.contribution === null ? '–' : U.dec(p.contribution, 2));
  }

  function deltaHtml(d, kind) {
    if (!d || !d.available) return '<span class="rk-delta flat">–</span>';
    if (d.isNew) return '<span class="rk-delta new">BARU</span>';
    const v = kind === 'rank' ? d.rank : d.score;
    if (v === null || v === undefined || isNaN(v)) return '<span class="rk-delta flat">–</span>';
    const eps = kind === 'rank' ? 0.5 : 0.05;
    if (Math.abs(v) < eps) return '<span class="rk-delta flat">±0</span>';
    const up = v > 0;
    return '<span class="rk-delta ' + (up ? 'up' : 'down') + '">' + (up ? '↑' : '↓') + ' ' +
      (kind === 'rank' ? Math.abs(v) : U.dec(Math.abs(v), 1)) + '</span>';
  }

  /* ---------------- filter, search, sort ---------------- */
  function applyView(rows, st) {
    let out = rows.slice();
    const q = (st.search || '').trim().toLowerCase();
    if (q) out = out.filter(function (r) {
      return (r.label + ' ' + r.code).toLowerCase().indexOf(q) >= 0;
    });
    if (st.quick === 'top3') out = out.filter(function (r) { return r.rank !== null && r.rank <= 3; });
    else if (st.quick === 'bottom3') {
      const done = rows.filter(function (r) { return r.complete; });
      const cut = Math.max(1, done.length - 3);
      out = out.filter(function (r) { return r.rank !== null && r.rank > cut; });
    } else if (st.quick === 'critical') out = out.filter(function (r) { return r.category === 'critical'; });

    if (st.colFilter && st.colFilter.kpi) {
      const f = st.colFilter;
      out = out.filter(function (r) {
        const v = f.kpi === 'final' ? r.final : actualOf(r, f.kpi);
        if (v === null || v === undefined || isNaN(v)) return false;
        if (f.min !== null && v < f.min) return false;
        if (f.max !== null && v > f.max) return false;
        return true;
      });
    }
    if (st.catFilter) out = out.filter(function (r) { return r.category === st.catFilter; });

    if (st.sortKey) {
      const dir = st.sortDir === 'asc' ? 1 : -1;
      out.sort(function (a, b) {
        const av = st.sortKey === 'final' ? a.final : st.sortKey === 'rank' ? a.rank : actualOf(a, st.sortKey);
        const bv = st.sortKey === 'final' ? b.final : st.sortKey === 'rank' ? b.rank : actualOf(b, st.sortKey);
        const an = av === null || av === undefined || isNaN(av), bn = bv === null || bv === undefined || isNaN(bv);
        if (an !== bn) return an ? 1 : -1;
        if (an && bn) return a.label < b.label ? -1 : 1;
        return (av - bv) * dir || (a.label < b.label ? -1 : 1);
      });
    }
    return out;
  }

/* ============================================================================
   LAYER 15 — MASTER CABANG (V1.6)
   Parser CSV native (offline). XLSX memakai SheetJS 0.18.5 yang dimuat LAZY
   hanya saat dibutuhkan; bila tidak tersedia, jalur CSV tetap bekerja penuh.
   File diperlakukan sebagai DATA — tidak ada eval/script dari isi file.
   ========================================================================= */
const MasterCabangIO = {
  XLSX_URL: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  _xlsxLoading: null,
  loadXlsx: function () {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (this._xlsxLoading) return this._xlsxLoading;
    const url = this.XLSX_URL;
    this._xlsxLoading = new Promise(function (res, rej) {
      const sc = document.createElement('script');
      sc.src = url; sc.async = true;
      sc.onload = function () { window.XLSX ? res(window.XLSX) : rej(new Error('SheetJS gagal dimuat.')); };
      sc.onerror = function () { rej(new Error('SheetJS tidak dapat dimuat (offline atau CDN diblokir).')); };
      document.head.appendChild(sc);
    });
    return this._xlsxLoading;
  },

  /* CSV parser: menghormati tanda kutip, koma/;/tab, dan CRLF */
  parseCsv: function (text) {
    const t = text.replace(/^﻿/, '');
    const firstLine = t.split(/\r?\n/)[0] || '';
    const delim = (firstLine.split(';').length > firstLine.split(',').length) ? ';'
                : (firstLine.split('\t').length > firstLine.split(',').length) ? '\t' : ',';
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (q) {
        if (c === '"') { if (t[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c === '\r') { /* abaikan */ }
      else cell += c;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (v) { return String(v).trim() !== ''; }); });
  },

  HEADER_MAP: {
    region: ['region', 'regional', 'kode region', 'kode regional', 'region code'],
    depot_code: ['kode depo', 'kode', 'kode_depo', 'depot code', 'kodedepo', 'kode depot', 'depo code'],
    branch: ['cabang', 'branch', 'nama cabang'],
    depot_name: ['depo', 'nama depo', 'depot', 'nama depot'],
    plant: ['plant'], area: ['area']
  },
  detectHeader: function (rowArr) {
    const norm = rowArr.map(function (v) { return String(v === null || v === undefined ? '' : v).trim().toLowerCase(); });
    const idx = {};
    Object.keys(MasterCabangIO.HEADER_MAP).forEach(function (field) {
      const alias = MasterCabangIO.HEADER_MAP[field];
      for (let i = 0; i < norm.length; i++) if (alias.indexOf(norm[i]) >= 0) { idx[field] = i; break; }
    });
    return idx;
  },

  /* Validasi lengkap sesuai aturan: wajib isi, satu kode -> satu cabang & satu region,
     duplikat identik dideduplikasi, konflik Plant/Area ditandai. */
  validate: function (matrix) {
    const out = { ok: false, totalRows: 0, valid: 0, duplicates: 0, errors: [], conflicts: [],
                  rows: [], regionals: 0, branches: 0, depots: 0, headerFound: false };
    if (!matrix || !matrix.length) { out.errors.push('File kosong atau tidak terbaca.'); return out; }

    let headerIdx = -1, idx = null;
    for (let i = 0; i < Math.min(matrix.length, 15); i++) {
      const cand = MasterCabangIO.detectHeader(matrix[i]);
      if (cand.region !== undefined && cand.depot_code !== undefined && cand.branch !== undefined) {
        headerIdx = i; idx = cand; break;
      }
    }
    if (headerIdx < 0) {
      out.errors.push('Header tidak ditemukan. Wajib ada kolom REGION, KODE DEPO, dan CABANG.');
      return out;
    }
    out.headerFound = true;

    const body = matrix.slice(headerIdx + 1);
    out.totalRows = body.length;
    const seen = {}, byCode = {};
    const norm = function (v) { return String(v === null || v === undefined ? '' : v).trim(); };

    body.forEach(function (r, n) {
      const line = headerIdx + n + 2;
      const region = norm(r[idx.region]).toUpperCase();
      const code = OrgResolver.normCode(r[idx.depot_code]);
      const branch = norm(r[idx.branch]).toUpperCase();
      const depotName = idx.depot_name !== undefined ? norm(r[idx.depot_name]) : '';
      const plant = idx.plant !== undefined ? norm(r[idx.plant]) : '';
      const area = idx.area !== undefined ? norm(r[idx.area]) : '';

      if (!region) { out.errors.push('Baris ' + line + ': REGION kosong.'); return; }
      if (!code)   { out.errors.push('Baris ' + line + ': KODE DEPO kosong.'); return; }
      if (!branch) { out.errors.push('Baris ' + line + ': CABANG kosong.'); return; }

      const sig = [region, code, branch, depotName, plant, area].join('|');
      if (seen[sig]) { out.duplicates++; return; }
      seen[sig] = 1;

      const prev = byCode[code];
      if (prev) {
        if (prev.branch_name !== branch)
          out.errors.push('Baris ' + line + ': KODE DEPO ' + code + ' terpetakan ke dua CABANG berbeda (' +
                          prev.branch_name + ' vs ' + branch + ').');
        if (prev.regional_code !== region)
          out.errors.push('Baris ' + line + ': KODE DEPO ' + code + ' terpetakan ke dua REGION berbeda (' +
                          prev.regional_code + ' vs ' + region + ').');
        if (prev.branch_name === branch && prev.regional_code === region &&
            (prev.plant !== plant || prev.area !== area))
          out.conflicts.push('KODE DEPO ' + code + ': PLANT/AREA berbeda antar baris (' +
                             (prev.plant || '–') + '/' + (prev.area || '–') + ' vs ' + (plant || '–') + '/' + (area || '–') + ').');
        return;
      }
      const rec = { regional_code: region, regional_name: region, depot_code: code,
                    branch_name: branch, depot_name: depotName, plant: plant, area: area };
      byCode[code] = rec; out.rows.push(rec); out.valid++;
    });

    const regs = {}, brs = {};
    out.rows.forEach(function (r) { regs[r.regional_code] = 1; brs[r.regional_code + '|' + r.branch_name] = 1; });
    out.regionals = Object.keys(regs).length;
    out.branches = Object.keys(brs).length;
    out.depots = out.rows.length;
    out.ok = out.errors.length === 0 && out.conflicts.length === 0 && out.valid > 0;
    return out;
  },

  readFile: function (file) {
    const name = (file.name || '').toLowerCase();
    if (/\.csv$/.test(name) || /\.txt$/.test(name)) {
      return file.text().then(function (t) { return MasterCabangIO.parseCsv(t); });
    }
    return MasterCabangIO.loadXlsx().then(function (X) {
      return file.arrayBuffer().then(function (buf) {
        const wb = X.read(new Uint8Array(buf), { type: 'array', cellText: true, cellDates: false, raw: false });
        const ws = wb.Sheets[wb.SheetNames[0]];
        /* raw:false + defval agar leading zero pada Kode Depo tidak hilang */
        return X.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
      });
    });
  }
};

/* V1.7.5 — parser Master Salesman Project.
   V1.7.6 — menjadi parser MASTER SALESMAN: Project membership + ASS owner.
   SheetJS/CSV memakai loader existing. Alias dibatasi (tanpa fuzzy matching). */
const SalesmanProjectIO = {
  HEADER_MAP: {
    salesman_code: ['salesman code', 'salesman_code', 'kode salesman', 'kode sales'],
    project: ['project', 'project name', 'nama project'],
    salesman_name: ['salesman name', 'nama salesman'],
    status: ['status', 'active', 'aktif'],
    ass_name: ['ass', 'ass name', 'nama ass'],
    ass_code: ['ass code', 'ass_code', 'kode ass']
  },
  detectHeader: function (row) {
    const norm = (row || []).map(function (v) { return String(v === null || v === undefined ? '' : v).trim().toLowerCase(); });
    const idx = {};
    Object.keys(this.HEADER_MAP).forEach(function (field) {
      const aliases = SalesmanProjectIO.HEADER_MAP[field];
      for (let i = 0; i < norm.length; i++) if (aliases.indexOf(norm[i]) >= 0) { idx[field] = i; break; }
    });
    return idx;
  },
  activeValue: function (v, columnExists) {
    if (!columnExists) return true;
    const x = String(v === null || v === undefined ? '' : v).trim().toUpperCase();
    return ['AKTIF', 'ACTIVE', '1', 'TRUE', 'YA', 'YES'].indexOf(x) >= 0;
  },
  validate: function (matrix) {
    const out = { ok: false, totalRows: 0, valid: 0, invalid: 0, duplicates: 0,
      rows: [], errors: [], conflicts: [], warnings: [],
      uniqueSalesmen: 0, uniqueProjects: 0, uniqueAss: 0, hasAssColumn: false,
      matched: 0, unmatched: 0 };
    if (!matrix || !matrix.length) { out.errors.push('File kosong atau tidak terbaca.'); return out; }
    let headerAt = -1, idx = null;
    for (let i = 0; i < Math.min(matrix.length, 15); i++) {
      const c = this.detectHeader(matrix[i]);
      if (c.salesman_code !== undefined && c.project !== undefined) { headerAt = i; idx = c; break; }
    }
    if (headerAt < 0) {
      out.errors.push('Header tidak ditemukan. Wajib ada kolom SALESMAN CODE dan PROJECT.'); return out;
    }
    out.hasAssColumn = (idx.ass_name !== undefined || idx.ass_code !== undefined);
    const body = matrix.slice(headerAt + 1);
    const seen = new Map();            /* salesman+project -> { assKey, assLabel, line } */
    const salesmen = new Set(), projects = new Set(), assKeys = new Set();
    const assBySalesman = new Map();   /* salesman_code -> owner ASS pertama yang valid */
    function cell(row, i) {
      if (i === undefined) return '';
      const v = row[i];
      return String(v === null || v === undefined ? '' : v).trim();
    }
    out.totalRows = body.length;
    body.forEach(function (r, n) {
      if (!(r || []).some(function (v) { return String(v === null || v === undefined ? '' : v).trim() !== ''; })) return;
      const line = headerAt + n + 2;
      const code = cell(r, idx.salesman_code);
      const project = cell(r, idx.project);
      const name = cell(r, idx.salesman_name);
      const assName = cell(r, idx.ass_name);
      const assCode = cell(r, idx.ass_code);
      const active = SalesmanProjectIO.activeValue(idx.status === undefined ? '' : r[idx.status], idx.status !== undefined);
      if (!code || !project) {
        out.invalid++;
        if (out.errors.length < 20) out.errors.push('Baris ' + line + ': SALESMAN CODE atau PROJECT kosong.');
        return;
      }
      const pkey = SalesmanProjectScope.projectKey(project), sig = code + '\u0001' + pkey;
      const assKey = SalesmanProjectScope.assKeyOf(assName, assCode);
      const assLabel = assName || assCode || '';
      const prev = seen.get(sig);
      if (prev) {
        /* Duplicate identik boleh dedupe. Duplicate dengan ASS berbeda = KONFLIK, save diblok. */
        if (prev.assKey === assKey) { out.duplicates++; return; }
        if (out.conflicts.length < 20)
          out.conflicts.push('Baris ' + line + ': KONFLIK ASS untuk Salesman ' + code + ' pada Project ' + project +
            ' \u2014 "' + (prev.assLabel || '(kosong)') + '" vs "' + (assLabel || '(kosong)') + '".');
        out.invalid++;
        return;
      }
      seen.set(sig, { assKey: assKey, assLabel: assLabel, line: line });
      /* Salesman pada 2 Project boleh beda ASS (assignment project berbeda):
         audit warning, BUKAN error fatal. Owner = ASS valid pertama. */
      if (assKey) {
        const own = assBySalesman.get(code);
        if (!own) assBySalesman.set(code, { key: assKey, label: assLabel, project: project });
        else if (own.key !== assKey && out.warnings.length < 20)
          out.warnings.push('Salesman ' + code + ' memiliki ASS berbeda antar Project: "' + own.label +
            '" (' + own.project + ') vs "' + assLabel + '" (' + project + '). Owner dipakai: "' + own.label + '".');
      }
      out.rows.push({ salesman_code: code, salesman_name: name, project: project,
        project_key: pkey, ass_name: assName, ass_code: assCode, ass_key: assKey,
        active: active, status: active ? 'ACTIVE' : 'INACTIVE' });
      out.valid++; salesmen.add(code);
      if (active) { projects.add(pkey); if (assKey) assKeys.add(assKey); }
    });
    out.uniqueSalesmen = salesmen.size; out.uniqueProjects = projects.size; out.uniqueAss = assKeys.size;
    const stats = SalesmanProjectScope.matchStats({ rows: out.rows });
    out.matched = stats.matched; out.unmatched = stats.unmatched;
    out.ok = out.valid > 0 && out.uniqueProjects > 0 && out.errors.length === 0 && out.conflicts.length === 0;
    return out;
  },
  readFile: function (file) {
    const name = String(file && file.name || '').toLowerCase();
    if (!/\.(xlsx|xls|csv)$/.test(name)) return Promise.reject(new Error('Format file harus XLSX, XLS, atau CSV.'));
    return MasterCabangIO.readFile(file);
  }
};

/* V1.7.7.9.2.1 — workflow governance: Download → Upload → Validate → Preview → Confirm → Apply. */
const MasterControlIO = {
  _applying: false,
  HEADERS: ['KODE DEPO','REGIONAL','CABANG','DEPO','PLANT','STATUS MONITORING','STATUS RANKING','STATUS INFORMASI'],

  normalizeHeader: function (v) {
    return String(v || '').trim().toUpperCase().replace(/[_-]+/g, ' ').replace(/\s+/g, ' ');
  },

  cleanText: function (v) {
    return String(v === null || v === undefined ? '' : v).trim().replace(/\s+/g, ' ');
  },

  sameText: function (a, b) {
    return this.cleanText(a).toUpperCase() === this.cleanText(b).toUpperCase();
  },

  parseRegional: function (v) {
    const s = this.cleanText(v);
    const m = s.match(/^(R\d{2})\s+(.+)$/i);
    return m
      ? { code: String(m[1]).toUpperCase(), name: this.cleanText(m[2]) }
      : { code: '', name: s };
  },

  parseBranch: function (v) {
    const s = this.cleanText(v);
    const m = s.match(/^(R\d{2}\.\d{2})\s+(.+)$/i);
    return m
      ? { code: String(m[1]).toUpperCase(), name: this.cleanText(m[2]) }
      : { code: '', name: s };
  },

  formatRegional: function (r) {
    const code = this.cleanText(r && r.regional_code).toUpperCase();
    const name = this.cleanText(r && r.regional_name);
    return [code, name].filter(Boolean).join(' ').trim();
  },

  formatBranch: function (r) {
    const code = this.cleanText(r && r.branch_code).toUpperCase();
    const name = this.cleanText(r && r.branch_name);
    return [code, name].filter(Boolean).join(' ').trim();
  },

  download: function () {
    const self = this;
    const xl = function (v) {
      const s = String(v === null || v === undefined ? '' : v);
      return /^[=+\-@]/.test(s) ? "'" + s : s;
    };

    const rows = MasterCabangAuthority.rows.map(function (r) {
      return {
        'KODE DEPO': xl(r.depot_code),
        /* V1.7.7.7: export hierarchy authority lengkap agar round-trip Excel
           tidak membuang regional_code / branch_code. */
        'REGIONAL': xl(self.formatRegional(r)),
        'CABANG': xl(self.formatBranch(r)),
        'DEPO': xl(r.depot_name || ''),
        'PLANT': xl(r.plant || ''),
        'STATUS MONITORING': MasterCabangAuthority.status(r.depot_code, 'monitoring'),
        'STATUS RANKING': MasterCabangAuthority.status(r.depot_code, 'ranking'),
        'STATUS INFORMASI': MasterCabangAuthority.status(r.depot_code, 'informasi')
      };
    });

    return MasterCabangIO.loadXlsx().then(function (X) {
      const ws = X.utils.json_to_sheet(rows, { header: MasterControlIO.HEADERS });
      ws['!cols'] = [{wch:16},{wch:24},{wch:30},{wch:28},{wch:14},{wch:20},{wch:18},{wch:20}];
      const wb = X.utils.book_new();
      X.utils.book_append_sheet(wb, ws, 'MASTER CABANG');
      X.writeFile(wb, 'Master-Cabang-Saat-Ini-' + U.wibNowDate() + '.xlsx');
      return rows.length;
    });
  },

  validate: function (matrix) {
    const out = {
      ok: false,
      valid: false,
      rows: [],
      changes: [],
      unchanged: [],
      invalid: [],
      missing: [],
      errors: []
    };

    if (!matrix || !matrix.length) {
      out.errors.push('File kosong atau tidak terbaca.');
      return out;
    }

    let at = -1, idx = {};
    for (let i = 0; i < Math.min(15, matrix.length); i++) {
      const norm = (matrix[i] || []).map(this.normalizeHeader);
      const test = {};
      this.HEADERS.forEach(function (h) { test[h] = norm.indexOf(h); });
      /* Backward compatible: file V1.7.7.8 tanpa PLANT tetap valid dan memakai
         Plant current. Download V1.7.7.9.2.1 selalu menyertakan PLANT. */
      if (this.HEADERS.filter(function (h) { return h !== 'PLANT'; })
          .every(function (h) { return test[h] >= 0; })) {
        at = i;
        idx = test;
        break;
      }
    }

    if (at < 0) {
      out.errors.push('Header wajib tidak lengkap. Gunakan file hasil Download Master Saat Ini.');
      return out;
    }

    const seen = {};
    const self = this;

    for (let n = at + 1; n < matrix.length; n++) {
      const r = matrix[n] || [];
      const line = n + 1;

      if (!r.some(function (v) { return String(v || '').trim(); })) continue;

      const code = LiveNormalize.code(r[idx['KODE DEPO']]);
      if (!code) {
        out.invalid.push({ line: line, message: 'Kode Depo kosong.' });
        continue;
      }

      if (seen[code]) {
        out.invalid.push({ line: line, code: code, message: 'Kode Depo duplikat.' });
        continue;
      }
      seen[code] = 1;

      const current = MasterCabangAuthority.byDepot[code];
      if (!current) {
        out.invalid.push({ line: line, code: code, message: 'Kode Depo tidak dikenal.' });
        continue;
      }

      const regionalRaw = self.parseRegional(r[idx['REGIONAL']]);
      const branchRaw = self.parseBranch(r[idx['CABANG']]);
      const depotName = self.cleanText(r[idx['DEPO']]);
      const plant = idx['PLANT'] >= 0
        ? self.cleanText(r[idx['PLANT']]).toUpperCase()
        : self.cleanText(current.plant).toUpperCase();

      if (!regionalRaw.name || !branchRaw.name || !depotName) {
        out.invalid.push({
          line: line,
          code: code,
          message: 'REGIONAL, CABANG, dan DEPO wajib terisi.'
        });
        continue;
      }

      if (plant && !/^[A-Z0-9._/-]{1,64}$/.test(plant)) {
        out.invalid.push({ line: line, code: code, message: 'Plant tidak valid. Contoh yang didukung: P194, 283, atau 55.' });
        continue;
      }

      /* Backward compatible:
         - File baru: "R02 SUMBAR" / "R02.01 PADANG" -> code + name authority.
         - File lama: "SUMBAR" / "PADANG" -> nama tetap dapat divalidasi,
           sedangkan code menggunakan authority current agar tidak hilang. */
      const desiredRegionalCode = regionalRaw.code ||
        self.cleanText(current.regional_code).toUpperCase();
      const desiredBranchCode = branchRaw.code ||
        self.cleanText(current.branch_code).toUpperCase();

      if (desiredRegionalCode && !/^R\d{2}$/.test(desiredRegionalCode)) {
        out.invalid.push({
          line: line,
          code: code,
          message: 'Kode Regional tidak valid. Format contoh: R02 SUMBAR.'
        });
        continue;
      }

      if (desiredBranchCode && !/^R\d{2}\.\d{2}$/.test(desiredBranchCode)) {
        out.invalid.push({
          line: line,
          code: code,
          message: 'Kode Cabang tidak valid. Format contoh: R02.01 PADANG.'
        });
        continue;
      }

      if (desiredRegionalCode && desiredBranchCode &&
          desiredBranchCode.slice(0, 3) !== desiredRegionalCode) {
        out.invalid.push({
          line: line,
          code: code,
          message: 'Kode Cabang tidak konsisten dengan Kode Regional.'
        });
        continue;
      }

      const raw = {
        regional_code: desiredRegionalCode,
        regional_name: regionalRaw.name,
        branch_code: desiredBranchCode,
        branch_name: branchRaw.name,
        depot_name: depotName,
        plant: plant,
        status_monitoring: self.cleanText(r[idx['STATUS MONITORING']]).toUpperCase(),
        status_ranking: self.cleanText(r[idx['STATUS RANKING']]).toUpperCase(),
        status_informasi: self.cleanText(r[idx['STATUS INFORMASI']]).toUpperCase()
      };

      const bad = ['status_monitoring','status_ranking','status_informasi'].filter(function (k) {
        return ['AKTIF','TAKE OUT'].indexOf(raw[k]) < 0;
      });

      if (bad.length) {
        out.invalid.push({
          line: line,
          code: code,
          message: 'Status hanya boleh AKTIF atau TAKE OUT.'
        });
        continue;
      }

      const before = {
        regional_code: self.cleanText(current.regional_code).toUpperCase(),
        regional_name: self.cleanText(current.regional_name),
        branch_code: self.cleanText(current.branch_code).toUpperCase(),
        branch_name: self.cleanText(current.branch_name),
        depot_name: self.cleanText(current.depot_name),
        plant: self.cleanText(current.plant).toUpperCase(),
        status_monitoring: MasterCabangAuthority.status(code, 'monitoring'),
        status_ranking: MasterCabangAuthority.status(code, 'ranking'),
        status_informasi: MasterCabangAuthority.status(code, 'informasi')
      };

      const changed =
        before.regional_code !== raw.regional_code ||
        !self.sameText(before.regional_name, raw.regional_name) ||
        before.branch_code !== raw.branch_code ||
        !self.sameText(before.branch_name, raw.branch_name) ||
        !self.sameText(before.depot_name, raw.depot_name) ||
        before.plant !== raw.plant ||
        before.status_monitoring !== raw.status_monitoring ||
        before.status_ranking !== raw.status_ranking ||
        before.status_informasi !== raw.status_informasi;

      const item = {
        depot_code: code,
        regional: raw.regional_name || before.regional_name || before.regional_code || '',
        branch: raw.branch_name || before.branch_name || before.branch_code || '',
        depot: raw.depot_name || before.depot_name || code,
        before: before,
        after: raw
      };

      (changed ? out.changes : out.unchanged).push(item);
      out.rows.push(item);
    }

    /* Row yang tidak ada di file = NO CHANGE. Jangan delete / Take Out. */
    MasterCabangAuthority.rows.forEach(function (r) {
      const code = LiveNormalize.code(r && r.depot_code);
      if (code && !seen[code]) out.missing.push(code);
    });

    if (out.invalid.length) {
      out.errors.push(out.invalid.length + ' baris invalid. Tidak ada perubahan yang akan diterapkan.');
    }

    out.valid = out.errors.length === 0;
    out.ok = out.valid && out.changes.length > 0;
    return out;
  }
};

RankingMasterView.preview = function () {
  const p = this._preview;
  if (!p) return '';

  const v = p.result;

  const list = v.changes.map(function (r) {
    function diffText(before, after, label) {
      const b = String(before === null || before === undefined ? '' : before).trim();
      const a = String(after === null || after === undefined ? '' : after).trim();
      if (b.toUpperCase() === a.toUpperCase()) return '';
      return '<div><b>' + label + ':</b> ' + U.esc(b || '–') + ' → ' + U.esc(a || '–') + '</div>';
    }

    function fmt(code, name) {
      return [String(code || '').trim(), String(name || '').trim()].filter(Boolean).join(' ');
    }

    const d =
      diffText(fmt(r.before.regional_code, r.before.regional_name),
               fmt(r.after.regional_code, r.after.regional_name), 'Regional') +
      diffText(fmt(r.before.branch_code, r.before.branch_name),
               fmt(r.after.branch_code, r.after.branch_name), 'Cabang') +
      diffText(r.before.depot_name, r.after.depot_name, 'Depo') +
      diffText(r.before.plant, r.after.plant, 'Plant') +
      diffText(r.before.status_monitoring, r.after.status_monitoring, 'Monitoring') +
      diffText(r.before.status_ranking, r.after.status_ranking, 'Ranking') +
      diffText(r.before.status_informasi, r.after.status_informasi, 'Informasi');

    const current = MasterCabangAuthority.byDepot[r.depot_code] || {};
    const oldName = String(r.before.depot_name || '').trim();
    const newName = String(r.after.depot_name || '').trim();
    const alias = oldName && oldName.toUpperCase() !== newName.toUpperCase()
      ? oldName.toUpperCase() + ' (HISTORICAL)' : '–';

    return '<tr><td>UPDATED</td><td>' + U.esc(r.depot_code) + '</td><td>' +
      U.esc(oldName || '–') + '</td><td>' + U.esc(newName || '–') + '</td><td>' +
      U.esc(alias) + '</td><td>' + U.esc(r.after.plant || current.plant || '–') + '</td><td class="master-diff">' +
      (d || '–') + '</td></tr>';
  }).concat(v.invalid.map(function (r) {
    return '<tr><td>INVALID</td><td>' + U.esc(r.code || '–') + '</td><td>Baris ' +
      U.int(r.line) + '</td><td>–</td><td>–</td><td>–</td><td>' + U.esc(r.message) + '</td></tr>';
  })).join('');

  let subtitle = 'Belum dapat diterapkan';
  if (v.valid && v.changes.length) subtitle = 'Valid · ' + U.int(v.changes.length) +
    ' perubahan · Siap diterapkan ke Supabase';
  else if (v.valid) subtitle = 'Valid · Tidak ada perubahan';

  return UI.section(
    'Preview Perubahan — ' + U.esc(p.fileName),
    subtitle,
    '<div class="mgrid">' +
      '<div class="mcell"><div class="mcell-l">UPDATED</div><div class="mcell-v">' + U.int(v.changes.length) + '</div></div>' +
      '<div class="mcell"><div class="mcell-l">UNCHANGED</div><div class="mcell-v">' + U.int(v.unchanged.length) + '</div></div>' +
      '<div class="mcell"><div class="mcell-l">TIDAK ADA DI FILE · NO CHANGE</div><div class="mcell-v">' + U.int((v.missing || []).length) + '</div></div>' +
      '<div class="mcell"><div class="mcell-l">INVALID</div><div class="mcell-v">' + U.int(v.invalid.length) + '</div></div>' +
    '</div>' +
    (v.errors.length ? '<div class="rk-warn">' + v.errors.map(U.esc).join('<br>') + '</div>' : '') +
    ((v.missing || []).length
      ? '<div class="dd-note">' + U.int(v.missing.length) +
        ' Depo tidak ada di file upload dan diperlakukan sebagai <b>NO CHANGE</b>. Tidak dihapus dan tidak otomatis TAKE OUT.</div>'
      : '') +
    (!MASTER_CONTROL_WRITE_ENABLED
      ? '<div class="rk-warn"><b>Apply tidak tersedia pada konfigurasi ini.</b></div>'
      : '') +
    '<div class="result-table-wrap"><table class="rtbl"><thead><tr><th>Status</th><th>Kode Depo</th><th>Current Name</th><th>New Name</th><th>Alias Ditambahkan</th><th>Plant</th><th>Perubahan</th></tr></thead><tbody>' +
      (list || '<tr><td colspan="7">Tidak ada perubahan.</td></tr>') +
    '</tbody></table></div>' +
    '<div class="rk-btnrow">' +
      '<button class="btn-primary" data-act="master-confirm"' +
        ((v.valid && v.changes.length && !MasterControlIO._applying && MASTER_CONTROL_WRITE_ENABLED) ? '' : ' disabled') + '>' +
        (MasterControlIO._applying ? 'Menerapkan…' : 'Terapkan ke Supabase') + '</button>' +
      '<button class="btn-ghost" data-act="master-cancel">Batal</button>' +
    '</div>'
  );
};

      'ditampilkan pada mode LIVE.</div></div></div></section>';
