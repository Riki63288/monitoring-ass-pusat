    const body = h.rows.map(function (r) {
      const m = r.metrics;
      if (!m.n) return '<tr><td><span class="row-name"><span class="row-code">' + U.esc(r.code) +
        '</span><span class="row-label">' + U.esc(r.label) + '</span></span></td>' +
        '<td colspan="10" style="text-align:center;color:var(--ink-3)">Tidak ada data pada periode ini</td></tr>';
      return '<tr class="clickable" data-act="drill" data-kind="' + r.kind + '" data-code="' + U.esc(r.code) +
        '" data-scope=\'' + JSON.stringify(r.scope) + '\'>' +
        '<td><span class="row-name"><span class="row-code">' + U.esc(r.code) + '</span>' +
          '<span class="row-label">' + U.esc(r.label) + '</span><span class="row-chev">›</span></span></td>' +
        '<td>' + (isSm ? U.int(m.visit) : U.int(r.salesmanCount)) + '</td>' +
        '<td>' + U.dec(m.avg_visit, 1) + '</td>' +
        '<td>' + mtag(m.sc_jks_pct, 88, 82, function (v) { return U.pct(v); }) + '</td>' +
        '<td>' + mtag(m.geo_match_pct, 88, 82, function (v) { return U.pct(v); }) + '</td>' +
        '<td>' + mtag(m.hit_rate_pct, 65, 55, function (v) { return U.pct(v); }) + '</td>' +
        '<td>' + U.clock(m.avg_check_in) + '</td>' +
        '<td>' + U.clock(m.avg_check_out) + '</td>' +
        '<td>' + U.durShort(m.avg_transport_minutes) + '</td>' +
        '<td>' + scorePill(m.process_score) + '</td>' +
        '<td>' + anomCell(m) + '</td></tr>';
    }).join('');

    const t = h.total;
    const foot = '<tr><td>Total ' + U.esc(currentScopeLabel()) + '</td>' +
      '<td>' + (isSm ? U.int(t.visit) : U.int(t.salesmen)) + '</td>' +
      '<td>' + U.dec(t.avg_visit, 1) + '</td><td>' + U.pct(t.sc_jks_pct) + '</td>' +
      '<td>' + U.pct(t.geo_match_pct) + '</td><td>' + U.pct(t.hit_rate_pct) + '</td>' +
      '<td>' + U.clock(t.avg_check_in) + '</td><td>' + U.clock(t.avg_check_out) + '</td>' +
      '<td>' + U.durShort(t.avg_transport_minutes) + '</td><td>' + scorePill(t.process_score) + '</td>' +
      '<td>' + U.int(t.anomaly_total) + '</td></tr>';

    return '<div class="table-wrap"><table class="tbl"><thead>' + head + '</thead><tbody>' + body +
           '</tbody><tfoot>' + foot + '</tfoot></table></div>';
  }

  /* ---------------- V1.1 MONITORING HARIAN (tanggal = kolom, MTD) ----------------
     Semua angka datang jadi dari DashboardService.getDailyMonitoring().
     Renderer di sini hanya memformat & mewarnai. */
  const NEXT_LEVEL = { regional: 'Cabang', branch: 'Depo', depot: 'ASS',
                       ass: 'Salesman', salesman: 'Detail Salesman' };

  /* V1.5 — saat tabel dirender di dalam popup drill-down, baris TOTAL harus memakai
     nama entitas popup, bukan scope halaman utama. Override bersifat sinkron
     (hanya aktif selama string tabel dibangun). */
  let _scopeLabelOverride = null;
  function currentScopeLabel() { return _scopeLabelOverride || scopeName(); }
  function withScopeLabel(label, fn) {
    _scopeLabelOverride = label || null;
    try { return fn(); } finally { _scopeLabelOverride = null; }
  }

  function dailyCell(v, metric, extraCls) {
    const cls = S.heatOf(v, metric.bands);
    if (cls === 'none')
      return '<td class="hm-none' + (extraCls ? ' ' + extraCls : '') + '" title="Belum ada data pada tanggal ini">–</td>';
    return '<td class="hm-' + cls + (extraCls ? ' ' + extraCls : '') + '" title="' +
           U.esc(metric.label + ': ' + metric.full(v)) + '">' + metric.cell(v) + '</td>';
  }

  function renderDailyTable(dm) {
    if (!dm.rows.length) return UI.empty('Tidak Ada Unit', 'Tidak ada unit di bawah scope ini.');
    if (!dm.dates.length) return UI.empty('Belum Ada Hari Kerja', 'Bulan berjalan belum memiliki tanggal kerja dengan data.');

    const m = dm.metric;
    const dateHead = dm.dates.map(function (d) {
      const p = U.dParts(d);
      return '<th class="' + (d === dm.today ? 'is-today' : '') + '" title="' + U.esc(U.dDow(d) + ', ' + U.dMed(d)) + '">' +
        '<div class="dh-d">' + U.pad(p.d) + '</div><div class="dh-w">' + U.esc(U.dDow(d).slice(0, 3)) + '</div></th>';
    }).join('');

    const head = '<tr><th class="col-name">' + U.esc(dm.childLabel) + '</th>' + dateHead +
                 '<th class="col-mtd">AVG MTD</th></tr>';

    const body = dm.rows.map(function (r) {
      const partial = r.days > 0 && r.days < dm.dates.length
        ? '<span class="row-code" style="background:none;color:var(--ink-3)">' + r.days + '/' + dm.dates.length + ' hr</span>' : '';
      const nameCell = '<td class="col-name"><span class="row-name">' +
        '<span class="row-code">' + U.esc(r.code) + '</span>' +
        '<span class="row-label">' + U.esc(r.label) + '</span>' + partial +
        '<span class="row-chev">›</span></span></td>';
      const cells = dm.dates.map(function (d) {
        return dailyCell(r.values[d] === undefined ? null : r.values[d], m);
      }).join('');
      const mtd = r.mtd === null
        ? '<td class="col-mtd hm-none" title="Tidak ada data pada bulan berjalan">–</td>'
        : '<td class="col-mtd hm-' + S.heatOf(r.mtd, m.bands) + '">' + m.full(r.mtd) + '</td>';
      return '<tr class="clickable" data-act="drill" data-kind="' + r.kind + '" data-code="' + U.esc(r.code) +
        '" data-scope=\'' + JSON.stringify(r.scope) + '\' title="Klik untuk membuka ' +
        U.esc(NEXT_LEVEL[r.kind] || '') + '">' + nameCell + cells + mtd + '</tr>';
    }).join('');

    const t = dm.total;
    const footCells = dm.dates.map(function (d) {
      const v = t.values[d] === undefined ? null : t.values[d];
      return v === null ? '<td class="hm-none">–</td>' : '<td>' + m.cell(v) + '</td>';
    }).join('');
    const foot = '<tr><td class="col-name">Total ' + U.esc(currentScopeLabel()) + '</td>' + footCells +
      '<td class="col-mtd">' + (t.mtd === null ? '–' : m.full(t.mtd)) + '</td></tr>';

    return '<div class="daily-wrap" data-dsrc="process_daily"><table class="dtbl"><thead>' + head + '</thead><tbody>' + body +
           '</tbody><tfoot>' + foot + '</tfoot></table></div>';
  }

  function dailySectionHtml(dm) {
    const m = dm.metric;
    const seg = dm.metrics.map(function (x) {
      return '<button data-act="dmetric" data-m="' + x.key + '" aria-pressed="' + (x.key === m.key) + '">' +
             U.esc(x.label) + '</button>';
    }).join('');
    const backBtn = dm.level === 'national' ? '' : '<button class="btn-ghost" data-act="back">← Kembali</button>';

    /* legend V1.2 — teks ambang datang dari service supaya tidak pernah beda dgn heatmap */
    const SW = ['#c2e7d3', '#e8f5ee', '#fdf1d6', '#fadfd0'];
    const legend = '<div class="hm-legend"><span>Skala ' + U.esc(m.label) + ':</span>' +
      m.legend.map(function (txt, i) {
        return '<span class="hl"><span class="hl-sw" style="background:' + SW[i] + '"></span>' + U.esc(txt) + '</span>';
      }).join('') +
      '<span class="hl"><span class="hl-sw" style="background:#ffffff"></span>– belum ada data (bukan nilai nol)</span></div>';

    const note = '<div class="note-inline" style="padding:9px 0 0">' +
      'Tabel ini <b>selalu menampilkan bulan berjalan</b> dan tidak terpengaruh filter Periode (Hari Ini / 7 Hari); ' +
      'filter Regional/Cabang/Depo tetap berlaku. AVG MTD memakai authority yang sama dengan KPI Summary MTD: ' +
      '<b>process_period_summary.mtd</b>, fallback <b>process_depot_summary</b>, dan parent rata-rata antar Depo valid. ' +
      'Urutan baris: AVG MTD terburuk lebih dulu' +
      (dm.noDataCount ? '; ' + dm.noDataCount + ' unit tanpa data ditempatkan paling bawah.' : '.') + '</div>';

    return '<section class="section" id="dailySection">' +
      '<div class="section-head"><span class="section-title">Monitoring Harian</span>' +
      '<span class="spacer"></span>' +
      '<div class="seg" role="group" aria-label="Pilih metrik">' + seg + '</div>' + backBtn + '</div>' +
      '<div class="section-body flush">' + renderDailyTable(dm) + '</div>' +
      '<div class="section-body" style="padding-top:10px">' + legend + note + '</div></section>';
  }

  /* update terpisah saat ganti metrik: posisi scroll horizontal dipertahankan */
  function updateDaily() {
    const old = document.getElementById('dailySection');
    if (!old) return;
    const w = old.querySelector('.daily-wrap');
    const sx = w ? w.scrollLeft : 0;
    old.outerHTML = dailySectionHtml(S.getDailyMonitoring(AppState.scope, AppState.dailyMetric));
    const nw = document.querySelector('#dailySection .daily-wrap');
    if (nw) nw.scrollLeft = sx;
    JpgExportService.decorate();   /* V1.6.6 — tombol JPG per tabel dipasang ulang */
  }

  /* ---------------- ANOMALI ---------------- */
  function renderAnomaly(a) {
    if (!a.totalCases) return UI.empty('Tidak Ada Anomali', 'Tidak ada indikasi anomali proses kerja pada scope dan periode ini.');
    const max = a.byType[0].cases || 1;
    const cards = a.byType.map(function (t) {
      /* V1.2 — aksen kartu memakai DOMINANSI kasus, bukan critical
         (informasi critical sengaja tidak ditampilkan pada card ini). */
      const lv = t.cases === 0 ? 'none' : (t.share >= 18 ? 'crit' : (t.share >= 12 ? 'review' : 'warn'));
      const hex = lv === 'crit' ? 'var(--st-crit)' : lv === 'review' ? 'var(--st-review)' :
                  lv === 'warn' ? 'var(--st-warn)' : 'var(--line-strong)';
      return '<div class="anom-card lv-' + lv + '" title="' + U.esc(t.desc) + '">' +
        '<div class="anom-name">' + U.esc(t.label) + '</div>' +
        '<div class="anom-main"><span class="anom-cases">' + U.int(t.cases) + '</span>' +
        '<span class="anom-cases-lbl">kasus</span><span class="anom-share">' + U.pct(t.share, 0) + ' dari total</span></div>' +
        '<div class="anom-track"><div class="bar-fill" style="width:' + (t.cases / max * 100).toFixed(1) +
        '%;background:' + hex + '"></div></div>' +
        '<div class="anom-facts"><span><b>' + U.int(t.salesmen) + '</b> salesman</span>' +
        '<span><b>' + U.int(t.patterns) + '</b> pola berulang</span></div></div>';
    }).join('');
    return '<div class="anom-grid">' + cards + '</div>';
  }

  /* ---------------- V1.7.3 REKAP ANOMALI BULANAN PER WILAYAH ----------------
     LIVE memakai granular anomaly_payload.flags + counter route production.
     DEMO tetap memakai matrix legacy. Renderer hanya memformat. */
  function routeCell(slot) {
    slot = slot || { on: 0, off: 0, unknown: 0, onPct: null, offPct: null };
    const on = '<span class="' + (slot.on ? 'rc-on' : 'rc-zero') + '">ON <em>' + U.int(slot.on) +
      '</em> · <em>' + (slot.onPct === null ? '–' : U.dec(slot.onPct, 2) + '%') + '</em></span>';
    const off = '<span class="' + (slot.off ? 'rc-off' : 'rc-zero') + '">OFF <em>' + U.int(slot.off) +
      '</em> · <em>' + (slot.offPct === null ? '–' : U.dec(slot.offPct, 2) + '%') + '</em></span>';
    const unknown = slot.unknown ? '<span class="rc-unk" title="Temuan granular tersedia, tetapi route per temuan tidak dikirim pada payload Pusat. Nilai tidak dipaksa ke ON/OFF.">RUTE ? <em>' + U.int(slot.unknown) + '</em></span>' : '';
    return '<td><div class="rc">' + on + off + unknown + '</div></td>';
  }
  function visitCell(row, cls) {
    return '<td class="col-visit' + (cls ? ' ' + cls : '') + '">' +
      '<div class="tv-main">' + U.int(row.visit) + '</div>' +
      '<div class="tv-sub"><span class="rc-on">ON ' + U.int(row.visitOn) + '</span> · ' +
      '<span class="rc-off">OFF ' + U.int(row.visitOff) + '</span></div></td>';
  }

  /* V1.3 — label tampilan saja; anomaly key dan struktur service tetap utuh. */
  const MATRIX_LABELS = {
    GEO_SALAH:        'GEO<br>SALAH',
    VISIT_MENUMPUK:  'MENUMPUK',
    VISIT_LAMA_LOW:  'VISIT LAMA<br>OUTPUT RENDAH',
    JALAN_OVER_EST:  'PERJALANAN<br>MELEBIHI ESTIMASI',
    ORDER_REMOTE:     'ORDER<br>REMOTE',
    ISTIRAHAT_OVER:  'ISTIRAHAT<br>MELEBIHI BATAS',
    SUPER_CEPAT:      'SUPER<br>CEPAT',
    KONFLIK_ALASAN:   'KONFLIK<br>ALASAN'
  };

  function renderAnomalyMatrix(mx) {
    if (!mx.rows.length) return UI.empty('Tidak Ada Unit', 'Tidak ada unit di bawah scope ini.');

    const head = '<tr><th class="col-name">' + U.esc(mx.childLabel) + '</th>' +
      '<th class="col-visit">Total Visit</th>' +
      mx.types.map(function (t) { return '<th class="col-anom" title="' + U.esc(t.desc) + '"><span class="mtx-head-label">' +
        (MATRIX_LABELS[t.key] || U.esc(t.label)) + '</span></th>'; }).join('') +
      '</tr>';

    const body = mx.rows.map(function (r) {
      if (!r.hasData) {
        return '<tr><td class="col-name"><span class="row-name"><span class="row-code">' + U.esc(r.code) +
          '</span><span class="row-label">' + U.esc(r.label) + '</span></span></td>' +
          '<td class="col-visit" style="color:var(--ink-3)">–</td>' +
          '<td colspan="' + mx.types.length + '" style="color:var(--ink-3)">Belum ada data pada bulan berjalan</td></tr>';
      }
      const nameCell = '<td class="col-name"><span class="row-name">' +
        '<span class="row-code">' + U.esc(r.code) + '</span>' +
        '<span class="row-label">' + U.esc(r.label) + '</span><span class="row-chev">›</span></span></td>';
      return '<tr class="clickable" data-act="drill" data-kind="' + r.kind + '" data-code="' + U.esc(r.code) +
        '" data-scope=\'' + JSON.stringify(r.scope) + '\' title="' + U.esc(r.label + ' — ' + U.int(r.totalCases) +
        (mx.liveAligned ? ' temuan granular' : ' kasus') + (r.rate === null ? '' : ' · ' + U.dec(r.rate, 2) +
        (mx.liveAligned ? ' temuan per 100 kunjungan' : ' kasus per 100 kunjungan'))) + '">' +
        nameCell + visitCell(r) +
        mx.types.map(function (t) { return routeCell(r.types[t.key]); }).join('') + '</tr>';
    }).join('');

    const t = mx.total;
    const foot = '<tr><td class="col-name">Total ' + U.esc(currentScopeLabel()) + '</td>' + visitCell(t) +
      mx.types.map(function (x) { return routeCell(t.types[x.key]); }).join('') + '</tr>';

    return '<div class="mtx-wrap" data-dsrc="anomaly_matrix"><table class="mtx"><colgroup><col style="width:var(--cn-w)">' +
           '<col style="width:var(--cv-w)">' + mx.types.map(function () { return '<col>'; }).join('') +
           '</colgroup><thead class="thead-green">' + head + '</thead><tbody>' +
           body + '</tbody><tfoot>' + foot + '</tfoot></table></div>';
  }

  function matrixSectionHtml(mx) {
    const sub = 'Rekap Bulan Berjalan · ' + U.dMed(mx.range.from) + ' – ' + U.dMed(mx.range.to) +
      ' · baris = ' + mx.childLabel +
      (mx.childLevel === 'salesman' ? ' · klik baris untuk membuka Detail Salesman'
                                    : ' · klik baris untuk drill-down ke ' + NEXT_LEVEL[mx.childLevel]);
    const legend = mx.liveAligned
      ? '<div class="mtx-legend"><span><b class="rc-on">ON</b> = On Route · <b class="rc-off">OFF</b> = Off Route · ' +
        '% = temuan dengan route pasti ÷ kunjungan pada route yang sama · <b class="rc-unk">RUTE ?</b> = route granular tidak tersedia di payload Pusat, tidak ditebak.</span>' +
        '<span>Jenis kolom mengikuti Website ASS. RUTE ? menampilkan count flag terpublikasi (bukan rate per visit). Perjalanan Melebihi Estimasi hanya terisi bila evidence Route Intelligence ikut dipublish.</span></div>'
      : '<div class="mtx-legend"><span><b class="rc-on">ON</b> = On Route · <b class="rc-off">OFF</b> = Off Route · ' +
        '% = kasus ÷ kunjungan pada route yang sama</span></div>';

    const backBtn = mx.level === 'national' ? '' : '<button class="btn-ghost" data-act="back">← Kembali</button>';

    return '<section class="section" id="matrixSection">' +
      '<div class="section-head"><span class="section-title">Rekap Anomali Bulanan per Wilayah</span>' +
      '<span class="section-sub">' + U.esc(sub) + '</span><span class="spacer"></span>' + backBtn + '</div>' +
      '<div class="section-body flush">' + renderAnomalyMatrix(mx) + '</div>' +
      '<div class="section-body" style="padding-top:9px;padding-bottom:9px">' + legend + '</div></section>';
  }

  /* ---------------- POLA BERULANG ---------------- */
  function renderPatterns(p) {
    if (!p.patterns.length) return UI.empty('Tidak Ada Pola Berulang',
      'Tidak ada salesman dengan anomali sejenis pada 3 hari berbeda atau lebih dalam jendela analisis.');
    const rows = p.patterns.map(function (g) {
      return '<tr class="clickable" data-act="pattern" data-sm="' + U.esc(g.salesman_code) + '" data-type="' + U.esc(g.type) + '">' +
        '<td><span class="row-name"><span class="row-code">' + U.esc(g.salesman_code) + '</span>' +
        '<span class="row-label">' + U.esc(g.salesman_name) + '</span><span class="row-chev">›</span></span></td>' +
        '<td>' + U.esc(g.depot_name) + '</td>' +
        '<td>' + U.esc(g.regional_code) + '</td>' +
        '<td>' + U.esc(g.type_label) + '</td>' +
        '<td>' + g.days + ' Hari</td><td>' + g.cases + ' Kasus</td>' +
        '<td>' + UI.badge(g.severity, g.severity_label) + '</td>' +
        '<td>' + UI.badge(g.status === 'Tervalidasi' ? 'good' : (g.status === 'Dalam Review' ? 'review' : 'neut'), g.status) + '</td></tr>';
    }).join('');
    return '<div class="table-wrap"><table class="tbl tbl-center" style="min-width:900px">' +
      '<thead class="thead-green"><tr>' +
      '<th>Salesman</th><th>Depo</th><th>Regional</th><th>Jenis Pola</th>' +
      '<th>Jumlah Hari</th><th>Occurrence</th><th>Severity</th><th>Status</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* ====================== HASIL KERJA V1.4 ====================== */
  function rMoney(v, withRp) {
    if (v === null || v === undefined || isNaN(v)) return '–';
    const p = withRp === false ? '' : 'Rp';
    if (Math.abs(v) >= 1000000000) return p + U.dec(v / 1000000000, 2) + ' M';
    if (Math.abs(v) >= 1000000) return p + U.dec(v / 1000000, 1) + ' Jt';
    if (Math.abs(v) >= 1000) return p + U.dec(v / 1000, 1) + ' Rb';
    return p + U.int(v);
  }
  function rNumber(v, digits) { return v === null || v === undefined ? '–' : U.dec(v, digits || 0); }
  function rGrowth(v) {
    const cls = v === null || Math.abs(v) < .005 ? 'flat' : (v > 0 ? 'up' : 'down');
    return '<span class="growth-pill ' + cls + '">' + (v === null ? '–' : U.pts(v, 1) + '%') + '</span>';
  }
  function rNameCell(r) {
    return '<span class="row-name"><span class="row-code">' + U.esc(r.code) + '</span>' +
      '<span class="row-label">' + U.esc(r.label) + '</span><span class="row-chev">›</span></span>';
  }
  /* V1.7.7 — baris terakhir hierarchy (tanpa anak): tanpa chevron, tanpa drill. */
  function rLeafNameCell(r) {
    return '<span class="row-name"><span class="row-code">' + U.esc(r.code) + '</span>' +
      '<span class="row-label">' + U.esc(r.label) + '</span></span>';
  }
  function rDrillAttrs(r) {
    return ' class="clickable" data-act="result-drill" data-kind="' + r.kind + '" data-code="' + U.esc(r.code) +
      '" data-scope=\'' + JSON.stringify(r.scope) + '\'';
  }
  function resultKpiCard(label, value, achievement, meta, gap, gapPositive) {
    return '<div class="result-kpi"><div class="result-kpi-label">' + U.esc(label) + '</div>' +
      '<div class="result-kpi-value">' + value + '</div>' +
      (achievement === null ? '' : '<div class="result-kpi-ach">' + U.pct(achievement, 1) + '</div>') +
      (meta ? '<div class="result-kpi-meta">' + meta + '</div>' : '') +
      (gap ? '<div class="result-kpi-gap ' + (gapPositive ? 'pos' : 'neg') + '">' + gap + '</div>' : '') + '</div>';
  }
  /* V1.4.1 — Surplus/Minus dihapus dari CARD (tetap tersedia di service & tabel Pencapaian).
     V1.7.6 — card kelima: Sales Call diganti NOO BULAN INI.
              Angka besar = SUM(noo_count); teks kecil = Omset NOO (formatter uang
              existing). NOO 0 tetap tampil "0", bukan "–". */
  function renderResultKPI(summary) {
    const c = summary.current; if (!c.hasData) return UI.empty('Tidak Ada Data Hasil Kerja');
    const nooCount = (c.noo === null || c.noo === undefined) ? 0 : c.noo;
    const nooOmset = (c.noo_omset === null || c.noo_omset === undefined) ? 0 : c.noo_omset;
    return '<div class="result-kpi-grid">' +
      resultKpiCard('Omset', rMoney(c.omset), c.achievement.omset, 'Target ' + rMoney(c.target_omset), '', false) +
      resultKpiCard('ROA', U.int(c.roa),
        (c.roa_actual_pct !== null && c.roa_actual_pct !== undefined &&
         (!c.salesmen || c.roa_eligible_salesmen === undefined || c.roa_eligible_salesmen === c.salesmen)) ? c.roa_actual_pct : null,
        'RO ' + U.int(c.ro), '', false) +
      resultKpiCard('Point EPB', U.dec(c.epb_point, 1), c.achievement.epb_point, 'Target ' + U.dec(c.target_epb_point, 1), '', false) +
      resultKpiCard('Avg EC', U.dec(c.avg_ec, 1), null, 'Total EC ' + U.int(c.ec), '', false) +
      resultKpiCard('NOO Bulan Ini', U.int(nooCount), null, 'Omset NOO ' + rMoney(nooOmset), '', false) + '</div>';
  }
  function resultMetricValue(key, v) {
    if (key === 'omset') return rMoney(v);
    if (key === 'epb_point') return v === null ? '–' : U.dec(v, 1);
    if (key === 'noo') return (v === null || v === undefined) ? '–' : U.int(v);
    return U.int(v);
  }
  /* ===== V1.4.1 — Pencapaian: SATU tabel, semua metrik, header 2 tingkat.
     Tanpa selector metrik. Renderer hanya memformat angka dari DashboardService. ===== */
  function achMoney(v) {
    if (v === null || v === undefined || isNaN(v)) return '–';
    const a = Math.abs(v), sign = v < 0 ? '−' : '';
    if (a >= 1e9) return sign + U.dec(a / 1e9, 2) + ' M';
    if (a >= 1e6) return sign + U.dec(a / 1e6, a >= 100e6 ? 0 : 1) + ' Jt';
    if (a >= 1e3) return sign + U.dec(a / 1e3, 0) + ' Rb';
    return sign + U.int(a);
  }
  function achPoint(v) {
    if (v === null || v === undefined || isNaN(v)) return '–';
    const a = Math.abs(v), sign = v < 0 ? '−' : '';
    return a >= 10000 ? sign + U.dec(a / 1000, 1) + 'K' : sign + U.dec(a, 1);
  }
  function achNum(v) {
    if (v === null || v === undefined || isNaN(v)) return '–';
    return (v < 0 ? '−' : '') + U.int(Math.abs(v));
  }
  /* format ringkas untuk sel tabel.
     scale (opsional) menyamakan satuan TGT & REAL dalam satu render supaya kolom tidak
     mencampur "10,9K" dengan "8.927,5". Kolom MINUS tetap auto agar tidak jadi "+0,03 M". */
  function achFmt(fmt, v, kind, scale) {
    if (v === null || v === undefined || isNaN(v)) return '–';
    if (fmt === 'money') {
      if (!scale) return achMoney(v);
      const sign = v < 0 ? '−' : '', a = Math.abs(v);
      return sign + U.dec(a / scale.div, scale.dec) + (scale.suffix ? ' ' + scale.suffix : '');
    }
    if (fmt === 'point') {
      if (!scale) return achPoint(v);
      const sign = v < 0 ? '−' : '', a = Math.abs(v);
      return sign + U.dec(a / scale.div, scale.dec) + scale.suffix;
    }
    if (fmt === 'call' && kind === 'AVG') return U.dec(v, 1);
    return achNum(v);
  }
  function achScaleFor(fmt, values) {
    const max = values.reduce(function (m, v) {
      return (v === null || v === undefined || isNaN(v)) ? m : Math.max(m, Math.abs(v)); }, 0);
    if (fmt === 'money') {
      if (max >= 1e9) return { div: 1e9, dec: 2, suffix: 'M' };
      if (max >= 1e6) return { div: 1e6, dec: max >= 100e6 ? 0 : 1, suffix: 'Jt' };
      if (max >= 1e3) return { div: 1e3, dec: 0, suffix: 'Rb' };
      return { div: 1, dec: 0, suffix: '' };
    }
    if (fmt === 'point') {
      if (max >= 10000) return { div: 1000, dec: 1, suffix: 'K' };
      return { div: 1, dec: 1, suffix: '' };
    }
    return null;
  }
  /* angka penuh untuk tooltip */
  function achFull(fmt, v) {
    if (v === null || v === undefined || isNaN(v)) return 'tidak ada data';
    /* V1.7.0 — tooltip = ANGKA PENUH. Nilai pecahan (mis. Rp113.207.372,63)
       tidak dibulatkan supaya angka UI dapat direkonsiliasi dengan database. */
    if (fmt === 'money') return 'Rp' + (v % 1 === 0 ? U.int(v) : U.dec(v, 2));
    if (fmt === 'point') return U.dec(v, 1);
    if (fmt === 'call') return U.dec(v, v % 1 === 0 ? 0 : 1);
    return U.int(v);
  }
  function achPctCell(pct, label, cell) {
    if (pct === null || pct === undefined || isNaN(pct)) {
      /* Bedakan "tidak ada target" dari "target belum lengkap" (partial coverage). */
      const note = cell && cell.targetNote ? cell.targetNote : 'tidak ada target';
      return '<td title="' + U.esc(label) + ': ' + U.esc(note) + '"><span class="ach-pct">–</span></td>';
    }
    const cls = pct >= 100 ? 'ok' : (pct >= 90 ? 'mid' : 'low');
    return '<td title="' + U.esc(label) + ' achievement: ' + U.dec(pct, 2) + '%">' +
      '<span class="ach-pct ' + cls + '">' + U.dec(pct, 1) + '%</span></td>';
  }
  function achGapCell(fmt, gap, label, last) {
    const end = last ? ' grp-end' : '';
    if (gap === null || gap === undefined || isNaN(gap))
      return '<td class="ach-gap flat' + end + '">–</td>';
    const pos = gap >= 0, cls = pos ? 'pos' : 'neg';
    return '<td class="ach-gap ' + cls + end + '" title="' + U.esc(label) + ' ' +
      (pos ? 'surplus' : 'minus') + ': ' + achFull(fmt, Math.abs(gap)) + '">' +
      (pos ? '+' : '−') + achFmt(fmt, Math.abs(gap)) + '</td>';
  }

  function achRowCells(cells, groups, scales) {
    let out = '';
    groups.forEach(function (g, gi) {
      const c = cells[g.key], last = gi < groups.length - 1, sc = scales ? scales[g.key] : null;
      /* V1.7.6 — NOO: JML NOO (SUM noo_count) + OMSET NOO (SUM noo_omset).
         Tanpa target/achievement/minus. Nilai 0 tetap ditampilkan sebagai 0. */
      if (g.nooGroup) {
        const cnt = c ? c.count : null, oms = c ? c.omset : null;
        out += '<td title="' + U.esc(g.label) + ' jumlah: ' + achFull('int', cnt) + '">' +
                 ((cnt === null || cnt === undefined) ? '–' : achNum(cnt)) + '</td>' +
               '<td' + (last ? ' class="grp-end"' : '') + ' title="Omset ' + U.esc(g.label) + ': ' +
                 achFull('money', oms) + '">' +
                 ((oms === null || oms === undefined) ? '–' : rMoney(oms)) + '</td>';
        return;
      }
      if (g.actualRatio) {
        out += '<td title="RO: ' + achFull('int', c.ro) + '">' + achFmt('int', c.ro, 'RO') + '</td>' +
               '<td title="ROA: ' + achFull('int', c.roa) + '">' + achFmt('int', c.roa, 'ROA') + '</td>' +
               achPctCell(c.achievement, 'ROA', c) +
               achGapCell('int', c.gap, 'ROA', last);
        return;
      }
      out += '<td title="Target ' + U.esc(g.label) + ': ' + achFull(g.fmt, c.target) + '">' +
               achFmt(g.fmt, c.target, 'TGT', sc) + '</td>' +
             '<td title="Real ' + U.esc(g.label) + ': ' + achFull(g.fmt, c.real) + '">' +
               achFmt(g.fmt, c.real, 'REAL', sc) + '</td>' +
             achPctCell(c.achievement, g.label, c) +
             achGapCell(g.fmt, c.gap, g.label, last);
    });
    return out;
  }

  function renderResultAchievement(data) {
    if (!data.rows.length) return UI.empty('Tidak Ada Unit', 'Tidak ada unit di bawah scope ini.');
    const groups = data.groups;

    /* lebar kolom eksplisit supaya tabel pasti muat pada desktop 1366px */
    const W = { name: 15, omset: [5.2, 5.2, 4.6, 5.6], roa: [4.4, 4.4, 4.6, 4.6],
                ec: [4.7, 4.7, 4.6, 5.0], epb_point: [4.4, 4.4, 4.6, 4.6], noo: [4.6, 5.8] };
    let cols = '<col style="width:' + W.name + '%">';
    groups.forEach(function (g) { W[g.key].forEach(function (w) { cols += '<col style="width:' + w + '%">'; }); });

    const head1 = '<tr><th rowspan="2" class="grp-end">' + U.esc(data.childLabel) + '</th>' +
      groups.map(function (g, i) {
        return '<th colspan="' + g.cols.length + '"' + (i < groups.length - 1 ? ' class="grp-end"' : '') + '>' +
          U.esc(g.label) + '</th>';
      }).join('') + '</tr>';
    const head2 = '<tr>' + groups.map(function (g, i) {
      return g.cols.map(function (c, j) {
        const last = (j === g.cols.length - 1) && (i < groups.length - 1);
        return '<th' + (last ? ' class="grp-end"' : '') + '>' + U.esc(c) + '</th>';
      }).join('');
    }).join('') + '</tr>';

    /* satuan TGT/REAL disamakan per kolom, dihitung sekali dari seluruh baris + total */
    const scales = {};
    groups.forEach(function (g) {
      if (g.noTarget || g.nooGroup || (g.fmt !== 'money' && g.fmt !== 'point')) { scales[g.key] = null; return; }
      const vals = [];
      data.rows.forEach(function (r) {
        if (!r.hasData) return;
        vals.push(r.cells[g.key].target, r.cells[g.key].real);
      });
      vals.push(data.total.cells[g.key].target, data.total.cells[g.key].real);
      scales[g.key] = achScaleFor(g.fmt, vals);
    });

    const body = data.rows.map(function (r) {
      if (!r.hasData) {
        return '<tr><td class="ach-name grp-end">' + rNameCell(r) + '</td>' +
          '<td colspan="18" style="color:var(--ink-3)">Belum ada data pada bulan berjalan</td></tr>';
      }
      return '<tr' + rDrillAttrs(r) + '><td class="ach-name grp-end">' + rNameCell(r) + '</td>' +
        achRowCells(r.cells, groups, scales) + '</tr>';
    }).join('');

    const foot = '<tr><td class="grp-end">Total ' + U.esc(currentScopeLabel()) + '</td>' +
      achRowCells(data.total.cells, groups, scales) + '</tr>';

    const note = '<div class="ach-note">Angka ditampilkan ringkas (M = miliar, Jt = juta, K = ribu) agar seluruh metrik ' +
      'muat dalam satu layar — arahkan kursor ke sel untuk melihat angka penuh. Kolom MINUS bernilai <b>+</b> bila Real ' +
      'melampaui Target. Khusus ROA: RO adalah denominator actual, ROA adalah real actual, % ROA = ROA ÷ RO, ' +
      'dan MINUS ROA = ROA − RO. NOO adalah informasi actual bulan berjalan dari RESULT MTD: ' +
      'JML NOO = jumlah NOO seluruh salesman dalam scope, OMSET NOO = total omset NOO. ' +
      'NOO tidak memiliki Target, Achievement, maupun Minus, dan mengikuti Coverage Salesman aktif. ' + U.esc(data.sortNote) +
      (data.noDataCount ? '; ' + data.noDataCount + ' unit tanpa data ditempatkan paling bawah.' : '.') + '</div>';

    return '<div class="ach-wrap" data-dsrc="result_achievement"><table class="ach-tbl"><colgroup>' + cols + '</colgroup>' +
      '<thead>' + head1 + head2 + '</thead><tbody>' + body + '</tbody><tfoot>' + foot + '</tfoot></table></div>' + note;
  }

  /* ---------------- INFORMASI UPDATE DATA (V1.6.5) ---------------- */
  /* V1.7.2 — timestamptz Supabase ditampilkan dalam WIB (Asia/Jakarta).
     Sebelumnya jam dibaca mentah dari string ISO sehingga 05:10 UTC tampil
     sebagai "05:10" padahal seharusnya "12:10 WIB". */
  function infoUploadLabel(value) {
    if (!value) return '–';
    const activeYear = Number(String(ProviderHub.facade.today || '').slice(0, 4));
    return U.wibDateTime(value, activeYear);
  }
  function infoCue(hk, max) {
    if (hk === null || hk === undefined || max === null || max === undefined) return '';
    const gap = Number(max) - Number(hk);
    return gap <= 0 ? ' info-cue-fresh' : (gap === 1 ? ' info-cue-near' : ' info-cue-lag');
  }
  /* V1.7.0 — HK tanpa bulan berpotensi ambigu karena PROSES dan HASIL dapat
     berada pada bulan berbeda. Bulan periode selalu ikut ditampilkan. */
  function infoPeriodLabel(period) {
    const t = String(period || '');
    if (!/^\d{4}-\d{2}/.test(t)) return '';
    return U.MON_S[Number(t.slice(5, 7)) - 1] + ' ' + t.slice(0, 4);
  }
  /* V1.7.4 — rentang HK pada kartu ringkasan (hypercare). */
  function hkRangeHtml(max, min) {
    return '<div class="info-hk-range">' +
      '<span>Tertinggi: <b>' + (max === null || max === undefined ? '–' : 'HK' + U.int(max)) + '</b></span>' +
      '<span>Terendah: <b>' + (min === null || min === undefined ? '–' : 'HK' + U.int(min)) + '</b></span></div>';
  }
  /* Status objektif tanpa threshold buatan: Update / Tertinggal X HK / Belum Update. */
  function infoStatusHtml(status) {
    if (!status) return '';
    const cls = status.state === 'ok' ? 'ok' : status.state === 'lag' ? 'lag'
              : status.state === 'stale' ? 'stale' : 'none';
    return '<div class="info-stat ' + cls + '">' + U.esc(status.label) + '</div>';
  }
  function infoCell(hk, uploadedAt, max, period, status) {
    if (hk === null || hk === undefined)
      return '<span class="info-missing">–</span>' + infoStatusHtml(status);
    const time = infoUploadLabel(uploadedAt);
    const per = infoPeriodLabel(period);
    return (per ? '<span class="info-hk">' + U.esc(per) + '</span><span class="info-sep"> · </span>' : '') +
      '<span class="info-hk">HK ' + U.int(Number(hk)) + '</span>' +
      '<span class="info-sep"> · </span><span class="info-time">' + U.esc(time) + '</span>' +
      infoStatusHtml(status);
  }
  /* ==========================================================================
     V1.7.8 — RIWAYAT UPDATE HARIAN (matrix Depo x TANGGAL PUBLISH).
     Kolom = tanggal publish, BUKAN HK report. Cell = posisi P/H terakhir pada
     tanggal publish tersebut. Tidak ada scoring/compliance tambahan.
     ========================================================================== */
  function phistHk(v) { return v === null || v === undefined ? '—' : U.int(v); }
  function phistCellHtml(cell, depotLabel) {
    const dLabel = U.dMed(cell.date), dow = U.dDow(cell.date);
    /* V1.7.9 — state ditentukan service (publish/holiday/future/missing/unverified).
       MERAH hanya untuk state 'missing', yaitu ketika history COMPLETE. */
    if (cell.state === 'holiday')
      return '<td class="phist-cell is-holiday" title="' + U.esc(dow + ', ' + dLabel + ' · Minggu (non-working day) · tidak perlu publish') +
        '"><span class="phist-holiday">LIBUR</span></td>';
    if (cell.state === 'future')
      return '<td class="phist-cell is-future" title="' + U.esc(dow + ', ' + dLabel + ' · belum terjadi') + '"></td>';
    if (cell.state === 'missing')
      return '<td class="phist-cell is-missing" title="' + U.esc(depotLabel + ' · ' + dow + ', ' + dLabel +
        ' · Tidak ada publish') + '"><span class="phist-miss">—</span></td>';
    if (cell.state === 'unverified')
      return '<td class="phist-cell is-unverified" title="' + U.esc(depotLabel + ' · ' + dow + ', ' + dLabel +
        ' · Belum dapat diverifikasi — histori publish lengkap belum tersedia.') +
        '"><span class="phist-unk">?</span></td>';
    /* V1.7.8.1 — badge & count berasal dari DISTINCT PUBLISH ACTION, bukan
       jumlah batch. PROCESS + RESULT dalam satu aksi publish = 1x (tanpa badge). */
    const badge = cell.repeat > 1
      ? '<span class="phist-badge" title="' + U.esc('Proses ' + cell.processCount + 'x publish · Hasil ' + cell.resultCount + 'x publish') + '">' +
        cell.repeat + 'x</span>' : '';
    const tip = [depotLabel + ' · ' + dow + ', ' + dLabel,
      cell.publishCount + 'x publish',
      'Process: ' + cell.processCount + 'x',
      'Result: ' + cell.resultCount + 'x']
      .concat(cell.times)
      .concat(['Latest: P' + phistHk(cell.processHk) + ' H' + phistHk(cell.resultHk)])
      .concat(cell.sunday ? ['Catatan: hari Minggu (non-working day)'] : [])
      .join('\n');
    const cls = 'phist-cell is-publish' + (cell.sunday ? ' is-holiday-publish' : '') + (cell.repeat > 1 ? ' is-repeat' : '');
    return '<td class="' + cls + '" title="' + U.esc(tip) + '"><span class="phist-hk">P' +
      phistHk(cell.processHk) + ' H' + phistHk(cell.resultHk) + '</span>' + badge + '</td>';
  }
  function renderPublishHistory(scope) {
    let data = null;
    try { data = PublishHistoryService.build(scope || {}); }
    catch (err) {
      return '<section class="info-section"><div class="info-section-head">' +
        '<span class="info-section-title">Riwayat Update Harian</span></div>' +
        '<div class="section-body">' + UI.error('Riwayat Publish Gagal Dibaca', String(err && err.message || err)) + '</div></section>';
    }
    if (!data.available || !data.rows.length || !data.dates.length) {
      const desc = !data.available
        ? 'Riwayat publish harian belum tersedia dari sumber LIVE. Read Gateway existing belum mengirim event/batch publish historis dengan timestamp publish, dan riwayat TIDAK dibuat dari snapshot update terakhir.'
        : 'Tidak ada Depo pada scope aktif untuk ditampilkan.';
      return '<section class="info-section"><div class="info-section-head">' +
        '<span class="info-section-title">Riwayat Update Harian</span>' +
        '<span class="info-section-meta">' + U.esc(scopeName()) + '</span></div>' +
        '<div class="section-body">' + UI.empty('Riwayat Publish Belum Tersedia', desc) + '</div></section>';
    }
    const head = data.dates.map(function (d) {
      return '<th class="phist-dh' + (d.sunday ? ' is-sun' : '') + (d.future ? ' is-future' : '') +
        '" title="' + U.esc(U.DAYS[d.dow] + ', ' + U.dMed(d.iso)) + '"><span class="phist-dh-d">' +
        U.esc(d.label) + '</span><span class="phist-dh-w">' + U.esc(d.dowLabel) + '</span></th>';
    }).join('');
    /* Legend adaptif: MERAH hanya bermakna (dan hanya muncul) pada mode
       COMPLETE; pada PARTIAL yang berlaku adalah neutral "?". */
    const complete = data.mode === 'COMPLETE';
    const legend =
      '<span class="phist-legend"><span class="phist-key is-publish"></span>Putih = Publish</span>' +
      (complete
        ? '<span class="phist-legend"><span class="phist-key is-missing"></span>Merah = Tidak publish</span>'
        : '<span class="phist-legend"><span class="phist-key is-unverified"></span>Neutral ? = Belum dapat diverifikasi</span>') +
      '<span class="phist-legend"><span class="phist-key is-repeat"></span>Orange = &gt;1x publish</span>' +
      '<span class="phist-legend"><span class="phist-key is-holiday"></span>Abu = Minggu</span>';
    const body = data.rows.map(function (r) {
      const label = r.depot;
      const cells = r.cells.map(function (c) { return phistCellHtml(c, label); }).join('');
      return '<tr><th class="phist-depo" scope="row" title="' + U.esc([r.regional, r.branch, r.depot].filter(Boolean).join(' › ')) +
        '"><span class="phist-depo-name">' + U.esc(label) + '</span>' +
        (r.branch ? '<span class="phist-depo-sub">' + U.esc(r.branch) + '</span>' : '') + '</th>' + cells + '</tr>';
    }).join('');
    return '<section class="info-section" id="publishHistorySection">' +
      '<div class="info-section-head"><span class="info-section-title">Riwayat Update Harian</span>' +
      '<span class="info-section-meta">' + U.esc(data.monthLabel) + ' · ' + U.esc(scopeName()) + ' · ' +
      U.int(data.depotCount) + ' Depo · ' + U.int(data.dates.length) + ' tanggal · Histori ' +
      U.esc(complete ? 'lengkap' : 'sebagian') + '</span></div>' +
      '<div class="info-table-wrap phist-wrap"><table class="phist-table"><thead><tr>' +
      '<th class="phist-depo phist-corner">Depo</th>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<div class="note-inline"><b>Kolom = TANGGAL PUBLISH</b> (bukan HK report). Cell menampilkan posisi ' +
      '<b>P</b> (HK Proses) dan <b>H</b> (HK Hasil) terakhir pada tanggal publish tersebut. ' +
      legend +
      ' Batch dideduplikasi memakai <b>batch_id</b>; jumlah publish dihitung dari <b>publish action</b> ' +
      '(<b>publish_event_id</b>, fallback timestamp publish), bukan dari jumlah batch atau baris KPI. ' +
      'Proses 1x + Hasil 1x dalam satu aksi publish adalah kondisi normal dan TIDAK diberi badge revisi. ' +
      'Posisi P/H terakhir mengikuti timestamp publish terbaru per domain. ' +
      'Waktu memakai WIB. Section ini mengikuti Monitoring Scope / Regional / Cabang / Depo dan ' +
      '<b>tidak</b> mengikuti Coverage Salesman.' +
      /* V1.7.9 — catatan kecil netral bila sumber histori belum lengkap. */
      (!complete
        ? ' <span class="phist-cap-note">Riwayat publish masih mengikuti histori yang tersedia; hari tanpa event belum dapat dinilai sampai sumber histori lengkap tersedia.</span>'
        : '') +
      '</div></section>';
  }

  function renderInformation() {
    $('#viewHost').innerHTML = '<header class="info-head"><h1 class="info-title">INFORMASI UPDATE DATA</h1>' +
      '<p class="info-subtitle">Monitoring HK dan waktu upload terakhir Proses Kerja &amp; Hasil Kerja per Depo.</p></header>' +
      sourceNote('informasi') + scopeWarningHtml() +
      renderResultFilterBar(false) + JpgExportService.allButtonHtml() + '<div id="informationBody"></div>';
    renderInformationDashboard();
  }

  /* ---------------- DASHBOARD BODY ---------------- */
  function renderDashboard() {
    const host = $('#dashBody');
    if (!host) return;
    TrendChart.destroy();
    const projectHasMatch = SalesmanProjectScope.hasMatchInScope(AppState.scope);
    const processAuthorityAvailable = S.processSummaryAvailable(AppState.scope, AppState.period);
    /* V1.7.7.4 — KPI Summary authority period-aware berlaku pada Hari Ini /
       7 Hari / Bulan Ini dan bersifat total Depo, sehingga Coverage Project
       kosong tidak boleh menutup authority KPI yang valid. */
    if (!projectHasMatch && !processAuthorityAvailable) {
      host.innerHTML = '<section class="section">' + UI.empty('Coverage Project Kosong', SalesmanProjectScope.emptyMessage()) + '</section>';
      return;
    }
    try {
      const scope = AppState.scope, per = AppState.period;
      const sum = S.getProcessSummary(scope, per);
      const p = sum.period;
      const ins = S.getInsights(scope, per, scopeName());
      const daily = S.getDailyMonitoring(scope, AppState.dailyMetric);
      const matrix = S.getMonthlyAnomalyMatrix(scope);
      const anom = S.getAnomalySummary(scope, per);
      const pat = S.getRecurringPatterns(scope, per, 12);
      const trend = S.getProcessTrend(scope, per);

      const periodRange = p.dates.length > 1
        ? U.dMed(p.range.from) + ' – ' + U.dMed(p.range.to)
        : U.dDow(p.range.to) + ', ' + U.dMed(p.range.to);

      /* V1.1 — urutan: KPI → Temuan Utama → Monitoring Harian → Trend → Anomali → Pola Berulang.
         Analisis Route & Performa Wilayah tidak lagi dipasang (lihat catatan di renderRoute/renderHierarchy). */
      host.innerHTML =
        UI.section('KPI Summary',
          U.esc(scopeName()) + ' · Periode ' + U.esc(p.label) + ' (' + U.esc(periodRange) + ')',
          renderKPI(sum) + (sum.kpiSource === 'WEBSITE_ASS_FINAL_KPI'
            ? '<div class="note-inline">' + U.esc(sum.kpiSourceNote ||
              'KPI Summary menggunakan angka final Website ASS sesuai periode aktif dan tidak mengikuti Coverage Salesman.') + '</div>'
            : ''), '') +
        UI.section('Temuan Utama',
          'Periode ' + U.esc(p.label) + ' · maks. 5 temuan, dihitung dari data pada scope aktif',
          renderInsights(ins)) +
        dailySectionHtml(daily) +
        UI.section('Trend Proses Kerja', U.esc(trend.note) + ' · Mengikuti Periode ' + U.esc(p.label),
          '<div class="chart-host" id="trendHost"></div>' +
          '<div class="note-inline" style="padding:9px 0 0">Setiap KPI memakai skala persentase sendiri agar arah perubahan ' +
          'lebih mudah dibaca. Garis putus-putus menandai target; nilai data tidak diubah atau dinormalisasi.</div>') +
        UI.section('Anomali Proses Kerja', 'Periode ' + U.esc(p.label) + ' (' + U.esc(periodRange) + ') · ' +
          U.int(anom.totalCases) + ' kasus', renderAnomaly(anom) +
          '<div class="note-inline">Anomali adalah indikasi operasional dan tetap membutuhkan validasi. ' +
          'Angka di atas bukan pernyataan pelanggaran. Card ini memakai <b>periode global aktif</b> ' +
          '(' + U.esc(p.label) + '); section Rekap Anomali Bulanan di bawah selalu memakai ' +
          '<b>bulan berjalan</b>.</div>') +
        matrixSectionHtml(matrix) +
        UI.section('Pola Berulang yang Perlu Perhatian',
          pat.windowDays + ' hari kerja terakhir (' + U.dMed(pat.windowRange.from) + ' – ' +
          U.dMed(pat.windowRange.to) + ') · ' + pat.totalPatterns + ' pola · ' + pat.critical + ' critical',
          renderPatterns(pat) +
          '<div class="note-inline">' + (pat.totalPatterns > pat.patterns.length ?
            'Menampilkan ' + pat.patterns.length + ' pola teratas dari ' + pat.totalPatterns + '. ' : '') +
            'Pola dihitung dari jumlah TANGGAL BERBEDA (minimal 3 hari), bukan total kasus. ' +
            'Pola menggunakan <b>minimal 14 hari kerja</b>. Jika periode aktif lebih panjang dari 14 hari kerja, ' +
            'window mengikuti periode aktif.</div>',
          '', true);

      TrendChart.mount($('#trendHost'), trend);
      JpgExportService.decorate();
    } catch (err) {
      host.innerHTML = '<section class="section">' + UI.error('Error Mengambil Data', String(err && err.message || err)) + '</section>';
      if (window.console) console.error(err);
    }
  }

  /* ---------------- VIEW ---------------- */
  /* Catatan: thead tabel memakai top:0. .daily-wrap/.mtx-wrap/.table-wrap adalah
     scroll container sendiri (overflow-x:auto membuat overflow-y ikut auto), sehingga
     sticky di sana diukur dari tepi container — bukan dari viewport. Memberi offset
     setinggi filter bar justru menggeser header menutupi baris pertama. */
  /* V1.7.0 — satu komponen catatan sumber data untuk seluruh menu. */
  function sourceNote(domain) {
    const st = ProviderHub.state();
    if (ProviderHub.mode() === 'demo') {
      return '<div class="live-note warn"><span>ⓘ</span><span><b>MODE PENGEMBANGAN (DEMO).</b> ' +
        'Data pada halaman ini adalah data simulasi yang diaktifkan secara eksplisit lewat ' +
        '<b>?dev_provider=demo</b> dan BUKAN data pusat.</span></div>';
    }
    const P = ProviderHub.active();
    const st2 = P.stats ? P.stats() : {};
    const proc = S.processContext();
    const rctx = S.resultContextPublic();
    let detail = '';
    if (domain === 'proses') {
      detail = 'Periode PROSES <b>' + U.esc(proc.periodMonth ? monthLabel(proc.periodMonth) : '–') +
        '</b> · HK <b>' + (proc.hk === null || proc.hk === undefined ? '–' : U.int(proc.hk)) + '</b> · ' +
        U.int(st2.records || 0) + ' baris process_daily · ' + U.int(st2.salesmen || 0) + ' salesman.';
    } else if (domain === 'hasil') {
      detail = 'Periode HASIL <b>' + U.esc(rctx.currentMonth ? monthLabel(rctx.currentMonth + '-01') : '–') +
        '</b> · HK <b>' + (rctx.hk === null || rctx.hk === undefined ? '–' : U.int(rctx.hk)) + '</b> · ' +
        U.int(st2.mtdRows || 0) + ' baris result_mtd (MTD authoritative dari public.result_mtd).';
    } else {

      '<b>DATA LIVE — DATABASE PUSAT.</b> ' + detail +

  function monthLabel(p) {
    const t = String(p || '');
    if (!/^\d{4}-\d{2}/.test(t)) return '–';
    return U.MONTHS[Number(t.slice(5, 7)) - 1] + ' ' + t.slice(0, 4);
  }
  function renderProses() {
    if (ProviderHub.isLive()) {
      const de = domainErrorHtml('process');
      if (de) { $('#viewHost').innerHTML = renderFilterBar() + de; return; }
      if (LiveDataStore.status.process !== 'ready') {
        $('#viewHost').innerHTML = renderFilterBar() +
          '<section class="section"><div class="section-head"><span class="section-title">Memuat Proses Kerja…</span></div>' +
          UI.loading(5) + '</section>';
        return;
      }
    }
    const per = S.resolvePeriod(AppState.period);
    $('#viewHost').innerHTML =
      sourceNote('proses') + scopeWarningHtml() +
      renderFilterBar() + renderScopeBar(per) + JpgExportService.allButtonHtml() + '<div id="dashBody"></div>';
    if (!SalesmanProjectScope.hasMatchInScope(AppState.scope)) {
      $('#dashBody').innerHTML = '<section class="section">' + UI.empty('Coverage Project Kosong', SalesmanProjectScope.emptyMessage()) + '</section>';
      return;

    renderDashboard();

  /* =====================================================================
     V1.7.0 — GERBANG LIVE.
     Menu apa pun hanya dirender ketika bootstrap LIVE berhasil. Tidak ada
     fallback diam-diam ke DEMO: kalau gagal, yang tampil adalah error state
     beserta tombol COBA LAGI — bukan angka dummy.
     ===================================================================== */
  function liveGateHtml() {
    const st = ProviderHub.state();
    if (st.key === 'config') {
      return '<div class="live-note warn"><span>⚠</span><span><b>Konfigurasi Live Data belum lengkap.</b> ' +
        U.esc(LiveGateway.setupMessage()) + '</span></div>' +
        '<section class="section">' + UI.error('Konfigurasi Live Data belum lengkap',
          'Isi MONITORING_PUSAT_CONFIG (SUPABASE_URL, SUPABASE_ANON_KEY, READ_FUNCTION_URL) pada file HTML ini, ' +
          'lalu muat ulang halaman. Aplikasi sengaja TIDAK menampilkan data contoh.') + '</section>';
    }
    if (st.key === 'loading' || st.key === 'idle') {
      return '<section class="section"><div class="section-head"><span class="section-title">Memuat data pusat…</span></div>' +
        UI.loading(5) + '</section>';
    }
    if (st.key === 'error') {
      const e = LiveDataStore.errors.bootstrap || {};
      return '<section class="section">' + UI.error('Gagal memuat data Monitoring Pusat.',
        (e.message || 'Tidak dapat menghubungi Read Gateway.') + ' (kode: ' + U.esc(e.code || 'ERROR') + ')') +
        '<div class="section-body" style="padding-top:0"><button class="btn-ghost" data-act="live-retry" type="button">COBA LAGI</button></div>' +
        '</section>';
    }
    return null;
  }
  /* Error per-domain: satu domain gagal tidak mematikan seluruh website. */
  function domainErrorHtml(domain) {
    const e = LiveDataStore.errors[domain];
    if (!e) return null;
    const label = domain === 'process' ? 'Proses Kerja' : 'Hasil Kerja';
    return '<section class="section">' + UI.error('Gagal memuat data ' + label,
      (e.message || '') + ' (kode: ' + U.esc(e.code || 'ERROR') + ')') +
      '<div class="section-body" style="padding-top:0"><button class="btn-ghost" data-act="live-retry-domain" ' +
      'data-domain="' + domain + '" type="button">COBA LAGI</button></div></section>';
  }

  function renderPlaceholder(key) {
    const m = MENUS[key];
    $('#viewHost').innerHTML = '<div class="placeholder"><div class="ph-mark">' + m.icon + '</div>' +
      '<div class="ph-title">Menu ' + U.esc(m.label) + ' sedang dikembangkan.</div>' +
      '<div class="ph-desc">' + U.esc(m.desc) + '</div>' +
      '<div class="ph-chip">Menu ini akan dikembangkan pada tahap berikutnya</div></div>';
  }

  function renderView() {
    TrendChart.destroy();
    ResultTrendChart.destroy();
    document.querySelectorAll('.nav-item').forEach(function (b) {
      if (b.dataset.menu === AppState.menu) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    syncBadge();
    /* Gerbang LIVE: menu apa pun hanya dirender setelah bootstrap berhasil. */
    if (ProviderHub.isLive()) {
      const gate = liveGateHtml();
      if (gate) { $('#viewHost').innerHTML = gate; window.scrollTo({ top: 0, behavior: 'auto' }); return; }
    }
    if (AppState.menu === 'proses') renderProses();
    else if (AppState.menu === 'hasil') renderHasil();
    else if (AppState.menu === 'ranking') RankingShell.render($('#viewHost'));
    else if (AppState.menu === 'informasi') renderInformation();
    else renderPlaceholder(AppState.menu);
    window.scrollTo({ top: 0, behavior: 'auto' });

  /* Badge header mengikuti status sumber data yang sebenarnya. */
  function syncBadge() {
    const el = document.getElementById('demoBadge');
    if (!el) return;
    const st = ProviderHub.state();
    el.textContent = st.label;
    el.title = st.title;
    el.classList.toggle('is-live', st.tone === 'ok');
    el.classList.toggle('is-err', st.tone === 'err');
  }

  /* refresh ringan: hanya scope bar + body (select tidak dibongkar saat dipakai) */
  function refresh(rebuildFilter) {
    if (AppState.menu === 'informasi') {
      if (rebuildFilter) { const infoBar = $('#filterBar'); if (infoBar) infoBar.outerHTML = renderResultFilterBar(false); }
      renderInformationDashboard(); return;
    }
    if (AppState.menu === 'hasil') {
      if (rebuildFilter) { const bar = $('#filterBar'); if (bar) bar.outerHTML = renderResultFilterBar(); }
      const rsb = document.querySelector('.scope-bar'); if (rsb) rsb.outerHTML = renderResultScopeBar(S.resultContext());
      renderResultDashboard(); return;
    }
    if (AppState.menu !== 'proses') return;
    if (rebuildFilter) {
      const bar = $('#filterBar');
      if (bar) bar.outerHTML = renderFilterBar();
    } else {
      document.querySelectorAll('.seg button[data-act="period"]').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.p === AppState.period));
      });
    }
    const sb = document.querySelector('.scope-bar');
    if (sb) sb.outerHTML = renderScopeBar(S.resolvePeriod(AppState.period));
    renderDashboard();
  }

  /* ===== V1.5 — builder isi popup drill-down.
     Seluruh angka tetap datang dari DashboardService; di sini hanya pemilihan
     renderer sesuai section asal + override label baris TOTAL. ===== */
  const DRILL_VIEWS = {
    process_daily: {
      domain: 'proses', label: 'Monitoring Harian',
      metricLabel: function (k) { const m = S.monitoringMetrics().filter(function (x) { return x.key === k; })[0]; return m ? m.label : ''; },
      build: function (scope, metricKey) { return renderDailyTable(S.getDailyMonitoring(scope, metricKey)); },
      note: 'Tabel selalu bulan berjalan (MTD) dan mengikuti scope pada popup ini.'
    },

      build: function (scope) { return renderAnomalyMatrix(S.getMonthlyAnomalyMatrix(scope)); },
      note: 'ON = kasus ÷ kunjungan On Route; OFF = kasus ÷ kunjungan Off Route. Selalu bulan berjalan.'
    },
    result_achievement: {
      domain: 'hasil', label: 'Pencapaian',
      build: function (scope) { return renderResultAchievement(S.getResultAchievementAll(scope)); },
      titleSuffix: function () { return S.resultContext().currentLabel.toUpperCase(); }
    },
    result_daily: {

      build: function (scope, metricKey) {
        const d = S.getResultDaily(scope, metricKey);
        /* V1.7.8 — drilldown juga jujur saat Coverage Project tanpa granular. */
        if (d.unavailable) return UI.empty('Harian Project Belum Tersedia', d.unavailableMessage);
        return resultDailyTableHtml(d);
      },
      note: 'Shading menunjukkan posisi relatif dalam data aktif · “–” berarti tidak ada data.'
    },
    result_detail_mtd: {
      domain: 'hasil', label: 'Detail MTD',
      build: function (scope) { return renderResultDetail(S.getResultDetail(scope)); },
      note: 'Baseline mengikuti authority Website ASS; pembanding tidak ditebak dari kalender.'
    },
    ranking_main: {
      domain: 'ranking', label: 'Ranking',
      metricLabel: function (k) {
        if (k === 'final') return 'Final Score';
        const x = RankingService.KPIS.filter(function (m) { return m.key === k; })[0];
        return x ? x.label : '';
      },
      build: function (scope) {
        const lv = S.childLevelOf(scope);
        return RankingView.tableHtml(RankingService.getRanking(scope, lv),
                 { sortKey: 'final', sortDir: 'desc' }, true);
      },
      titleSuffix: function () { return ''; }
    },
    result_contribution: {
      domain: 'hasil', label: 'Kontribusi Omset',
      build: function (scope) { return renderResultContribution(S.getResultContribution(scope)); },
      note: 'Kontribusi dihitung terhadap total scope pada popup ini.'
    }
  };
  function drillViewMeta(key) { return DRILL_VIEWS[key] || null; }
  function drillBody(sourceView, scope, metricKey, scopeLabel) {
    const v = DRILL_VIEWS[sourceView];
    if (!v) return UI.error('Konteks Tidak Dikenal', 'sourceView "' + sourceView + '" tidak terdaftar.');
    return withScopeLabel(scopeLabel, function () {
      const html = v.build(scope, metricKey);
      return html + (v.note ? '<div class="dd-note">' + v.note + '</div>' : '');
    });
  }
  function drillChildLevel(scope) { return S.childLevelOf(scope); }

  return { renderView: renderView, renderDashboard: renderDashboard, renderResultDashboard: renderResultDashboard,
           refresh: refresh, updateDaily: updateDaily, scopeName: scopeName, orgLabel: orgLabel, scorePill: scorePill,
           drillBody: drillBody, drillViewMeta: drillViewMeta, drillChildLevel: drillChildLevel,
           levelLabel: function (l) { return S.levelLabel(l); },
           syncBadge: syncBadge, domainErrorHtml: domainErrorHtml,
           scopeWarningHtml: scopeWarningHtml, levelBadge: levelBadge };
})(DashboardService);

const Modal = {
  root: null, box: null, _esc: null,
  init: function () {
    this.root = document.getElementById('modalRoot');
    this.box = document.getElementById('modalBox');
    const self = this;
    this.root.addEventListener('click', function (e) { if (e.target === self.root) self.close(); });
    this._esc = function (e) { if (e.key === 'Escape') self.close(); };
    document.addEventListener('keydown', this._esc);
  },
  /* V1.5 — _capture memungkinkan Drilldown MEMINJAM hasil render Detail.* tanpa
     menampilkannya sebagai modal terpisah, sehingga tidak ada duplikasi formula
     dan tidak ada modal bertumpuk. */
  _capture: null,
  open: function (html, mode) {
    if (this._capture) { this._capture.html = html; return; }
    this.box.className = 'modal' + (mode === true || mode === 'narrow' ? ' narrow' : (mode === 'wide' ? ' wide' : ''));
    this.box.innerHTML = html;
    this.root.classList.add('on');
    document.body.style.overflow = 'hidden';
  },
  /* jalankan fn() dan tangkap HTML modal yang dihasilkannya */
  capture: function (fn) {
    const box = {}; this._capture = box;
    try { fn(); } finally { this._capture = null; }
    return box.html || '';
  },
  close: function () {
    if (this._capture) return;
    this.root.classList.remove('on'); this.box.innerHTML = ''; document.body.style.overflow = '';
    if (typeof Drilldown !== 'undefined') Drilldown.onModalClosed();
  },
  head: function (title, sub) {
    return '<div class="modal-head"><div><div class="mh-title" id="modalTitle">' + U.esc(title) + '</div>' +
      '<div class="mh-sub">' + U.esc(sub) + '</div></div>' +
      '<button class="modal-x" data-act="modal-close" aria-label="Tutup">×</button></div>';
  }
};
