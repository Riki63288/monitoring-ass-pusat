const DemoDataProvider = (function () {

  const TODAY   = '2026-08-15';
  const HISTORY = 58;                       /* hari ke belakang yang di-generate */
  const rnd     = mulberry32(20260815);

  /* ---------- organisasi ---------- */
  const regionals = [], branches = [], depots = [], salesmen = [];
  const byCode = { regional: {}, branch: {}, depot: {}, ass: {}, salesman: {} };
  const assList = [];
  let smCounter = 0;

  ORG_DEF.forEach(function (R) {
    const reg = { code: R.code, name: R.name, label: R.code + ' ' + R.name, branches: [] };
    regionals.push(reg); byCode.regional[reg.code] = reg;

    R.branches.forEach(function (B) {
      const br = { code: B.code, name: B.name, regional_code: R.code, depots: [] };
      branches.push(br); byCode.branch[br.code] = br; reg.branches.push(br);

      B.depots.forEach(function (D) {
        const dp = { code: D.code, name: D.name, branch_code: B.code, regional_code: R.code,
                     q: D.q, salesmen: [] };
        depots.push(dp); byCode.depot[dp.code] = dp; br.depots.push(dp);

        for (let i = 0; i < D.n; i++) {
          smCounter++;
          const r = mulberry32(hashStr(D.code + '#' + i));
          const nm = NAMA_DEPAN[Math.floor(r() * NAMA_DEPAN.length)] + ' ' +
                     NAMA_BELAKANG[Math.floor(r() * NAMA_BELAKANG.length)];
          /* x = level performa personal, menyebar di sekitar kualitas depo */
          const x = U.clamp(D.q + (r() - 0.5) * 0.20, 0.40, 0.99);
          const risk = U.clamp(1.06 - x + (r() - 0.5) * 0.12, 0.03, 0.80);

          /* 0–2 jenis anomali "kronis" -> menghasilkan pola berulang yang realistis */
          const chronic = [];
          if (risk > 0.30) chronic.push(ANOMALY_TYPES[Math.floor(r() * ANOMALY_TYPES.length)].key);
          if (risk > 0.44 && r() > 0.45) {
            const k = ANOMALY_TYPES[Math.floor(r() * ANOMALY_TYPES.length)].key;
            if (chronic.indexOf(k) < 0) chronic.push(k);
          }

          /* V1.5 — level ASS. Pembagian deterministik murni dari jumlah salesman depo
             dan index salesman: TIDAK memakai PRNG, sehingga seluruh angka KPI yang
             sudah ada tidak bergeser sedikit pun. >=7 salesman -> 2 ASS, selain itu 1 ASS. */
          const assCount = D.n >= 7 ? 2 : 1;
          const assIdx = assCount === 2 ? (i % 2) : 0;
          const assLetter = 'AB'.charAt(assIdx);
          const assCode = 'AS' + D.code.slice(1) + assLetter;
          const assName = 'ASS ' + assLetter;

          const sm = {
            salesman_code: 'SM' + U.pad(smCounter, 4),
            salesman_name: nm,
            depot_code: D.code, depot_name: D.name,
            branch_code: B.code, branch_name: B.name,
            regional_code: R.code, regional_name: R.name,
            ass_code: assCode, ass_name: assName,
            x: x, risk: risk, chronic: chronic, seed: hashStr(D.code + '#' + i)
          };
          /* Registry ASS memakai ass_code sebagai identitas utama dan menyimpan DAFTAR depo.
             Struktur ini sengaja tidak mengasumsikan satu ASS hanya boleh punya satu depo. */
          let asRec = byCode.ass[assCode];
          if (!asRec) {
            asRec = byCode.ass[assCode] = { code: assCode, name: assName,
                     depot_codes: [], branch_code: B.code, regional_code: R.code, salesmen: [] };
            assList.push(asRec);
          }
          if (asRec.depot_codes.indexOf(D.code) < 0) asRec.depot_codes.push(D.code);
          asRec.salesmen.push(sm);

          salesmen.push(sm); byCode.salesman[sm.salesman_code] = sm; dp.salesmen.push(sm);
        }
      });
    });
  });

  /* ---------- kalender kerja (Minggu libur) ---------- */
  const dates = [];
  for (let i = HISTORY; i >= 0; i--) {
    const d = U.addDays(TODAY, -i);
    if (new Date(d + 'T00:00:00').getDay() !== 0) dates.push(d);
  }

  /* faktor harian nasional (kondisi lapangan per hari) -> trend agregat punya gerak nyata */
  const dayFactor = {};
  (function () {
    const dr = mulberry32(770315);
    let f = 0;
    dates.forEach(function (d, i) {
      f = U.clamp(f * 0.62 + (dr() - 0.5) * 0.055, -0.055, 0.055);
      const dow = new Date(d + 'T00:00:00').getDay();
      dayFactor[d] = f + (dow === 6 ? -0.028 : 0) + (dow === 1 ? -0.010 : 0);  /* Sabtu & Senin lebih berat */
    });
  })();

  /* ---------- record harian + event anomali ---------- */
  const records = [];
  const events  = [];
  const recIndex = {};                       /* date -> [record] */

  salesmen.forEach(function (sm) {
    const r = mulberry32(sm.seed ^ 0x9e3779b9);
    /* drift pelan agar trend tidak datar */
    let drift = 0;

    dates.forEach(function (date, di) {
      drift = U.clamp(drift + (r() - 0.5) * 0.012, -0.05, 0.05);
      const wobble = (r() - 0.5) * 0.055;
      const x = U.clamp(sm.x + drift + wobble + dayFactor[date], 0.34, 1.0);

      /* level per-KPI: sedikit berbeda antar KPI supaya profil tidak seragam */
      const B = KPI_MODEL.range;
      const lv = function (spread) { return U.clamp(x + (r() - 0.5) * spread, 0.18, 1.0); };
      const val = function (b, s) { return b[0] + (b[1] - b[0]) * s; };

      /* --- besaran mentah (integer) supaya agregasi bisa exact --- */
      const jks    = Math.round(23 + 9 * lv(0.10) + (r() - 0.5) * 3);
      const scPct  = val(B.sc_jks, lv(0.13));
      const scAct  = U.clamp(Math.round(jks * scPct / 100), 0, jks);
      const visitOn  = Math.max(0, scAct - (r() < 0.22 ? 1 : 0));
      const offShare = U.clamp(0.035 + 0.20 * (1 - x) + (r() - 0.5) * 0.05, 0.01, 0.42);
      const visit    = Math.max(visitOn + 1, Math.round(visitOn / (1 - offShare)));
      const visitOff = visit - visitOn;
      const fOff     = visitOff / visit;

      /* geo & hit: rata-rata tertimbang tetap = target, gap on/off melebar saat performa turun */
      const geoT  = val(B.geo, lv(0.13)) / 100;
      const gGap  = 0.09 + 0.30 * (1 - x);
      const geoOn   = Math.round(visitOn  * U.clamp(geoT + fOff * gGap, 0.05, 1));
      const geoOff  = Math.round(visitOff * U.clamp(geoT - (1 - fOff) * gGap, 0.02, 1));

      const hitT  = val(B.hit, lv(0.15)) / 100;
      const hGap  = 0.11 + 0.26 * (1 - x);
      const ecOn    = Math.round(visitOn  * U.clamp(hitT + fOff * hGap, 0.02, 1));
      const ecOff   = Math.round(visitOff * U.clamp(hitT - (1 - fOff) * hGap, 0.01, 1));

      const omset   = Math.round((ecOn + ecOff) * (410000 + r() * 520000) / 1000) * 1000;

      const checkIn   = Math.round(val(B.checkin,  lv(0.22)));   /* menit sejak 00:00 */
      const checkOut  = Math.round(val(B.checkout, lv(0.22)));
      const transport = Math.round(val(B.transport, lv(0.20)));

      const rec = {
        /* --- kunci (siap dipetakan ke kolom tabel backend) --- */
        report_date: date,
        submitted_at: date + 'T20:' + U.pad(10 + Math.floor(r() * 40)) + ':00+07:00',
        regional_code: sm.regional_code, regional_name: sm.regional_name,
        branch_code: sm.branch_code,     branch_name: sm.branch_name,
        depot_code: sm.depot_code,       depot_name: sm.depot_name,
        ass_code: sm.ass_code,           ass_name: sm.ass_name,
        salesman_code: sm.salesman_code, salesman_name: sm.salesman_name,
        /* --- denominator mentah (agar agregasi weighted & konsisten) --- */
        jks_count: jks, sc_count: scAct,
        on_route_visits: visitOn, off_route_visits: visitOff,
        on_route_geo_ok: geoOn,   off_route_geo_ok: geoOff,
        on_route_ec: ecOn,        off_route_ec: ecOff,
        /* --- metrik proses --- */
        total_visit: visit,
        total_ec: ecOn + ecOff,
        omset: omset,
        sc_jks_pct: jks ? scAct / jks * 100 : 0,
        /* KPI utama Geo Match = ON ROUTE; nilai OFF tetap tersedia terpisah. */
        geo_match_pct: visitOn ? geoOn / visitOn * 100 : null,
        hit_rate_pct: visit ? (ecOn + ecOff) / visit * 100 : 0,
        on_route_geo_match_pct:  visitOn  ? geoOn  / visitOn  * 100 : null,
        off_route_geo_match_pct: visitOff ? geoOff / visitOff * 100 : null,
        avg_check_in: checkIn, avg_check_out: checkOut,
        avg_transport_minutes: transport,
        anomaly_total: 0, anomaly_critical: 0
      };
      rec.process_score = KPI_MODEL.score({
        sc_jks_pct: rec.sc_jks_pct, geo_match_pct: rec.geo_match_pct,
        hit_rate_pct: rec.hit_rate_pct, avg_visit: rec.total_visit,
        avg_check_in: rec.avg_check_in, avg_check_out: rec.avg_check_out,
        avg_transport_minutes: rec.avg_transport_minutes
      });

      /* --- event anomali hari itu --- */
      ANOMALY_TYPES.forEach(function (T) {
        let p = T.base * (0.30 + 2.15 * sm.risk);
        if (sm.chronic.indexOf(T.key) >= 0) p *= 2.7;
        p = Math.min(p, 0.72);
        if (r() >= p) return;

        const cases = 1 + Math.floor(r() * (sm.risk > 0.45 ? 3.6 : 2.2));
        /* V1.2 — route_status ON/OFF. PRNG terpisah (seed: salesman+tanggal+jenis) supaya
           penambahan field ini TIDAK menggeser satu pun angka yang sudah ada di V1.1. */
        const rs = mulberry32(hashStr(sm.salesman_code + '|' + date + '|' + T.key));
        const pOff = U.clamp((fOff * T.offBias) / (fOff * T.offBias + (1 - fOff)), 0.02, 0.85);
        const route_status = rs() < pOff ? 'OFF' : 'ON';
        /* severity bergantung pada jenis anomali + profil risiko, bukan hanya jumlah kasus */
        const cw = T.critW * (0.55 + 0.9 * sm.risk) * (cases >= 3 ? 1.35 : 1);
        const q = r();
        const sev = q < cw ? 'crit' : (q < Math.min(0.92, cw + 0.30) ? 'review' : 'warn');
        events.push({
          report_date: date, type: T.key,
          salesman_code: sm.salesman_code, salesman_name: sm.salesman_name,
          depot_code: sm.depot_code, depot_name: sm.depot_name,
          ass_code: sm.ass_code, ass_name: sm.ass_name,
          branch_code: sm.branch_code, branch_name: sm.branch_name,
          regional_code: sm.regional_code, regional_name: sm.regional_name,
          cases: cases, severity: sev, route_status: route_status,
          window: U.clock(checkIn + 45 + Math.floor(r() * 380)),
          outlet: 'OTL-' + U.pad(100 + Math.floor(r() * 880), 3)
        });
        rec.anomaly_total += cases;
        if (sev === 'crit') rec.anomaly_critical += cases;
      });

      records.push(rec);
      (recIndex[date] || (recIndex[date] = [])).push(rec);
    });
  });

  /* index event: date -> [] */
  const evIndex = {};
  events.forEach(function (e) { (evIndex[e.report_date] || (evIndex[e.report_date] = [])).push(e); });

  /* ---------- helper filter scope ---------- */
  /* V1.6.6 — membership Regional/Cabang TIDAK lagi dibaca dari row.regional_code /
     row.branch_code, melainkan dari resolved organization graph (Master Cabang
     authoritative, fallback demo). Raw record tidak pernah dimutasi. */
  function allowSetFor(scope) {
    if (!scope || (!scope.regional && !scope.branch)) return null;
    return (typeof OrgResolver !== 'undefined') ? OrgResolver.depotSetOf(scope) : null;
  }
  function inScope(row, scope, allow, domain) {
    const set = allow === undefined ? allowSetFor(scope) : allow;
    if (set && !set[row.depot_code]) return false;
    if (scope.depot    && row.depot_code    !== scope.depot)    return false;
    if (scope.ass      && row.ass_code      !== scope.ass)      return false;
    if (scope.salesman && row.salesman_code !== scope.salesman) return false;
    return true;
  }
  function pick(index, from, to, scope) {
    const out = [];
    let d = from;
    const guard = U.diffDays(from, to);
    if (guard < 0) return out;
    const allow = allowSetFor(scope);
    for (let i = 0; i <= guard; i++) {
      const bucket = index[d];
      if (bucket) for (let j = 0; j < bucket.length; j++) {
        if (inScope(bucket[j], scope, allow)) out.push(bucket[j]);
      }
      d = U.addDays(d, 1);
    }
    return out;
  }

  /* ---------- domain dummy Hasil Kerja (deterministic, terpisah dari PRNG proses) ---------- */
  const resultRecords = [], resultIndex = {};
  records.forEach(function (src, di) {
    const rr = mulberry32(hashStr('hasil|' + src.salesman_code + '|' + src.report_date));
    const poolSize = 28 + (hashStr('pool|' + src.salesman_code) % 17);
    const outletIds = [];
    const start = (di * 7 + hashStr(src.report_date + '|' + src.salesman_code)) % poolSize;
    for (let i = 0; i < src.total_ec; i++) {
      const oi = (start + i * 3) % poolSize;
      const id = src.salesman_code + '-O' + U.pad(oi + 1);
      if (outletIds.indexOf(id) < 0) outletIds.push(id);
    }

    const weights = RESULT_ECERAN.map(function (p, pi) {
      const pr = mulberry32(hashStr('eceran|' + p.key + '|' + src.salesman_code + '|' + src.report_date));
      return .55 + pr() * 1.15 + (pi === hashStr(src.salesman_code) % RESULT_ECERAN.length ? .28 : 0);
    });
    const weightTotal = U.sum(weights, function (x) { return x; });
    const epbPoint = Math.round(src.total_ec * (.82 + rr() * .78) * 10) / 10;
    const products = RESULT_ECERAN.map(function (p, pi) {
      const active = outletIds.filter(function (id) {
        return hashStr(id + '|' + p.key + '|' + src.report_date) % 100 < 36 + (pi % 3) * 5;
      });
      if (!active.length && outletIds.length) active.push(outletIds[pi % outletIds.length]);
      return {
        key: p.key,
        active_outlet_ids: active,
        omset: Math.round(src.omset * weights[pi] / weightTotal),
        epb_point: Math.round(epbPoint * weights[pi] / weightTotal * 10) / 10
      };
    });

    const rec = {
      report_date: src.report_date,
      regional_code: src.regional_code, regional_name: src.regional_name,
      branch_code: src.branch_code, branch_name: src.branch_name,
      depot_code: src.depot_code, depot_name: src.depot_name,
      ass_code: src.ass_code, ass_name: src.ass_name,
      salesman_code: src.salesman_code, salesman_name: src.salesman_name,
      sales_call: src.total_visit,
      ec: src.total_ec,
      omset: src.omset,
      active_outlet_ids: outletIds,
      epb_point: epbPoint,
      salesman_active: true,
      products: products,
      target_omset: null, target_ec: null, target_roa: null, target_epb_point: null
    };
    resultRecords.push(rec);
    (resultIndex[rec.report_date] || (resultIndex[rec.report_date] = [])).push(rec);
  });

  /* Target MTD demo ditempel sebagai raw field per salesman/bulan. Renderer tidak menghitung target. */
  const targetBag = {};
  resultRecords.forEach(function (r) {
    const k = r.report_date.slice(0, 7) + '|' + r.salesman_code;
    const b = targetBag[k] || (targetBag[k] = { rows: [], omset: 0, ec: 0, epb: 0, outlets: {} });
    b.rows.push(r); b.omset += r.omset; b.ec += r.ec; b.epb += r.epb_point;
    r.active_outlet_ids.forEach(function (id) { b.outlets[id] = 1; });
  });
  Object.keys(targetBag).forEach(function (k) {
    const b = targetBag[k], h = hashStr('target|' + k);
    const fOm = .91 + (h % 2000) / 10000;
    const fEc = .92 + ((h >>> 3) % 1800) / 10000;
    const fRo = .93 + ((h >>> 6) % 1600) / 10000;
    const fEp = .90 + ((h >>> 9) % 2100) / 10000;
    const t = {
      omset: Math.round(b.omset / fOm),
      ec: Math.max(1, Math.round(b.ec / fEc)),
      roa: Math.max(1, Math.round(Object.keys(b.outlets).length / fRo)),
      epb: Math.round(b.epb / fEp * 10) / 10
    };
    b.rows.forEach(function (r) {
      r.target_omset = t.omset; r.target_ec = t.ec;
      r.target_roa = t.roa; r.target_epb_point = t.epb;
    });
  });

  /* =========================== PUBLIC API =========================== */
  return {
    mode: 'demo',
    label: 'Demo Data Provider (in-memory)',
    today: TODAY,
    /* daftar tanggal kerja yang tersedia */
    dates: function () { return dates.slice(); },
    firstDate: function () { return dates[0]; },
    lastDate:  function () { return dates[dates.length - 1]; },

    org: function () { return { regionals: regionals, branches: branches, depots: depots, ass: assList, salesmen: salesmen }; },
    lookup: function (kind, code) { return byCode[kind] ? byCode[kind][code] : null; },

    /* record harian per salesman */
    getRecords: function (range, scope) { return pick(recIndex, range.from, range.to, scope || {}); },
    /* event anomali */
    getEvents:  function (range, scope) { return pick(evIndex,  range.from, range.to, scope || {}); },
    /* raw result harian per salesman; epb_point adalah field demo yang dapat diganti backend. */
    getResultRecords: function (range, scope) { return pick(resultIndex, range.from, range.to, scope || {}); },
    resultEceran: function () { return RESULT_ECERAN.map(function (x) { return Object.assign({}, x); }); },

    countSalesmen: function (scope) {
      const sc = scope || {}, allow = allowSetFor(sc);
      let n = 0; for (const s of salesmen) if (inScope(s, sc, allow)) n++; return n;
    },

    stats: function () { return { records: records.length, events: events.length,
                                  salesmen: salesmen.length, depots: depots.length, days: dates.length }; }
  };
})();

/* ============================================================================
   LAYER 4B — LIVE DATA FOUNDATION (V1.7.1)
   ----------------------------------------------------------------------------
   SUPABASE → MONITORING PUSAT READ GATEWAY → LiveDataStore → ApiDataProvider
   → DashboardService existing → Renderer existing.

   Prinsip:
   - Fetch bersifat async, TETAPI DataProvider yang dilihat DashboardService
     tetap SYNCHRONOUS (membaca cache). Renderer existing tidak diubah menjadi
     async.
   - PROCESS dan RESULT memiliki periode INDEPENDEN. Tidak ada satu lastDate()
     global untuk keduanya.
   - Tidak ada silent fallback ke DEMO. Bila LIVE gagal, aplikasi menampilkan
     status error — bukan angka dummy.
   ========================================================================= */

/* ---------------------------------------------------------------------------
   KONFIGURASI FRONTEND — HANYA NILAI YANG AMAN UNTUK CLIENT.
   DILARANG mengisi service_role key, password database, atau secret apa pun
   di blok ini. anon key memang public client key dan boleh berada di sini.
   --------------------------------------------------------------------------- */
const MONITORING_PUSAT_CONFIG = {
  /* V1.7.4 micro-fix: SUPABASE_URL harus project base URL; functionUrl()
     menambahkan /functions/v1/monitoring-pusat-read secara otomatis. */
  /* Contoh: 'https://xxxxxxxx.supabase.co' */
  SUPABASE_URL: 'https://nrpxkrhkdhyokbejcjsb.supabase.co',
  /* anon/publishable key — public client key, BUKAN service role */
  SUPABASE_ANON_KEY: '',
  /* URL penuh Edge Function Read Gateway.
     Contoh: 'https://xxxxxxxx.supabase.co/functions/v1/monitoring-pusat-read'
     Bila dikosongkan namun SUPABASE_URL terisi, URL disusun otomatis. */
  READ_FUNCTION_URL: '',
  /* Mode autentikasi Read Gateway: 'jwt' (disarankan) atau 'token'. */
  AUTH_MODE: 'token',
  /* Hanya dipakai bila AUTH_MODE === 'token' (project belum memakai Supabase Auth).
     Nilai ini TETAP terlihat oleh pengguna aplikasi — gunakan hanya untuk UAT
     internal pada jaringan terbatas, dan pindah ke 'jwt' untuk production. */
  READ_ACCESS_TOKEN: 'PusatUAT_Riki_2026_qwertyuiopasdfghjklzxcvbnmqwer1234',
  /* Timeout permintaan gateway (ms) */
  TIMEOUT_MS: 45000,
  /* Versi kontrak response gateway yang didukung frontend ini */
  SUPPORTED_SCHEMA_VERSION: 1
};

/* ---------------------------------------------------------------------------
   LIVE GATEWAY — satu-satunya pintu keluar jaringan.
   Menyediakan request generation token + AbortController sehingga response lama
   tidak pernah menimpa state terbaru.
   --------------------------------------------------------------------------- */
const LiveGateway = {
  _gen: 0,
  _inflight: {},

  configured: function () {
    const c = MONITORING_PUSAT_CONFIG;
    const url = this.functionUrl();
    if (!url) return false;
    if (c.AUTH_MODE === 'token') return !!String(c.READ_ACCESS_TOKEN || '').trim();
    /* mode jwt: butuh anon key untuk memperoleh session Supabase Auth */
    return !!String(c.SUPABASE_ANON_KEY || '').trim();
  },
  functionUrl: function () {
    const c = MONITORING_PUSAT_CONFIG;
    const explicit = String(c.READ_FUNCTION_URL || '').trim();
    if (explicit) return explicit;
    const base = String(c.SUPABASE_URL || '').trim().replace(/\/+$/, '');
    return base ? base + '/functions/v1/monitoring-pusat-read' : '';
  },
  setupMessage: function () {
    const c = MONITORING_PUSAT_CONFIG;
    if (!this.functionUrl()) return 'SUPABASE_URL atau READ_FUNCTION_URL belum diisi pada MONITORING_PUSAT_CONFIG.';
    if (c.AUTH_MODE === 'token' && !String(c.READ_ACCESS_TOKEN || '').trim())
      return 'AUTH_MODE = "token" tetapi READ_ACCESS_TOKEN belum diisi pada MONITORING_PUSAT_CONFIG.';
    if (c.AUTH_MODE !== 'token' && !String(c.SUPABASE_ANON_KEY || '').trim())
      return 'SUPABASE_ANON_KEY belum diisi pada MONITORING_PUSAT_CONFIG.';
    return '';
  },

  /* token akses user. Pada AUTH_MODE 'jwt' diambil dari sesi Supabase Auth yang
     sudah ada (localStorage standar supabase-js). Tidak pernah membuat token
     sendiri dan tidak pernah menyimpan service role. */
  accessToken: function () {
    const c = MONITORING_PUSAT_CONFIG;
    if (c.AUTH_MODE === 'token') return null;
    if (typeof window !== 'undefined' && window.__PUSAT_ACCESS_TOKEN__) return String(window.__PUSAT_ACCESS_TOKEN__);
    try {
      const ref = String(c.SUPABASE_URL || '').replace(/^https?:\/\//, '').split('.')[0];
      const raw = window.localStorage.getItem('sb-' + ref + '-auth-token');
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      return (parsed && (parsed.access_token || (parsed.currentSession && parsed.currentSession.access_token))) || null;
    } catch (e) { return null; }
  },

  nextGeneration: function () { this._gen++; return this._gen; },
  currentGeneration: function () { return this._gen; },

  /* Mengirim satu action ke Read Gateway.
     opts.generation — bila diberikan dan sudah usang, hasil ditolak (race safety). */
  call: function (action, payload, opts) {
    const self = this, o = opts || {};
    const url = this.functionUrl();
    const setup = this.setupMessage();
    if (setup) return Promise.reject(this._err('CONFIG_INCOMPLETE', setup));

    const c = MONITORING_PUSAT_CONFIG;
    const headers = { 'Content-Type': 'application/json' };
    if (c.AUTH_MODE === 'token') {
      headers['X-Pusat-Read-Token'] = String(c.READ_ACCESS_TOKEN || '');
      if (String(c.SUPABASE_ANON_KEY || '').trim()) headers['apikey'] = String(c.SUPABASE_ANON_KEY);
    } else {
      const tok = this.accessToken();
      if (!tok) return Promise.reject(this._err('NO_SESSION',
        'Sesi login Supabase tidak ditemukan. Read Gateway menolak permintaan tanpa autentikasi.'));
      headers['Authorization'] = 'Bearer ' + tok;
      if (String(c.SUPABASE_ANON_KEY || '').trim()) headers['apikey'] = String(c.SUPABASE_ANON_KEY);
    }

    /* satu request aktif per action; request lama dibatalkan */
    if (this._inflight[action]) { try { this._inflight[action].abort(); } catch (e) {} }
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    this._inflight[action] = ctrl;
    const timer = setTimeout(function () { if (ctrl) { try { ctrl.abort(); } catch (e) {} } },
                             Number(c.TIMEOUT_MS) || 45000);

    const body = Object.assign({ action: action }, payload || {});
    return fetch(url, {
      method: 'POST', headers: headers, body: JSON.stringify(body),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (resp) {
      clearTimeout(timer);
      return resp.text().then(function (text) {
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        if (!resp.ok || !data || data.ok !== true) {
          const err = (data && data.error) || {};
          throw self._err(err.code || ('HTTP_' + resp.status),
            err.message || ('Read Gateway menolak permintaan (HTTP ' + resp.status + ').'), resp.status);
        }
        if (Number(data.schema_version) !== Number(c.SUPPORTED_SCHEMA_VERSION)) {
          throw self._err('SCHEMA_VERSION_MISMATCH',
            'Versi kontrak Read Gateway (' + data.schema_version + ') tidak cocok dengan aplikasi (' +
            c.SUPPORTED_SCHEMA_VERSION + ').');
        }
        if (o.generation !== undefined && o.generation !== self._gen) {
          throw self._err('STALE_RESPONSE', 'Response usang diabaikan.');
        }
        return data;
      });
    }).catch(function (e) {
      clearTimeout(timer);
      if (e && e.__pusat) throw e;
      if (e && e.name === 'AbortError') throw self._err('ABORTED', 'Permintaan dibatalkan atau melewati batas waktu.');
      throw self._err('NETWORK_ERROR', 'Tidak dapat menghubungi Read Gateway Monitoring Pusat.');
    });
  },
  _err: function (code, message, status) {
    const e = new Error(message); e.code = code; e.status = status || 0; e.__pusat = true; return e;
  }
};

/* V1.7.7.7 — gateway governance terpisah agar Read Gateway existing tidak
   di-overwrite. Token/auth mengikuti konfigurasi existing; service-role tetap
   hanya berada di Edge Function. */
/* V1.7.7.9.2.1 — preserve the production authentication contract. The server
   validates the same configured token/session already used by production. */
const MASTER_CONTROL_WRITE_ENABLED = MONITORING_PUSAT_CONFIG.AUTH_MODE === 'token';

const MasterControlGateway = {
  functionUrl: function () {
    const base = String(MONITORING_PUSAT_CONFIG.SUPABASE_URL || '').trim().replace(/\/+$/, '');
    return base ? base + '/functions/v1/monitoring-pusat-master' : '';
  },
  call: function (action, payload) {
    const url = this.functionUrl();
    if (!url) return Promise.reject(new Error('SUPABASE_URL belum dikonfigurasi.'));
    const c = MONITORING_PUSAT_CONFIG, headers = { 'Content-Type': 'application/json' };
    if (c.AUTH_MODE === 'token') headers['X-Pusat-Read-Token'] = String(c.READ_ACCESS_TOKEN || '');
    else {
      const tok = LiveGateway.accessToken();
      if (!tok) return Promise.reject(new Error('Sesi login Supabase tidak ditemukan.'));
      headers.Authorization = 'Bearer ' + tok;
    }
    if (String(c.SUPABASE_ANON_KEY || '').trim()) headers.apikey = String(c.SUPABASE_ANON_KEY);
    return fetch(url, { method: 'POST', headers: headers,
      body: JSON.stringify(Object.assign({ action: action }, payload || {})) })
      .then(function (r) { return r.text().then(function (t) {
        let d = null; try { d = t ? JSON.parse(t) : null; } catch (e) {}
        if (!r.ok || !d || d.ok !== true) throw new Error((d && d.error && d.error.message) || 'Master Cabang gateway gagal.');
        return d.data || {};
      }); });
  }
};

/* Central authority keyed by depot_code. Missing field pada payload lama = AKTIF. */
const MasterCabangAuthority = {
  rev: 0, rows: [], byDepot: {}, loaded: false,
  normStatus: function (v) {
    const x = String(v === null || v === undefined ? '' : v).trim().toUpperCase().replace(/\s+/g, ' ');
    return x === 'TAKE OUT' ? 'TAKE OUT' : 'AKTIF';
  },
  hydrate: function (rows) {
    const out = [], by = {};
    (rows || []).forEach(function (r) {
      const code = LiveNormalize.code(r && r.depot_code); if (!code || by[code]) return;
      const rec = Object.assign({}, r, {
        depot_code: code,
        status_monitoring: MasterCabangAuthority.normStatus(r.status_monitoring),
        status_ranking: MasterCabangAuthority.normStatus(r.status_ranking),
        status_informasi: MasterCabangAuthority.normStatus(r.status_informasi)
      });
      by[code] = rec; out.push(rec);
    });
    this.rows = out; this.byDepot = by; this.loaded = true; this.rev++;
    return out;
  },
  status: function (code, domain) {
    const r = this.byDepot[LiveNormalize.code(code)];
    if (!r) return 'AKTIF';
    const key = domain === 'ranking' ? 'status_ranking' : domain === 'informasi' ? 'status_informasi' : 'status_monitoring';
    return this.normStatus(r[key]);
  },
  allowed: function (code, domain) { return this.status(code, domain) === 'AKTIF'; },
  scopeAllowed: function (scope, domain) {
    const sc = scope || {};
    if (sc.depot) return this.allowed(sc.depot, domain);
    return true;
  },
  scopeHasAllowed: function (scope, domain) {
    const sc = scope || {};
    if (sc.depot) return this.allowed(sc.depot, domain);
    try {
      const list = OrgResolver.depotCodesOf(sc).list || [];
      for (let i = 0; i < list.length; i++) if (this.allowed(list[i].code || list[i], domain)) return true;
      return false;
    } catch (e) { return true; }
  },
  syncLiveStore: function () {
    if (typeof LiveDataStore !== 'undefined' && LiveDataStore && LiveDataStore.masterDepots) {
      const by = this.byDepot;
      LiveDataStore.masterDepots = LiveDataStore.masterDepots.map(function (r) {
        return Object.assign({}, r, by[LiveNormalize.code(r.depot_code)] || {});
      });
      LiveDataStore.org = LiveNormalize.buildOrg(LiveDataStore.masterDepots,
        LiveDataStore.process.daily || [], LiveDataStore.result.mtd || [],
        (typeof LiveLoader !== 'undefined' && LiveLoader._batchIndex) || {});
    }
    return this.rows;
  },
  refresh: function () {
    const self = this;
    return MasterControlGateway.call('get', {}).then(function (d) {
      self.hydrate(d.rows || []);
      return self.syncLiveStore();
    });
  },
  apply: function (changes) {
    if (!MASTER_CONTROL_WRITE_ENABLED)
      return Promise.reject(new Error('Apply Master Cabang dinonaktifkan oleh konfigurasi aplikasi.'));
    const self = this;
    return MasterControlGateway.call('apply', { changes: changes || [] }).then(function (d) {
      /* Gunakan rows terbaru dari response apply supaya success tidak berubah
         menjadi false-failure hanya karena GET kedua mengalami gangguan jaringan. */
      self.hydrate(d.rows || []);
      self.syncLiveStore();
      return d;
    });
  }
};

/* ---------------------------------------------------------------------------
   VALIDASI RESPONSE (client-side). Response yang tidak valid TIDAK dipakai.
   --------------------------------------------------------------------------- */
const LiveValidate = {
  isArr: function (v) { return Array.isArray(v); },
  num: function (v) { const n = Number(v); return isFinite(n) ? n : null; },
  nonNegInt: function (v) { const n = Number(v); return isFinite(n) && n >= 0 ? n : null; },
  isDate: function (v) { return /^\d{4}-\d{2}-\d{2}/.test(String(v || '')); },
  isPeriod: function (v) { return /^\d{4}-\d{2}-01/.test(String(v || '')); },

  bootstrap: function (d) {
    const errs = [];
    if (!d || typeof d !== 'object') { errs.push('payload bootstrap kosong'); return errs; }
    if (!this.isArr(d.master_depots)) errs.push('master_depots bukan array');
    if (!this.isArr(d.latest_by_depot)) errs.push('latest_by_depot bukan array');
    if (!this.isArr(d.batches)) errs.push('batches bukan array');
    if (this.isArr(d.master_depots)) {
      const bad = d.master_depots.filter(function (r) { return !r || !String(r.depot_code || '').trim(); }).length;
      if (bad) errs.push(bad + ' baris master_depot tanpa depot_code');
    }
    const lp = d.latest_period || {};
    if (lp.process && !this.isPeriod(lp.process)) errs.push('latest_period.process bukan YYYY-MM-01');
    if (lp.result && !this.isPeriod(lp.result)) errs.push('latest_period.result bukan YYYY-MM-01');
    return errs;
  },

  process: function (d) {
    const errs = [];
    if (!d || typeof d !== 'object') { errs.push('payload process kosong'); return errs; }
    if (!this.isArr(d.batches) || !this.isArr(d.daily) || !this.isArr(d.anomalies)) {
      errs.push('struktur process tidak lengkap'); return errs;
    }
    if (d.period_month && !this.isPeriod(d.period_month)) errs.push('period_month process tidak valid');
    const ids = {};
    d.batches.forEach(function (b) { if (b && b.batch_id) ids[String(b.batch_id)] = 1; });
    let noBatch = 0, badDate = 0, noSalesman = 0, badNum = 0, badGeo = 0, wrongPeriod = 0;
    const self = this;
    d.batches.forEach(function (b) {
      if (!b || !String(b.depot_code || '').trim()) noBatch++;
      if (d.period_month && b && b.period_month && String(b.period_month).slice(0, 10) !== d.period_month) wrongPeriod++;
    });
    d.daily.forEach(function (r) {
      if (!r || !ids[String(r.batch_id)]) { noBatch++; return; }
      if (!self.isDate(r.report_date)) badDate++;
      if (!String(r.salesman_code || '').trim() && !String(r.salesman_name || '').trim()) noSalesman++;
      ['sales_call', 'on_route_visits', 'off_route_visits', 'jks_visited', 'jks_not_visited', 'ec_count']
        .forEach(function (k) { if (r[k] !== null && r[k] !== undefined && self.nonNegInt(r[k]) === null) badNum++; });
      const gm = Number(r.geo_on_route_match || 0), ge = Number(r.geo_on_route_eligible || 0);
      const om = Number(r.geo_off_route_match || 0), oe = Number(r.geo_off_route_eligible || 0);
      if (gm > ge || om > oe) badGeo++;
    });
    if (noBatch) errs.push(noBatch + ' baris process tanpa batch aktif / depot_code');
    if (badDate) errs.push(badDate + ' baris process dengan report_date tidak valid');
    if (noSalesman) errs.push(noSalesman + ' baris process tanpa identitas salesman');
    if (badNum) errs.push(badNum + ' counter process bukan angka non-negatif');
    if (badGeo) errs.push(badGeo + ' baris process dengan geo match melebihi eligible');
    if (wrongPeriod) errs.push(wrongPeriod + ' batch process di luar period_month yang diminta');
    return errs;
  },

  result: function (d) {
    const errs = [];
    if (!d || typeof d !== 'object') { errs.push('payload result kosong'); return errs; }
    ['batches', 'mtd', 'targets', 'daily', 'daily_eceran', 'mtd_eceran'].forEach(function (k) {
      if (!Array.isArray(d[k])) errs.push('result.' + k + ' bukan array');
    });
    if (errs.length) return errs;
    if (d.period_month && !this.isPeriod(d.period_month)) errs.push('period_month result tidak valid');
    const ids = {};
    d.batches.forEach(function (b) { if (b && b.batch_id) ids[String(b.batch_id)] = 1; });
    let noBatch = 0, noSalesman = 0, badCutoff = 0, badNum = 0, wrongPeriod = 0;
    const self = this;
    d.batches.forEach(function (b) {
      if (d.period_month && b && b.period_month && String(b.period_month).slice(0, 10) !== d.period_month) wrongPeriod++;
    });
    d.mtd.forEach(function (r) {
      if (!r || !ids[String(r.batch_id)]) { noBatch++; return; }
      if (!String(r.salesman_code || '').trim()) noSalesman++;
      if (r.cutoff_date && !self.isDate(r.cutoff_date)) badCutoff++;
      ['actual_omset', 'return_omset', 'ro_count', 'roa_actual_count', 'ec_actual_count', 'actual_epb_point']
        .forEach(function (k) { if (r[k] !== null && r[k] !== undefined && self.num(r[k]) === null) badNum++; });
    });
    if (noBatch) errs.push(noBatch + ' baris result_mtd tanpa batch aktif');
    if (noSalesman) errs.push(noSalesman + ' baris result_mtd tanpa salesman_code');
    if (badCutoff) errs.push(badCutoff + ' baris result_mtd dengan cutoff_date tidak valid');
    if (badNum) errs.push(badNum + ' nilai numerik result_mtd tidak valid');
    if (wrongPeriod) errs.push(wrongPeriod + ' batch result di luar period_month yang diminta');
    return errs;
  }
};

  rebuildOrg: function () {

    S.org = LiveNormalize.buildOrg(S.masterDepots, S.process.daily || [], S.result.mtd || [],

       (omset, RO/ROA, EC, EPB, SC/JKS, Geo, NOO) TIDAK disentuh. */
    function stamp(arr) {
      if (!arr || !arr.length) return;
      for (let i = 0; i < arr.length; i++) {
        const r = arr[i]; if (!r || r.salesman_code === undefined) continue;

          r.depot_code = sm.depot_code;

          r.regional_code = dp ? dp.regional_code : r.regional_code;
          r.regional_name = dp ? dp.regional_name : r.regional_name;
        }
        r.organization_conflict = !!sm.organization_conflict;
      }

    /* recIndex/dailyIndex memegang REFERENSI object yang sama, jadi cukup sekali. */
    stamp(S.process.records); stamp(S.process.events);
    stamp(S.result.mtdRecords); stamp(S.result.dailyRecords);
    S.bump();
  },
