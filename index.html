/* ============================================================
   PORTAL MONITORING ASS — PUSAT
   Build Pusat V1.7.9.4  |  PUBLISH HISTORY ATOMIC REPLACEMENT
   ---------------------------------------------------------------------------
   V1.7.9.4 — PUBLISH HISTORY ATOMIC REPLACEMENT
   A. Setiap response yang membawa node publish_history sekarang menggantikan
      authoritative history state sebelumnya secara atomic; same-period rows
      tidak lagi di-union dengan snapshot lama.
   B. Payload tanpa node publish_history tidak mengubah state, sedangkan node
      present tetapi malformed/null mereset authoritative state agar COMPLETE
      lama tidak tertinggal.
   C. Authoritative empty snapshot dapat benar-benar menggantikan history
      sebelumnya, termasuk pada period_month yang sama.
   D. Existing V1.7.9.3 authority precedence, observable integrity cross-check,
      PARTIAL/COMPLETE semantics, timestamp/timezone validation, Project contracts,
      PROCESS, Ranking, Master dan Informasi dipertahankan.

   V1.7.9.3 — PUBLISH HISTORY AUTHORITY PRECEDENCE
   A. Saat publish_history V1 valid COMPLETE, matrix Riwayat Update Harian
      menggunakan authoritative contract rows sebagai satu-satunya event source;
      observable active batches tidak lagi dicampurkan ke hasil authoritative.
   B. Observable batches digunakan sebagai integrity cross-check. Extra/conflicting
      same-period observable batch terhadap COMPLETE contract menurunkan effective
      history mode menjadi PARTIAL, bukan digabung sambil tetap COMPLETE.
   C. Authoritative empty history tetap valid hanya bila tidak bertentangan dengan
      same-period observable evidence; contradiction menggunakan safe PARTIAL mode.
   D. Observable subset tidak membatalkan COMPLETE karena current/active batch
      source memang boleh hanya menjadi subset dari historical authority.
   E. Existing V1.7.9.2 timestamp/timezone integrity, Project completeness,
      Daily/Baseline Salesman, PROCESS, Ranking, Master dan Informasi tetap
      dipertahankan.

   V1.7.9.2 — PUBLISH HISTORY INTEGRITY FINAL
   A. Authoritative publish_history COMPLETE kini mensyaratkan timezone
      Asia/Jakarta secara eksplisit dan seluruh created_at harus merupakan
      timestamp valid.
   B. Malformed historical row membatalkan claim COMPLETE; Web Pusat tidak
      menggunakan authoritative subset yang dapat menghasilkan false missing
      publish.
   C. Duplicate conflicting batch_id membatalkan integrity COMPLETE, sedangkan
      exact duplicate tetap dapat dideduplikasi secara defensif.
   D. Publish History state dihydrate secara clean/atomic sehingga COMPLETE state
      lama tidak terbawa setelah payload malformed atau pergantian period.
   E. Existing Project completeness, Daily/Baseline Salesman V1, PROCESS,
      Ranking, Master, Informasi, badge event dan authoritative empty-history
      behaviour tetap dipertahankan.

   V1.7.9.1 — CONTRACT COMPLETENESS SAFETY
   A. Future Daily Salesman dan Baseline Salesman memakai fail-closed contract
      validation; malformed/duplicate payload tidak lagi digunakan sebagian.
   B. Project parent aggregate hanya aktif bila granular future contract lengkap
      untuk expected Project population pada Monitoring Scope aktif; partial
      rollout tidak ditampilkan sebagai angka complete.
   C. Baseline Project incomplete tetap menampilkan Current tetapi Baseline/Growth
      unavailable, tanpa subset comparison.
   D. Authoritative publish_history V1 menerima complete=true dengan rows kosong;
      malformed complete history tidak digunakan sebagai authoritative subset.
   E. Existing Total Depo, PROCESS, Ranking, Master, Informasi dan future contract
      architecture V1.7.9 dipertahankan.

   V1.7.9 — FUTURE DATA CONTRACT READY
   A. Web Pusat siap otomatis membaca RESULT Daily Salesman V1 untuk
      Monitoring Harian + Trend Project tanpa mengubah Total Depo authority.
   B. Web Pusat siap otomatis membaca RESULT Baseline Salesman V1 untuk
      Detail MTD Project yang comparable.
   C. Publish History membedakan NONE / PARTIAL / COMPLETE; missing workday
      hanya merah ketika historical source authoritative lengkap.
   D. Multiple publish memakai distinct publish action union antar domain;
      PROCESS + RESULT dalam event sama tetap satu publish.
   E. Semua contract bersifat additive/backward-compatible; sebelum producer
      tersedia UI tetap fail-safe dan tidak membuat angka/history sintetis.

   V1.7.8.1 — PUBLISH HISTORY IDENTITY SAFETY
   A. Batch dedupe memakai batch_id sebagai primary identity; publish_event_id
      tidak lagi menghapus PROCESS/RESULT batch yang berada pada event sama.
   B. publish_event_id digunakan sebagai grouping publish action, sehingga
      PROCESS + RESULT pada satu publish tidak dianggap revisi 2x.
   C. Multiple publish badge hanya berasal dari distinct publish event yang
      benar-benar observable; revision_number tidak digunakan untuk menebak
      same-day revision history.
   D. Existing Project-scoped Result, Detail MTD safety, daily publish matrix,
      Sunday handling, Ranking, PROCESS authority dan backend contract
      dipertahankan.

   V1.7.8 — PROJECT-SCOPED RESULT + DAILY PUBLISH DISCIPLINE
   A. Monitoring Harian Hasil Kerja dan Trend menggunakan Coverage Salesman /
      Project bila granular authority tersedia; tidak ada fallback palsu ke Total Depo.
   B. Detail MTD Current/Baseline dibuat scope-safe terhadap Coverage Project;
      baseline yang tidak comparable ditampilkan unavailable, bukan Total Depo.
   C. Informasi menambah Riwayat Update Harian per Depo dengan posisi
      P(HK Proses) / H(HK Hasil), missing workday, multiple publish badge,
      dan Sunday/non-working-day handling.
   D. Existing Update per Depo, RESULT Daily Depot V2, PROCESS authority,
      Ranking, Master Cabang, Master Salesman, dan backend contract dipertahankan.

   V1.7.7.9.2.1 — MASTER CABANG SSOT SOURCE RESOLVER
   - Kontrak autentikasi produksi dipertahankan untuk Read dan Apply.
   - Preview rename menampilkan current/new name, alias historical, dan Plant current.
   - Backend apply_master_cabang_ssot_v1 menjaga master + source-map secara atomic.

   V1.7.7.4 — PROCESS PERIOD AUTHORITY ROUTING
   A. KPI Summary PROSES membaca source_meta.process_period_summary V1 dari
      Website ASS untuk periode yang benar: Hari Ini -> today, 7 Hari ->
      last_7_workdays, Bulan Ini -> mtd. Formula tetap 100% authority Website ASS;
      Pusat hanya memilih snapshot periode dan melakukan parent mean 1 Depo=1 suara.
   B. SC vs JKS tetap ON ROUTE ONLY sesuai metadata Website ASS. Tidak ada
      recompute formula KPI final di Pusat.
   C. Backward compatibility: Bulan Ini dapat fallback ke process_depot_summary
      V1 bila process_period_summary.mtd belum tersedia. Hari Ini/7 Hari pada
      batch legacy tetap memakai perilaku existing hanya bila extension baru
      memang tidak tersedia, tanpa mengubah process_daily granular.
   D. RESULT Daily V2, Ranking, Anomali, Trend, Master, Edge Function, Supabase
      schema, dan filter Coverage Salesman tidak diubah.

   V1.7.7.3 — PROCESS AUTHORITY ALL PERIOD + UI POLISH (RIWAYAT)
   A. Pada build ini KPI Summary PROSES Hari Ini / 7 Hari / Bulan Ini pernah memakai
      authority yang sama: upload_batches.source_meta.process_depot_summary
      Website ASS. Ini mencegah fallback ke recompute process_daily lama yang
      menghasilkan definisi Avg Check In/Out dan Durasi Jalan berbeda.
      Karena source saat ini bergrain DEPOT_MONTH, ketiga tombol periode pada
      7 card KPI Summary menampilkan snapshot final Depo yang sama; tombol
      periode tetap berlaku untuk section granular lain (Monitoring Harian,
      Trend Proses, Anomali, Pola Berulang). KPI Summary juga tetap total Depo
      dan tidak mengikuti Coverage Salesman/Project.
   B. Card SC vs JKS dipastikan eksplisit memakai authority ON ROUTE Website ASS
      (field sc_jks_pct dari process_depot_summary), bukan All Sales Call.
   C. Trend Hasil Kerja di desktop memakai 2 kolom penuh (Omset + Avg EC),
      menghilangkan kolom kosong di sisi kanan; responsive tetap 1 kolom.
   D. Badge Level Aktif pada popup Monitoring Harian RESULT V2 menunjukkan
      level scope yang sedang dibuka (Regional/Cabang/Depo), bukan level anak.
   E. Presentasi Avg Durasi Jalan untuk KPI authority Website ASS memakai menit
      utuh/floor agar konsisten dengan tampilan Website ASS (contoh 3j21m).

   V1.7.7.2 — PROCESS MTD AUTHORITY ROUTING FIX
   A. KPI Summary PROCESS periode Bulan Ini/MTD SELALU memakai
      source_meta.process_depot_summary Website ASS pada level
      Nasional / Regional / Cabang / Depo, termasuk ketika Coverage Salesman

      recompute process_daily untuk KPI Summary MTD.
   B. Hari Ini / 7 Hari tetap memakai process_daily existing dan tetap
      mengikuti Coverage Salesman, karena process_depot_summary bergrain
      DEPOT_MONTH dan tidak boleh dipakai untuk periode harian.
   C. Delta KPI MTD authority tidak dibandingkan dengan process_daily periode
      sebelumnya karena sumber/definisi tidak apple-to-apple; delta ditampilkan
      kosong sampai tersedia summary pembanding yang setara.
   D. Temuan Utama memakai summary KPI yang sama dengan KPI Summary agar tidak
      kembali menampilkan jam Check In/Out atau Durasi Jalan hasil recompute lama.

   V1.7.7.1 — SCOPE & PERIOD SAFETY MICROFIX
   A. process_depot_summary hanya dipakai untuk PROCESS Bulan Ini/MTD saat
      Coverage Salesman = Semua Salesman. Hari Ini / 7 Hari / Project Coverage
      tetap memakai process_daily existing agar periode dan scope konsisten.
   B. RESULT Daily V2 memakai hierarchy organisasi murni dari Master Depot +
      Monitoring Scope, tanpa bocor ke SalesmanProjectScope.
   C. Coverage Project kosong tidak lagi mematikan seluruh Hasil Kerja; section
      MTD salesman-level boleh kosong, sementara Monitoring Harian + Trend V2
      tetap tampil sebagai TOTAL DEPO.

   V1.7.7 — ASS AUTHORITY + RESULT DAILY V2
   A. PROCESS DEPOT SUMMARY sebagai FINAL KPI AUTHORITY managerial.
      Website ASS adalah calculation authority. Dashboard Proses Kerja pada
      level Nasional / Regional / Cabang / Depo memakai angka FINAL dari
      upload_batches.source_meta.process_depot_summary (grain DEPOT_MONTH),
      BUKAN hasil recompute process_daily. Parent memakai prinsip
      1 DEPO = 1 SUARA (arithmetic mean antar Depo valid); counter additive
      (total_visit, ec_count) tetap SUM. Missing metric DIEKSKLUSI dari
      denominator dan TIDAK pernah dianggap nol.
   B. process_daily TETAP authority untuk Ranking, KPI Salesman, detail
      Salesman, Monitoring Harian PROSES, Trend PROSES, Anomali, Matrix
      Anomali, route/evidence, dan seluruh scope di bawah Depo (ASS/Salesman).
   C. RESULT DAILY DEPOT V2 (source_meta.result_daily_depot, version 2,
      date_basis ORDER_DATE, grain DEPO x TANGGAL ORDER, metrics Omset dan
      Avg EC) menjadi sumber Monitoring Harian dan Trend HASIL KERJA pada LIVE.
      Omset parent = SUM Depo valid; Avg EC parent = arithmetic mean Depo valid.
      Drilldown berhenti di DEPO karena Daily Salesman memang tidak dipublish.
   D. Daily/Trend V2 dan kolom MTD pada Monitoring Harian bersifat TOTAL DEPO:
      mengikuti Monitoring Scope dan hierarchy organisasi, TETAPI TIDAK
      mengikuti Coverage Salesman / Project. Result MTD, Pencapaian, Detail
      MTD, dan Ranking tetap mengikuti Coverage Salesman seperti sebelumnya.
   Backend, Edge Function monitoring-pusat-read, Supabase schema, dan
   Website ASS TIDAK diubah — seluruh extension dibaca dari d.batches existing.

   V1.7.6.1

      1 SALESMAN CODE = 1 SALESMAN ENTITY. Identity key organization graph

:root{
  color-scheme: light;

  /* --- surfaces --- */
  --bg:            #eef1ef;
  --surface-1:     #ffffff;
  --surface-2:     #f7f9f8;
  --surface-3:     #eef2f0;
  --header-1:      #0d2a22;
  --header-2:      #14483a;

  /* --- ink --- */
  --ink-1:         #15211d;
  --ink-2:         #55635c;
  --ink-3:         #8b978f;
  --ink-inv:       #ffffff;

  /* --- lines --- */
  --line:          #e2e8e4;
  --line-strong:   #cfd8d3;

  /* --- brand --- */
  --brand:         #0e9f6e;
  --brand-deep:    #0b7d57;
  --brand-wash:    #e7f5ef;

  /* --- chart series (validated: all-pairs CVD PASS on white) --- */
  --series-1:      #0e9f6e;   /* SC vs JKS      */
  --series-2:      #2a78d6;   /* Geo Match      */
  --series-3:      #4a3aa7;   /* Hit Rate EC    */

  /* --- status (reserved: never used as a data series) --- */
  --st-good:       #0e9f6e;
  --st-good-wash:  #e7f5ef;
  --st-warn:       #b98200;
  --st-warn-wash:  #fdf4e0;
  --st-review:     #d2551f;
  --st-review-wash:#fdeee6;
  --st-crit:       #cf3a39;
  --st-crit-wash:  #fdeded;
  --st-neut:       #55635c;
  --st-neut-wash:  #eef2f0;

  --radius:        10px;
  --radius-sm:     6px;
  --shadow-1:      0 1px 2px rgba(16,40,32,.05), 0 1px 3px rgba(16,40,32,.04);
  --shadow-2:      0 8px 28px rgba(13,42,34,.16);
  --font: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", "JetBrains Mono", "Consolas", "Roboto Mono", ui-monospace, monospace;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink-1);
  font-size:13.5px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{ font-family:inherit; font-size:inherit; cursor:pointer; }
select{ font-family:inherit; }
h1,h2,h3,h4{ margin:0; font-weight:650; letter-spacing:-.01em; }
table{ border-collapse:separate; border-spacing:0; width:100%; }

/* ============================ HEADER ============================ */
.app-header{
  background:linear-gradient(135deg,var(--header-1) 0%,var(--header-2) 100%);
  color:var(--ink-inv);
  padding:14px 22px 0;
}
.hdr-top{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  max-width:1720px; margin:0 auto; padding-bottom:12px;
}
.hdr-mark{
  width:38px; height:38px; border-radius:9px; flex:none;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.16);
  display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:12px; letter-spacing:.04em; color:#a9e8cd;
}
.hdr-titles{ min-width:0; }
.hdr-title{ font-size:16.5px; font-weight:700; letter-spacing:.05em; line-height:1.2; }
.hdr-sub{ font-size:11.5px; color:#a9c4b9; letter-spacing:.01em; margin-top:2px; }
.hdr-right{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.badge-demo{
  display:inline-flex; align-items:center; gap:6px;
  background:#fdf4e0; color:#7a5600; border:1px solid #eccf85;
  font-size:10.5px; font-weight:750; letter-spacing:.07em;
  padding:4px 9px; border-radius:999px; cursor:help; white-space:nowrap;
}
.badge-demo::before{ content:""; width:6px; height:6px; border-radius:50%; background:#b98200; flex:none; }
/* V1.7.1 — status sumber data: LIVE (hijau) / peringatan (kuning) / error (merah) */
.badge-demo.is-live{ color:#065f46; background:#d1fae5; border-color:#a7f3d0; }
.badge-demo.is-live::before{ background:#0e9f6e; }
.badge-demo.is-err{ color:#991b1b; background:#fee2e2; border-color:#fecaca; }
.badge-demo.is-err::before{ background:#dc2626; }
.live-note{ display:flex; gap:8px; align-items:flex-start; margin:0 0 12px;
  padding:10px 13px; border-radius:10px; font-size:12.5px; line-height:1.5;
  color:#0b5d43; background:#e7f5ef; border:1px solid #bfe5d4; }
.live-note.warn{ color:#8a5a00; background:#fff8e6; border-color:#f2dfae; }
.live-note b{ font-weight:700; }
.badge-build{
  font-size:10.5px; letter-spacing:.06em; font-weight:600;
  color:#a9c4b9; border:1px solid rgba(255,255,255,.18);
  padding:4px 9px; border-radius:999px; white-space:nowrap;
}
.hdr-clock{ font-size:11px; color:#8fb3a6; font-variant-numeric:tabular-nums; }

/* ============================ NAV ============================ */
.app-nav{
  display:flex; gap:2px; max-width:1720px; margin:0 auto;
  overflow-x:auto; scrollbar-width:none;
}
.app-nav::-webkit-scrollbar{ display:none; }
.nav-item{
  appearance:none; background:none; border:0;
  color:#a9c4b9; font-size:12px; font-weight:650; letter-spacing:.075em;
  padding:11px 17px; border-bottom:2.5px solid transparent;
  white-space:nowrap; transition:color .14s, border-color .14s;
}
.nav-item:hover{ color:#e2f3ea; }
.nav-item[aria-current="page"]{ color:#ffffff; border-bottom-color:var(--brand); }
.nav-item .nav-dot{
  display:inline-block; width:5px; height:5px; border-radius:50%;
  background:#6b8f81; margin-left:7px; vertical-align:middle;
}
.nav-item[aria-current="page"] .nav-dot{ background:var(--brand); }

/* ============================ SHELL ============================ */
.app-main{ max-width:1720px; margin:0 auto; padding:0 22px 56px; }

.demo-note{
  display:flex; align-items:flex-start; gap:9px;
  background:#fdf9ee; border:1px solid #ecdcb4;
  color:#6d5312; font-size:11.5px; line-height:1.5;
  padding:8px 12px; border-radius:var(--radius-sm); margin:14px 0 0;
}
.demo-note b{ font-weight:700; }

/* ============================ FILTER BAR ============================ */
.filter-bar{
  position:sticky; top:0; z-index:40;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);
  border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow-1);
  margin-top:14px; padding:10px 14px;
  display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap;
}
.fg{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.fg-label{
  font-size:9.5px; font-weight:750; letter-spacing:.1em;
  color:var(--ink-3); text-transform:uppercase;
}
.seg{ display:inline-flex; background:var(--surface-3); border-radius:7px; padding:2px; gap:2px; }
.seg button{
  appearance:none; border:0; background:transparent; color:var(--ink-2);
  font-size:12px; font-weight:600; padding:5px 12px; border-radius:5px;
  transition:background .13s, color .13s;
}
.seg button:hover{ color:var(--ink-1); }
.seg button[aria-pressed="true"]{
  background:var(--surface-1); color:var(--brand-deep);
  box-shadow:0 1px 2px rgba(16,40,32,.10); font-weight:700;
}
.sel{
  appearance:none; background:var(--surface-1) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='7' viewBox='0 0 11 7'><path d='M1 1l4.5 4.5L10 1' fill='none' stroke='%2355635c' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 10px center;
  border:1px solid var(--line-strong); border-radius:7px;
  color:var(--ink-1); font-size:12.5px; font-weight:550;
  padding:6px 30px 6px 10px; min-width:168px; max-width:230px;
  transition:border-color .13s, box-shadow .13s;
}
/* ===== V1.7.2 — SCOPE MONITORING (multi-regional trial) ===== */
.sel-btn{
  appearance:none; background:var(--surface-1); border:1px solid var(--line-strong);
  border-radius:7px; color:var(--ink-1); font-size:12.5px; font-weight:600;
  padding:6px 12px; min-width:168px; max-width:230px; cursor:pointer; text-align:left;
  display:inline-flex; align-items:center; gap:8px; transition:border-color .13s, box-shadow .13s;
}
.sel-btn:hover{ border-color:var(--brand); color:var(--brand-deep); }
.sel-btn:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,159,110,.15); }
.sel-btn .sel-btn-chev{ margin-left:auto; color:#55635c; font-size:10px; line-height:1; }
.sel-btn.is-scoped{ border-color:var(--brand); color:var(--brand-deep); background:var(--brand-wash); }
.sel-btn.is-warn{ border-color:#e0b44b; color:#8a5a00; background:#fff8e6; }
.ms-body{ padding:14px 18px 6px; }
.ms-modes{ display:grid; gap:8px; margin-bottom:12px; }
.ms-mode{ display:flex; gap:10px; align-items:flex-start; padding:9px 11px; cursor:pointer;
  border:1px solid var(--line); border-radius:9px; background:var(--surface-1); }
.ms-mode.on{ border-color:var(--brand); background:var(--brand-wash); }
.ms-mode input{ margin-top:2px; flex:none; accent-color:var(--brand); }
.ms-mode span{ display:flex; flex-direction:column; gap:1px; }
.ms-mode b{ font-size:12.5px; font-weight:700; color:var(--ink-1); }
.ms-mode i{ font-style:normal; font-size:11.5px; color:var(--ink-3); }
.ms-toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
.ms-count{ margin-left:auto; font-size:11.5px; color:var(--ink-3); font-weight:600; }
.ms-list{ max-height:46vh; overflow-y:auto; border:1px solid var(--line); border-radius:9px;
  background:var(--surface-1); padding:4px; }
.ms-item{ display:flex; gap:10px; align-items:center; padding:8px 10px; border-radius:7px; cursor:pointer; }
.ms-item + .ms-item{ border-top:1px solid var(--line); }
.ms-item:hover{ background:var(--surface-3); }
.ms-item.on{ background:var(--brand-wash); }
.ms-item input{ flex:none; accent-color:var(--brand); }
.ms-item input:disabled{ cursor:not-allowed; }
.ms-item-label{ font-size:12.5px; font-weight:600; color:var(--ink-1); }
.ms-empty{ padding:18px; text-align:center; font-size:12.5px; color:var(--ink-3); }
.ms-warn{ margin-top:9px; padding:8px 11px; border-radius:8px; font-size:12px; font-weight:600;
  color:#8a5a00; background:#fff8e6; border:1px solid #f2dfae; }
.ms-warn[hidden]{ display:none; }
.ms-foot{ display:flex; gap:9px; justify-content:flex-end; padding:12px 18px 16px; }
/* .btn-primary base sudah didefinisikan pada blok modal existing — di sini
   hanya ditambahkan state disabled untuk tombol Terapkan. */
.btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
.scope-note{ display:flex; gap:8px; align-items:flex-start; margin:0 0 12px; padding:10px 13px;
  border-radius:10px; font-size:12.5px; line-height:1.5;
  color:#8a5a00; background:#fff8e6; border:1px solid #f2dfae; }
@media (max-width:640px){
  .sel-btn{ min-width:0; width:100%; max-width:none; }
  .ms-list{ max-height:38vh; }
  .ms-foot{ position:sticky; bottom:0; background:var(--surface-1); border-top:1px solid var(--line); }
}
.sel:hover{ border-color:var(--brand); }
.sel:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,159,110,.15); }
.sel:disabled{ background-color:var(--surface-3); color:var(--ink-3); cursor:not-allowed; }
.filter-spacer{ margin-left:auto; }
.btn-ghost{
  appearance:none; background:var(--surface-1); border:1px solid var(--line-strong);
  color:var(--ink-2); font-size:12px; font-weight:600;
  padding:6px 12px; border-radius:7px; transition:border-color .13s, color .13s;
}
.btn-ghost:hover{ border-color:var(--brand); color:var(--brand-deep); }

/* ============================ SCOPE / BREADCRUMB ============================ */
.scope-bar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  margin:16px 0 4px;
}
.crumbs{ display:flex; align-items:center; gap:3px; flex-wrap:wrap; font-size:13px; }
.crumb{
  appearance:none; background:none; border:0; padding:3px 6px; border-radius:5px;
  color:var(--ink-2); font-weight:600; font-size:13px;
  transition:background .13s, color .13s;
}
.crumb:hover{ background:var(--surface-3); color:var(--brand-deep); }
.crumb[aria-current="true"]{ color:var(--ink-1); font-weight:750; cursor:default; }
.crumb[aria-current="true"]:hover{ background:none; }
.crumb-sep{ color:var(--ink-3); font-size:12px; }
.scope-level{
  font-size:9.5px; font-weight:750; letter-spacing:.1em; text-transform:uppercase;
  color:var(--brand-deep); background:var(--brand-wash);
  border:1px solid #bfe5d4; padding:3px 8px; border-radius:999px;
}
.scope-meta{ margin-left:auto; font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }

/* ============================ SECTION ============================ */
.section{
  background:var(--surface-1); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow-1);
  margin-top:14px; overflow:hidden;
}
.section-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:12px 16px; border-bottom:1px solid var(--line);
  background:var(--surface-2);
}
.section-title{
  font-size:11.5px; font-weight:750; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-1);
}
.section-sub{ font-size:11.5px; color:var(--ink-3); font-weight:500; }
.section-head .spacer{ margin-left:auto; }
.section-body{ padding:14px 16px; }
.section-body.flush{ padding:0; }

/* ============================ KPI ============================ */
.kpi-row{ display:grid; gap:10px; }
.kpi-row.primary{ grid-template-columns:repeat(5,minmax(0,1fr)); }
.kpi-row.secondary{ grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:10px; }
.kpi{
  border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--surface-1); padding:10px 12px;
  display:flex; flex-direction:column; gap:3px; min-width:0;
  border-left:3px solid var(--line-strong);
}
.kpi.is-good{ border-left-color:var(--st-good); }
.kpi.is-warn{ border-left-color:var(--st-warn); }
.kpi.is-review{ border-left-color:var(--st-review); }
.kpi.is-crit{ border-left-color:var(--st-crit); }
.kpi.is-neut{ border-left-color:var(--line-strong); }
.kpi.hero{ background:var(--surface-2); }
.kpi-label{
  font-size:9.5px; font-weight:750; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.kpi-value{
  font-size:22px; font-weight:700; letter-spacing:-.02em; line-height:1.15;
  font-variant-numeric:tabular-nums; color:var(--ink-1);
}
.kpi-value.sm{ font-size:18px; }
.kpi-foot{ display:flex; align-items:center; gap:6px; row-gap:2px; flex-wrap:wrap; font-size:11px; color:var(--ink-3); }
.kpi-context{ font-size:9.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.kpi-context.is-low,.kpi-context .is-low{ color:var(--st-review); font-weight:650; }
.delta{ font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.delta.up{ color:var(--st-good); }
.delta.down{ color:var(--st-crit); }
.delta.flat{ color:var(--ink-3); }
.kpi-target{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ============================ ROUTE ============================ */
.route-grid{ display:grid; grid-template-columns:1fr 1fr minmax(210px,.85fr); gap:12px; }
.route-card{
  border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:11px 13px; background:var(--surface-1);
}
.route-card.on{ background:linear-gradient(180deg,#f2faf6 0%,#ffffff 62%); }
.route-card.off{ background:linear-gradient(180deg,#fdf6f2 0%,#ffffff 62%); }
.route-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:9px; }
.route-name{ font-size:11px; font-weight:750; letter-spacing:.09em; text-transform:uppercase; }
.route-card.on .route-name{ color:var(--brand-deep); }
.route-card.off .route-name{ color:var(--st-review); }
.route-visits{ font-size:20px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.route-share{ margin-left:auto; font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.bar-line{ margin-top:8px; }
.bar-line-top{ display:flex; align-items:baseline; gap:8px; font-size:11.5px; color:var(--ink-2); }
.bar-line-top b{ margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink-1); font-weight:700; font-size:12.5px; }
.bar-track{ height:6px; border-radius:3px; background:var(--surface-3); margin-top:4px; overflow:hidden; }
.bar-fill{ height:100%; border-radius:3px; }
.route-verdict{
  border:1px solid var(--line); border-radius:var(--radius-sm);
  background:var(--surface-2); padding:11px 13px;
  display:flex; flex-direction:column; gap:8px;
}
.verdict-label{ font-size:9.5px; font-weight:750; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); }
.verdict-text{ font-size:12.5px; line-height:1.5; color:var(--ink-1); }
.gapline{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; font-size:11.5px; color:var(--ink-2); border-top:1px solid var(--line); padding-top:6px; }
.gapline b{ font-variant-numeric:tabular-nums; font-size:12.5px; }

/* ============================ INSIGHT ============================ */
.insight-list{ display:flex; flex-direction:column; gap:8px; }
.insight{
  display:flex; align-items:flex-start; gap:10px;
  border:1px solid var(--line); border-left-width:3px; border-radius:var(--radius-sm);
  padding:9px 12px; background:var(--surface-1);
}
.insight.crit{ border-left-color:var(--st-crit); background:#fefafa; }
.insight.review{ border-left-color:var(--st-review); background:#fffaf7; }
.insight.warn{ border-left-color:var(--st-warn); background:#fffdf6; }
.insight.good{ border-left-color:var(--st-good); background:#f8fdfa; }
.insight-ico{ font-size:12px; line-height:1.5; flex:none; }
.insight-body{ min-width:0; }
.insight-text{ font-size:12.5px; line-height:1.5; color:var(--ink-1); }
.insight-text b{ font-weight:700; }
.insight-meta{ font-size:11px; color:var(--ink-3); margin-top:2px; }

/* ============================ TABLE ============================ */
.table-wrap{ overflow-x:auto; }
.tbl{ font-size:12.5px; min-width:940px; }
.tbl thead th{
  position:sticky; top:0; z-index:2;
  background:var(--surface-2); color:var(--ink-3);
  font-size:9.5px; font-weight:750; letter-spacing:.08em; text-transform:uppercase;
  text-align:right; padding:9px 10px; white-space:nowrap;
  border-bottom:1px solid var(--line);
}
.tbl thead th:first-child{ text-align:left; }
.tbl tbody td{
  padding:8px 10px; border-bottom:1px solid var(--line);
  text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-1); white-space:nowrap;
}
.tbl tbody td:first-child{ text-align:left; font-variant-numeric:normal; }
.tbl tbody tr:last-child td{ border-bottom:0; }
.tbl tbody tr.clickable{ cursor:pointer; transition:background .11s; }
.tbl tbody tr.clickable:hover{ background:var(--brand-wash); }
.tbl tbody tr.clickable:hover .row-chev{ color:var(--brand-deep); transform:translateX(2px); }
.row-name{ display:flex; align-items:center; gap:8px; }
.row-code{
  font-family:var(--mono); font-size:10.5px; font-weight:600;
  color:var(--ink-3); background:var(--surface-3);
  padding:1px 5px; border-radius:4px; flex:none;
}
.row-label{ font-weight:600; overflow:hidden; text-overflow:ellipsis; }
.row-chev{ color:var(--ink-3); font-size:13px; flex:none; transition:transform .13s, color .13s; margin-left:2px; }
.tbl tfoot td{
  padding:9px 10px; text-align:right; font-variant-numeric:tabular-nums;
  background:var(--surface-2); font-weight:700; color:var(--ink-1);
  border-top:1px solid var(--line-strong);
}
.tbl tfoot td:first-child{
  text-align:left; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);
}

/* score pill */
.score{
  display:inline-block; min-width:44px; text-align:center;
  font-weight:700; font-variant-numeric:tabular-nums;
  padding:2px 8px; border-radius:5px; border:1px solid transparent; font-size:12px;
}
.score.s-a{ background:var(--st-good-wash); color:#08603f; border-color:#bfe5d4; }
.score.s-b{ background:#f2faf6; color:#0b7d57; border-color:#d8ede4; }
.score.s-c{ background:var(--st-warn-wash); color:#7a5600; border-color:#eddcae; }
.score.s-d{ background:var(--st-review-wash); color:#93380f; border-color:#f2cdb8; }
.score.s-e{ background:var(--st-crit-wash); color:#96201f; border-color:#f3c4c3; }

.mtag{ font-variant-numeric:tabular-nums; }
.mtag.low{ color:var(--st-crit); font-weight:700; }
.mtag.mid{ color:var(--st-review); font-weight:650; }
.mtag.warnv{ color:var(--st-warn); font-weight:650; }
.mtag::after{ font-size:9px; margin-left:3px; vertical-align:1px; }
.mtag.low::after{ content:"▼"; }
.mtag.mid::after{ content:"▼"; }

.acount{
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
  font-variant-numeric:tabular-nums; font-weight:650;
}
.adot{ width:6px; height:6px; border-radius:50%; flex:none; }
.adot.crit{ background:var(--st-crit); }
.adot.review{ background:var(--st-review); }
.adot.warn{ background:var(--st-warn); }
.adot.none{ background:var(--line-strong); }

/* ============================ BADGES ============================ */
.badge{
  display:inline-flex; align-items:center; gap:5px;
  font-size:10.5px; font-weight:700; letter-spacing:.02em;
  padding:2px 8px; border-radius:999px; border:1px solid transparent; white-space:nowrap;
}
.badge.crit{ background:var(--st-crit-wash); color:#96201f; border-color:#f3c4c3; }
.badge.review{ background:var(--st-review-wash); color:#93380f; border-color:#f2cdb8; }
.badge.warn{ background:var(--st-warn-wash); color:#7a5600; border-color:#eddcae; }
.badge.good{ background:var(--st-good-wash); color:#08603f; border-color:#bfe5d4; }
.badge.neut{ background:var(--st-neut-wash); color:var(--st-neut); border-color:var(--line-strong); }

/* ============================ ANOMALY ============================ */
.anom-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:10px; }
.anom-card{
  border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:10px 12px; background:var(--surface-1);
  display:flex; flex-direction:column; gap:7px;
  border-top:3px solid var(--line-strong);
}
.anom-card.lv-crit{ border-top-color:var(--st-crit); }
.anom-card.lv-review{ border-top-color:var(--st-review); }
.anom-card.lv-warn{ border-top-color:var(--st-warn); }
.anom-card.lv-none{ border-top-color:var(--line-strong); }
.anom-name{
  font-size:10.5px; font-weight:750; letter-spacing:.055em; text-transform:uppercase;
  color:var(--ink-1); line-height:1.35; min-height:28px;
}
.anom-main{ display:flex; align-items:baseline; gap:7px; }
.anom-cases{ font-size:23px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1; }
.anom-cases-lbl{ font-size:11px; color:var(--ink-3); }
.anom-share{ margin-left:auto; font-size:10.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; }
.anom-track{ height:4px; border-radius:2px; background:var(--surface-3); overflow:hidden; }
.anom-facts{ display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--ink-2); }
.anom-facts span b{ color:var(--ink-1); font-variant-numeric:tabular-nums; font-weight:700; }
.note-inline{
  font-size:11px; color:var(--ink-3); font-style:italic;
  padding:9px 16px 0; line-height:1.5;
}

/* ============================ TREND / CHART ============================ */
.chart-toolbar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; }
.legend-item{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11.5px; color:var(--ink-2); font-weight:600;
  background:none; border:0; padding:2px 0; cursor:pointer;
}
.legend-item[aria-pressed="false"]{ opacity:.38; }
.legend-key{ width:14px; height:2.5px; border-radius:2px; flex:none; }
.chart-host{ position:relative; width:100%; }
.chart-host svg{ display:block; width:100%; height:auto; }
.chart-tip{
  position:absolute; pointer-events:none; z-index:20;
  background:var(--surface-1); border:1px solid var(--line-strong);
  border-radius:var(--radius-sm); box-shadow:var(--shadow-2);
  padding:8px 10px; font-size:11.5px; min-width:158px;
  opacity:0; transition:opacity .1s;
}
.chart-tip.on{ opacity:1; }
.tip-date{ font-weight:750; font-size:11.5px; margin-bottom:5px; color:var(--ink-1); }
.tip-row{ display:flex; align-items:center; gap:7px; margin-top:3px; }
.tip-key{ width:9px; height:9px; border-radius:2px; flex:none; }
.tip-name{ color:var(--ink-2); }
.tip-val{ margin-left:auto; font-weight:700; font-variant-numeric:tabular-nums; color:var(--ink-1); }

/* ============================ STATES ============================ */
.state{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:7px; padding:38px 20px; text-align:center;
}
.state-ico{ font-size:20px; opacity:.5; }
.state-title{ font-size:13px; font-weight:700; color:var(--ink-1); }
.state-desc{ font-size:12px; color:var(--ink-3); max-width:400px; line-height:1.5; }
.state.error .state-title{ color:var(--st-crit); }
.skel{
  background:linear-gradient(90deg,var(--surface-3) 25%,#f4f7f5 50%,var(--surface-3) 75%);
  background-size:200% 100%; animation:shimmer 1.25s linear infinite; border-radius:5px;
}
@keyframes shimmer{ from{ background-position:200% 0; } to{ background-position:-200% 0; } }
.skel-row{ height:13px; margin:9px 0; }

/* ============================ INFORMASI UPDATE DATA (V1.6.5) ============================ */
.info-head{
  margin-top:14px; padding:2px 1px 0;
}
.info-title{ font-size:17px; font-weight:750; letter-spacing:.035em; }
.info-subtitle{ margin:3px 0 0; color:var(--ink-2); font-size:12px; }
.info-summary{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:14px;
}
.info-summary-card{
  min-width:0; background:var(--surface-1); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow-1); padding:12px 14px;
}
.info-summary-stream{
  color:var(--ink-3); font-size:9.5px; font-weight:750; letter-spacing:.10em; text-transform:uppercase;
}
.info-summary-row{ display:flex; align-items:baseline; gap:8px; margin-top:4px; }
.info-summary-label{ color:var(--ink-2); font-size:11px; font-weight:650; }
.info-summary-value{ color:var(--brand-deep); font-size:21px; font-weight:800; line-height:1; }
/* ===== V1.7.4 — HK HYPERCARE ===== */
.info-hk-range{ display:flex; gap:14px; margin-top:7px; flex-wrap:wrap; }
.info-hk-range span{ font-size:11.5px; color:var(--ink-3); font-weight:600; }
.info-hk-range b{ color:var(--ink-1); font-weight:750; }
.info-stat{ display:inline-block; margin-top:3px; padding:1px 7px; border-radius:999px;
  font-size:10.5px; font-weight:700; letter-spacing:.01em; white-space:nowrap; }
.info-stat.ok{ color:#065f46; background:#d1fae5; }
.info-stat.lag{ color:#8a5a00; background:#fff3d6; }
.info-stat.none{ color:#64748b; background:#e2e8f0; }
.info-stat.stale{ color:#7c3aed; background:#ede9fe; }
.info-section{
  margin-top:10px; background:var(--surface-1); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow-1); overflow:hidden;
}
.info-section-head{
  display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line);
}
.info-section-title{ font-size:12px; font-weight:750; }
.info-section-meta{ margin-left:auto; color:var(--ink-3); font-size:10.5px; white-space:nowrap; }
.info-table-wrap{ width:100%; overflow:hidden; }
.info-table{ width:100%; table-layout:fixed; border-collapse:separate; border-spacing:0; }
.info-table th,
.info-table td{
  min-width:0; padding:8px 11px; border-bottom:1px solid var(--line);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left;
}
.info-table th{
  background:var(--surface-2); color:var(--ink-3); font-size:9.5px;
  font-weight:750; letter-spacing:.075em; text-transform:uppercase;
}
.info-table tbody tr:last-child td{ border-bottom:0; }

<script>
"use strict";
/* ============================================================================
   LAYER 1 — UTILITIES
   ========================================================================= */
const U = {
  pad(n, w) { return String(n).padStart(w || 2, '0'); },

  /* --- angka --- */
  int(v)      { return (v === null || v === undefined || isNaN(v)) ? '–' : Math.round(v).toLocaleString('id-ID'); },
  dec(v, d)   { if (v === null || v === undefined || isNaN(v)) return '–';
                return v.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }); },
  pct(v, d)   { return (v === null || v === undefined || isNaN(v)) ? '–' : U.dec(v, d === undefined ? 1 : d) + '%'; },
  pts(v, d)   { if (v === null || v === undefined || isNaN(v)) return '–';
                const dg = d === undefined ? 1 : d, eps = Math.pow(10, -dg) / 2;
                const s = Math.abs(v) < eps ? '±' : (v > 0 ? '+' : '−');
                return s + U.dec(Math.abs(v), dg); },

  /* --- jam (menit sejak 00:00) --- */
  clock(min)  { if (min === null || min === undefined || isNaN(min)) return '–';
                const m = Math.round(min); return U.pad(Math.floor(m / 60)) + ':' + U.pad(m % 60); },

  /* --- durasi perjalanan ---
     <1 menit  -> "26 detik" | <60 menit -> "59 menit 20 detik" | >=60 -> "2 jam 18 menit" */
  dur(minutes) {
    if (minutes === null || minutes === undefined || isNaN(minutes)) return '–';
    const totalSec = Math.round(minutes * 60);
    if (totalSec < 60) return totalSec + ' detik';
    if (totalSec < 3600) {
      const m = Math.floor(totalSec / 60), s = totalSec % 60;
      return s === 0 ? (m + ' menit') : (m + ' menit ' + s + ' detik');
    }
    const h = Math.floor(totalSec / 3600), m = Math.round((totalSec % 3600) / 60);
    return m === 0 ? (h + ' jam') : (h + ' jam ' + m + ' menit');
  },
  durShort(minutes) {
    if (minutes === null || minutes === undefined || isNaN(minutes)) return '–';
    const t = Math.round(minutes);
    if (t < 60) return t + 'm';
    return Math.floor(t / 60) + 'j ' + U.pad(t % 60) + 'm';
  },

  /* --- tanggal --- */
  MONTHS: ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],
  MON_S: ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],
  DAYS:  ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],
  dParts(iso) { const p = iso.split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; },
  dLong(iso)  { const p = U.dParts(iso); return p.d + ' ' + U.MONTHS[p.m - 1] + ' ' + p.y; },
  dMed(iso)   { const p = U.dParts(iso); return p.d + ' ' + U.MON_S[p.m - 1] + ' ' + p.y; },
  dShort(iso) { const p = U.dParts(iso); return U.pad(p.d) + ' ' + U.MON_S[p.m - 1]; },
  dDow(iso)   { return U.DAYS[new Date(iso + 'T00:00:00').getDay()]; },
  addDays(iso, n) { const dt = new Date(iso + 'T00:00:00'); dt.setDate(dt.getDate() + n);
                    return dt.getFullYear() + '-' + U.pad(dt.getMonth() + 1) + '-' + U.pad(dt.getDate()); },
  diffDays(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); },

  /* ======================================================================
     V1.7.2 — WAKTU WIB (Asia/Jakarta)
     Timestamp dari Supabase adalah timestamptz, contoh:
       2026-08-17T05:10:06.009376+00:00
     Konversi ke WIB dilakukan dengan Intl.DateTimeFormat timeZone
     'Asia/Jakarta'. TIDAK memakai date.setHours(getHours()+7): raw timestamp
     sudah membawa offset, sehingga penambahan manual menyebabkan DOUBLE
     CONVERSION. Yang dikonversi hanya PRESENTATION layer — nilai di database
     tidak pernah diubah.
     ====================================================================== */
  WIB_TZ: 'Asia/Jakarta',
  _wibDTF: null,

  /* Parser toleran: null/undefined/'' -> null, tidak pernah "Invalid Date".
     Fractional seconds > 3 digit dinormalisasi demi kompatibilitas parser lama. */
  toDate(value) {
    if (value === null || value === undefined || value === '') return null;
    if (value instanceof Date) return isNaN(value.getTime()) ? null : value;
    const raw = String(value).trim();
    if (!raw) return null;
    let s = raw.replace(/(\.\d{3})\d+/, '$1');
    if (/^\d{4}-\d{2}-\d{2} \d{2}:/.test(s)) s = s.replace(' ', 'T');
    let d = new Date(s);
    if (isNaN(d.getTime())) d = new Date(raw);
    return isNaN(d.getTime()) ? null : d;
  },

  /* Bagian tanggal/jam menurut Asia/Jakarta, apa pun timezone perangkat user. */
  wibParts(value) {
    const d = U.toDate(value);
    if (!d) return null;
    try {
      if (!U._wibDTF) U._wibDTF = new Intl.DateTimeFormat('en-GB', {
        timeZone: U.WIB_TZ, year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false });
      const p = {};
      U._wibDTF.formatToParts(d).forEach(function (x) { if (x.type !== 'literal') p[x.type] = x.value; });
      const y = Number(p.year), m = Number(p.month), dd = Number(p.day);
      if (!isFinite(y) || !isFinite(m) || !isFinite(dd)) return null;
      return { y: y, m: m, d: dd, hh: p.hour === '24' ? '00' : String(p.hour), mm: String(p.minute) };
    } catch (e) { return null; }
  },

  /* "17 Agu 12:10 WIB" — tahun ikut tampil bila berbeda dari tahun data aktif. */
  wibDateTime(value, activeYear) {
    const p = U.wibParts(value);
    if (!p) return '–';
    const ay = Number(activeYear);
    const showYear = !isFinite(ay) || ay !== p.y;
    return p.d + ' ' + U.MON_S[p.m - 1] + (showYear ? ' ' + p.y : '') + ' ' + p.hh + ':' + p.mm + ' WIB';
  },
  wibDate(value) { const p = U.wibParts(value); return p ? p.d + ' ' + U.MON_S[p.m - 1] + ' ' + p.y : '–'; },
  wibTime(value) { const p = U.wibParts(value); return p ? p.hh + ':' + p.mm + ' WIB' : '–'; },
  /* jam berjalan menurut Asia/Jakarta (bukan jam perangkat) */
  wibNowDate() { return U.wibDate(new Date()); },
  wibNowTime() { return U.wibTime(new Date()); },
  wibStamp() {
    const p = U.wibParts(new Date());
    return p ? String(p.y) + U.pad(p.m) + U.pad(p.d) + '_' + p.hh + p.mm : '00000000_0000';
  },

  clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); },
  sum(arr, f) { let t = 0; for (let i = 0; i < arr.length; i++) t += f(arr[i]); return t; },
  esc(s) { return String(s === null || s === undefined ? '' : s)
              .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
};

/* PRNG deterministik — data demo identik setiap kali halaman dibuka */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h >>> 0; }

/* ============================================================================
   LAYER 2 — KPI ENGINE
   Bobot skor internal mengikuti struktur website ASS existing.
   process_score SELALU diturunkan dari KPI (bukan angka acak), sehingga
   nilai parent = hasil hitung dari KPI agregat anak-anaknya. (Konsisten.)
   ========================================================================= */
const KPI_MODEL = {
  weights: [
    { key: 'sc_jks',    label: 'SC vs JKS',    w: 0.20 },
    { key: 'geo',       label: 'Geo Match',    w: 0.20 },
    { key: 'hit',       label: 'Hit Rate EC',  w: 0.15 },
    { key: 'visit',     label: 'Total Kunjungan', w: 0.15 },
    { key: 'checkin',   label: 'Avg Check In', w: 0.05 },
    { key: 'checkout',  label: 'Avg Check Out', w: 0.10 },
    { key: 'transport', label: 'Durasi Jalan', w: 0.15 }
  ],
  /* target yang ditampilkan di UI */
  target: {
    sc_jks: 100, geo: 100, hit: 90, visit: 30,
    checkin: 8 * 60,        /* 08:00 — lebih awal = baik  */
    checkout: 17 * 60,      /* 17:00 — lebih lama = baik  */
    transport: 120          /* menit — lebih kecil = baik */
  },
  /* rentang penilaian: [nilai skor 0, nilai skor 100] */
  range: {
    sc_jks:   [62, 100], geo:     [58, 100], hit:      [38, 84], visit: [16, 34],
    checkin:  [525, 450],                      /* lebih kecil = lebih baik */
    checkout: [960, 1050],
    transport:[240, 85]                        /* lebih kecil = lebih baik */
  },
  scale(v, b) { return v === null || v === undefined || isNaN(v)
                  ? 0 : U.clamp((v - b[0]) / (b[1] - b[0]) * 100, 0, 100); },
  /* skor per komponen, 0–100 */
  parts(m) {
    const B = KPI_MODEL.range, f = KPI_MODEL.scale;
    return {
      sc_jks:    f(m.sc_jks_pct, B.sc_jks),
      geo:       f(m.geo_match_pct, B.geo),
      hit:       f(m.hit_rate_pct, B.hit),
      visit:     f(m.avg_visit, B.visit),
      checkin:   f(m.avg_check_in, B.checkin),
      checkout:  f(m.avg_check_out, B.checkout),
      transport: f(m.avg_transport_minutes, B.transport)
    };
  },
  score(m) {
    const p = KPI_MODEL.parts(m);
    let s = 0;
    for (const it of KPI_MODEL.weights) s += p[it.key] * it.w;
    return Math.round(s * 10) / 10;
  },
  band(s) {
    if (s === null || s === undefined || isNaN(s)) return 'none';
    if (s >= 90) return 'a';  if (s >= 80) return 'b';
    if (s >= 70) return 'c';  if (s >= 60) return 'd';  return 'e';
  },
  /* V1.2 — ambang klasifikasi VISUAL (heatmap/KPI status). Formula & bobot KPI tidak berubah.
     Urutan: [excellent, baik, warning]; di bawah warning = perlu review. */
  visual: {
    sc_jks: [100, 95, 90],
    geo:    [100, 95, 90],
    hit:    [72, 65, 55],      /* tidak diubah pada revisi ini */
    visit:  [35, 30, 25]
  },
  grade(v, bands) {
    if (v === null || v === undefined || isNaN(v)) return 'none';
    if (v >= bands[0]) return 'a';
    if (v >= bands[1]) return 'b';
    if (v >= bands[2]) return 'c';
    return 'd';
  },
  gradeLabel: { a: 'Excellent', b: 'Baik', c: 'Perlu Perhatian', d: 'Perlu Review', none: 'Belum ada data' },
  gradeStatus: { a: 'good', b: 'good', c: 'warn', d: 'review', none: 'neut' },
  bandStatus(s) { const b = KPI_MODEL.band(s);
    return b === 'a' ? 'good' : b === 'b' ? 'good' : b === 'c' ? 'warn' : b === 'd' ? 'review' : 'crit'; }
};
