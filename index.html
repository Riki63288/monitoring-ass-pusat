/* ============================================================================
   LAYER 10b — DRILLDOWN (V1.5)
   Satu modal reusable untuk seluruh hierarki organisasi.
   PENTING: state ini TERPISAH dari AppState.scope. Klik baris organisasi
   TIDAK PERNAH mengubah scope halaman utama, filter, atau breadcrumb halaman.
   ========================================================================= */
const DrilldownState = {
  open: false,
  domain: null,          /* 'proses' | 'hasil' | 'ranking'                       */
  sourceView: null,      /* process_daily | anomaly_matrix | result_achievement |
                            result_daily | result_detail_mtd | result_contribution */
  metricKey: null,       /* metrik aktif pada section asal (bila relevan)        */
  stack: [],             /* [{ scope, label, level }] — level = level entitasnya  */
  view: 'list',          /* 'bucket' | 'list' | 'salesman' | 'evidence' | 'pattern' */
  bucket: null,
  salesmanCode: null,
  patternArgs: null,
  pageScrollY: 0, pageScrollX: 0,
  reset: function () {
    this.open = false; this.domain = null; this.sourceView = null; this.metricKey = null;
    this.stack = []; this.view = 'list'; this.bucket = null; this.salesmanCode = null; this.patternArgs = null;
  },
  current: function () { return this.stack.length ? this.stack[this.stack.length - 1] : null; }
};

const Drilldown = {
  st: DrilldownState,

  /* ---------- entry point dari klik baris di halaman utama ---------- */
  openFrom: function (sourceView, entity) {
    const meta = Renderer.drillViewMeta(sourceView);
    if (!meta || !entity) return;
    const st = this.st;
    st.reset();
    st.open = true;
    st.domain = meta.domain;
    st.sourceView = sourceView;
    st.metricKey = sourceView === 'process_daily' ? AppState.dailyMetric
                 : sourceView === 'result_daily'  ? AppState.resultDailyMetric : null;
    st.pageScrollY = window.scrollY || window.pageYOffset || 0;
    st.pageScrollX = window.scrollX || window.pageXOffset || 0;
    st.stack = [{ scope: entity.scope, label: entity.label, level: entity.kind }];
    /* langsung ke ANAK dari baris yang diklik — tidak menampilkan ulang level yang sama */
    if (entity.kind === 'salesman') { st.view = 'salesman'; st.salesmanCode = entity.code; }
    this.render();
  },

  /* Entry point bucket: filter hanya disimpan untuk daftar awal. */
  openBucket: function (detail) {
    if (!detail || !detail.count) return;
    const st = this.st;
    st.reset(); st.open = true; st.domain = 'ranking'; st.sourceView = 'ranking_main';
    st.metricKey = detail.kpi; st.bucket = detail; st.view = 'bucket'; st.stack = [];
    st.pageScrollY = window.scrollY || window.pageYOffset || 0;
    st.pageScrollX = window.scrollX || window.pageXOffset || 0;
    this.render();
  },

  goBucketEntity: function (entity) {
    const st = this.st;
    if (!st.open || !st.bucket || !entity) return;
    st.stack = [{ scope: entity.scope, label: entity.label, level: entity.kind }];
    if (entity.kind === 'salesman') { st.view = 'salesman'; st.salesmanCode = entity.code; }
    else st.view = 'list';
    this.render();
  },

  bucketHome: function () {
    const st = this.st;
    if (!st.open || !st.bucket) return;
    st.stack = []; st.view = 'bucket'; st.salesmanCode = null; st.patternArgs = null;
    this.render();
  },

  /* ---------- klik baris di dalam popup ---------- */
  goChild: function (entity) {
    const st = this.st;
    if (!st.open || !entity) return;
    if (entity.kind === 'salesman') { st.view = 'salesman'; st.salesmanCode = entity.code; this.render(); return; }
    st.stack.push({ scope: entity.scope, label: entity.label, level: entity.kind });
    st.view = 'list';
    this.render();
  },

  /* sub-view (evidence / pattern) dibuka DI DALAM popup yang sama supaya
     stack hierarki tidak hilang saat user membuka bukti dari detail salesman */
  openSub: function (view, args) {
    const st = this.st;
    if (!st.open) return false;
    st.view = view; st.patternArgs = args || null;
    this.render();
    return true;
  },

  back: function () {
    const st = this.st;
    if (!st.open) return;
    if (st.view === 'evidence' || st.view === 'pattern') { st.view = 'salesman'; st.patternArgs = null; this.render(); return; }
    if (st.view === 'salesman') {
      if (st.bucket && st.stack.length === 1 && st.stack[0].level === 'salesman') {
        this.bucketHome(); return;
      }
      st.view = 'list'; st.salesmanCode = null; this.render(); return;
    }
    if (st.stack.length > 1) { st.stack.pop(); this.render(); return; }
    if (st.bucket) { this.bucketHome(); return; }
    Modal.close();
  },

  goCrumb: function (idx) {
    const st = this.st;
    if (!st.open || idx < 0 || idx >= st.stack.length) return;
    st.stack = st.stack.slice(0, idx + 1);
    st.view = 'list'; st.salesmanCode = null;
    this.render();
  },

  onModalClosed: function () {
    const st = this.st;
    if (!st.open) return;
    const y = st.pageScrollY, x = st.pageScrollX;
    st.reset();
    /* kembalikan posisi scroll halaman utama — jangan lompat ke atas */
    window.scrollTo({ top: y, left: x, behavior: 'auto' });
  },

  _bucketRangeText: function () {
    const b = this.st.bucket;
    if (!b) return '';
    const unit = b.kpi === 'golden' || b.kpi === 'final' ? '' : '%';
    return U.dec(b.bucket.from, 1) + ' – ' + U.dec(b.bucket.to, 1) + unit;
  },

  /* ---------- header modal: konteks + breadcrumb + level aktif + back ---------- */
  _head: function (childLevel) {
    const st = this.st, meta = Renderer.drillViewMeta(st.sourceView) || {};
    let ctx = (meta.label || '').toUpperCase();
    if (meta.titleSuffix) ctx += ' ' + meta.titleSuffix();
    if (st.metricKey && meta.metricLabel) {
      const ml = meta.metricLabel(st.metricKey);
      if (ml) ctx += ' — ' + ml.toUpperCase();
    }
    const sub = st.view === 'evidence' || st.view === 'pattern';
    const isDetail = sub || st.view === 'salesman';
    const bucketCrumb = st.bucket
      ? '<button class="dd-crumb" data-act="dd-bucket-home"' + (st.view === 'bucket' ? ' aria-current="true"' : '') +
        '>Bucket ' + U.esc(this._bucketRangeText()) + '</button>' +
        (st.stack.length || isDetail ? '<span class="dd-crumb-sep">›</span>' : '') : '';
    const crumbs = bucketCrumb + st.stack.map(function (e, i) {
      const cur = (i === st.stack.length - 1) && st.view === 'list';
      return '<button class="dd-crumb" data-act="dd-crumb" data-i="' + i + '"' +
        (cur ? ' aria-current="true"' : '') + '>' + U.esc(e.label) + '</button>' +
        (i < st.stack.length - 1 ? '<span class="dd-crumb-sep">›</span>' : '');
    }).join('') + (isDetail
      ? '<span class="dd-crumb-sep">›</span><button class="dd-crumb" data-act="dd-back-sm"' +
        (sub ? '' : ' aria-current="true"') + '>Detail Salesman</button>' +
        (sub ? '<span class="dd-crumb-sep">›</span><button class="dd-crumb" aria-current="true">' +
               (st.view === 'evidence' ? 'Evidence' : 'Pola Berulang') + '</button>' : '') : '');

    const showBack = isDetail || st.stack.length > 1 || (st.bucket && st.view === 'list' && st.stack.length === 1);
    const backLabel = sub ? '← Kembali ke Detail Salesman'
                     : (st.view === 'salesman' ? '← Kembali ke Salesman' : '← Kembali');
    /* V1.7.7.3 — khusus Monitoring Harian RESULT V2, badge Level Aktif harus
       menunjukkan scope yang sedang dibuka. Contoh breadcrumb R05 > TIGARAKSA
       berarti Level Aktif = Cabang, sementara tabel di bawah berisi anak Depo. */
    const currentLevel = st.current() ? st.current().level : null;
    const levelTxt = st.view === 'bucket' ? Renderer.levelLabel(st.bucket.level)
                     : sub ? (st.view === 'evidence' ? 'Evidence' : 'Pola Berulang')
                     : (st.view === 'salesman' ? 'Salesman'
                     : (st.sourceView === 'result_daily' && currentLevel
                        ? Renderer.levelLabel(currentLevel)
                        : (Renderer.levelLabel(childLevel) || '')));

    return '<div class="modal-head dd-head">' +
      '<div class="dd-main"><div class="dd-context">' + U.esc(ctx) + '</div>' +
      '<div class="dd-title" id="modalTitle">' + U.esc(this._titleText()) + '</div>' +
      '<div class="dd-crumbs">' + crumbs + '</div></div>' +
      '<div class="dd-actions"><span class="dd-level">Level aktif: ' + U.esc(levelTxt) + '</span>' +
      (showBack ? '<button class="dd-back" data-act="dd-back">' + U.esc(backLabel) + '</button>' : '') +
      '<button class="modal-x" data-act="modal-close" aria-label="Tutup detail hierarki">×</button></div></div>';
  },

  _titleText: function () {
    const st = this.st;
    if (st.view === 'bucket') return 'Bucket ' + this._bucketRangeText();
    if (st.view === 'salesman' || st.view === 'evidence' || st.view === 'pattern') {
      const sm = DashboardService.lookup('salesman', st.salesmanCode);
      return sm ? sm.salesman_name : (st.salesmanCode || '');
    }
    return st.current() ? st.current().label : '';
  },

  /* ---------- detail salesman DI MODAL YANG SAMA (meminjam Detail.* apa adanya) ---------- */
  _salesmanBody: function () {
    const st = this.st, code = st.salesmanCode, pa = st.patternArgs;
    const raw = Modal.capture(function () {
      if (st.view === 'evidence') Detail.evidence(code);
      else if (st.view === 'pattern' && pa) Detail.pattern(pa.sm, pa.type);
      else if (st.domain === 'hasil') Detail.resultSalesman(code);
      else Detail.salesman(code);
    });
    const tmp = document.createElement('div');
    tmp.innerHTML = raw;
    const head = tmp.querySelector('.modal-head');
    if (head) head.parentNode.removeChild(head);   /* header diganti header drilldown */
    /* V1.6 — pada domain Ranking, detail salesman diawali audit Final Score
       (Actual -> Score Basis -> setelah cap -> bobot -> kontribusi). */
    if (st.domain === 'ranking' && st.view === 'salesman') {
      const audit = RankingView.auditHtml('salesman', code);
      const bodyEl = tmp.querySelector('.modal-body');
      if (audit && bodyEl) bodyEl.insertAdjacentHTML('afterbegin', audit);
      else if (audit) return '<div class="modal-body">' + audit + '</div>' + tmp.innerHTML;
    }
    return tmp.innerHTML;
  },

  render: function () {
    const st = this.st;
    if (!st.open) return;
    try {
      if (st.view === 'bucket') {
        Modal.open(this._head(st.bucket.level) + '<div class="modal-body">' +
          RankingView.bucketPopupHtml(st.bucket) + '</div>', 'wide');
        return;
      }
      if (st.view === 'salesman' || st.view === 'evidence' || st.view === 'pattern') {
        Modal.open(this._head(null) + this._salesmanBody(), 'wide');
        return;
      }
      const cur = st.current();
      const childLevel = Renderer.drillChildLevel(cur.scope);
      const body = Renderer.drillBody(st.sourceView, cur.scope, st.metricKey, cur.label);
      Modal.open(this._head(childLevel) + '<div class="modal-body">' + body + '</div>', 'wide');
    } catch (err) {
      Modal.open(this._head(null) + '<div class="modal-body">' +
        UI.error('Gagal Memuat Detail', String(err && err.message || err)) + '</div>', 'wide');
      if (window.console) console.error(err);
    }
  }
};

/* ============================================================================
   LAYER 12 — RANKING INFRASTRUCTURE (V1.6)
   RankingSettings  : bobot KPI + parameter (localStorage)
   MasterCabangStore: master organisasi global (IndexedDB, terisolasi)
   OrgResolver      : satu-satunya layer pemetaan Kode Depo -> Regional/Cabang/Depo
   ========================================================================= */
/* ============================================================================
   LAYER 12C — TAT PRODUCTION & TOTAL HK (V1.7.4)
   ----------------------------------------------------------------------------
   TAT MTD production:

       TAT = HK BERJALAN RESULT ÷ TOTAL HK BULAN × 100

   - HK BERJALAN  = MAX(result_hk) pada RESULT period aktif, DI DALAM Monitoring
                    Scope aktif (bukan HK per Depo, bukan HK drilldown).
                    Sumbernya InformationService — satu-satunya authority HK,
                    supaya Informasi dan Ranking tidak pernah berbeda angka.
   - TOTAL HK     = input manual business per BULAN RESULT (localStorage).
                    TIDAK pernah dihitung dari kalender browser.

   Filosofi bisnis: Depo yang terlambat update TIDAK mendapat TAT lebih ringan.
   Semua peserta Ranking memakai TAT standar pusat yang sama.
   ========================================================================= */

const RankingPeriodSettings = {
  KEY: 'ass_pusat_ranking_period_settings_v1',
  _v: null,
  rev: 0,

  _read: function () {
    if (this._v) return this._v;
    let v = {};
    try {
      const raw = window.localStorage.getItem(this.KEY);
      if (raw) {
        const p = JSON.parse(raw);
        if (p && typeof p === 'object' && !Array.isArray(p)) {
          Object.keys(p).forEach(function (k) {
            if (!/^\d{4}-\d{2}$/.test(k)) return;
            const n = Number(p[k] && p[k].totalHk);
            if (isFinite(n) && n > 0 && n === Math.floor(n)) v[k] = { totalHk: n };
          });
        }
      }
    } catch (e) { v = {}; }      /* JSON rusak / storage diblokir -> kosong, tidak crash */
    this._v = v; return v;
  },
  _write: function () {
    try { window.localStorage.setItem(this.KEY, JSON.stringify(this._v || {})); } catch (e) { /* abaikan */ }
  },

  /* normalisasi 'YYYY-MM-01' / 'YYYY-MM' -> 'YYYY-MM' */
  monthKey: function (period) {
    const t = String(period === null || period === undefined ? '' : period).trim();
    return /^\d{4}-\d{2}/.test(t) ? t.slice(0, 7) : null;
  },
  all: function () { return JSON.parse(JSON.stringify(this._read())); },

  /* Total HK yang tersimpan untuk sebuah bulan RESULT; null bila belum diisi. */
  totalHk: function (period) {
    const k = this.monthKey(period);
    if (!k) return null;
    const e = this._read()[k];
    return e && isFinite(Number(e.totalHk)) && Number(e.totalHk) > 0 ? Number(e.totalHk) : null;
  },

  /* Validasi input user: integer, > 0, dan masuk akal untuk satu bulan. */
  validate: function (value) {
    const raw = String(value === null || value === undefined ? '' : value).trim();
    if (raw === '') return { ok: false, value: null, message: 'Total HK belum diisi.' };
    const n = Number(raw);
    if (!isFinite(n)) return { ok: false, value: null, message: 'Total HK harus berupa angka.' };
    if (n !== Math.floor(n)) return { ok: false, value: null, message: 'Total HK harus bilangan bulat.' };
    if (n <= 0) return { ok: false, value: null, message: 'Total HK harus lebih besar dari 0.' };
    if (n > 31) return { ok: false, value: null, message: 'Total HK tidak wajar (maksimal 31 hari dalam sebulan).' };
    return { ok: true, value: n, message: '' };
  },

  setTotalHk: function (period, value) {
    const k = this.monthKey(period);
    if (!k) return { ok: false, value: null, message: 'Periode RESULT tidak dikenali.' };
    const v = this.validate(value);
    if (!v.ok) return v;                        /* nilai invalid TIDAK disimpan */
    const store = this._read();
    store[k] = { totalHk: v.value };
    this._write();
    this.rev++;
    RankingTat.invalidate();
    if (typeof RankingService !== 'undefined' && RankingService.invalidate) RankingService.invalidate();
    return v;
  },

  /* Reset eksplisit satu periode saja — TIDAK pernah dipanggil oleh Reset Default. */
  clearPeriod: function (period) {
    const k = this.monthKey(period);
    if (!k) return false;
    const store = this._read();
    if (!(k in store)) return false;
    delete store[k];
    this._write();
    this.rev++;
    RankingTat.invalidate();
    if (typeof RankingService !== 'undefined' && RankingService.invalidate) RankingService.invalidate();
    return true;
  }
};

const RankingTat = {
  _cache: null,
  _key: '',

  invalidate: function () { this._cache = null; this._key = ''; },

  _stateKey: function () {
    const live = typeof LiveDataStore !== 'undefined' ? (LiveDataStore.rev | 0) : 0;
    const ms = typeof MonitoringScope !== 'undefined' ? (MonitoringScope.rev | 0) : 0;
    const org = typeof OrgResolver !== 'undefined' ? (OrgResolver.rev | 0) : 0;
    return live + '|' + ms + '|' + org + '|' + (RankingPeriodSettings.rev | 0);
  },

  monthLabel: function (period) {
    const t = String(period || '');
    if (!/^\d{4}-\d{2}/.test(t)) return '–';
    return U.MONTHS[Number(t.slice(5, 7)) - 1] + ' ' + t.slice(0, 4);
  },

  /* ------------------------------------------------------------------------
     Snapshot HK standar pusat.
     Memakai InformationService.getSnapshot({}) — ROOT Monitoring Scope,
     BUKAN drilldown AppState.scope. Dengan demikian TAT identik di seluruh
     level: root / Regional / Cabang / Depo / ASS / Salesman.
     Hasil di-cache; tidak ada network request tambahan.
     ------------------------------------------------------------------------ */
  _computing: false,
  snapshot: function () {
    const key = this._stateKey();
    if (this._cache && this._key === key) return this._cache;
    /* Guard re-entrancy: snapshot dipanggil dari resultContext(); bila ada jalur
       tak terduga yang memanggil balik, kembalikan state netral daripada
       rekursi tanpa henti. */
    if (this._computing) {
      return { periodMonth: null, periodLabel: '–', hkRunning: null, totalHk: null, tat: null,
               valid: false, reasonCode: 'NOT_READY', reason: 'TAT sedang dihitung.' };
    }
    this._computing = true;
    try { return this._compute(key); } finally { this._computing = false; }
  },
  _compute: function (key) {

    const out = {
      periodMonth: null, periodLabel: '–',
      hkRunning: null, totalHk: null, tat: null,
      valid: false, reasonCode: 'NO_RESULT_PERIOD',
      reason: 'Periode Hasil Kerja belum tersedia.'
    };

    let snap = null;
    try { snap = InformationService.getSnapshotForTat({}); } catch (e) { snap = null; }
    if (snap) {
      out.periodMonth = RankingPeriodSettings.monthKey(snap.resultPeriod);
      out.hkRunning = (snap.maxResultHK === null || snap.maxResultHK === undefined)
        ? null : Number(snap.maxResultHK);
    }
    /* Bila latest-by-depot belum membawa periode, pakai periode batch RESULT aktif. */
    if (!out.periodMonth) {
      try {
        const rc = DashboardService.resultContextRaw ? DashboardService.resultContextRaw() : null;
        if (rc && rc.currentMonth) out.periodMonth = RankingPeriodSettings.monthKey(rc.currentMonth);
      } catch (e) { /* abaikan */ }
    }
    out.periodLabel = this.monthLabel(out.periodMonth);

    if (!out.periodMonth) { this._cache = out; this._key = key; return out; }

    out.totalHk = RankingPeriodSettings.totalHk(out.periodMonth);

    if (out.hkRunning === null || !isFinite(out.hkRunning) || out.hkRunning <= 0) {
      out.reasonCode = 'NO_RESULT_HK';
      out.reason = 'HK berjalan RESULT belum tersedia.';
    } else if (out.totalHk === null) {
      out.reasonCode = 'NO_TOTAL_HK';
      out.reason = 'Total HK ' + out.periodLabel + ' belum disetting.';
    } else if (out.hkRunning > out.totalHk) {
      /* TIDAK di-clamp diam-diam dan TIDAK menghasilkan TAT > 100%. */
      out.reasonCode = 'HK_EXCEEDS_TOTAL';
      out.reason = 'HK berjalan melebihi Total HK bulan. Periksa setting Total HK atau data update. ' +
                   '(HK berjalan ' + out.hkRunning + ' > Total HK ' + out.totalHk + ')';
    } else {
      const tat = out.hkRunning / out.totalHk * 100;
      if (!isFinite(tat) || tat <= 0 || tat > 100) {
        out.reasonCode = 'TAT_INVALID';
        out.reason = 'TAT MTD tidak valid.';
      } else {
        out.tat = tat;                 /* presisi penuh untuk kalkulasi */
        out.valid = true;
        out.reasonCode = 'OK';
        out.reason = null;
      }
    }

    this._cache = out; this._key = key;
    return out;
  },

  value: function () { return this.snapshot().tat; },
  isValid: function () { return this.snapshot().valid; },
  /* "TAT dihitung dari HK RESULT tertinggi pada Monitoring Scope ÷ Total HK bulan." */
  sourceText: function () {
    const s = this.snapshot();
    const base = 'TAT dihitung dari HK RESULT tertinggi pada Monitoring Scope ÷ Total HK bulan.';
    if (!s.valid) return base + ' Saat ini: ' + (s.reason || 'belum tersedia.');
    return base + ' HK Berjalan ' + s.hkRunning + ' ÷ Total HK ' + s.totalHk + ' × 100.';
  }
};

/* ---------------------------------------------------------------------------
   RANKING GATE — syarat aktivasi Ranking LIVE.
   Engine Ranking, bobot, Golden EC, Score Cap, kategori, dan tie-break existing
   TIDAK diubah. Gate hanya menentukan boleh/tidaknya engine dijalankan.
   --------------------------------------------------------------------------- */
const RankingGate = {
  evaluate: function () {
    const out = {
      live: false, ok: false, code: 'OK', title: '', detail: '',
      processPeriod: null, resultPeriod: null,
      processLabel: '–', resultLabel: '–',
      tat: null, hkRunning: null, totalHk: null
    };
    if (typeof ProviderHub === 'undefined' || !ProviderHub.isLive()) {
      /* Mode pengembangan demo: perilaku existing dipertahankan sepenuhnya. */
      out.live = false; out.ok = true; return out;
    }
    out.live = true;

    let proc = null, res = null;
    try { proc = DashboardService.processContext(); } catch (e) { proc = null; }
    try { res = DashboardService.resultContextRaw ? DashboardService.resultContextRaw() : null; } catch (e) { res = null; }

    out.processPeriod = proc && proc.periodMonth ? String(proc.periodMonth).slice(0, 7) : null;
    out.resultPeriod = res && res.currentMonth ? String(res.currentMonth).slice(0, 7) : null;
    out.processLabel = RankingTat.monthLabel(out.processPeriod);
    out.resultLabel = RankingTat.monthLabel(out.resultPeriod);

    if (!out.processPeriod) {
      out.code = 'NO_PROCESS'; out.title = 'RANKING BELUM TERSEDIA';
      out.detail = 'Periode Proses Kerja belum tersedia.'; return out;
    }
    if (!out.resultPeriod) {
      out.code = 'NO_RESULT'; out.title = 'RANKING BELUM TERSEDIA';
      out.detail = 'Periode Hasil Kerja belum tersedia.'; return out;
    }
    if (out.processPeriod !== out.resultPeriod) {
      out.code = 'PERIOD_MISMATCH'; out.title = 'RANKING BELUM TERSEDIA';
      out.detail = 'Periode Proses Kerja dan Hasil Kerja berbeda.'; return out;
    }

    const t = RankingTat.snapshot();
    out.tat = t.tat; out.hkRunning = t.hkRunning; out.totalHk = t.totalHk;
    if (!t.valid) {
      out.code = t.reasonCode; out.title = 'RANKING BELUM TERSEDIA';
      out.detail = t.reason || 'TAT MTD belum tersedia.';
      return out;
    }

    out.ok = true; out.code = 'OK';
    return out;
  },

  /* Baris status positif ketika Ranking LIVE aktif. */
  liveStatusHtml: function (g) {
    return '<div class="live-note"><span>●</span><span><b>RANKING LIVE</b> · PROCESS &amp; RESULT ' +
      U.esc(g.resultLabel) + ' · TAT ' + U.dec(g.tat, 1) + '% · HK' + U.int(g.hkRunning) + '/' +
      U.int(g.totalHk) + '</span></div>';
  },

  /* Controlled state ketika Ranking belum boleh dihitung. */
  blockedHtml: function (g) {
    const arah = g.code === 'NO_TOTAL_HK'
      ? '<br><br>Buka <b>Setting KPI</b> → isi <b>Total HK Bulan</b>.'
      : (g.code === 'HK_EXCEEDS_TOTAL'
        ? '<br><br>Periksa <b>Setting KPI → Total HK Bulan</b> atau data update Depo pada menu <b>Informasi</b>.'
        : '');
    return '<section class="section"><div class="section-body">' +
      '<div class="state"><div class="state-ico">⏳</div>' +
      '<div class="state-title">' + U.esc(g.title || 'RANKING BELUM TERSEDIA') + '</div>' +
      '<div class="state-desc">' +
      'PROCESS: <b>' + U.esc(g.processLabel) + '</b><br>' +
      'RESULT: <b>' + U.esc(g.resultLabel) + '</b><br><br>' +
      'Alasan: ' + U.esc(g.detail) + arah +
      '<br><br>Setting KPI, Master Cabang, Master Salesman, dan Informasi tetap dapat digunakan.' +
      '</div></div></div></section>';
  }
};

/* ---- IndexedDB terisolasi: master bisa ribuan baris, jangan di localStorage ---- */
const MasterCabangStore = {
  DB: 'ass_pusat_master_v1', STORE: 'master', KEY: 'active',
  _cache: undefined, rev: 0,
  _open: function () {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error('IndexedDB tidak tersedia di browser ini.')); return; }
      const rq = window.indexedDB.open(MasterCabangStore.DB, 1);
      rq.onupgradeneeded = function () {
        const db = rq.result;
        if (!db.objectStoreNames.contains(MasterCabangStore.STORE)) db.createObjectStore(MasterCabangStore.STORE);
      };
      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error || new Error('Gagal membuka IndexedDB.')); };
    });
  },
  load: function () {
    const self = this;
    if (self._cache !== undefined) return Promise.resolve(self._cache);
    return self._open().then(function (db) {
      return new Promise(function (res) {
        const tx = db.transaction(self.STORE, 'readonly');
        const rq = tx.objectStore(self.STORE).get(self.KEY);
        rq.onsuccess = function () { self._cache = rq.result || null; res(self._cache); };
        rq.onerror = function () { self._cache = null; res(null); };
      });
    }).catch(function () { self._cache = null; return null; });
  },
  save: function (payload) {
    const self = this;
    return self._open().then(function (db) {
      return new Promise(function (res, rej) {
        const tx = db.transaction(self.STORE, 'readwrite');
        tx.objectStore(self.STORE).put(payload, self.KEY);
        tx.oncomplete = function () { self._cache = payload; self.rev++; OrgResolver.invalidate(); res(payload); };
        tx.onerror = function () { rej(tx.error || new Error('Gagal menyimpan master.')); };
      });
    });
  },
  clear: function () {
    const self = this;
    return self._open().then(function (db) {
      return new Promise(function (res) {
        const tx = db.transaction(self.STORE, 'readwrite');
        tx.objectStore(self.STORE).delete(self.KEY);
        tx.oncomplete = function () { self._cache = null; self.rev++; OrgResolver.invalidate(); res(); };
        tx.onerror = function () { res(); };
      });
    });
  }
};

/* ============================================================================
   V1.7.5 — MASTER SALESMAN PROJECT + BUSINESS SCOPE
   Master disimpan pada IndexedDB terpisah. Preference scope saja yang berada
   di localStorage. Lookup memakai Map/Set dan tidak memutasi hierarchy organisasi.
   ============================================================================ */
const SalesmanProjectStore = {
  DB: 'ass_pusat_project_master_v1', STORE: 'master', KEY: 'active',
  _cache: undefined, rev: 0,
  _open: function () {
    return new Promise(function (resolve, reject) {
      if (!window.indexedDB) { reject(new Error('IndexedDB tidak tersedia di browser ini.')); return; }
      const rq = window.indexedDB.open(SalesmanProjectStore.DB, 1);
      rq.onupgradeneeded = function () {
        const db = rq.result;
        if (!db.objectStoreNames.contains(SalesmanProjectStore.STORE)) db.createObjectStore(SalesmanProjectStore.STORE);
      };
      rq.onsuccess = function () { resolve(rq.result); };
      rq.onerror = function () { reject(rq.error || new Error('Gagal membuka penyimpanan Master Salesman.')); };
      rq.onblocked = function () { reject(new Error('Penyimpanan Master Salesman sedang dipakai tab lain. Tutup tab lama lalu coba lagi.')); };
    });
  },
  load: function () {
    const self = this;
    if (self._cache !== undefined) return Promise.resolve(self._cache);
    return self._open().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(self.STORE, 'readonly');
        const rq = tx.objectStore(self.STORE).get(self.KEY);
        rq.onsuccess = function () { self._cache = rq.result || null; resolve(self._cache); };
        rq.onerror = function () { reject(rq.error || new Error('Gagal membaca Master Salesman.')); };
        tx.oncomplete = function () { try { db.close(); } catch (e) {} };
      });
    }).catch(function () { self._cache = null; return null; });
  },
  /* Safe replace: payload lama tidak disentuh sampai parse/validasi selesai.
     Commit put bersifat atomic; cache baru aktif hanya setelah transaction complete. */
  save: function (payload) {
    const self = this;
    return self._open().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(self.STORE, 'readwrite');
        tx.objectStore(self.STORE).put(payload, self.KEY);
        tx.oncomplete = function () {
          try { db.close(); } catch (e) {}
          self._cache = payload; self.rev++; resolve(payload);
        };
        tx.onerror = function () { try { db.close(); } catch (e) {} reject(tx.error || new Error('Gagal menyimpan Master Salesman.')); };
        tx.onabort = function () { try { db.close(); } catch (e) {} reject(tx.error || new Error('Penyimpanan Master Salesman dibatalkan.')); };
      });
    });
  },
  clear: function () {
    const self = this;
    return self._open().then(function (db) {
      return new Promise(function (resolve, reject) {
        const tx = db.transaction(self.STORE, 'readwrite');
        tx.objectStore(self.STORE).delete(self.KEY);
        tx.oncomplete = function () { try { db.close(); } catch (e) {} self._cache = null; self.rev++; resolve(); };
        tx.onerror = function () { try { db.close(); } catch (e) {} reject(tx.error || new Error('Gagal menghapus Master Salesman.')); };
      });
    });
  }
};

const SalesmanProjectScope = {
  KEY: 'ass_pusat_project_scope_v1',
  _master: null, _mode: 'all', _selectedKey: '', _selectedLabel: '',
  _projectToSalesmen: new Map(), _projectLabels: new Map(), rev: 0,
  /* V1.7.6 — index ASS Master Salesman. Lookup Salesman Code O(1) (Map). */
  _salesmanAss: new Map(),          /* salesman_code -> { key, name, code } */
  _salesmanProjectAss: new Map(),   /* salesman_code + project_key -> { key, name, code } */
  _assKeys: new Set(),

  code: function (v) { return String(v === null || v === undefined ? '' : v).trim(); },
  projectKey: function (v) { return String(v === null || v === undefined ? '' : v).trim().toUpperCase(); },
  /* Nama ASS ternormalisasi untuk internal key deterministik (bukan random / bukan index row). */
  assNorm: function (v) {
    return String(v === null || v === undefined ? '' : v).trim().toUpperCase().replace(/\s+/g, ' ');
  },
  /* ASS CODE menjadi identitas utama bila tersedia; jika tidak, internal key dari nama ASS. */
  assKeyOf: function (assName, assCode) {
    const c = this.code(assCode);
    if (c) return c.toUpperCase();
    const n = this.assNorm(assName);
    return n ? 'MASTERASS:' + n : '';
  },
  loadPreference: function () {
    let p = null;
    try { p = JSON.parse(window.localStorage.getItem(this.KEY) || 'null'); } catch (e) { p = null; }
    if (p && p.mode === 'project' && this.projectKey(p.selectedProject)) {
      this._mode = 'project'; this._selectedKey = this.projectKey(p.selectedProject);
      this._selectedLabel = String(p.selectedProject || '').trim();
    } else this._setAll(false);
    return this;

  savePreference: function () {
    try { window.localStorage.setItem(this.KEY, JSON.stringify({
      mode: this._mode, selectedProject: this._mode === 'project' ? this._selectedLabel : ''
    })); } catch (e) {}
  },
  _setAll: function (persist) {
    this._mode = 'all'; this._selectedKey = ''; this._selectedLabel = '';
    if (persist) this.savePreference();
  },
  setMaster: function (payload) {
    this._master = payload && Array.isArray(payload.rows) ? payload : null;
    this._projectToSalesmen = new Map(); this._projectLabels = new Map();
    this._salesmanAss = new Map(); this._salesmanProjectAss = new Map(); this._assKeys = new Set();
    const self = this;
    (this._master ? this._master.rows : []).forEach(function (r) {
      const code = self.code(r.salesman_code), key = self.projectKey(r.project);
      if (!code || !key || r.active === false) return;
      if (!self._projectToSalesmen.has(key)) self._projectToSalesmen.set(key, new Set());
      self._projectToSalesmen.get(key).add(code);
      if (!self._projectLabels.has(key)) self._projectLabels.set(key, String(r.project).trim());
      /* V1.7.6 — ASS opsional. Master lama tanpa kolom ASS tetap valid. */
      const assKey = self.assKeyOf(r.ass_name, r.ass_code);
      if (!assKey) return;
      const ent = { key: assKey, name: String(r.ass_name || r.ass_code || '').trim() || assKey,
                    code: self.code(r.ass_code) };
      self._assKeys.add(assKey);
      self._salesmanProjectAss.set(code + '' + key, ent);
      /* ASS owner per salesman: baris pertama yang valid menjadi identitas stabil. */
      if (!self._salesmanAss.has(code)) self._salesmanAss.set(code, ent);
    });
    this.validateSelection(); this.rev++;
    return this;
  },
  /* ==========================================================================
     V1.7.6.1 — IDENTITAS ASS AUTHORITATIVE DARI MASTER SALESMAN (PROJECT AWARE).
     Urutan lookup:
       1. Salesman Code + Project aktif  (_salesmanProjectAss)
       2. ASS global Master salesman     (_salesmanAss)
       3. null -> pemanggil memakai fallback identitas LIVE existing, dan
          uploaded_by_name tetap fallback TERAKHIR.
     projectKey opsional. Bila tidak diberikan dan Coverage Salesman sedang
     berada pada satu Project, Project aktif tersebut yang dipakai. Pada mode
     Semua Salesman dipakai ASS global yang stabil. Tidak ada Project hardcode.
     Seluruh lookup memakai Map -> O(1).
     ========================================================================== */
  assOf: function (salesmanCode, projectKey) {
    const c = this.code(salesmanCode);
    if (!c) return null;
    const pk = (projectKey === undefined || projectKey === null || projectKey === '')
      ? (this.isAll() ? '' : this._selectedKey)
      : this.projectKey(projectKey);
    if (pk) {
      const hit = this._salesmanProjectAss.get(c + '\u0001' + pk);
      if (hit) return hit;
    }
    return this._salesmanAss.get(c) || null;
  },
  hasAss: function () { return this._assKeys.size > 0; },
  assCount: function () { return this._assKeys.size; },
  validateSelection: function () {
    if (this._mode === 'project' && !this._projectToSalesmen.has(this._selectedKey)) this._setAll(true);
    if (this._mode === 'project') this._selectedLabel = this._projectLabels.get(this._selectedKey) || this._selectedLabel;
  },
  select: function (value) {
    const key = this.projectKey(value);
    if (!key || !this._projectToSalesmen.has(key)) this._setAll(true);
    else {
      this._mode = 'project'; this._selectedKey = key;
      this._selectedLabel = this._projectLabels.get(key) || String(value).trim();
      this.savePreference();
    }
    this.rev++; return this;
  },
  isAll: function () { return this._mode !== 'project'; },
  selected: function () { return this.isAll() ? null : this._selectedLabel; },
  label: function () { return this.isAll() ? 'Semua Salesman' : this._selectedLabel; },
  options: function () {
    const out = [];
    this._projectLabels.forEach(function (label, key) { out.push({ key: key, label: label }); });
    out.sort(function (a, b) { return a.label.localeCompare(b.label, 'id'); });
    return out;
  },
  isAllowed: function (salesmanCode) {
    if (this.isAll()) return true;
    const set = this._projectToSalesmen.get(this._selectedKey);
    return !!(set && set.has(this.code(salesmanCode)));
  },
  filterRows: function (rows) {
    if (!Array.isArray(rows) || this.isAll()) return rows;
    const self = this;
    return rows.filter(function (r) { return self.isAllowed(r && r.salesman_code); });
  },
  activeSet: function () { return this.isAll() ? null : (this._projectToSalesmen.get(this._selectedKey) || new Set()); },
  hasMaster: function () { return !!(this._master && this._master.rows && this._master.rows.length); },
  master: function () { return this._master; },
  membershipCount: function () { const s = this.activeSet(); return s ? s.size : null; },
  liveSalesmanSet: function () {
    const set = new Set();
    try { (ProviderHub.facade.org().salesmen || []).forEach(function (s) { set.add(String(s.salesman_code || '').trim()); }); } catch (e) {}
    return set;
  },
  matchStats: function (payload) {
    const live = this.liveSalesmanSet(), codes = new Set(), assKeys = new Set(), self = this;
    ((payload && payload.rows) || []).forEach(function (r) {
      if (r.active === false) return;
      codes.add(String(r.salesman_code || '').trim());
      const k = self.assKeyOf(r.ass_name, r.ass_code);
      if (k) assKeys.add(k);
    });
    let matched = 0; codes.forEach(function (c) { if (live.has(c)) matched++; });
    return { total: codes.size, matched: matched, unmatched: Math.max(0, codes.size - matched),
             assUnique: assKeys.size };
  },
  hasMatchInScope: function (scope) {
    if (this.isAll()) return true;
    const active = this.activeSet(); if (!active || !active.size) return false;
    let allow = null;
    try { allow = OrgResolver.depotSetOf(scope || {}); } catch (e) { allow = null; }
    const sc = scope || {}, org = ProviderHub.facade.org();
    return (org.salesmen || []).some(function (sm) {
      if (!active.has(String(sm.salesman_code || '').trim())) return false;
      if (allow && !allow[sm.depot_code]) return false;
      if (sc.depot && sm.depot_code !== sc.depot) return false;
      if (sc.ass && sm.ass_code !== sc.ass) return false;
      if (sc.salesman && sm.salesman_code !== sc.salesman) return false;
      return true;
    });
  },
  emptyMessage: function () { return 'Tidak ada Salesman Project ' + this.label() + ' pada scope/data aktif.'; }
};
window.SalesmanProjectScope = SalesmanProjectScope;

/* ---- Satu layer pemetaan organisasi untuk Proses / Hasil / Ranking ---- */
/* ============================================================================
   LAYER 12B — MONITORING SCOPE (V1.7.2)
   ----------------------------------------------------------------------------
   MULTI-REGIONAL TRIAL SCOPE.

   Monitoring Pusat belum dipakai Nasional penuh. Layer ini memungkinkan user
   menentukan sendiri Regional mana yang masuk scope trial.

   Hierarki final:

       MASTER DEPOT LIVE (seluruh Regional)
                 ↓
       MONITORING SCOPE  ← outer allowlist (layer ini)
                 ↓
       AppState.scope    ← inner drilldown existing (Regional → Cabang → Depo)
                 ↓
       ASS → Salesman

   Catatan penting:
   - AppState.scope TIDAK diubah menjadi array. Konsep drilldown existing utuh.
   - OrgResolver / master_depot TIDAK dimutasi. Layer ini hanya allowlist pada
     presentation & calculation layer.
   - Preference disimpan di localStorage (kode Regional saja, bukan dataset).
   ========================================================================= */
const MonitoringScope = {
  KEY: 'ass_pusat_monitoring_scope_v1',

  _mode: 'all',            /* 'all' | 'selected' */
  _selected: [],           /* array kode Regional (urut stabil by code) */
  _set: null,              /* Set kode Regional — lookup O(1) */
  _depotSet: null,         /* Set kode Depo — cache, di-invalidate saat org/scope berubah */
  _depotRev: -1,
  _orgRev: -1,
  rev: 0,                  /* naik setiap kali scope efektif berubah */
  needsReselect: false,    /* true bila mode selected tetapi tidak ada Regional valid */
  loaded: false,

  /* ---------------------------------------------------------------- state */
  mode: function () { return this._mode; },
  isAll: function () { return this._mode !== 'selected'; },
  count: function () { return this._selected.length; },
  selectedRegionalCodes: function () { return this._selected.slice(); },

  allowedRegionalSet: function () {
    if (this.isAll()) return null;                 /* null = tanpa batas */
    if (!this._set) this._set = new Set(this._selected);
    return this._set;
  },
  isRegionalAllowed: function (code) {
    const set = this.allowedRegionalSet();
    if (!set) return true;
    return set.has(String(code === null || code === undefined ? '' : code));
  },

  /* Set kode Depo yang diizinkan. Dihitung sekali per (rev org × rev scope). */
  allowedDepotSet: function () {
    if (this.isAll()) return null;
    const orgRev = (typeof OrgResolver !== 'undefined' ? OrgResolver.rev : 0) | 0;
    if (this._depotSet && this._depotRev === this.rev && this._orgRev === orgRev) return this._depotSet;
    const set = new Set();
    try {
      const g = OrgResolver.graph();
      const allow = this.allowedRegionalSet();
      for (let i = 0; i < g.depots.length; i++) {
        const d = g.depots[i];
        if (allow.has(d.regional_code)) set.add(d.code);
      }
    } catch (e) { /* graph belum siap — biarkan kosong, dihitung ulang nanti */ }
    this._depotSet = set; this._depotRev = this.rev; this._orgRev = orgRev;
    return set;
  },
  isDepotAllowed: function (code) {
    const set = this.allowedDepotSet();
    if (!set) return true;
    return set.has(String(code === null || code === undefined ? '' : code));
  },

  /* -------------------------------------------------------------- storage */
  load: function () {
    this.loaded = true;
    let raw = null;
    try { raw = window.localStorage.getItem(this.KEY); } catch (e) { raw = null; }
    if (!raw) { this._apply('all', [], false); return this; }
    let parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    /* JSON rusak / bentuk tidak dikenal -> kembali ke default aman, tanpa crash */
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) { this._apply('all', [], false); return this; }
    const mode = parsed.mode === 'selected' ? 'selected' : 'all';
    const codes = Array.isArray(parsed.selectedRegionalCodes) ? parsed.selectedRegionalCodes : [];
    this._apply(mode, codes, false);
    return this;
  },
  save: function () {
    try {
      window.localStorage.setItem(this.KEY, JSON.stringify({
        mode: this._mode,
        selectedRegionalCodes: this._selected,
        savedAt: new Date().toISOString()
      }));
    } catch (e) { /* storage penuh / diblokir — preference tidak tersimpan, app tetap jalan */ }
    return this;
  },

  _apply: function (mode, codes, persist) {
    const clean = [];
    const seen = {};
    (codes || []).forEach(function (c) {
      const v = String(c === null || c === undefined ? '' : c).trim();
      if (!v || seen[v]) return;
      seen[v] = 1; clean.push(v);
    });
    clean.sort(function (a, b) { return a < b ? -1 : a > b ? 1 : 0; });
    this._mode = mode === 'selected' ? 'selected' : 'all';
    this._selected = this._mode === 'selected' ? clean : [];
    this._set = null; this._depotSet = null; this._depotRev = -1;
    this.needsReselect = this._mode === 'selected' && this._selected.length === 0;
    this.rev++;
    if (persist) this.save();
    return this;
  },

  /* -------------------------------------------------- validasi vs master LIVE */
  /* Daftar Regional yang benar-benar tersedia pada master aktif, urut by code. */
  availableRegionals: function () {
    let list = [];
    try {
      const g = OrgResolver.graph();
      list = (g.regionals || []).map(function (r) {
        return { code: r.code, label: r.name ? r.code + ' ' + r.name : r.code };
      });
    } catch (e) { list = []; }
    list.sort(function (a, b) { return a.code < b.code ? -1 : a.code > b.code ? 1 : 0; });
    return list;
  },

  /* Buang kode Regional yang sudah tidak ada di master. Tidak pernah diam-diam
     kembali ke "Semua Regional": bila habis, tandai needsReselect. */
  sanitizeAgainstOrg: function () {
    if (this.isAll()) { this.needsReselect = false; return { removed: [], kept: [] }; }
    const avail = {};
    this.availableRegionals().forEach(function (r) { avail[r.code] = 1; });
    if (!Object.keys(avail).length) return { removed: [], kept: this._selected.slice() };
    const kept = [], removed = [];
    this._selected.forEach(function (c) { (avail[c] ? kept : removed).push(c); });
    if (removed.length) {
      this._selected = kept;
      this._set = null; this._depotSet = null; this._depotRev = -1;
      this.rev++;
      this.save();
    }
    this.needsReselect = kept.length === 0;
    return { removed: removed, kept: kept };
  },

  /* ------------------------------------------------------------- pemakaian */
  /* Dipanggil dari modal saat user menekan TERAPKAN. */
  apply: function (mode, codes) {
    this._apply(mode, codes, true);
    this.sanitizeAgainstOrg();
    return this;
  },

  /* --------------------------------------------------------------- label */
  /* Badge level pada scope bar ketika drilldown berada di root. */
  rootBadge: function () {
    return this.isAll() ? 'Nasional' : ('Scope Trial · ' + this.count() + ' Regional');
  },
  /* Nama scope pada judul/report ketika drilldown berada di root. */
  rootLabel: function () {
    return this.isAll() ? 'Nasional' : ('Gabungan ' + this.count() + ' Regional');
  },
  /* Teks tombol pada filter bar. */
  buttonLabel: function () {
    if (this.needsReselect) return 'Scope perlu dipilih';
    return this.isAll() ? 'Semua Regional' : (this.count() + ' Regional Aktif');
  },
  /* Token filename export. */
  rootToken: function () {
    return this.isAll() ? 'NASIONAL' : ('SCOPE_TRIAL_' + this.count() + '_REGIONAL');
  }
};

            '<span><b>Semua Regional</b><i>Seluruh Regional pada Master Depo Pusat.</i></span></label>' +

            '<input type="radio" name="msMode" data-act="ms-mode" data-mode="selected"' + (selected ? ' checked' : '') + '>' +
            '<span><b>Regional Pilihan</b><i>Hanya Regional yang dicentang di bawah.</i></span></label>' +

        '<div class="ms-toolbar">' +
          '<button class="btn-ghost" type="button" data-act="ms-all"' + (selected ? '' : ' disabled') + '>Pilih Semua</button>' +

          (invalid ? ' disabled' : '') + '>Terapkan</button>' +

  /* Perubahan mode mengubah struktur -> render ulang isi modal. */
  setMode: function (mode) {
    if (!this._draft) return;
    this._draft.mode = mode === 'selected' ? 'selected' : 'all';
    Modal.open(this.html(), 'narrow');
  },
  /* Toggle checkbox TIDAK me-render ulang daftar (agar posisi scroll tidak lompat). */
  toggle: function (code, on) {
    if (!this._draft) return;
    if (on) this._draft.set.add(code); else this._draft.set.delete(code);
    this.syncFooter();
  },
  selectAll: function (on) {
    if (!this._draft) return;
    this._draft.set = on ? new Set(MonitoringScope.availableRegionals().map(function (r) { return r.code; })) : new Set();
    Modal.open(this.html(), 'narrow');

  syncFooter: function () {
    const d = this._draft; if (!d) return;
    const total = MonitoringScope.availableRegionals().length;
    const selected = d.mode === 'selected', n = d.set.size, invalid = selected && n === 0;
    const c = document.getElementById('msCount');
    if (c) c.textContent = selected ? (n + ' dari ' + total + ' Regional dipilih')

    const b = document.getElementById('msApply');

    MonitoringScope.apply(d.mode, Array.from(d.set));
    this._draft = null;

  }
